<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DuduQ Engine — English — Year 2 — Module 01</title>
</head>

<body>
  <div id="root">Carregando DuduQ Engine...</div>

  <script>
    window.DUDUQ_ENGINE_BASE =
      new URL("../../../..", window.location.href)
        .href
        .replace(/\/$/, "");

    window.DUDUQ_GAME_CONFIG = Object.freeze({
      engineBase: window.DUDUQ_ENGINE_BASE,
      channel: "canary-v1",
      label: "DuduQ Engine — English — Year 2 — Module 01",
      modulePath: ["english", "year2", "module01"],
      contentScript: "./module-01.js?v=131"
    });
  </script>

  <script>
    (function () {
      "use strict";

      const stamp = Date.now();

      function loadCentralScript(src) {
        return new Promise(function (resolve, reject) {
          const script = document.createElement("script");
          script.src = src + "?t=" + stamp;
          script.async = false;
          script.onload = resolve;
          script.onerror = function () {
            reject(new Error("Falha ao carregar " + src));
          };
          document.head.appendChild(script);
        });
      }

      loadCentralScript(
        "../../../../engine/duduq-player-v1.js"
      )
        .then(function () {
          return loadCentralScript(
            "../../../../engine/duduq-loader-v1.js"
          );
        })
        .catch(function (error) {
          console.error("[DuduQ Bootstrap]", error);
          const root = document.getElementById("root");
          if (root) {
            root.textContent =
              "Erro ao carregar o DuduQ Engine.";
          }
        });
    })();
  </script>
</body>
</html>
