<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DuduQ — 2º Ano — M01 — Homologação Word Slash</title>
</head>

<body>
  <div id="root">Carregando homologação DuduQ...</div>

  <script>
    window.DUDUQ_ENGINE_BASE =
      new URL("../../../..", window.location.href)
        .href
        .replace(/\/$/, "");

    window.DUDUQ_GAME_CONFIG = Object.freeze({
      engineBase: window.DUDUQ_ENGINE_BASE,
      channel: "canary-v1",
      label: "DuduQ — English — Year 2 — Module 01 — Word Slash Pilot",
      modulePath: ["english", "year2", "module01"],
      contentScript: "./module-01.js?v=131"
    });

    window.DUDUQ_HOMOLOGATION = Object.freeze({
      id: "YEAR2_M01_WORD_SLASH_EN2-M1-08",
      baseRevision: 143,
      sourceVersion: "1.3.1",
      pilotQuestionId: "EN2-M1-08",
      mechanic: "word-slash",
      productionIndexUntouched: true
    });
  </script>

  <!-- Overlay carregado antes do conteúdo oficial para interceptar somente module01. -->
  <script src="./module-01-word-slash-homolog.js?v=1"></script>
  <script src="./word-slash-homolog-check.js?v=1"></script>

  <script>
    (function () {
      "use strict";

      const stamp = Date.now();

      function loadCentralScript(src) {
        return new Promise(function (resolve, reject) {
          const script = document.createElement("script");
          script.src = src + "?t=" + stamp;
          script.async = false;
          script.onload = resolve;
          script.onerror = function () {
            reject(new Error("Falha ao carregar " + src));
          };
          document.head.appendChild(script);
        });
      }

      loadCentralScript(
        "../../../../engine/duduq-player-v1.js"
      )
        .then(function () {
          return loadCentralScript(
            "../../../../engine/duduq-loader-v1.js"
          );
        })
        .catch(function (error) {
          console.error("[DuduQ Homolog Bootstrap]", error);
          const root = document.getElementById("root");
          if (root) root.textContent = "Erro ao carregar a homologação DuduQ.";
        });
    })();
  </script>
</body>
</html>
