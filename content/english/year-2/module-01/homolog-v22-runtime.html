  <div id="root">Carregando runtime de homologação v2.2...</div>

  <script>
    window.DUDUQ_ENGINE_BASE = new URL("../../../..", window.location.href).href.replace(/\/$/, "");
    window.DUDUQ_GAME_CONFIG = Object.freeze({
      engineBase: window.DUDUQ_ENGINE_BASE,
      channel: "canary-v1",
      label: "DuduQ — English — Year 2 — Module 01 — v2.2 + Factory v1.2 Homologation",
      modulePath: ["english", "year2", "module01v22homolog"],
      contentScript: "./module-01-v22-homolog.js?v=2"
    });
    window.DUDUQ_HOMOLOGATION = Object.freeze({
      id: "YEAR2_M01_V22_V12",
      baseRevision: 143,
      sourceVersion: "2.2",
      factorySpec: "1.2",
      sourceItems: 15,
      runnableItems: 14,
      blockedItems: ["EN2-M1-12"],
      blocker: "Primeira escuta de L-E-O deve ocorrer sem revelar letras.",

  <script src="../year2-v22-homolog-core.js?v=1"></script>
  <script src="../year2-v22-homolog-layout.js?v=1"></script>
  <script>
    (function () {
      "use strict";
      const stamp = Date.now();
      function loadCentralScript(src) {
        return new Promise(function (resolve, reject) {
          const script = document.createElement("script");
          script.src = src + "?t=" + stamp;
          script.async = false;
          script.onload = resolve;
          script.onerror = function () { reject(new Error("Falha ao carregar " + src)); };
          document.head.appendChild(script);
        });
      }
      loadCentralScript("../../../../engine/duduq-player-v1.js")
        .then(function () { return loadCentralScript("../../../../engine/duduq-loader-v1.js"); })
        .catch(function (error) {
          console.error("[DuduQ v2.2 + Factory v1.2 Homolog Bootstrap]", error);
          const root = document.getElementById("root");
          if (root) root.textContent = "Erro ao carregar o runtime de homologação v2.2.";
        });
    })();
  </script>
</body>
