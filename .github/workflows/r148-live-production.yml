name: R148 Live Production Check

on:
  push:
    branches:
      - release/canary-r148-drag-drop-2.0.25
    paths:
      - "test/systemic/r148-live-check.mjs"
      - ".github/workflows/r148-live-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-production:
    name: live-year1-year3-year5-r148
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check test/systemic/r148-live-check.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify public R148
        env:
          LIVE_BASE: https://duduq-engine.pages.dev
        run: node test/systemic/r148-live-check.mjs
