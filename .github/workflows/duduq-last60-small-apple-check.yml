name: DUDUQ Last60 Small Apple Compare

on:
  push:
    branches:
      - staging/duduq-last60-new-assets-20261110
    paths:
      - .github/workflows/duduq-last60-small-apple-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download only pinned asset candidates and verify original blobs
        run: |
          set -Eeuo pipefail
          mkdir -p qa/results/apple-compare
          python - <<'PY'
          import json,urllib.request,hashlib,pathlib
          plan=json.loads(pathlib.Path('qa/plans/last60-official-assets-20261110.json').read_text())
          tree=json.loads(pathlib.Path('qa/fixtures/source-tree-617-20261110.json').read_text())
          paths={p['path']:p for p in tree['tree']}
          for name in ['big_apple.png','small apple.png','small_red_apple.png']:
            source='Imagens Ilustrativa/'+name
            pin=paths[source]
            url='https://raw.githubusercontent.com/'+plan['sourceRepo']+'/'+plan['sourceCommit']+'/Imagens%20Ilustrativa/'+urllib.parse.quote(name)
            blob=urllib.request.urlopen(url,timeout=60).read()
            h=hashlib.sha1(b'blob '+str(len(blob)).encode()+b'\0'+blob).hexdigest()
            assert h==pin['sha'],(name,h,pin['sha'])
            (pathlib.Path('qa/results/apple-compare')/name.replace(' ','_')).write_bytes(blob)
          PY
      - name: Measure and compare visible occupied area for small
        run: |
          python -m pip install --quiet "Pillow>=10,<12"
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import json
          root=Path('qa/results/apple-compare')
          ims=[]
          for name in ['big_apple.png','small_apple.png','small_red_apple.png']:
            im=Image.open(root/name).convert('RGBA')
            box=im.getchannel('A').getbbox()
            info=dict(name=name,canvas=im.size,bbox=box,occupancy_width=(box[2]-box[0])/im.width if box else 0,occupancy_height=(box[3]-box[1])/im.height if box else 0)
            ims.append(info)
          sheet=Image.new('RGB',(1200,480),'#f4f7fc')
          draw=ImageDraw.Draw(sheet)
          for n,x in enumerate(ims):
            pic=Image.open(root/x['name']).convert('RGBA')
            pic.thumbnail((350,350))
            tile=Image.new('RGBA',(350,350),(255,255,255,255))
            tile.alpha_composite(pic,((350-pic.width)//2,(350-pic.height)//2))
            sheet.paste(tile.convert('RGB'),(n*400+25,20))
            draw.text((n*400+25,380),x['name'],fill='#222')
            draw.text((n*400+25,410),f"Width {x['occupancy_width']:.1%}  Height {x['occupancy_height']:.1%}",fill='#222')
          sheet.save(root/'comparison.png')
          (root/'measurements.json').write_text(json.dumps(ims,indent=2))
          print(json.dumps(ims,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: duduq-small-apple-choice-${{ github.run_id }}
          path: qa/results/apple-compare/**
          retention-days: 7
