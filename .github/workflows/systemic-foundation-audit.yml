name: Systemic Foundation Audit

on:
  push:
    branches:
      - refactor/systemic-foundation-years1-5
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax
        run: |
          node --check test/systemic/foundation-architecture-audit.mjs
          node --check test/systemic/year1-loader-compat-smoke.mjs
          node --check test/systemic/year1-public-entry-smoke.mjs
          node --check test/systemic/canary-r147-core-1.0.12-contract.mjs
          node --check test/systemic/canary-r147-core-1.0.12-smoke.mjs

      - name: Guard systemic foundation
        run: node test/systemic/foundation-architecture-audit.mjs

      - name: Guard Canary R147 manifest and rollback
        run: node test/systemic/canary-r147-core-1.0.12-contract.mjs

  year1-loader-compat:
    if: github.event_name != 'pull_request' || github.head_ref != 'release/canary-r147-core-1.0.12'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/duduq-systemic-http.log 2>&1 &
          echo $! > /tmp/duduq-systemic-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duduq-systemic-http.log
          exit 1

      - name: Revalidate Canary R147 proportional runtime sentinels
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/systemic/canary-r147-core-1.0.12-smoke.mjs

      - name: Smoke Year 1 M02-M06 via universal Loader
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/systemic/year1-loader-compat-smoke.mjs
