name: Year 1 M02 Official Homologation

on:
  push:
    branches:
      - homolog-year1-m02-official
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m02-ten-criteria:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout M02 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify closed local scope
        run: |
          git fetch origin refactor/systemic-foundation-years1-5
          files="$(git diff --name-only origin/refactor/systemic-foundation-years1-5...HEAD)"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -E '^(engine/|content/english/year-1/module-01/|content/english/year-1/module-0[3-6]/)' ; then
            echo 'Unexpected shared/frozen module diff.' >&2
            exit 1
          fi

      - name: Correct QA false-positive sentinel only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/systemic/year1-m02-official-homologation.mjs')
          s = p.read_text(encoding='utf-8')
          old = '!/gap-preview|procedural|legacy-fallback/i.test(audit.raw)'
          new = '!/gap-preview|legacy-fallback|"status":"preview"/i.test(audit.raw)'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one false-positive sentinel, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check test/systemic/year1-m02-official-homologation.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start M02 candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/duduq-m02-http.log 2>&1 &
          echo $! > /tmp/duduq-m02-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duduq-m02-http.log
          exit 1

      - name: Run M02 10/10 on 4 viewports
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/systemic/year1-m02-official-homologation.mjs

      - name: Upload M02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: year1-m02-official-homologation-evidence
          path: test-results/systemic/year1-m02-official/
          if-no-files-found: ignore
