name: DUDUQ - Independent Official Media Overlay QA

on:
  push:
    branches:
      - automation/duduq-media-source-only-fix-20261029
      - integration/duduq-m1-qa-consolidated-20261031
    paths:
      - ".github/workflows/duduq-independent-official-overlay-qa.yml"
      - ".github/workflows/duduq-assets-duduq-reuse-qa.yml"
      - "scripts/duduq-import-chatgpt-bundle.mjs"
      - "qa/media-candidates/y1m04-official-20261030/**"
      - "qa/media-candidates/y1m05-official-20261030/**"
      - "qa/media-candidates/y1m06-official-20261030/**"
      - "qa/apply-y1m04-official-media-overlay.mjs"
      - "qa/apply-y1m05-official-media-overlay.mjs"
      - "qa/apply-target-shooter-mobile-containment-qa.mjs"
      - "qa/finalize-y1m04-official-media.mjs"
      - "qa/finalize-y1m05-official-media.mjs"
      - "qa/verify-y1m05-source-registry-rebase.mjs"
      - "qa/tests/verify-y1m05-source-registry-rebase.test.mjs"
      - "qa/y1m04-official-media-browser-qa.mjs"
      - "qa/y1m06-official-media-model.mjs"
      - "qa/y1m05-official-media-browser-qa.mjs"
      - "qa/tests/verify-y1m04-official-media-overlay.mjs"
      - "qa/tests/verify-y1m05-official-media-overlay.mjs"
      - "qa/apply-y1m06-official-media-overlay.mjs"
      - "qa/prepare-y1m06-official-media-bundle.mjs"
      - "qa/verify-y1m06-official-media-build.mjs"
      - "qa/verify-y1m06-source-registry-pin.mjs"
      - "qa/verify-compiled-media-distribution-browser.mjs"
      - "qa/replace-pig-from-assets-duduq.mjs"
      - "qa/replace-farm-animal-batch-from-assets-duduq.mjs"
      - "qa/verify-farm-animal-source-batch-browser.mjs"
      - "qa/replace-safe-vocabulary-from-assets-duduq.mjs"
      - "qa/verify-vocabulary-source-browser.mjs"
      - "qa/verify-pig-direct-reuse-browser.mjs"
      - "core/adapters/v27/target-shooter-mobile-containment.css"
      - "core/adapters/v28/intro-mobile-touch-target.css"
      - "qa/apply-intro-mobile-touch-target-v28.mjs"
      - "qa/tests/verify-intro-mobile-touch-target-v28.test.mjs"
      - "qa/export-verified-media-distribution-candidate.mjs"
      - "engine/adapters/r148/duduq-hud-responsive.css"
      - "qa/y1m06-official-media-browser-qa.mjs"
      - "qa/y1m06-official-media-model.mjs"
      - "qa/tests/verify-y1m06-official-media-overlay.mjs"
      - "qa/tests/verify-y1m06-source-registry-pin.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duduq-independent-official-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce-y1m06-review-overlay:
    name: Rebuild and replay Y1M06 review overlay on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "true"
      DUDUQ_QA_ONLY: "1"
      BASE_URL: http://127.0.0.1:4175
    steps:
      - name: Checkout isolated review branch without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Remove stale Y1M06 QA output from this ephemeral runner
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- qa/results/y1m06-official-media-browser
          rm -f -- qa/results/y1m06-official-media-evidence.json qa/results/y1m06-official-media-finalization.json
          rm -f -- qa/results/y1m06-official-media-binding-plan.json qa/results/y1m06-review-build.json
          echo "STALE_Y1M06_QA_EVIDENCE_CLEARED_FROM_EPHEMERAL_CHECKOUT"

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install independent Chromium QA dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build clean V26 from immutable source
        run: bash qa/build-v26-topic-first-paint-qa.sh

      - name: Prepare the hash-pinned Y1M06 review bundle
        shell: bash
        run: |
          set -o pipefail
          node qa/prepare-y1m06-official-media-bundle.mjs 2>&1 | tee /tmp/duduq-y1m06-prepare.log

      - name: Verify the Y1M06 clean-source registry pin
        shell: bash
        run: |
          set -o pipefail
          node qa/verify-y1m06-source-registry-pin.mjs 2>&1 | tee /tmp/duduq-y1m06-pin.log

      - name: Exercise Y1M06 source-pin tamper rejection
        shell: bash
        run: |
          set -o pipefail
          node --test qa/tests/verify-y1m06-source-registry-pin.test.mjs 2>&1 | tee /tmp/duduq-y1m06-pin-test.log

      - name: Annotate a fail-closed Y1M06 preparation error
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          for log in /tmp/duduq-y1m06-prepare.log /tmp/duduq-y1m06-pin.log /tmp/duduq-y1m06-pin-test.log; do
            if [[ -s "$log" ]]; then
              message="$(tail -n 12 "$log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/::/%3A%3A/g')"
              echo "::error title=Y1M06 fail-closed replay diagnostic::$message"
            fi
          done

      - name: Apply scoped mobile geometry fix ONLY to ephemeral Y1M06 compiled QA preview
        run: |
          node --check qa/apply-target-shooter-mobile-containment-qa.mjs
          node qa/apply-target-shooter-mobile-containment-qa.mjs --apply
          echo "Y1M06_QA_PATCH_ONLY_NO_GOLD_MASTER_OR_SOURCE_MODIFICATION"

      - name: Start isolated review-only HTTP server
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m http.server 4175 --bind 127.0.0.1 --directory dist-pages > /tmp/duduq-y1m06-overlay-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then
              echo "ISOLATED_Y1M06_QA_HTTP_READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/duduq-y1m06-overlay-http.log
          exit 1

      - name: Apply and statically verify the Y1M06 candidate overlay
        run: |
          node qa/apply-y1m06-official-media-overlay.mjs --apply
          node qa/tests/verify-y1m06-official-media-overlay.mjs
          node qa/verify-y1m06-official-media-build.mjs
          git diff --exit-code -- content/english functions/play/english core
          echo "NO_SOURCE_QUESTION_NO_PRODUCTION_NO_GOLD_MASTER_CHANGE"

      - name: Exercise all Y1M06 routes and native mouse and touch gameplay
        run: node qa/y1m06-official-media-browser-qa.mjs

      - name: Retain independent Y1M06 reports, trace, video and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duduq-independent-y1m06-overlay-qa-${{ github.run_id }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            qa/results/y1m06-official-media-binding-plan.json
            qa/results/y1m06-review-build.json
            qa/results/y1m06-official-media-browser/**
            qa/media-candidates/y1m06-official-20261030/source-registry-pin.json
            /tmp/duduq-y1m06-prepare.log
            /tmp/duduq-y1m06-pin.log
            /tmp/duduq-y1m06-pin-test.log
            /tmp/duduq-y1m06-overlay-http.log

      - name: Explicit Y1M06 release boundary
        if: always()
        run: |
          echo "Only ephemeral runner dist-pages is modified. No commit, merge, release, production deploy or deletion."
          echo "A red browser step remains a blocker; this job never converts technical evidence into owner approval."

  reproduce-two-reviewed-modules:
    name: Rebuild and replay both Codex media overlays on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      CI: "true"
      DUDUQ_QA_ONLY: "1"
      BASE_URL: http://127.0.0.1:4175
    steps:
      - name: Checkout isolated review branch without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Remove stale checked-in QA output from this ephemeral runner
        shell: bash
        run: |
          set -Eeuo pipefail
          # Historical PASS files exist in the review branch. Never include them
          # in a fresh run artifact when the current browser stage was skipped.
          rm -rf -- qa/results/y1m04-official-media-browser qa/results/y1m05-official-media-browser
          rm -f -- qa/results/y1m04-official-media-evidence.json qa/results/y1m05-official-media-evidence.json
          rm -f -- qa/results/y1m04-official-media-finalization.json qa/results/y1m05-official-media-finalization.json
          rm -f -- qa/results/media-closure-inventory.json qa/results/media-module-closure.json
          rm -f -- qa/results/media-safe-retirement-plan.json qa/results/y1m05-review-build.json
          echo "STALE_QA_EVIDENCE_CLEARED_FROM_EPHEMERAL_CHECKOUT"

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install independent Chromium QA dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build clean V26 from immutable source
        run: |
          # The V19 base SHA pin is checked inside the build chain before V21-V26 overlays.
          # Rechecking the V19 pin after V26 would falsely reject the correctly changed manifest.
          bash qa/build-v26-topic-first-paint-qa.sh

      - name: Apply scoped mobile geometry fix ONLY to ephemeral compiled QA preview
        run: |
          node --check qa/apply-target-shooter-mobile-containment-qa.mjs
          node qa/apply-target-shooter-mobile-containment-qa.mjs --apply
          echo "QA_PATCH_ONLY_NO_GOLD_MASTER_OR_SOURCE_MODIFICATION"

      - name: Verify Y1M05 pristine V26 registry rebase without rewriting legacy evidence
        run: |
          node qa/verify-y1m05-source-registry-rebase.mjs
          node --test qa/tests/verify-y1m05-source-registry-rebase.test.mjs

      - name: Start isolated review-only HTTP server
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m http.server 4175 --bind 127.0.0.1 --directory dist-pages > /tmp/duduq-overlay-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then
              echo "ISOLATED_QA_HTTP_READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/duduq-overlay-http.log
          exit 1

      - name: Reproduce Y1M04 candidate integration and all 20 Chromium question routes
        run: |
          node qa/apply-y1m04-official-media-overlay.mjs --apply
          node qa/tests/verify-y1m04-official-media-overlay.mjs
          node qa/y1m04-official-media-browser-qa.mjs
          node qa/finalize-y1m04-official-media.mjs --apply
          node qa/tests/verify-y1m04-official-media-overlay.mjs --require-official

      - name: Reproduce Y1M05 on the independently verified Y1M04 predecessor
        run: |
          # apply-y1m05 fails closed unless the current registry is either the
          # exact pristine V26 pin or a fully hash-bound Y1M04 official
          # predecessor whose 101-entry Y1M05 source projection is unchanged.
          node qa/apply-y1m05-official-media-overlay.mjs --apply
          node qa/tests/verify-y1m05-official-media-overlay.mjs
          node qa/verify-y1m05-official-media-build.mjs
          node qa/y1m05-official-media-browser-qa.mjs
          node qa/finalize-y1m05-official-media.mjs --apply
          node qa/tests/verify-y1m05-official-media-overlay.mjs --require-official

      - name: Require independent proof of combined 185-ID integration
        run: |
          node qa/audit-media-completion.mjs
          node qa/check-media-module-closure.mjs
          node qa/media-safe-retirement.mjs --root=dist-pages --output=qa/results/media-safe-retirement-plan.json
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import assert from "node:assert/strict";
            const inv=JSON.parse(readFileSync("qa/results/media-closure-inventory.json"));
            const c=JSON.parse(readFileSync("qa/results/media-module-closure.json"));
            const plan=JSON.parse(readFileSync("qa/results/media-safe-retirement-plan.json"));
            assert.equal(inv.modules,30);
            assert.equal(inv.activities,600);
            assert.equal(c.modules,30);
            assert.equal(c.activities,600);
            assert.equal(c.distinctPendingMediaIds,954,"Independent Linux replay must match Codex checkpoint");
            assert.equal(c.distinctVerifiedMediaIds,185);
            assert.equal(c.completedModules,2);
            assert.deepEqual(c.modulesDetail.filter(m=>m.complete).map(m=>m.moduleId).sort(),["Y1M04","Y1M05"]);
            assert.equal(inv.byStatus?.BROKEN_ASSET||0,0);
            assert.equal(inv.byStatus?.MISSING_REGISTRY||0,0);
            assert.equal(plan.applied,false,"No retirement may occur");
            assert.equal(c.status,"INCOMPLETE");
            assert.equal(inv.finalCompletionPassed,false);
            console.log(JSON.stringify({status:"PASS_REVIEW_ONLY",modules:30,activities:600,verified:185,pending:954,completedModules:2,productionDeployed:false}));
          '
          git diff --exit-code -- content/english functions/play/english core
          echo "NO_PRODUCTION_DEPLOY_NO_MEDIA_DELETION_NO_GOLD_MASTER_CHANGE"

      - name: Checkout pinned official Assets-DuduQ source for exact pig reuse
        uses: actions/checkout@v4
        with:
          repository: augustoborgessousa93/Assets-DuduQ
          ref: 50fb80a89a5779d73f81c96aab35f6e86193d769
          path: assets-source
          persist-credentials: false

      - name: Integrate exactly one pig PNG into three provisional IDs after the 185 approved replacements
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C assets-source rev-parse HEAD)" = "50fb80a89a5779d73f81c96aab35f6e86193d769"
          test -z "$(git -C assets-source status --porcelain)"
          node --check qa/replace-pig-from-assets-duduq.mjs
          node qa/replace-pig-from-assets-duduq.mjs assets-source
          node qa/replace-pig-from-assets-duduq.mjs assets-source --apply
          node --check qa/verify-pig-direct-reuse-browser.mjs
          node qa/verify-pig-direct-reuse-browser.mjs
          echo "185_APPROVED_IDS_PLUS_3_PIG_PREVIEW_IDS_VERIFIED_ON_ONE_COMPILED_ARTIFACT"

          node --check qa/replace-farm-animal-batch-from-assets-duduq.mjs
          node qa/replace-farm-animal-batch-from-assets-duduq.mjs assets-source
          node qa/replace-farm-animal-batch-from-assets-duduq.mjs assets-source --apply
          node --check qa/verify-farm-animal-source-batch-browser.mjs
          node qa/verify-farm-animal-source-batch-browser.mjs
          echo "185_APPROVED_IDS_PLUS_16_PROVISIONAL_FARM_ANIMAL_IDS_ON_ONE_COMPILED_PRODUCT"

      - name: Integrate safe bilingual numerals colors and pets from pinned source in ephemeral compiled QA only
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check qa/replace-safe-vocabulary-from-assets-duduq.mjs
          node qa/replace-safe-vocabulary-from-assets-duduq.mjs assets-source
          node qa/replace-safe-vocabulary-from-assets-duduq.mjs assets-source --apply
          node --check qa/verify-vocabulary-source-browser.mjs
          node qa/verify-vocabulary-source-browser.mjs
          echo "SOURCE_VOCAB_REUSE_PREVIEW_ONLY_NO_PEDAGOGICAL_RELEASE"

      # This is a product-shaped compiled distribution containing all 358
      # media-ID substitutions, NOT another empty QA report. The temporary
      # injected Target Shooter style is stripped and re-hashed; only V27
      # versioned Pages CSS remains. V28 expands only the transparent Intro
      # hit area; the CTA artwork and all curriculum/media bytes stay unchanged.
      # Release approval is deliberately FALSE.
      - name: Export single hash-bound 358-ID distributable candidate with V28 touch target
        run: |
          set -Eeuo pipefail
          node --check qa/apply-intro-mobile-touch-target-v28.mjs
          node --test qa/tests/verify-intro-mobile-touch-target-v28.test.mjs
          DUDUQ_COMPILED_RELEASE_HOTFIX=1 node qa/apply-intro-mobile-touch-target-v28.mjs --apply
          node --check qa/export-verified-media-distribution-candidate.mjs
          node qa/export-verified-media-distribution-candidate.mjs
          node --check qa/verify-compiled-media-distribution-browser.mjs
          node qa/verify-compiled-media-distribution-browser.mjs
          tar -czf "$RUNNER_TEMP/duduq-review-distribution.tar.gz" -C dist-pages .
          sha256sum "$RUNNER_TEMP/duduq-review-distribution.tar.gz" | sed 's#  .*/#  #' > qa/results/duduq-review-distribution.sha256
          test -s "$RUNNER_TEMP/duduq-review-distribution.tar.gz"
          echo "BUNDLED_COMPILED_PRODUCT_WITH_358_MEDIA_IDS_AND_V28_TOUCH_TARGET_NOT_PEDAGOGICALLY_APPROVED"

      - name: Keep compiled product artifact for release review without deploying
        uses: actions/upload-artifact@v4
        with:
          name: duduq-media-distribution-candidate-${{ github.run_id }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/duduq-review-distribution.tar.gz
            qa/results/duduq-review-distribution.sha256
            qa/results/duduq-distribution-candidate.json
            qa/results/intro-mobile-touch-target-v28.json
            qa/results/pig-source-direct-reuse.json
            qa/results/pig-source-direct-browser.json
            qa/results/farm-animal-source-batch.json
            qa/results/farm-animal-batch-browser.json
            qa/results/vocabulary-source-batch.json
            qa/results/vocabulary-source-browser.json

      - name: Retain independent QA reports and real-browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duduq-independent-overlay-qa-${{ github.run_id }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            qa/results/media-closure-inventory.json
            qa/results/media-module-closure.json
            qa/results/media-safe-retirement-plan.json
            qa/results/y1m04-official-media-browser/**
            qa/results/y1m05-official-media-browser/**
            qa/results/y1m04-official-media-evidence.json
            qa/results/y1m05-official-media-evidence.json
            qa/results/y1m04-official-media-finalization.json
            qa/results/y1m05-official-media-finalization.json
            qa/results/intro-mobile-touch-target-v28.json
            /tmp/duduq-overlay-http.log

      - name: Explicit release boundary
        if: always()
        run: |
          echo "Only ephemeral runner dist-pages is modified. No commit, merge, release, production deploy or deletion."
          echo "This is independent technical/browser QA; it does not replace owner final pedagogical approval."
