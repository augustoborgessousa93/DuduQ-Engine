name: DUDUQ Last60 Visual Review Compact Sheets

on:
  push:
    branches:
      - staging/duduq-last60-new-assets-20261110
    paths:
      - qa/build-last60-visual-review.py
      - .github/workflows/duduq-last60-visual-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download exact successful candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: duduq-last60-qa-42924245868
          run-id: 42924245868
          github-token: ${{ github.token }}
          path: qa/input-last60-20261110
      - name: Verify and extract six contact sheets and six browser captures
        run: |
          python -m pip install --quiet "Pillow>=10,<12"
          python qa/build-last60-visual-review.py qa/input-last60-20261110 qa/results/last60-visual-review
      - name: Upload only compact review images and report
        uses: actions/upload-artifact@v4
        with:
          name: duduq-last60-visual-review-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: qa/results/last60-visual-review/**
      - name: Explicit no-release gate
        run: |
          echo "Visual review sheets are NOT human pedagogical sign-off."
          echo "No production deploy, merge or changes to game sources."
