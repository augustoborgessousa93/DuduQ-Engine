name: DUDUQ Y1 - immutable QA distribution with source images (NO deploy)
on:
  push:
    branches: [qa/duduq-y1-greetings-official-media-20261103]
    paths:
      - .github/workflows/duduq-y1-greetings-immutable-qa-package.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: duduq-y1-greetings-single-qa-release
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/duduq-y1-greetings-immutable-qa-package.yml
          sparse-checkout-cone-mode: false
      - name: Gate exact already-passed compiled media and browser tests
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41721480687" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41723592971" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41723592971" --jq '.head_sha')" = b6ceac4c05706d40bc07d02aeb28f1a2ee4eb278
          echo Y1_BROWSER_ALREADY_PASSED
      - name: Restore exact official baseline and changed Y1 overlay
        run: |
          set -Eeuo pipefail
          mkdir -p dist-pages /tmp/y1qa qa/results
          URL='https://github.com/augustoborgessousa93/DuduQ-Engine/releases/download/duduq-phase2-orange-fruit-color-corrected-20261103/duduq-phase2-orange-fruit-color-corrected.tar.gz'
          curl -fLSs --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 720 "$URL" -o /tmp/duduq-current-release.tar.gz
          echo 'cf049f8c7a5f3d02696f7997b6dd1e31ec7b28942f6c77b96af656e72b5a1800  /tmp/duduq-current-release.tar.gz' | sha256sum -c -
          tar -xzf /tmp/duduq-current-release.tar.gz -C dist-pages
          gh run download 41721480687 -R "$GITHUB_REPOSITORY" -n duduq-y1-official-greetings-media-qa-candidate -D /tmp/y1qa
          (cd /tmp/y1qa && sha256sum -c overlay.sha256)
          tar -xzf /tmp/y1qa/overlay.tar.gz -C dist-pages
          cp /tmp/y1qa/report.json qa/results/y1-greetings-fixed-source-report.json
      - name: Verify 2896 hashes and all 600 contracts
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          const root=path.resolve('dist-pages');
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const report=JSON.parse(readFileSync('qa/results/y1-greetings-fixed-source-report.json','utf8'));
          const entries=readFileSync(path.join(root,'.duduq-pages-manifest'),'utf8').trimEnd().split(/\r?\n/);
          assert.equal(entries.length,2896);
          for(const line of entries){
           const i=line.lastIndexOf(' ');assert(i>0);
           const rel=line.slice(0,i),expected=line.slice(i+1),f=path.resolve(root,rel);
           assert(f.startsWith(root+path.sep));assert.equal(sha(readFileSync(f)),expected,'HASH:'+rel);
          }
          assert.deepEqual(report.touchedQuestionFiles,['content/english/year-1/module-01/questions.json']);
          assert.equal(report.answerKeysChanged,0);
          let n=0;
          for(let y=1;y<=5;y++)for(let m=1;m<=6;m++){
           const rel='content/english/year-'+y+'/module-'+String(m).padStart(2,'0')+'/questions.json';
           const q=JSON.parse(readFileSync(path.join(root,rel)));
           assert.equal(q.items.length,20);n+=20;
          }
          assert.equal(n,600);
          console.log('Y1_QA_DISTRIBUTION_VERIFIED='+JSON.stringify({manifest:entries.length,questions:n,sourcePng:report.newOriginalPngs,mediaIds:report.replacedMediaIds.length,productionDeployed:false}));
          NODE
      - name: Publish immutable QA prerelease (no Cloudflare deployment)
        run: |
          set -Eeuo pipefail
          TAG=duduq-y1-greetings-corrected-qa-20261103
          NAME=duduq-y1-greetings-corrected-qa-20261103.tar.gz
          HASH=duduq-y1-greetings-corrected-qa-20261103.sha256
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1;then echo 'TAG_EXISTS';exit 1;fi
          tar -czf "qa/results/$NAME" -C dist-pages .
          (cd qa/results && sha256sum "$NAME" > "$HASH")
          gh release create "$TAG" "qa/results/$NAME" "qa/results/$HASH" \
            -R "$GITHUB_REPOSITORY" --prerelease \
            --title "DUDUQ English Year 1 — correct greetings and semantic media" \
            --notes "QA candidate only; 600 unchanged answer keys; 2896 manifest files; source original Assets-DuduQ commit a62c07c; real browser tests PASS run #41723592971. NOT deployed in production."
          cat "qa/results/$HASH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duduq-y1-greetings-corrected-qa-prerelease-hash
          retention-days: 90
          if-no-files-found: warn
          path: |
            qa/results/duduq-y1-greetings-corrected-qa-20261103.sha256
            qa/results/y1-greetings-fixed-source-report.json
