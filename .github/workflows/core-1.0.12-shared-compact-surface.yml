name: Core 1.0.12 Shared Compact Surface

on:
  push:
    branches:
      - fix/shared-compact-mechanic-surface
    paths:
      - 'engine/releases/core/1.0.12/**'
      - 'test/systemic/core-1.0.12-*.mjs'
      - '.github/workflows/core-1.0.12-shared-compact-surface.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-gate:
    if: github.event_name != 'pull_request' || github.head_ref == 'fix/shared-compact-mechanic-surface'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check test/systemic/core-1.0.12-shared-compact-causal.mjs
          node --check test/systemic/core-1.0.12-shared-compact-regression.mjs
          node --check test/systemic/core-1.0.12-release-integrity.mjs
          node --check test/systemic/foundation-architecture-audit.mjs
          node --check test/systemic/year1-loader-compat-smoke.mjs
      - name: Core 1.0.12 release integrity
        run: node test/systemic/core-1.0.12-release-integrity.mjs
      - name: Foundation contract
        run: node test/systemic/foundation-architecture-audit.mjs
      - name: Drag and Drop 2.0.24 contract
        run: node test/systemic/canary-r146-drag-drop-2.0.24-contract.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/duduq-core-1.0.12-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duduq-core-1.0.12-http.log
          exit 1
      - name: Prove shared compact surface causality
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/systemic/core-1.0.12-shared-compact-causal.mjs
      - name: Validate frozen TS and DD consumers on candidate
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/systemic/core-1.0.12-shared-compact-regression.mjs
      - name: Loader and Player compatibility smoke
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/systemic/year1-loader-compat-smoke.mjs
