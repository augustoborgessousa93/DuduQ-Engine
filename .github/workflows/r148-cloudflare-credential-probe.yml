name: R148 Cloudflare Credential Probe

on:
  push:
    branches:
      - release/canary-r148-drag-drop-2.0.25
    paths:
      - ".github/workflows/r148-cloudflare-credential-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN != '' }}
      HAS_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID != '' }}
      HAS_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK != '' }}
    steps:
      - name: Report credential availability only
        shell: bash
        run: |
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$HAS_CLOUDFLARE_API_TOKEN"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$HAS_CLOUDFLARE_ACCOUNT_ID"
          printf 'CF_API_TOKEN=%s\n' "$HAS_CF_API_TOKEN"
          printf 'CF_ACCOUNT_ID=%s\n' "$HAS_CF_ACCOUNT_ID"
          printf 'CLOUDFLARE_PAGES_DEPLOY_HOOK=%s\n' "$HAS_PAGES_DEPLOY_HOOK"
