name: Homolog Drag Drop Single Target Choice

on:
  push:
    branches:
      - homolog/drag-drop-single-target-choice-m03
    paths:
      - "engine/releases/mechanics/drag-drop/2.0.18/**"
      - "engine/releases/mechanics/drag-drop/2.0.22/**"
      - "engine/releases/mechanics/drag-drop/2.0.23/**"
      - "engine/channels/canary-v1.json"
      - "engine/channels/homolog-m03-single-target-v1.json"
      - "content/english/year-2/module-03/**"
      - "content/english/year-2/year2-v23-dragdrop-visual-patch.js"
      - "test/drag-drop/single-target-choice-2.0.23/**"
      - ".github/workflows/homolog-drag-drop-single-target-choice.yml"
  pull_request:
    branches:
      - main
    paths:
      - "engine/releases/mechanics/drag-drop/2.0.18/**"
      - "engine/releases/mechanics/drag-drop/2.0.22/**"
      - "engine/releases/mechanics/drag-drop/2.0.23/**"
      - "engine/channels/canary-v1.json"
      - "engine/channels/homolog-m03-single-target-v1.json"
      - "content/english/year-2/module-03/**"
      - "content/english/year-2/year2-v23-dragdrop-visual-patch.js"
      - "test/drag-drop/single-target-choice-2.0.23/**"
      - ".github/workflows/homolog-drag-drop-single-target-choice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    name: Static composition contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout homolog branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check candidate adapter
        run: node --check engine/releases/mechanics/drag-drop/2.0.23/drag-drop.js

      - name: Syntax check M03 visual patch
        run: node --check content/english/year-2/year2-v23-dragdrop-visual-patch.js

      - name: Validate SINGLE_TARGET_CHOICE composition contract
        run: node test/drag-drop/single-target-choice-2.0.23/contract.mjs
