name: DUDUQ - Verify recovered destination media in QA preview
on:
  push:
    branches:
      - integration/assets-duduq-resume-20261030
    paths:
      - "qa/repair-assets-duduq-scoped-occurrences.mjs"
      - "qa/apply-assets-duduq-y1m04-review.mjs"
      - "qa/build-v26-topic-first-paint-qa.sh"
      - ".github/workflows/duduq-assets-duduq-repaired-bindings-qa.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CF_PAGES_BRANCH: integration/assets-duduq-resume-20261030
      BASE_URL: http://127.0.0.1:4175
      DUDUQ_MEDIA_QA_MODULES: Y1M02,Y1M03,Y1M04,Y1M06
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild candidate preview with destination correction
        run: |
          node --check qa/repair-assets-duduq-scoped-occurrences.mjs
          bash qa/build-v26-topic-first-paint-qa.sh
      - name: Confirm corrected destination/media references and immutable source
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('qa/results/assets-duduq-occurrence-scoped-repair.json','utf8'));
          const r=JSON.parse(fs.readFileSync('dist-pages/content/english/media/media-registry.json','utf8'));
          const lookup=new Map(r.entries.map(e=>[e.mediaId,e]));
          assert(c.totalNewMediaIds>=12,'INSUFFICIENT_SCOPED_MEDIA_IDENTIFIERS');
          assert(c.questionFilesModified.length>=3,'QUESTION_REFERENCE_FILES_NOT_UPDATED');
          const cases=[
            ['Y1M02','01',['one','two','three','four']],
            ['Y1M03','01',['red','blue','yellow','green']],
            ['Y1M06','01',['dog','cat','fish','rabbit']]
          ];
          for(const [module,unused,concepts] of cases){
            const m=module.slice(3);
            const q=JSON.parse(fs.readFileSync('dist-pages/content/english/year-1/module-'+m+'/questions.json','utf8')).items[0];
            const found=new Map();
            function walk(node){
              if(!node||typeof node!=='object')return;
              if(!Array.isArray(node)){
                for(const key of ['assetId','mediaId','image_ref','imageRef']){
                  const id=node[key];
                  if(typeof id!=='string'||!id.includes('-CTX-'))continue;
                  const concept=String(node.semanticTarget||'').toLowerCase().trim();
                  const e=lookup.get(id);
                  assert(e?.provenance?.sourceRepository==='augustoborgessousa93/Assets-DuduQ','MISSING_SOURCE_BINDING:'+id);
                  assert(e.urlOrPath?.endsWith('.png'),'WRONG_ASSET_TYPE:'+id);
                  assert(e.temporary===true,'MUST_STAY_PENDING_HUMAN_APPROVAL:'+id);
                  found.set(concept,(found.get(concept)||0)+1);
                }
              }
              for(const v of Object.values(node))if(v&&typeof v==='object')walk(v);
            }
            walk(q);
            for(const concept of concepts)assert(found.has(concept),'QUESTION_DESTINATION_STILL_PROVISIONAL:'+module+':'+concept);
          }
          console.log('DUDUQ_MEDIA_OCCURRENCE_RECOVERY='+JSON.stringify({status:'PASS',newIds:c.totalNewMediaIds,mediaFieldsChanged:c.totalQuestionMediaOccurrencesRebound,byModule:c.byModule,sourceQuestionCount:600,production:'UNTOUCHED'}));
          NODE
      - name: Install browser and check all four module routes
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Boot all four modules, screen sizes 3
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 --directory dist-pages >/tmp/duduq-reviewed-qa.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4175/ >/dev/null 2>&1 && break; sleep 1; done
          node qa/browser-media-candidate-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duduq-recovered-destination-qa-report
          retention-days: 21
          path: |
            qa/results/assets-duduq-occurrence-scoped-repair.json
            qa/results/media-browser-qa/**
      - run: echo "Strictly isolated QA preview. No official promotion or pedagogical approval."
