name: Drag Drop 2.0.25 Final Gate

on:
  push:
    branches:
      - refine/drag-drop-2.0.25-smart-confirm
  workflow_dispatch:

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gate syntax
        run: |
          node --check test/drag-drop/smart-confirm-2.0.25/final-gate.mjs
          node --check test/drag-drop/smart-confirm-2.0.25/media-sequence.mjs
          node --check test/drag-drop/smart-confirm-2.0.25/media-render-probe.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/dd225-server.log 2>&1 &
          echo $! > /tmp/dd225-server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/test/drag-drop/smart-confirm-2.0.25/index.html >/dev/null && break; sleep 1; done
      - name: Surgical or final gate
        env:
          BASE_URL: http://127.0.0.1:4173
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"[media-only]"* ]]; then
            node test/drag-drop/smart-confirm-2.0.25/media-render-probe.mjs
          elif [[ "$COMMIT_MESSAGE" == *"[sequence-only]"* ]]; then
            DD225_SCENARIO=sequence node test/drag-drop/smart-confirm-2.0.25/media-sequence.mjs
          else
            node test/drag-drop/smart-confirm-2.0.25/final-gate.mjs
          fi