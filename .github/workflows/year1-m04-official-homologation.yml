name: Year 1 M04 Official Homologation

on:
  push:
    branches:
      - homolog-year1-m04-official
    paths:
      - 'content/english/year-1/module-04/**'
      - 'test/systemic/year1-m04-official-homologation.mjs'
      - '.github/workflows/year1-m04-official-homologation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m04-ten-criteria:
    name: M04 10/10 — ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - desktop-1366x768
          - fullhd-1920x1080
          - tablet-768x1024
          - mobile-390x844
    steps:
      - name: Checkout M04 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify closed local M04 scope
        run: |
          git fetch origin refactor/systemic-foundation-years1-5
          files="$(git diff --name-only origin/refactor/systemic-foundation-years1-5...HEAD)"
          printf '%s\n' "$files"
          unexpected="$(printf '%s\n' "$files" | grep -Ev '^(content/english/year-1/module-04/|test/systemic/year1-m04-official-homologation\.mjs$|\.github/workflows/year1-m04-official-homologation\.yml$|test/systemic/year1-m04-targeted-diagnostic\.mjs$|\.github/workflows/year1-m04-targeted-diagnostic\.yml$)' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected diff outside local M04 homologation/QA scope:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Syntax and prohibited-media guard
        run: |
          node --check content/english/year-1/module-04/module-04.js
          node --check content/english/year-1/module-04/m04-visual-composition.js
          node --check test/systemic/year1-m04-official-homologation.mjs
          python3 - <<'PY'
          from pathlib import Path
          text = Path('content/english/year-1/module-04/module-04.js').read_text(encoding='utf-8').lower()
          prohibited = ['data:image', '<svg', 'gap-preview', 'legacy-fallback']
          found = [token for token in prohibited if token in text]
          if found:
              raise SystemExit(f'Prohibited M04 media representation found: {found}')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start M04 candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/duduq-m04-http.log 2>&1 &
          echo $! > /tmp/duduq-m04-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duduq-m04-http.log
          exit 1

      - name: Run M04 10/10 — ${{ matrix.viewport }}
        env:
          BASE_URL: http://127.0.0.1:4173
          VIEWPORT_NAME: ${{ matrix.viewport }}
        run: node test/systemic/year1-m04-official-homologation.mjs

      - name: Upload M04 evidence — ${{ matrix.viewport }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: year1-m04-official-${{ matrix.viewport }}
          path: test-results/systemic/year1-m04-official/
          if-no-files-found: ignore
          retention-days: 14

  m04-aggregate:
    name: M04 aggregate 4/4 10/10
    needs: m04-ten-criteria
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all four viewport shards
        env:
          MATRIX_RESULT: ${{ needs.m04-ten-criteria.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "M04 aggregate FAIL: matrix result=$MATRIX_RESULT" >&2
            exit 1
          fi
          echo 'M04 PASS 4/4 10/10'
