name: Year 2 Gamification Diversity RC1

on:
  pull_request:
    paths:
      - "content/english/year-2/**"
      - "test/year2/gamification-diversity-*.mjs"
      - "test/year2/manual-review-hotfix-*.mjs"
      - "test/year2/mechanics-regression-*.mjs"
      - "test/year2/word-slash-frame-diagnostic-*.mjs"
      - ".github/workflows/year2-gamification-diversity-rc1.yml"
  push:
    branches:
      - "feat/year2-gamification-diversity-v23"
      - "fix/year2-logo-smart-assets-matching-v2"
      - "hotfix/year2-mechanics-regression"
    paths:
      - "content/english/year-2/**"
      - "test/year2/gamification-diversity-*.mjs"
      - "test/year2/manual-review-hotfix-*.mjs"
      - "test/year2/mechanics-regression-*.mjs"
      - "test/year2/word-slash-frame-diagnostic-*.mjs"
      - ".github/workflows/year2-gamification-diversity-rc1.yml"

permissions:
  contents: read

jobs:
  integrity:
    name: 90-item content + mechanic integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check diversity layer
        run: node --check content/english/year-2/year2-v23-gamification-diversity.js

      - name: Syntax check manual-review hotfix RC2
        run: node --check content/english/year-2/year2-v23-manual-review-hotfix-v2.js

      - name: Syntax check mechanics regression hotfix RC1
        run: node --check content/english/year-2/year2-v23-mechanics-regression-hotfix.js

      - name: Syntax check mechanics regression Router compatibility
        run: node --check content/english/year-2/year2-v23-mechanics-regression-router-compat.js

      - name: Syntax check Year 2 RC test
        run: node --check test/year2/gamification-diversity-rc1.mjs

      - name: Syntax check manual-review diagnostic
        run: node --check test/year2/manual-review-hotfix-diagnostic.mjs

      - name: Syntax check mechanics regression diagnostic
        run: node --check test/year2/mechanics-regression-hotfix-rc1.mjs

      - name: Syntax check quick browser homologation RC2
        run: node --check test/year2/gamification-diversity-browser-rc2.mjs

      - name: Syntax check exhaustive manual-review browser RC2
        run: node --check test/year2/manual-review-hotfix-browser-rc2.mjs

      - name: Syntax check deterministic mechanics regression browser RC2
        run: node --check test/year2/mechanics-regression-browser-rc2.mjs

      - name: Syntax check mechanics regression browser diagnostic supervisor RC2
        run: node --check test/year2/mechanics-regression-browser-diagnostic-rc2.mjs

      - name: Syntax check focused Word Slash frame diagnostic RC2
        run: node --check test/year2/word-slash-frame-diagnostic-rc2.mjs

      - name: Syntax check public entry smoke
        run: node --check test/year2/gamification-diversity-public-entry-rc1.mjs

      - name: Validate frozen six-module / 90-item source integrity
        run: node test/year2/gamification-diversity-rc1.mjs

      - name: Validate variable complete-pair Matching + manual review hotfix
        run: node test/year2/manual-review-hotfix-diagnostic.mjs

      - name: Validate mechanics regression contracts across all 90 items
        run: node test/year2/mechanics-regression-hotfix-rc1.mjs

  chromium-homologation:
    name: Chromium interaction + responsive homologation
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local DuduQ server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/duduq-year2-http.log 2>&1 &
          echo $! > /tmp/duduq-year2-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duduq-year2-http.log
          exit 1

      - name: Run quick browser manual-review smoke RC2
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/year2/gamification-diversity-browser-rc2.mjs

      - name: Homologate Intro + every Matching-origin item on desktop and mobile
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/year2/manual-review-hotfix-browser-rc2.mjs

      - name: Capture focused Word Slash iframe lifecycle RC2
        env:
          BASE_URL: http://127.0.0.1:4173
        run: timeout 45s node test/year2/word-slash-frame-diagnostic-rc2.mjs

      - name: Homologate Word Slash, Bubble, Target uniqueness and dense Matching RC2
        env:
          BASE_URL: http://127.0.0.1:4173
        run: timeout 240s node test/year2/mechanics-regression-browser-diagnostic-rc2.mjs

      - name: Smoke all public M01-M06 entrypoints
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/year2/gamification-diversity-public-entry-rc1.mjs

      - name: Upload browser homologation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: year2-gamification-diversity-rc1-browser
          path: test-results/year2-gamification-diversity-rc1
          if-no-files-found: warn
          retention-days: 7
