name: Year 2 Word Slash Homologation

on:
  push:
    branches:
      - homolog/year2-word-slash-pedagogy
    paths:
      - "content/english/year-2/**"
      - "scripts/qa-year2-word-slash-homolog.mjs"
      - "scripts/qa-year2-m01-v22-canonical.mjs"
      - "scripts/qa-year2-m01-v22-runtime.mjs"
      - "scripts/qa-year2-all-v22-runtime.mjs"
      - "scripts/qa-year2-visual-functional.mjs"
      - "scripts/qa-year2-visual-functional-base.mjs"
      - "scripts/qa-year2-m01-12-first-listen.mjs"
      - "scripts/audit-year2-commercial-readiness.mjs"
      - "engine/channels/canary-v1.json"
      - ".github/workflows/year2-word-slash-homolog.yml"
  pull_request:
    branches:
      - main
    paths:
      - "content/english/year-2/**"
      - "scripts/qa-year2-word-slash-homolog.mjs"
      - "scripts/qa-year2-m01-v22-canonical.mjs"
      - "scripts/qa-year2-m01-v22-runtime.mjs"
      - "scripts/qa-year2-all-v22-runtime.mjs"
      - "scripts/qa-year2-visual-functional.mjs"
      - "scripts/qa-year2-visual-functional-base.mjs"
      - "scripts/qa-year2-m01-12-first-listen.mjs"
      - "scripts/audit-year2-commercial-readiness.mjs"
      - "engine/channels/canary-v1.json"
      - ".github/workflows/year2-word-slash-homolog.yml"

permissions:
  contents: read

jobs:
  structural-gate:
    name: Structural pedagogical gate
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate official M01 v2.2 source
        run: node scripts/qa-year2-m01-v22-canonical.mjs

      - name: Validate isolated M01 v2.2 runtime
        run: node scripts/qa-year2-m01-v22-runtime.mjs

      - name: Validate isolated Word Slash pilot
        run: node scripts/qa-year2-word-slash-homolog.mjs

      - name: Validate Year 2 M01-M06 v2.2 + Factory v1.2
        run: node scripts/qa-year2-all-v22-runtime.mjs

      - name: Audit commercial assets and recorded audio
        run: node scripts/audit-year2-commercial-readiness.mjs

      - name: Upload commercial readiness audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: year2-commercial-readiness
          path: artifacts/year2-readiness
          if-no-files-found: warn
          retention-days: 14

  visual-functional-gate:
    name: Visual and functional gate
    needs: structural-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local homologation server
        run: |
          python3 -m http.server 4173 > /tmp/duduq-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/engine/channels/canary-v1.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duduq-http.log
          exit 1

      - name: Validate M01-M06 desktop and mobile
        run: node scripts/qa-year2-visual-functional-base.mjs

      - name: Validate EN2-M1-12 first-listen gate
        run: node scripts/qa-year2-m01-12-first-listen.mjs

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: year2-visual-functional-evidence
          path: artifacts/year2-visual
          if-no-files-found: warn
          retention-days: 14
