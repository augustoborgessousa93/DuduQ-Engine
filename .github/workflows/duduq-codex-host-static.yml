name: DUDUQ Codex Windows Host Static Safety
on:
  push:
    branches:
      - automation/duduq-media-source-only-fix-20261029
    paths:
      - qa/duduq-codex-unattended.mjs
      - qa/validate-duduq-png.mjs
      - qa/duduq-windows-scheduler-diagnostics.mjs
      - qa/duduq-two-lane-plan.mjs
      - qa/tests/duduq-two-lane-plan.test.mjs
      - .github/workflows/duduq-codex-host-static.yml
  pull_request:
    paths:
      - qa/duduq-codex-unattended.mjs
      - .github/workflows/duduq-codex-host-static.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and read-only status on Linux
        run: |
          node --check qa/duduq-codex-unattended.mjs
          node --check qa/duduq-windows-scheduler-diagnostics.mjs
          node --check qa/validate-duduq-png.mjs
          node --check qa/duduq-two-lane-plan.mjs
          node --check qa/tests/duduq-two-lane-plan.test.mjs
          node --test qa/tests/duduq-two-lane-plan.test.mjs
          node qa/duduq-two-lane-plan.mjs --output=/tmp/duduq-two-lane-plan.json
          node -e "let x=require('/tmp/duduq-two-lane-plan.json');if(x.moduleCount!==30||x.activityCount!==600||!x.producer.nextModule||!x.integrator.nextModule||x.finished||x.integrator.deployAllowed)process.exit(2);console.log('DUDUQ_TWO_LANE_REVIEW_ONLY=PASS',x.producer.nextModule,x.integrator.nextModule)"
          node qa/duduq-codex-unattended.mjs --status
      - name: Fail closed outside Windows even with Codex absent
        run: |
          set +e
          node qa/duduq-codex-unattended.mjs --doctor > /tmp/duduq-doctor.out 2>&1
          status=$?
          set -e
          cat /tmp/duduq-doctor.out
          test "$status" -eq 2
          grep -F "REQUIRES_WINDOWS_HOST" /tmp/duduq-doctor.out
      - name: No execution or production permissions here
        run: echo "STATIC RUNNER CHECK ONLY. Windows installation must be performed by authenticated local Codex."
