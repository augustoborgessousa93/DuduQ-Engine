name: DUDUQ Phase2 - final orange-context browser gate and prerelease package (NO DEPLOY)
on:
  push:
    branches: [qa/duduq-phase2-releasegate-127-20261103]
    paths:
      - qa/verify-orange-fruit-color-browser.mjs
      - .github/workflows/duduq-phase2-orange-release-qa.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: duduq-phase2-orange-release-qa
  cancel-in-progress: true
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      DUDUQ_QA_ONLY: "1"
      BASE_URL: http://127.0.0.1:4175
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: qa/verify-orange-fruit-color-browser.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Restore source-verifiable 127 + 153 + orange-fruit split, no rebuild
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/qa127 /tmp/qa153 /tmp/qafruit dist-pages qa/results
          gh run download 41549957803 -R "$GITHUB_REPOSITORY" -n duduq-phase2-conservative-source-reuse-qa -D /tmp/qa127
          TAR="$(find /tmp/qa127 -name duduq-phase2-proven-safe-visual-hold-unapproved.tar.gz -print -quit)"
          SUM="$(find /tmp/qa127 -name duduq-phase2-proven-safe-visual-hold-unapproved.sha256 -print -quit)"
          test -s "$TAR" && test -s "$SUM"
          (cd "$(dirname "$TAR")" && sha256sum -c "$(basename "$SUM")")
          tar -xzf "$TAR" -C dist-pages
          gh run download 41682938356 -R "$GITHUB_REPOSITORY" -n duduq-phase2-batch-source-integration-qa-only -D /tmp/qa153
          (cd /tmp/qa153 && sha256sum -c duduq-phase2-batch-qa-overlay.sha256)
          tar -xzf /tmp/qa153/duduq-phase2-batch-qa-overlay.tar.gz -C dist-pages
          gh run download 41692971490 -R "$GITHUB_REPOSITORY" -n duduq-phase2-orange-fruit-color-context-qa -D /tmp/qafruit
          (cd /tmp/qafruit && sha256sum -c overlay.sha256)
          cp /tmp/qafruit/split-report.json qa/results/split-report.json
          tar -xzf /tmp/qafruit/overlay.tar.gz -C dist-pages
          test -s dist-pages/.duduq-pages-manifest
          test -s qa/results/split-report.json
      - name: Verify final compiled 600 questions and all manifest hashes
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          import path from 'node:path';
          const root=path.resolve('dist-pages'),sha=b=>createHash('sha256').update(b).digest('hex');
          const rows=readFileSync(path.join(root,'.duduq-pages-manifest'),'utf8').trimEnd().split(/\r?\n/);
          assert(rows.length>2700);
          for(const line of rows){const k=line.lastIndexOf(' ');assert(k>0);
           const rel=line.slice(0,k),expected=line.slice(k+1),f=path.resolve(root,rel);
           assert(f.startsWith(root+path.sep));assert.equal(sha(readFileSync(f)),expected,'BAD_SOURCE_HASH:'+rel);
          }
          const reg=JSON.parse(readFileSync(path.join(root,'content/english/media/media-registry.json')));
          assert(reg.entries.some(e=>e.mediaId==='IMG-ASSETS-DUDUQ-ORANGE-FRUIT-PHASE2'));
          console.log('FINAL_COMPILED_SOURCE_VERIFIED='+rows.length);
          NODE
      - name: Check actual fruit and color media in 4 focused browser scenes
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save playwright@1.55.0 wrangler@latest
          npx playwright install --with-deps chromium
          npx wrangler pages dev dist-pages --ip 127.0.0.1 --port 4175 --compatibility-date 2026-10-30 >/tmp/orange-final-pages.log 2>&1 &
          echo $! > /tmp/orange-final-pages.pid
          for i in {1..60};do
            if curl -fsS "$BASE_URL/" >/dev/null;then break;fi
            if ! kill -0 "$(cat /tmp/orange-final-pages.pid)" 2>/dev/null;then cat /tmp/orange-final-pages.log; exit 1;fi
            sleep 2
          done
          node --check qa/verify-orange-fruit-color-browser.mjs
          node qa/verify-orange-fruit-color-browser.mjs
      - name: Package a single immutable full distribution for Cloudflare builds
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -czf qa/results/duduq-phase2-orange-fruit-color-corrected.tar.gz -C dist-pages .
          (cd qa/results && sha256sum duduq-phase2-orange-fruit-color-corrected.tar.gz > duduq-phase2-orange-fruit-color-corrected.sha256)
          cat qa/results/duduq-phase2-orange-fruit-color-corrected.sha256
      - name: Publish immutable GitHub prerelease for Cloudflare Git build
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="duduq-phase2-orange-fruit-color-corrected-20261103"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::RELEASE_TAG_ALREADY_EXISTS";exit 1
          fi
          gh release create "$TAG" \
            qa/results/duduq-phase2-orange-fruit-color-corrected.tar.gz \
            qa/results/duduq-phase2-orange-fruit-color-corrected.sha256 \
            -R "$GITHUB_REPOSITORY" --prerelease \
            --title "DUDUQ English Phase 2 — Orange color/fruit corrected QA candidate" \
            --notes "Compiled 600-question distribution; 15 food uses and 6 color uses of orange separated; unchanged answer keys; NOT production deployed. Requires Cloudflare preview verification and explicit official release."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duduq-phase2-orange-context-final-browser-and-sha
          retention-days: 90
          if-no-files-found: warn
          path: |
            qa/results/orange-release-browser.json
            qa/results/orange-release-browser/*.png
            qa/results/duduq-phase2-orange-fruit-color-corrected.sha256
