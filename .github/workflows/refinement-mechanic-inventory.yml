name: Refinement Mechanic Inventory

on:
  push:
    branches:
      - refine/next-mechanic-inventory-20260902
    paths:
      - "test/refinement/mechanic-inventory-30-modules.mjs"
      - ".github/workflows/refinement-mechanic-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium once
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mechanic-inventory-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mechanic-inventory-http.log
          exit 1
      - name: Inventory 30 real modules
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/refinement/mechanic-inventory-30-modules.mjs
