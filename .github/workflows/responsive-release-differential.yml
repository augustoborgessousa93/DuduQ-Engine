name: Responsive Release Differential QA

on:
  push:
    branches:
      - ci/responsive-release-differential-v3

permissions:
  contents: write

concurrency:
  group: duduq-responsive-release-v3
  cancel-in-progress: false

jobs:
  differential-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout CI harness and authorized payload
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout exact production source baseline
        uses: actions/checkout@v4
        with:
          ref: 617cdcd3f953c2915a116fac3dda3f6cc4df6c8f
          path: source

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover exact production bytes and verify all 2,641 manifest entries
        working-directory: harness
        env:
          DUDUQ_BASELINE_ROOT: ${{ github.workspace }}/baseline-dist
        run: node ci/responsive/download-production-baseline.mjs

      - name: Reconstruct exact candidate from baseline plus four authorized CSS files
        run: node harness/ci/responsive/prepare-release.mjs

      - name: Install deterministic Playwright Chromium
        working-directory: harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated baseline and candidate servers
        run: |
          mkdir -p ci-run
          (cd baseline-dist && DUDUQ_TEST_PORT=4175 node ../source/scripts/duduq-test-server.mjs > "$GITHUB_WORKSPACE/ci-run/baseline-http.log" 2>&1 & echo $! > ci-run/baseline.pid)
          (cd candidate-dist && DUDUQ_TEST_PORT=4176 node ../source/scripts/duduq-test-server.mjs > "$GITHUB_WORKSPACE/ci-run/candidate-http.log" 2>&1 & echo $! > ci-run/candidate.pid)
          for i in {1..60}; do
            b=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4175/__duduq/status || true)
            c=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4176/__duduq/status || true)
            [ "$b" = 200 ] && [ "$c" = 200 ] && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4175/__duduq/status)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4176/__duduq/status)" = 200
          cat ci-run/baseline-http.log ci-run/candidate-http.log

      - name: Differential QA for the 112 previously inconclusive boots
        working-directory: harness
        env:
          BASELINE_ORIGIN: http://127.0.0.1:4175
          CANDIDATE_ORIGIN: http://127.0.0.1:4176
          DIFFERENTIAL_REPORT_PATH: ${{ github.workspace }}/ci-run/differential-112-report.json
        run: node ci/responsive/differential-112.mjs

      - name: Responsive geometry matrix (90 cases) on exact candidate
        working-directory: harness
        env:
          DUDUQ_QA_ORIGIN: http://127.0.0.1:4176
          DUDUQ_EXPECTED_ROOT: ${{ github.workspace }}/candidate-dist
          DUDUQ_CANDIDATE_BUILD_HASH: a94b510cf4178a4ae84aba352d15ea9fe1a0ed66545a8071822f3ec49434b829
          DUDUQ_RESPONSIVE_OUTPUT: ${{ github.workspace }}/harness/ci-run/candidate-geometry-90.json
          DUDUQ_RESPONSIVE_EVIDENCE_DIR: ${{ github.workspace }}/harness/ci-run/screenshots/geometry-90
        run: node ci/responsive/canonical-responsive-certification.mjs

      - name: Bubble Pop responsive interaction regression on exact candidate
        working-directory: harness
        env:
          DUDUQ_QA_ORIGIN: http://127.0.0.1:4176
          DUDUQ_EXPECTED_ROOT: ${{ github.workspace }}/candidate-dist
          DUDUQ_CANDIDATE_BUILD_HASH: a94b510cf4178a4ae84aba352d15ea9fe1a0ed66545a8071822f3ec49434b829
          DUDUQ_EVIDENCE_DIR: ${{ github.workspace }}/harness/ci-run/screenshots/bubble-pop
          DUDUQ_REPORT_PATH: ${{ github.workspace }}/harness/ci-run/bubble-pop.json
        run: node ci/responsive/bubble-pop.e2e.mjs

      - name: Target Shooter responsive interaction regression on exact candidate
        working-directory: harness
        env:
          DUDUQ_QA_ORIGIN: http://127.0.0.1:4176
          DUDUQ_EXPECTED_ROOT: ${{ github.workspace }}/candidate-dist
          DUDUQ_CANDIDATE_BUILD_HASH: a94b510cf4178a4ae84aba352d15ea9fe1a0ed66545a8071822f3ec49434b829
          DUDUQ_EVIDENCE_DIR: ${{ github.workspace }}/harness/ci-run/screenshots/target-shooter
          DUDUQ_REPORT_PATH: ${{ github.workspace }}/harness/ci-run/target-shooter.json
        run: node ci/responsive/target-shooter.e2e.mjs

      - name: Grouping responsive interaction regression on exact candidate
        working-directory: harness
        env:
          DUDUQ_QA_ORIGIN: http://127.0.0.1:4176
          DUDUQ_EXPECTED_ROOT: ${{ github.workspace }}/candidate-dist
          DUDUQ_CANDIDATE_BUILD_HASH: a94b510cf4178a4ae84aba352d15ea9fe1a0ed66545a8071822f3ec49434b829
          DUDUQ_EVIDENCE_DIR: ${{ github.workspace }}/harness/ci-run/screenshots/grouping
          DUDUQ_REPORT_PATH: ${{ github.workspace }}/harness/ci-run/grouping.json
        run: node ci/responsive/grouping.e2e.mjs

      - name: Run legitimate Y1M01 Intro-to-final journey against candidate
        working-directory: harness
        env:
          DUDUQ_QA_ORIGIN: http://127.0.0.1:4176
          DUDUQ_EXPECTED_ROOT: ${{ github.workspace }}/candidate-dist
          DUDUQ_CANDIDATE_BUILD_HASH: a94b510cf4178a4ae84aba352d15ea9fe1a0ed66545a8071822f3ec49434b829
          DUDUQ_REPORT_PATH: ${{ github.workspace }}/harness/ci-run/y1m01-sequential.json
        run: node ci/responsive/y1m01-sequential.mjs

      - name: Verify all official module routes and baseline contract evidence
        working-directory: harness
        env:
          DUDUQ_CANDIDATE_ORIGIN: http://127.0.0.1:4176
        run: node ci/responsive/release-smoke.mjs

      - name: Deploy exact candidate to Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a7e5cdd5d653da1b19a547024c1a4640
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret unavailable; no deployment attempted"; exit 1; }
          npx --yes wrangler@4 pages deploy candidate-dist --project-name duduq-engine --branch responsive-release-v3 --commit-hash "$GITHUB_SHA" --commit-message "Validated responsive CSS candidate a94b510c"
          echo "DUDUQ_PREVIEW_ORIGIN=https://responsive-release-v3.duduq-engine-13a.pages.dev" >> "$GITHUB_ENV"

      - name: Verify preview assets and all official routes
        env:
          DUDUQ_REMOTE_ORIGIN: https://responsive-release-v3.duduq-engine-13a.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          const origin=process.env.DUDUQ_REMOTE_ORIGIN;
          const expected={
            '/core/duduq-live-hud.css':'a6e77a2de7b9928fe2fc5482e1e828edf6ec161773d3ad3d7e063d96c62da8ba',
            '/play/drag-drop-multimedia/drag-drop-multimedia.css':'2a5aa9665c642ff5bb621d924e054b02a187cafcdba2ff7b3d8e15b09ca78175',
            '/play/drag-drop/drag-drop.css':'4ed80343a9e24cff70b3b30b6dbe4a4833835f4beaa9c01b613c9e0a5c9a90f5',
            '/play/intro-module/intro-module.css':'512a5daa57c0ea27e59737a15fb1a6d23073dd4397c7b258caf3eb35fdddd34f'
          };
          for(const [path,want] of Object.entries(expected)){const r=await fetch(origin+path);if(!r.ok)throw Error('preview CSS HTTP '+r.status+' '+path);const got=createHash('sha256').update(Buffer.from(await r.arrayBuffer())).digest('hex');if(got!==want)throw Error('preview CSS hash mismatch '+path+' '+got);}
          let routes=0;for(let y=1;y<=5;y++)for(let m=1;m<=6;m++){const p=`/play/english/year-${y}/module-${String(m).padStart(2,'0')}/`;const r=await fetch(origin+p);if(!r.ok)throw Error('preview route '+r.status+' '+p);routes++;}
          console.log(JSON.stringify({preview:origin,css:4,routes:`${routes}/30`,status:'PASS'}));
          NODE

      - name: Preview browser E2E on Bubble Pop, Target Shooter and Grouping
        working-directory: harness
        env:
          DUDUQ_REMOTE_QA: '1'
          DUDUQ_EXPECTED_ROOT: ''
          DUDUQ_EXPECTED_CORE_CSS_SHA256: a6e77a2de7b9928fe2fc5482e1e828edf6ec161773d3ad3d7e063d96c62da8ba
          DUDUQ_CANDIDATE_BUILD_HASH: a94b510cf4178a4ae84aba352d15ea9fe1a0ed66545a8071822f3ec49434b829
          DUDUQ_QA_ORIGIN: https://responsive-release-v3.duduq-engine-13a.pages.dev
          DUDUQ_EVIDENCE_DIR: ${{ github.workspace }}/harness/ci-run/screenshots/preview-bubble-pop
          DUDUQ_REPORT_PATH: ${{ github.workspace }}/harness/ci-run/preview-bubble-pop.json
        run: |
          node ci/responsive/bubble-pop.e2e.mjs
          DUDUQ_EVIDENCE_DIR="$GITHUB_WORKSPACE/harness/ci-run/screenshots/preview-target-shooter" DUDUQ_REPORT_PATH="$GITHUB_WORKSPACE/harness/ci-run/preview-target-shooter.json" node ci/responsive/target-shooter.e2e.mjs
          DUDUQ_EVIDENCE_DIR="$GITHUB_WORKSPACE/harness/ci-run/screenshots/preview-grouping" DUDUQ_REPORT_PATH="$GITHUB_WORKSPACE/harness/ci-run/preview-grouping.json" node ci/responsive/grouping.e2e.mjs

      - name: Promote exact candidate to production and verify with rollback guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a7e5cdd5d653da1b19a547024c1a4640
          DUDUQ_PRODUCTION_ORIGIN: https://duduq-engine-13a.pages.dev
        run: |
          set -euo pipefail
          previous="$(node --input-type=module -e 'const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/duduq-engine`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});const j=await r.json();if(!r.ok||!j.success)throw Error(JSON.stringify(j.errors));console.log(j.result.canonical_deployment?.id||"")')"
          test "$previous" = "45db189f-a5a6-46af-9e89-220a44f97bf8" || { echo "Production deployment changed since verified baseline; refusing promotion."; exit 1; }
          npx --yes wrangler@4 pages deploy candidate-dist --project-name duduq-engine --branch feat/design-sync-primary-button-v1 --commit-hash "$GITHUB_SHA" --commit-message "Validated responsive CSS candidate a94b510c"
          deployment_id="$(node --input-type=module -e 'const base=`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/duduq-engine/deployments?per_page=20`;for(let n=0;n<40;n++){const r=await fetch(base,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});const j=await r.json();if(!r.ok||!j.success)throw Error(JSON.stringify(j.errors));const d=(j.result||[]).find(x=>x.environment==="production"&&x.deployment_trigger?.metadata?.commit_hash===process.env.GITHUB_SHA);if(d){console.log(d.id);process.exit(0)}await new Promise(r=>setTimeout(r,3000))}throw Error("Production deployment id not found")')"
          echo "RESPONSIVE_DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
          echo "RESPONSIVE_PREVIOUS_DEPLOYMENT_ID=$previous" >> "$GITHUB_ENV"
          set +e
          DUDUQ_REMOTE_ORIGIN="$DUDUQ_PRODUCTION_ORIGIN" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          const origin=process.env.DUDUQ_REMOTE_ORIGIN;
          const expected={
            '/core/duduq-live-hud.css':'a6e77a2de7b9928fe2fc5482e1e828edf6ec161773d3ad3d7e063d96c62da8ba',
            '/play/drag-drop-multimedia/drag-drop-multimedia.css':'2a5aa9665c642ff5bb621d924e054b02a187cafcdba2ff7b3d8e15b09ca78175',
            '/play/drag-drop/drag-drop.css':'4ed80343a9e24cff70b3b30b6dbe4a4833835f4beaa9c01b613c9e0a5c9a90f5',
            '/play/intro-module/intro-module.css':'512a5daa57c0ea27e59737a15fb1a6d23073dd4397c7b258caf3eb35fdddd34f'
          };
          for(const [p,w] of Object.entries(expected)){const r=await fetch(origin+p);if(!r.ok)throw Error('production CSS HTTP '+r.status+' '+p);const h=createHash('sha256').update(Buffer.from(await r.arrayBuffer())).digest('hex');if(h!==w)throw Error('production CSS hash mismatch '+p+' '+h);}
          let routes=0;for(let y=1;y<=5;y++)for(let m=1;m<=6;m++){const p=`/play/english/year-${y}/module-${String(m).padStart(2,'0')}/`;const r=await fetch(origin+p);if(!r.ok)throw Error('production route '+r.status+' '+p);routes++;}
          console.log(JSON.stringify({production:origin,css:4,routes:`${routes}/30`,status:'PASS'}));
          NODE
          smoke=$?
          if [ "$smoke" -eq 0 ]; then
            DUDUQ_REMOTE_QA=1 DUDUQ_EXPECTED_ROOT='' DUDUQ_EXPECTED_CORE_CSS_SHA256=a6e77a2de7b9928fe2fc5482e1e828edf6ec161773d3ad3d7e063d96c62da8ba DUDUQ_CANDIDATE_BUILD_HASH=a94b510cf4178a4ae84aba352d15ea9fe1a0ed66545a8071822f3ec49434b829 DUDUQ_QA_ORIGIN="$DUDUQ_PRODUCTION_ORIGIN" DUDUQ_EVIDENCE_DIR="$GITHUB_WORKSPACE/harness/ci-run/screenshots/production-bubble-pop" DUDUQ_REPORT_PATH="$GITHUB_WORKSPACE/harness/ci-run/production-bubble-pop.json" node harness/ci/responsive/bubble-pop.e2e.mjs || smoke=$?
          fi
          if [ "$smoke" -ne 0 ]; then
            echo "Production smoke failed; rolling back to $previous"
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/duduq-engine/deployments/$previous/rollback" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" >/dev/null || exit 90
            exit "$smoke"
          fi
          echo "Post-deploy smoke PASS; deployment $deployment_id"
          echo "### Responsive release production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: $deployment_id" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous/rollback target: $previous" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: $DUDUQ_PRODUCTION_ORIGIN" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop isolated servers
        if: always()
        run: |
          for f in ci-run/baseline.pid ci-run/candidate.pid; do
            if [ -f "$f" ]; then kill "$(cat "$f")" 2>/dev/null || true; fi
          done

      - name: Upload differential and responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duduq-responsive-differential-v3-${{ github.run_id }}
          path: |
            ci-run/
            harness/ci-run/
            harness/differential-112-report.json
            ci-output-artifact.json
            harness/baseline-recovery.json
          if-no-files-found: warn
          retention-days: 30

      - name: Release gate summary
        if: always()
        run: |
          echo 'Candidate remains isolated until the differential, responsive, route, and sequential-session gates have passed.'
          echo 'Cloudflare preview and production are promoted only after this run is fully green.'

