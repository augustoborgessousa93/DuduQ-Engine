name: Y3 R151 Production Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/y3-track-b.yml'

jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OFFICIAL_BASE: https://duduq-engine.pages.dev
      DEPLOY_BASE: https://617aa175.duduq-engine.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deployed Cloudflare aliases and 7 routes
        shell: bash
        run: |
          set -euo pipefail
          ROUTES=(
            /content/english/year-3/index.html
            /content/english/year-3/module-01/index.html
            /content/english/year-3/module-02/index.html
            /content/english/year-3/module-03/index.html
            /content/english/year-3/module-04/index.html
            /content/english/year-3/module-05/index.html
            /content/english/year-3/module-06/index.html
          )
          for base in "$DEPLOY_BASE" "$OFFICIAL_BASE"; do
            echo "Checking $base"
            for route in "${ROUTES[@]}"; do
              code="$(curl -sS -L --retry 8 --retry-delay 2 --retry-all-errors -o /dev/null -w '%{http_code}' "$base$route")"
              test "$code" = "200" || { echo "$base$route -> HTTP $code"; exit 1; }
              echo "$base$route -> HTTP 200"
            done
          done
          echo 'YEAR3_PRODUCTION_HTTP_ROUTES = 7/7 PASS'

      - name: Verify production R151 runtime channel and cache freshness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors "$OFFICIAL_BASE/engine/channels/year3-r151-v1.json" -o /tmp/year3-r151.json
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('/tmp/year3-r151.json','utf8'));
          if(m.revision!==151) throw new Error(`revision ${m.revision}`);
          if(m.core?.release!=='1.0.12') throw new Error(`core ${m.core?.release}`);
          if(m.mechanics?.['target-shooter']?.release!=='1.0.23') throw new Error(`target-shooter ${m.mechanics?.['target-shooter']?.release}`);
          if(m.policy?.year3Publication!=='GO_WITH_TEMPORARY_VISUALS') throw new Error('publication policy mismatch');
          console.log('YEAR3_PRODUCTION_RUNTIME = R151 / Core 1.0.12 / Target Shooter 1.0.23');
          NODE
          curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors "$OFFICIAL_BASE/content/english/year-3/module-01/index.html" -o /tmp/m01.html
          grep -q 'channel:"year3-r151-v1"' /tmp/m01.html
          grep -q 'foundation:"R151/Core 1.0.12"' /tmp/m01.html
          echo 'YEAR3_PRODUCTION_CACHE = FRESH'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Production HOME routes and navigation
        env:
          BASE_URL: https://duduq-engine.pages.dev
        run: node test/year3/y3-production-links.mjs

      - name: Production M01-M02 browser
        env:
          BASE_URL: https://duduq-engine.pages.dev
        run: |
          node test/year3/y3-track-b-m01-browser.mjs
          node test/year3/y3-track-b-m02-browser.mjs

      - name: Production M03-M06 browser
        env:
          BASE_URL: https://duduq-engine.pages.dev
        run: |
          for m in 3 4 5 6; do
            MODULE="$m" node test/year3/y3-track-b-module-browser.mjs
          done

      - name: Production consolidated browser gate
        env:
          BASE_URL: https://duduq-engine.pages.dev
        run: node test/year3/y3-track-b-final-browser.mjs

      - name: Upload production smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: y3-r151-production-smoke
          path: test-results/year3/
          if-no-files-found: error
