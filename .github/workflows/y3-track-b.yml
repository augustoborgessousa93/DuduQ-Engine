name: Y3 Final Validation

on:
  pull_request:
    paths:
      - 'content/english/year-3/**'
      - 'engine/channels/year3-r151-v1.json'
      - 'test/year3/**'
      - '.github/workflows/y3-track-b.yml'

jobs:
  year3-final-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard final Year 3 scope
        shell: bash
        run: |
          git fetch origin main
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          BAD="$(printf '%s\n' "$CHANGED" | grep -E '^(content/english/year-4/|content/english/year-5/|test/year4/|test/year5/|engine/releases/core/|engine/releases/mechanics/)' | grep -v '^engine/releases/mechanics/target-shooter/1.0.24/' || true)"
          if [ -n "$BAD" ]; then
            echo 'Unexpected out-of-scope finalization files:'
            echo "$BAD"
            exit 1
          fi
          echo 'YEAR4_YEAR5_CORE_UNRELATED_MECHANICS_MODIFIED = 0'
          echo 'TARGET_SHOOTER_1_0_24 = QUARANTINED / NOT AN ACTIVE GATE'

      - name: Validate frozen Year 3 runtime baseline
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const y3=JSON.parse(fs.readFileSync('engine/channels/year3-r151-v1.json','utf8'));
          if(y3.revision!==151||y3.core?.release!=='1.0.12'||y3.mechanics?.['target-shooter']?.release!=='1.0.23'||y3.mechanics?.['smart-sentence']?.release!=='4.0.20'||y3.mechanics?.['bubble-pop']?.release!=='1.0.31'||y3.mechanics?.['drag-drop']?.release!=='2.0.26'||y3.mechanics?.['word-slash']?.release!=='1.0.17'||y3.mechanics?.matching?.release!=='1.0.23') throw new Error('Year 3 frozen runtime boundary changed');
          console.log('YEAR3_RUNTIME = R151 / Core 1.0.12 / Target Shooter 1.0.23 / Smart Sentence 4.0.20');
          console.log('TARGET_SHOOTER_1_0_24 = ABORTED / NOT PROMOTED');
          NODE

      - name: Syntax gates
        run: |
          node --check content/english/year-3/y3-ux-orchestration-v1.js
          node --check content/english/year-3/year3-ux-presentation-v1.js
          node --check content/english/year-3/year3-intro-brand-v1.js
          node --check test/year3/y3-track-b-matrix.mjs
          node --check test/year3/y3-ux-correction.mjs
          node --check test/year3/y3-final-validation-browser.mjs
          node --check test/year3/y3-track-b-final-browser.mjs
          node --check test/year3/y3-production-links.mjs

      - name: Source matrix 90/90 and mechanic equivalence audit
        run: node test/year3/y3-track-b-matrix.mjs

      - name: M01-M06 contracts concise instructions and mechanic diversity
        run: node test/year3/y3-ux-correction.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start final validation server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/y3-final-http.log 2>&1 &
          echo $! > /tmp/y3-final-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/content/english/year-3/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/y3-final-http.log
          exit 1

      - name: HOME routes and navigation
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/year3/y3-production-links.mjs

      - name: M01-M06 browser Target 1.0.23 Smart Matching and intro logo
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/year3/y3-final-validation-browser.mjs

      - name: Year 3 consolidated regression
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/year3/y3-track-b-final-browser.mjs

      - name: Mark Year 3 ready for final user test
        run: |
          echo 'TARGET_SHOOTER_ACTIVE = 1.0.23'
          echo 'TARGET_SHOOTER_1_0_24 = ABORTED / NOT PROMOTED'
          echo 'NEW_TARGET_SHOOTER_RELEASE = NO'
          echo 'MECHANIC_DIVERSITY = ACCEPTED'
          echo 'CANONICAL_ASSETS = PENDING'
          echo 'TECHNICAL_BLOCKERS = 0'
          echo 'YEAR3_FINAL_VALIDATION = PASS'
          echo 'YEAR3_READY_FOR_FINAL_USER_TEST = YES'
          echo 'MERGED = NO'
          echo 'PUBLISHED = NO'

      - name: Upload Year 3 final validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: y3-final-validation-evidence
          path: test-results/year3/
          if-no-files-found: warn
