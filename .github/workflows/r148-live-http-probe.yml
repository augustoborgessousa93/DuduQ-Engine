name: R148 Live HTTP Probe

on:
  push:
    branches:
      - release/canary-r148-drag-drop-2.0.25
    paths:
      - ".github/workflows/r148-live-http-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe public manifest and consumers
        shell: bash
        run: |
          set -u
          BASE="https://duduq-engine.pages.dev"
          STAMP="$(date +%s)"
          echo "=== MANIFEST HEADERS ==="
          curl -sS -D - -o /dev/null "$BASE/engine/channels/canary-v1.json?probe=$STAMP" | tr -d '\r'
          echo "=== DD 2.0.25 HEADERS ==="
          curl -sS -D - -o /dev/null "$BASE/engine/releases/mechanics/drag-drop/2.0.25/drag-drop.js?probe=$STAMP" | tr -d '\r'

          curl -fsSL --retry 3 --retry-delay 2 "$BASE/engine/channels/canary-v1.json?probe=$STAMP" -o /tmp/canary.json
          REV="$(python3 -c 'import json;print(json.load(open("/tmp/canary.json")).get("revision"))')"
          DD="$(python3 -c 'import json;print(json.load(open("/tmp/canary.json")).get("mechanics",{}).get("drag-drop",{}).get("release"))')"
          STATUS="$(python3 -c 'import json;print(json.load(open("/tmp/canary.json")).get("status"))')"
          echo "PUBLIC REVISION=$REV DRAG_DROP=$DD STATUS=$STATUS"

          dd25="$(curl -sS -o /tmp/dd25.js -w '%{http_code}' "$BASE/engine/releases/mechanics/drag-drop/2.0.25/drag-drop.js?probe=$STAMP")"
          echo "DD 2.0.25 ADAPTER HTTP $dd25"

          bad=0
          for y in 1 3 5; do
            code="$(curl -sS -o /tmp/y${y}.html -w '%{http_code}' "$BASE/content/english/year-$y/module-01/?probe=$STAMP")"
            bytes="$(wc -c < /tmp/y${y}.html | tr -d ' ')"
            title="$(grep -io '<title>[^<]*</title>' /tmp/y${y}.html | head -1 || true)"
            echo "Y${y} HTTP $code BYTES=$bytes $title"
            if [ "$code" != "200" ]; then bad=1; fi
          done

          if [ "$REV" != "148" ] || [ "$DD" != "2.0.25" ] || [ "$dd25" != "200" ] || [ "$bad" != "0" ]; then
            echo "HTTP_DEPLOYMENT_STALE"
            exit 1
          fi
          echo "HTTP_DEPLOYMENT_PASS"
