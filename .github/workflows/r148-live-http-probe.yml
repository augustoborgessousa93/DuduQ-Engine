name: R148 Live HTTP Probe

on:
  push:
    branches:
      - release/canary-r148-drag-drop-2.0.25
    paths:
      - ".github/workflows/r148-live-http-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fingerprint public deployment
        shell: bash
        run: |
          set -euo pipefail
          REPO="augustoborgessousa93/DuduQ-Engine"
          BASE="https://duduq-engine.pages.dev"
          STAMP="$(date +%s%N)"

          curl -fsSL "$BASE/engine/channels/canary-v1.json?probe=$STAMP" -D /tmp/public.headers -o /tmp/public.json
          curl -fsSL "https://raw.githubusercontent.com/$REPO/main/engine/channels/canary-v1.json?probe=$STAMP" -o /tmp/main.json
          curl -fsSL "https://raw.githubusercontent.com/$REPO/main/engine/channels/canary-r147-rollback.json?probe=$STAMP" -o /tmp/r147.json
          curl -fsSL "https://raw.githubusercontent.com/$REPO/release/canary-r148-drag-drop-2.0.25/engine/channels/canary-v1.json?probe=$STAMP" -o /tmp/r148.json

          echo "=== MANIFEST FINGERPRINTS ==="
          sha256sum /tmp/public.json /tmp/main.json /tmp/r147.json /tmp/r148.json
          wc -c /tmp/public.json /tmp/main.json /tmp/r147.json /tmp/r148.json
          echo "PUBLIC_EQUALS_MAIN=$(cmp -s /tmp/public.json /tmp/main.json && echo yes || echo no)"
          echo "PUBLIC_EQUALS_R147=$(cmp -s /tmp/public.json /tmp/r147.json && echo yes || echo no)"
          echo "PUBLIC_EQUALS_R148=$(cmp -s /tmp/public.json /tmp/r148.json && echo yes || echo no)"
          echo "=== PUBLIC HEADERS ==="
          tr -d '\r' < /tmp/public.headers

          echo "=== DD 2.0.25 PUBLIC BODY ==="
          curl -sS "$BASE/engine/releases/mechanics/drag-drop/2.0.25/drag-drop.js?probe=$STAMP" -D /tmp/dd.headers -o /tmp/dd-public
          curl -fsSL "https://raw.githubusercontent.com/$REPO/main/engine/releases/mechanics/drag-drop/2.0.25/drag-drop.js?probe=$STAMP" -o /tmp/dd-main
          tr -d '\r' < /tmp/dd.headers
          sha256sum /tmp/dd-public /tmp/dd-main
          wc -c /tmp/dd-public /tmp/dd-main
          echo "PUBLIC_DD_EQUALS_MAIN=$(cmp -s /tmp/dd-public /tmp/dd-main && echo yes || echo no)"
          printf 'PUBLIC_DD_PREFIX='; head -c 80 /tmp/dd-public | tr '\n' ' '; echo
          printf 'MAIN_DD_PREFIX='; head -c 80 /tmp/dd-main | tr '\n' ' '; echo

          REV="$(python3 -c 'import json;print(json.load(open("/tmp/public.json")).get("revision"))')"
          DD="$(python3 -c 'import json;print(json.load(open("/tmp/public.json")).get("mechanics",{}).get("drag-drop",{}).get("release"))')"
          echo "PUBLIC_REVISION=$REV PUBLIC_DRAG_DROP=$DD"

          if [ "$REV" != "148" ] || [ "$DD" != "2.0.25" ]; then
            echo "HTTP_DEPLOYMENT_STALE"
            exit 1
          fi
          if ! cmp -s /tmp/dd-public /tmp/dd-main; then
            echo "DD_RELEASE_NOT_PUBLIC"
            exit 1
          fi
          echo "HTTP_DEPLOYMENT_PASS"
