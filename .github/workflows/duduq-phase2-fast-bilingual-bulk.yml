name: DUDUQ - Unblocked media visual review (QA only)

on:
  push:
    branches:
      - qa/duduq-phase2-unlock-visual-review-20261106
    paths:
      - .github/workflows/duduq-phase2-fast-bilingual-bulk.yml
      - qa/phase2-fast-bilingual-bulk.mjs
      - qa/phase2-fast-bilingual-aliases.mjs
      - qa/verify-fast-bilingual-browser.mjs

permissions:
  contents: read
  actions: read

concurrency:
  group: duduq-unblocked-review-single
  cancel-in-progress: true

jobs:
  bulk:
    name: Single pass, bilingual filename matching, 600 actual contracts, immutable source SHA
    runs-on: ubuntu-latest
    timeout-minutes: 52
    env:
      GH_TOKEN: ${{ github.token }}
      DUDUQ_QA_ONLY: "1"
      DUDUQ_VISUAL_REVIEW: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore immutable 03-Nov package to isolated QA root
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p qa/fast-bilingual-immutable-candidate qa/results /tmp/fast-bilingual
          curl -fLSs --retry 3 --retry-delay 2 --connect-timeout 25 --max-time 360 \
            "https://github.com/augustoborgessousa93/DuduQ-Engine/releases/download/duduq-phase2-orange-fruit-color-corrected-20261103/duduq-phase2-orange-fruit-color-corrected.tar.gz" \
            -o /tmp/fast-bilingual/current-production.tar.gz
          printf '%s  %s\n' \
            cf049f8c7a5f3d02696f7997b6dd1e31ec7b28942f6c77b96af656e72b5a1800 \
            /tmp/fast-bilingual/current-production.tar.gz | sha256sum -c
          tar -xzf /tmp/fast-bilingual/current-production.tar.gz -C qa/fast-bilingual-immutable-candidate
          echo IMMUTABLE_03NOV_QA_BASE_VERIFIED_04NOV_PARITY_UNCERTIFIED
      - name: Reconcile against exact 04-Nov deployed production (39 pins, 8 PNGs, 600 contracts)
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check qa/reconcile-duduq-live-04nov.mjs
          DUDUQ_QA_ONLY=1 node qa/reconcile-duduq-live-04nov.mjs
      - name: Index ALL original PNG filenames at immutable Assets-DuduQ HEAD (no full clone)
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSET_SHA=db68bc43eafd33e8b4a287604f6f94a1e9d7df02
          gh api "repos/augustoborgessousa93/Assets-DuduQ/git/trees/$ASSET_SHA?recursive=1" \
            > /tmp/fast-bilingual/assets-tree.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const sha='db68bc43eafd33e8b4a287604f6f94a1e9d7df02';
          const tree=JSON.parse(readFileSync('/tmp/fast-bilingual/assets-tree.json'));
          assert.equal(tree.truncated,false);
          const pngs=tree.tree.filter(x=>x.type==='blob'&&x.path.startsWith('Imagens Ilustrativa/')&&/\.png$/i.test(x.path));
          assert(pngs.length>=400&&pngs.length<550,'EXPECTED_ALL_417_SOURCE_IMAGES');
          writeFileSync('qa/results/assets-duduq-current-head-tree.json',
           JSON.stringify({sha,tree:tree.tree,truncated:tree.truncated},null,2)+'\n');
          console.log('SOURCE_PNG_ENTRIES='+pngs.length+' UNIQUE_BLOBS='+new Set(pngs.map(x=>x.sha)).size);
          NODE
      - name: Audit delta from old 417 PNGs to new 488 PNGs, by Git blob
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/augustoborgessousa93/Assets-DuduQ/git/trees/a62c07c075a4a744f81dee2eea3a6b93108f9d08?recursive=1" > /tmp/fast-bilingual/old-assets-tree.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const earlier=JSON.parse(readFileSync('/tmp/fast-bilingual/old-assets-tree.json'));
          const current=JSON.parse(readFileSync('qa/results/assets-duduq-current-head-tree.json'));
          assert.equal(earlier.truncated,false);
          assert.equal(current.sha,'db68bc43eafd33e8b4a287604f6f94a1e9d7df02');
          const isP=x=>x.type==='blob'&&x.path.startsWith('Imagens Ilustrativa/')&&/\.png$/i.test(x.path);
          const prior=new Map(earlier.tree.filter(isP).map(x=>[x.path,x.sha]));
          const now=current.tree.filter(isP);
          const added=now.filter(x=>!prior.has(x.path));
          const modified=now.filter(x=>prior.has(x.path)&&prior.get(x.path)!==x.sha);
          assert.equal(prior.size,417);
          assert.equal(now.length,488);
          assert.equal(added.length,71);
          assert.equal(modified.length,0);
          const summary={oldSourceCommit:'a62c07c075a4a744f81dee2eea3a6b93108f9d08',newSourceCommit:current.sha,oldPngs:417,
            newPngs:488,addedPngs:71,modifiedExistingPngs:0,
            additions:added.map(x=>({sourcePath:x.path,sourceGitBlob:x.sha,size:x.size})),
            qaOnly:true,pedagogicalApproval:false,productionDeployed:false};
          writeFileSync('qa/results/phase2-source-delta-20261106.json',JSON.stringify(summary,null,2)+'\n');
          console.log('NEW_IMMUTABLE_SOURCE_DELTA='+JSON.stringify({newPngs:488,added:71,modified:0}));
          NODE
      - name: ONE PASS semantic crosswalk and automatic SAFE bulk reuse in disposable QA
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check qa/phase2-fast-bilingual-aliases.mjs
          node --check qa/phase2-fast-bilingual-bulk.mjs
          node qa/phase2-fast-bilingual-bulk.mjs
          node qa/phase2-fast-bilingual-bulk.mjs --apply
      - name: Strong post-apply verification of ALL manifest entries + 600 exact original contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const h=b=>createHash('sha256').update(b).digest('hex');
          const root='qa/fast-bilingual-immutable-candidate/';
          const old=JSON.parse(readFileSync('qa/results/phase2-fast-bilingual-bulk-plan.json'));
          const now=JSON.parse(readFileSync('qa/results/phase2-fast-bilingual-bulk-applied.json'));
          assert(now.appliedMediaIds>0,'NOTHING_WAS_INTEGRATED');
          assert.equal(now.realContracts,600);
          assert.equal(now.changedQuestionJsonFiles,0);
          assert.equal(now.changedAudioFiles,0);
          assert.equal(now.changedGoldMasters,0);
          assert.equal(now.changedRuntimeFiles,0);
          assert.equal(now.productionDeployed,false);
          const man=readFileSync(root+'.duduq-pages-manifest','utf8').trimEnd().split(/\r?\n/);
          const entries=new Map();
          for(const line of man){
           const i=line.lastIndexOf(' ');assert(i>0,'BAD_MANIFEST');
           const path=line.slice(0,i),sha=line.slice(i+1);
           assert(!entries.has(path)&&!path.startsWith('/')&&!path.includes('..'));
           assert.equal(h(readFileSync(root+path)),sha,'BAD_SHA:'+path);
           entries.set(path,sha);
          }
          assert.equal(man.length,old.baseManifestFiles+now.actuallyAddedPngs);
          let questions=0;
          for(let year=1;year<=5;year++)for(let module=1;module<=6;module++){
           const p='content/english/year-'+year+'/module-'+String(module).padStart(2,'0')+'/questions.json';
           const q=JSON.parse(readFileSync(root+p));
           assert.equal(q.items.length,20);
           questions+=q.items.length;
          }
          assert.equal(questions,600);
          const reg=JSON.parse(readFileSync(root+'content/english/media/media-registry.json'));
          const byId=new Map(reg.entries.map(e=>[e.mediaId,e]));
          assert.equal(byId.size,reg.entries.length,'DUPLICATE_MEDIA');
          for(const x of now.applied){
           const e=byId.get(x.mediaId);
           assert.equal(e.provenance.sourceCommit,now.sourceCommit);
           assert.equal(e.replacementAudit.qaOnly,true);
           assert.equal(e.replacementAudit.verifiedQuestionIds.length,x.questionIds.length);
           assert.equal(e.humanResolutionStatus,'PEDAGOGICAL_QA_PENDING');
           assert.equal(e.sha256,entries.get(e.urlOrPath));
          }
          const summary={status:'FAST_BULK_ARTIFACT_INTEGRITY_PASS_VISUAL_AND_PEDAGOGICAL_QA_PENDING',
           sourcePngs:now.imagesInSource,matchedIds:now.appliedMediaIds,
           affectedQuestions:now.appliedQuestionIds.length,
           affectedModules:new Set(now.appliedQuestionIds.map(x=>x.slice(0,5))).size,
           newPngs:now.actuallyAddedPngs,
           preexistingPngs:now.reusedAlreadyPublishedPngs,
           allHashesVerified:entries.size,contracts:600,
           curriculumChanged:false,productionDeployed:false,releaseApproved:false};
          writeFileSync('qa/results/phase2-fast-bulk-verification.json',JSON.stringify(summary,null,2)+'\n');
          console.log('BULK_QA_PASS='+JSON.stringify(summary));
          NODE
      - name: Directed REAL Chromium proof of affected media in isolated local Pages (no deploy)
        shell: bash
        env:
          BASE_URL: http://127.0.0.1:4175
        run: |
          set -Eeuo pipefail
          npm install --no-save playwright@1.55.0 wrangler@latest
          npx playwright install --with-deps chromium
          npx wrangler pages dev qa/fast-bilingual-immutable-candidate --ip 127.0.0.1 --port 4175 --compatibility-date 2026-10-30 >/tmp/fast-bulk-browser-pages.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for i in {1..90}; do
            if curl -fsS "$BASE_URL/" >/dev/null; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat /tmp/fast-bulk-browser-pages.log; exit 1; fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/fast-bulk-browser-pages.log; exit 1; fi
          node --check qa/verify-fast-bilingual-browser.mjs
          node qa/verify-fast-bilingual-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duduq-unblocked-review-browser
          path: |
            qa/results/phase2-fast-bulk-browser.json
            qa/results/phase2-fast-bulk-browser/*.png
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duduq-unblocked-review-semantic
          path: |
            qa/results/phase2-reconciled-live-production-04nov.json
            qa/results/phase2-source-delta-20261106.json
            qa/results/phase2-fast-bilingual-bulk-plan.json
            qa/results/phase2-fast-bilingual-bulk-applied.json
            qa/results/phase2-fast-bulk-verification.json
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
      - name: Archive ONE revised candidate only, SHA256; no release, commit or deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -czf qa/results/duduq-fast-bilingual-qa-only.tar.gz \
            -C qa/fast-bilingual-immutable-candidate .
          (cd qa/results && sha256sum duduq-fast-bilingual-qa-only.tar.gz \
            > duduq-fast-bilingual-qa-only.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duduq-unblocked-review-qa-package
          path: |
            qa/results/phase2-reconciled-live-production-04nov.json
            qa/results/phase2-source-delta-20261106.json
            qa/results/phase2-fast-bilingual-bulk-plan.json
            qa/results/phase2-fast-bilingual-bulk-applied.json
            qa/results/phase2-fast-bulk-verification.json
            qa/results/duduq-fast-bilingual-qa-only.tar.gz
            qa/results/duduq-fast-bilingual-qa-only.sha256
          retention-days: 90
          if-no-files-found: warn
          compression-level: 0
