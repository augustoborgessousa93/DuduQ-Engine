name: DUDUQ - Reuse exact Assets-DuduQ media in isolated QA

on:
  push:
    branches:
      - integration/assets-duduq-reuse-20261031
      - integration/duduq-m1-qa-consolidated-20261031
      - qa/duduq-phase2-crosswalk-head-20261103
    paths:
      - ".github/workflows/duduq-assets-duduq-reuse-qa.yml"
      - ".github/workflows/duduq-independent-official-overlay-qa.yml"
      - "qa/audit-assets-duduq-source.mjs"
      - "qa/catalog-assets-duduq-matches.mjs"
      - "qa/phase2-y4m03-seasons-batch.mjs"
      - "qa/phase2-y4m03-seasons-browser-qa.mjs"
      - "qa/phase2-y4m03-bubble-iframe-pointer-qa.mjs"
      - "qa/phase2-consolidate-orange-source-deltas.mjs"
      - "qa/phase2-consolidated-real-browser-qa.mjs"
      - "qa/phase2-audit-next-bulk-safe-source.mjs"
      - "qa/tests/verify-assets-duduq-crosswalk.mjs"
      - "qa/tests/verify-30-route-browser-smoke.mjs"
      - "qa/prepare-assets-duduq-reuse.mjs"
      - "qa/replace-pig-from-assets-duduq.mjs"
      - "qa/replace-farm-animal-batch-from-assets-duduq.mjs"
      - "qa/verify-farm-animal-source-batch-browser.mjs"
      - "qa/replace-safe-vocabulary-from-assets-duduq.mjs"
      - "qa/verify-vocabulary-source-browser.mjs"
      - "qa/verify-pig-direct-reuse-browser.mjs"
      - "qa/verify-assets-duduq-reuse-preparation.mjs"
      - "qa/verify-assets-duduq-import.mjs"
      - "qa/assets-duduq-reuse-browser-qa.mjs"
      - "qa/assets-duduq-reuse-affected-gameplay.e2e.mjs"
      - "qa/assert-media-closure-coherence.mjs"
      - "qa/audit-non-temporary-media-browser.mjs"
      - "qa/target-shooter-mobile-containment-probe.mjs"
      - "qa/tests/verify-target-shooter-mobile-containment.mjs"
      - "qa/apply-target-shooter-mobile-containment-qa.mjs"
      - "qa/overlays/target-shooter-mobile-hitbox-reflow-v2.css"
      - "scripts/duduq-import-chatgpt-bundle.mjs"
      - "scripts/duduq-image-pipeline.mjs"
      - "docs/qa/media-audit-20261029/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: duduq-assets-duduq-reuse-${{ github.ref }}
  # Preserve the in-flight Chromium audit when new QA commits arrive.
  # GitHub may replace a pending run, but must not cancel the running evidence.
  cancel-in-progress: false

jobs:
  source-head-crosswalk:
    name: QA-only bilingual crosswalk at pinned Assets-DuduQ HEAD
    if: ${{ github.ref_name == 'qa/duduq-phase2-crosswalk-head-20261103' && github.sha == 'bf4976d9a28b6b23566a75722d1ef9af8713e2ce' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASSETS_DUDUQ_SOURCE_COMMIT: a62c07c075a4a744f81dee2eea3a6b93108f9d08
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            qa
            docs/qa/media-audit-20261029
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit the complete HEAD and all 600 historical QA question entries
        run: |
          set -Eeuo pipefail
          mkdir -p qa/results
          node --check qa/catalog-assets-duduq-matches.mjs
          node --check qa/tests/verify-assets-duduq-crosswalk.mjs
          node --check qa/build-assets-git-tree-inventory.mjs
          node qa/build-assets-git-tree-inventory.mjs --source-commit="$ASSETS_DUDUQ_SOURCE_COMMIT" --out=qa/results/assets-duduq-source-inventory.json
          node qa/catalog-assets-duduq-matches.mjs qa/results/assets-duduq-source-inventory.json --out=qa/results/assets-duduq-question-crosswalk.json
          node qa/tests/verify-assets-duduq-crosswalk.mjs qa/results/assets-duduq-question-crosswalk.json
      - name: Retain SHA-pinned inventory and suggestion graph
        uses: actions/upload-artifact@v4
        with:
          name: duduq-phase2-source-head-crosswalk-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 21
          path: |
            qa/results/assets-duduq-source-inventory.json
            qa/results/assets-duduq-question-crosswalk.json

  production-orange-gap-qa:
    name: Canonical orange production 600-contract gap audit (NO deploy)
    if: ${{ github.ref_name == 'qa/duduq-phase2-crosswalk-head-20261103' && github.sha == '1358eff07f83ccb31ce6fdfcad653f42805ca907' }}
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      GH_TOKEN: ${{ github.token }}
      DUDUQ_QA_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            qa/phase2-canonical-production-gap.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reuse completed pinned source crosswalk, do not rebuild it
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p qa/results
          gh run download 41729187694 -R "$GITHUB_REPOSITORY" --name duduq-phase2-source-head-crosswalk-41729187694 --dir qa/results
          test -s qa/results/assets-duduq-source-inventory.json
          test -s qa/results/assets-duduq-question-crosswalk.json
      - name: Download and verify EXACT latest production Orange release (NO deploy)
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG=duduq-phase2-orange-fruit-color-corrected-20261103
          ASSET=duduq-phase2-orange-fruit-color-corrected.tar.gz
          SHA=cf049f8c7a5f3d02696f7997b6dd1e31ec7b28942f6c77b96af656e72b5a1800
          FILE="$RUNNER_TEMP/orange-prod-base.tar.gz"
          curl -fLSs --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 500             "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET" -o "$FILE"
          echo "$SHA  $FILE" | sha256sum --check --status
          mkdir -p dist-pages
          tar -xzf "$FILE" -C dist-pages
          test -s dist-pages/.duduq-pages-manifest
          test -s dist-pages/content/english/media/media-registry.json
      - name: Cross-reference canonical 600 question files and all shared IDs
        run: |
          node --check qa/phase2-canonical-production-gap.mjs
          node qa/phase2-canonical-production-gap.mjs
      - name: Keep immutable QA report only
        uses: actions/upload-artifact@v4
        with:
          name: duduq-phase2-canonical-production-gap-${{ github.run_id }}
          retention-days: 21
          if-no-files-found: error
          path: qa/results/phase2-production-gap.json

  y1m06-fish-bird-candidate-qa:
    name: Native Y1M06 fish and bird original PNG overlay (NO deploy)
    if: ${{ github.ref_name == 'qa/duduq-phase2-crosswalk-head-20261103' && github.sha == '8b4cee86baeea4b33b45753ed7dc947b6f7bbaed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DUDUQ_QA_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            qa/phase2-y1m06-fish-bird-overlay.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retrieve exact original bird and fish source PNGs
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/a62c07c075a4a744f81dee2eea3a6b93108f9d08/Imagens%20Ilustrativa
          mkdir -p source-pets
          for NAME in pet-bird-passaro.png pet-fish-peixe.png; do
            curl -fLSs --retry 3 --connect-timeout 20 --max-time 80 "$SRC/$NAME" -o "source-pets/$NAME"
            test -s "source-pets/$NAME"
          done
      - name: Check original pixel dimensions, alpha and visible object with Pillow
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet pillow==11.3.0
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          items=[]
          for name in ['pet-bird-passaro.png','pet-fish-peixe.png']:
              img=Image.open(Path('source-pets')/name).convert('RGBA')
              assert img.width>=1024 and img.height>=1024
              a=img.getchannel('A')
              bbox=a.getbbox()
              assert bbox is not None
              assert a.getextrema()[0]==0 and a.getextrema()[1]>0
              assert bbox[2]-bbox[0] > 300 and bbox[3]-bbox[1]>300
              items.append((name,img))
          canvas=Image.new('RGB',(1100,600),'#eeeeee')
          draw=ImageDraw.Draw(canvas)
          for i,(name,img) in enumerate(items):
              frame=Image.new('RGBA',(480,480),'white')
              img.thumbnail((465,465))
              frame.alpha_composite(img,((480-img.width)//2,(480-img.height)//2))
              canvas.paste(frame.convert('RGB'),(i*550+35,60))
              draw.text((i*550+35,20),name,fill='black')
          Path('qa/results').mkdir(parents=True,exist_ok=True)
          canvas.save('qa/results/y1m06-fish-bird-review.png')
          print('SOURCE_PIXEL_QA_PASS_VISUAL_PEDAGOGICAL_APPROVAL_PENDING')
          PY
      - name: Retrieve and verify canonical 2891-file Orange production package (NO deploy)
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG=duduq-phase2-orange-fruit-color-corrected-20261103
          FILE="$RUNNER_TEMP/phase2-orange-prod.tar.gz"
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 480             "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/duduq-phase2-orange-fruit-color-corrected.tar.gz" -o "$FILE"
          echo "cf049f8c7a5f3d02696f7997b6dd1e31ec7b28942f6c77b96af656e72b5a1800  $FILE" | sha256sum --check --status
          mkdir -p dist-pages
          tar -xzf "$FILE" -C dist-pages
      - name: Apply only two explicitly audited temporary media IDs in isolated QA
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check qa/phase2-y1m06-fish-bird-overlay.mjs
          node qa/phase2-y1m06-fish-bird-overlay.mjs
          node qa/phase2-y1m06-fish-bird-overlay.mjs --apply
          tar -czf qa/results/y1m06-fish-bird-delta-only.tar.gz -C dist-pages             .duduq-pages-manifest content/english/media/media-registry.json             content/english/assets/images/assets-duduq/pet-bird-passaro-046b76b9215c.png             content/english/assets/images/assets-duduq/pet-fish-peixe-1fc64569b170.png
      - name: Publish QA-only delta and visual review, not a production package
        uses: actions/upload-artifact@v4
        with:
          name: duduq-phase2-y1m06-two-pets-qa-${{ github.run_id }}
          retention-days: 21
          if-no-files-found: error
          path: |
            qa/results/y1m06-fish-bird-evidence.json
            qa/results/y1m06-fish-bird-review.png
            qa/results/y1m06-fish-bird-delta-only.tar.gz

  y1m06-pets-real-browser-qa:
    name: Y1M06 Q004 local Pages desktop/mobile source PNG QA (NO deploy)
    if: ${{ github.ref_name == 'qa/duduq-phase2-crosswalk-head-20261103' && github.sha == 'b4016fb56501848edee3778f2799bf3367ffec12' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      DUDUQ_QA_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            qa/phase2-y1m06-pets-browser-qa.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reuse exact 2-image tested overlay from successful immutable QA
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p qa/results
          gh run download 41732259527 -R "$GITHUB_REPOSITORY" --name duduq-phase2-y1m06-two-pets-qa-41732259527 --dir qa/results
          test -s qa/results/y1m06-fish-bird-delta-only.tar.gz
          test -s qa/results/y1m06-fish-bird-evidence.json
      - name: Boot exact canonical Orange build and apply only verified overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          T="$RUNNER_TEMP/orange-prod.tar.gz"
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 480             "https://github.com/$GITHUB_REPOSITORY/releases/download/duduq-phase2-orange-fruit-color-corrected-20261103/duduq-phase2-orange-fruit-color-corrected.tar.gz" -o "$T"
          echo "cf049f8c7a5f3d02696f7997b6dd1e31ec7b28942f6c77b96af656e72b5a1800  $T" | sha256sum --check --status
          mkdir -p dist-pages
          tar -xzf "$T" -C dist-pages
          tar -xzf qa/results/y1m06-fish-bird-delta-only.tar.gz -C dist-pages
          echo "485998402116e4049c7884dcf6843e5a2a1674ec7c0a95402019465477b2b8d0  dist-pages/.duduq-pages-manifest" | sha256sum --check --status
      - name: Install local browser and Pages runtime, never use production deploy credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.55.0 wrangler@4
          npx playwright install --with-deps chromium
          npx wrangler pages dev dist-pages --ip 127.0.0.1 --port 4175 --compatibility-date 2026-10-30 >/tmp/duduq-pages-local.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:4175/play/target-shooter/; then exit 0; fi
            sleep 2
          done
          tail -60 /tmp/duduq-pages-local.log
          exit 1
      - name: Verify both original PNGs visibly render in real Q004 gameplay
        run: |
          node --check qa/phase2-y1m06-pets-browser-qa.mjs
          node qa/phase2-y1m06-pets-browser-qa.mjs
      - name: Archive real screenshots even if visual QA fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duduq-y1m06-fish-bird-real-browser-${{ github.run_id }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            qa/results/y1m06-pets-browser/
            /tmp/duduq-pages-local.log

  y4m03-season-safe-batch:
    name: Original seasons - 3 PNG / 8 media IDs / all 600 contracts (NO deploy)
    if: ${{ github.ref_name == 'qa/duduq-phase2-crosswalk-head-20261103' && github.sha == 'b8e5ff2f4bf1573a7b731c331779f2427b08b374' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DUDUQ_QA_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            qa/phase2-y4m03-seasons-batch.mjs
            qa/phase2-y4m03-seasons-browser-qa.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retrieve ONLY three SHA-pinned original season PNGs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p source-seasons
          SRC=https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/a62c07c075a4a744f81dee2eea3a6b93108f9d08/Imagens%20Ilustrativa
          curl -fLSs --retry 3 "$SRC/Summer%20-%20ver%C3%A3o.PNG" -o source-seasons/summer.png
          curl -fLSs --retry 3 "$SRC/Autumn%20-%20outono.PNG" -o source-seasons/autumn.png
          curl -fLSs --retry 3 "$SRC/Winter%20-%20inverno.PNG" -o source-seasons/winter.png
      - name: Check transparency, dimensions, substantial visible object, and prepare manual review
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet pillow==11.3.0
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import json
          canvas=Image.new('RGB',(1440,580),'#f2f2f2')
          facts=[]
          for i,season in enumerate(('summer','autumn','winter')):
            image=Image.open('source-seasons/'+season+'.png')
            img=image.convert('RGBA')
            alpha=img.getchannel('A'); box=alpha.getbbox()
            facts.append({'season':season,'sourceFormat':image.format,
              'width':img.width,'height':img.height,'alphaExtrema':alpha.getextrema(),
              'visibleBoundingBox':box,
              'minimum1024':img.width>=1024 and img.height>=1024})
            img.thumbnail((440,440))
            stage=Image.new('RGBA',(450,450),'white')
            stage.alpha_composite(img,((450-img.width)//2,(450-img.height)//2))
            canvas.paste(stage.convert('RGB'),(i*480+15,65))
            ImageDraw.Draw(canvas).text((i*480+15,25),season,fill='black')
          Path('qa/results').mkdir(parents=True,exist_ok=True)
          canvas.save('qa/results/y4m03-seasons-review.png')
          Path('qa/results/y4m03-season-source-dimensions.json').write_text(json.dumps(facts,indent=2))
          print('SOURCE_SEASON_FACTS='+json.dumps(facts),flush=True)
          if not all(f['width']>=512 and f['height']>=512 and
                     f['visibleBoundingBox'] and f['alphaExtrema'][0]==0 and f['alphaExtrema'][1]>0 for f in facts):
            raise SystemExit('SOURCE_UNUSABLE_EVEN_AT_DISPLAY_RESOLUTION')
          print('SOURCE_560PX_IMAGES_ACCEPTED_FOR_QA_RENDER_DENSITY_CHECK_ONLY')
          PY
      - name: Fetch EXACT latest Orange prod package, verify immutable SHA256
        shell: bash
        run: |
          set -Eeuo pipefail
          TAR="$RUNNER_TEMP/orange-current.tar.gz"
          curl -fLSs --retry 3 --max-time 480             "https://github.com/$GITHUB_REPOSITORY/releases/download/duduq-phase2-orange-fruit-color-corrected-20261103/duduq-phase2-orange-fruit-color-corrected.tar.gz" -o "$TAR"
          echo "cf049f8c7a5f3d02696f7997b6dd1e31ec7b28942f6c77b96af656e72b5a1800  $TAR" | sha256sum --check --status
          mkdir -p dist-pages && tar -xzf "$TAR" -C dist-pages
      - name: Exact 600-question preflight and candidate-only registry overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check qa/phase2-y4m03-seasons-batch.mjs
          node qa/phase2-y4m03-seasons-batch.mjs
          node qa/phase2-y4m03-seasons-batch.mjs --apply
          shopt -s nullglob
          images=(dist-pages/content/english/assets/images/assets-duduq/original-season-*.png)
          test "${#images[@]}" -eq 3
          (
            cd dist-pages
            tar -czf ../qa/results/y4m03-seasons-delta-only.tar.gz               .duduq-pages-manifest content/english/media/media-registry.json               content/english/assets/images/assets-duduq/original-season-*.png
          )
      - name: Run exact-season QA in local Pages browser at desktop and mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.55.0 wrangler@4
          npx playwright install --with-deps chromium
          npx wrangler pages dev dist-pages --ip 127.0.0.1 --port 4175 --compatibility-date 2026-10-30 >/tmp/duduq-seasons-pages.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:4175/play/target-shooter/; then break; fi
            sleep 2
          done
          node --check qa/phase2-y4m03-seasons-browser-qa.mjs
          node qa/phase2-y4m03-seasons-browser-qa.mjs
      - name: Preserve QA and source quality evidence even if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duduq-y4m03-seasons-8ids-qa-${{ github.run_id }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            qa/results/y4m03-season-source-dimensions.json
            qa/results/y4m03-seasons-evidence.json
            qa/results/y4m03-seasons-review.png
            qa/results/y4m03-seasons-delta-only.tar.gz
            qa/results/y4m03-seasons-browser/

  y4m03-season-lifecycle-browser-recheck:
    name: Seasons 8-ID browser lifecycle recheck from existing immutable QA delta (NO deploy)
    if: ${{ github.ref_name == 'qa/duduq-phase2-crosswalk-head-20261103' && github.sha == 'd3b05a40c845ab1d74143cdd0330f912d8440a5c' }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      GH_TOKEN: ${{ github.token }}
      DUDUQ_QA_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            qa/phase2-y4m03-seasons-browser-qa.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retrieve exact tested 3-PNG delta; no repeat source classification
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p qa/results
          gh run download 41736151817 -R "$GITHUB_REPOSITORY" --name duduq-y4m03-seasons-8ids-qa-41736151817 --dir qa/results
          test -s qa/results/y4m03-seasons-evidence.json
          test -s qa/results/y4m03-seasons-delta-only.tar.gz
      - name: Restore exact Orange baseline and already verified delta
        shell: bash
        run: |
          set -Eeuo pipefail
          T="$RUNNER_TEMP/orange-prod.tar.gz"
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 480             "https://github.com/$GITHUB_REPOSITORY/releases/download/duduq-phase2-orange-fruit-color-corrected-20261103/duduq-phase2-orange-fruit-color-corrected.tar.gz" -o "$T"
          echo "cf049f8c7a5f3d02696f7997b6dd1e31ec7b28942f6c77b96af656e72b5a1800  $T" | sha256sum --check --status
          mkdir -p dist-pages
          tar -xzf "$T" -C dist-pages
          tar -xzf qa/results/y4m03-seasons-delta-only.tar.gz -C dist-pages
