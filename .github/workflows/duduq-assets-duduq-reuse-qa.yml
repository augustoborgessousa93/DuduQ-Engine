name: DUDUQ - Reuse exact Assets-DuduQ media in isolated QA

on:
  push:
    branches:
      - integration/assets-duduq-reuse-20261031
      - integration/duduq-m1-qa-consolidated-20261031
      - qa/duduq-phase2-banana-preflight-20261102
      - qa/duduq-phase2-source-expansion-20261102
      - qa/duduq-phase2-structured-bilingual-20261102
    paths:
      - ".github/workflows/duduq-assets-duduq-reuse-qa.yml"
      - ".github/workflows/duduq-independent-official-overlay-qa.yml"
      - "qa/audit-assets-duduq-source.mjs"
      - "qa/catalog-assets-duduq-matches.mjs"
      - "qa/tests/verify-assets-duduq-crosswalk.mjs"
      - "qa/tests/verify-30-route-browser-smoke.mjs"
      - "qa/prepare-assets-duduq-reuse.mjs"
      - "qa/replace-pig-from-assets-duduq.mjs"
      - "qa/replace-farm-animal-batch-from-assets-duduq.mjs"
      - "qa/replace-phase2-source-reuse-from-assets-duduq.mjs"
      - "qa/duduq-phase2-banana-preflight.mjs"
      - "qa/verify-phase2-banana-browser.mjs"
      - "qa/duduq-phase2-food-qa.mjs"
      - "qa/verify-phase2-food-browser.mjs"
      - "qa/verify-phase2-directed-interactions.mjs"
      - "qa/audit-phase2-new-source-delta.mjs"
      - "qa/verify-phase2-new-source-browser.mjs"
      - "qa/apply-phase2-multilingual-assets.mjs"
      - "qa/verify-phase2-source-browser.mjs"
      - "qa/verify-farm-animal-source-batch-browser.mjs"
      - "qa/replace-safe-vocabulary-from-assets-duduq.mjs"
      - "qa/verify-vocabulary-source-browser.mjs"
      - "qa/verify-pig-direct-reuse-browser.mjs"
      - "qa/verify-assets-duduq-reuse-preparation.mjs"
      - "qa/verify-assets-duduq-import.mjs"
      - "qa/assets-duduq-reuse-browser-qa.mjs"
      - "qa/assets-duduq-reuse-affected-gameplay.e2e.mjs"
      - "qa/assert-media-closure-coherence.mjs"
      - "qa/audit-non-temporary-media-browser.mjs"
      - "qa/target-shooter-mobile-containment-probe.mjs"
      - "qa/tests/verify-target-shooter-mobile-containment.mjs"
      - "qa/apply-target-shooter-mobile-containment-qa.mjs"
      - "qa/overlays/target-shooter-mobile-hitbox-reflow-v2.css"
      - "scripts/duduq-import-chatgpt-bundle.mjs"
      - "scripts/duduq-image-pipeline.mjs"
      - "docs/qa/media-audit-20261029/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duduq-assets-duduq-reuse-${{ github.ref }}
  # Preserve the in-flight Chromium audit when new QA commits arrive.
  # GitHub may replace a pending run, but must not cancel the running evidence.
  cancel-in-progress: ${{ github.ref_name == 'qa/duduq-phase2-banana-preflight-20261102' || github.ref_name == 'qa/duduq-phase2-source-expansion-20261102' }}

jobs:
  isolated-v26-media-reuse:
    if: ${{ !startsWith(github.ref_name, 'qa/duduq-phase2-') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[phase2]')) }}
    name: Inventory, guarded import and real-browser Y1M04 verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      BASE_URL: http://127.0.0.1:4175
      ASSETS_DUDUQ_SOURCE_COMMIT: 50fb80a89a5779d73f81c96aab35f6e86193d769
      DUDUQ_MEDIA_CANDIDATE_BUNDLE: qa/media-candidates/assets-duduq-reuse-20261030
      DUDUQ_MEDIA_BROWSER_OUT: qa/results/assets-duduq-browser
      DUDUQ_AFFECTED_GAMEPLAY_OUT: qa/results/assets-duduq-browser/affected-gameplay
      DUDUQ_QA_ONLY: "1"
    steps:
      - name: Checkout isolated DUDUQ review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false

      - name: Checkout read-only Assets-DuduQ source at pinned commit
        uses: actions/checkout@v4
        with:
          repository: augustoborgessousa93/Assets-DuduQ
          ref: 50fb80a89a5779d73f81c96aab35f6e86193d769
          path: assets-source
          persist-credentials: false

      - name: Node.js 22 and real Chromium
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm install --no-save playwright@1.55.0 wrangler@latest
          npx playwright install --with-deps chromium
          npx wrangler --version

      - name: Verify the exact read-only source revision and audit all files
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C assets-source rev-parse HEAD)" = "$ASSETS_DUDUQ_SOURCE_COMMIT"
          test -z "$(git -C assets-source status --porcelain)"
          mkdir -p qa/results
          node qa/audit-assets-duduq-source.mjs assets-source --out=qa/results/assets-duduq-source-inventory.json
          node qa/catalog-assets-duduq-matches.mjs qa/results/assets-duduq-source-inventory.json --out=qa/results/assets-duduq-question-crosswalk.json
          node qa/tests/verify-assets-duduq-crosswalk.mjs qa/results/assets-duduq-question-crosswalk.json

      - name: Prepare only exact, pre-reviewed temporary bindings
        run: |
          node --check qa/prepare-assets-duduq-reuse.mjs
          node qa/prepare-assets-duduq-reuse.mjs assets-source --out=qa/media-candidates/assets-duduq-reuse-20261030
          node qa/tests/verify-assets-duduq-reuse-preparation.mjs qa/media-candidates/assets-duduq-reuse-20261030

      - name: Build official V26 QA artifact and verify all 30 modules / 600 contracts
        run: |
          bash qa/build-v26-topic-first-paint-qa.sh
          export EXPECTED_ARTIFACT_SHA256="$(sha256sum dist-pages/.duduq-pages-manifest | awk '{print toupper($1)}')"
          export EXPECTED_COMPILED_FILE_COUNT=2674
          echo "CANDIDATE_MANIFEST_SHA256=$EXPECTED_ARTIFACT_SHA256 EXPECTED_FILES=$EXPECTED_COMPILED_FILE_COUNT"
          node qa/verify-artifact.mjs

      - name: Snapshot contracts and dry-run guarded 600-question import
        run: |
          node qa/verify-assets-duduq-import.mjs snapshot qa/media-candidates/assets-duduq-reuse-20261030
          node scripts/duduq-import-chatgpt-bundle.mjs qa/media-candidates/assets-duduq-reuse-20261030

      - name: Apply candidate-only media registry overlay and verify no question changes
        run: |
          node scripts/duduq-import-chatgpt-bundle.mjs qa/media-candidates/assets-duduq-reuse-20261030 --apply
          node qa/verify-assets-duduq-import.mjs verify qa/media-candidates/assets-duduq-reuse-20261030
          node --check qa/apply-target-shooter-mobile-containment-qa.mjs
          node qa/apply-target-shooter-mobile-containment-qa.mjs --apply
          export EXPECTED_ARTIFACT_SHA256="$(sha256sum dist-pages/.duduq-pages-manifest | awk '{print toupper($1)}')"
          export EXPECTED_COMPILED_FILE_COUNT=2680
          echo "CANDIDATE_WITH_MEDIA_OVERLAY_MANIFEST_SHA256=$EXPECTED_ARTIFACT_SHA256 EXPECTED_FILES=$EXPECTED_COMPILED_FILE_COUNT"
          node qa/verify-artifact.mjs
          node qa/audit-media-completion.mjs
          node qa/check-media-module-closure.mjs --input=qa/results/media-closure-inventory.json --output=qa/results/media-module-closure.json
          node --check qa/assert-media-closure-coherence.mjs
          node qa/assert-media-closure-coherence.mjs
          node qa/media-safe-retirement.mjs --root=dist-pages --output=qa/results/assets-duduq-safe-retirement-plan.json
          node --test qa/tests/duduq-media-binding-usage-guard.test.mjs
          node --test qa/tests/duduq-media-safe-retirement.test.mjs

      - name: Run exact compiled candidate with Cloudflare Pages Functions locally
        shell: bash
        run: |
          set -Eeuo pipefail
          npx wrangler pages dev dist-pages --ip 127.0.0.1 --port 4175 --compatibility-date 2026-10-30 --log-level debug > /tmp/duduq-assets-reuse-pages.log 2>&1 &
          echo $! > /tmp/duduq-assets-reuse-pages.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then
              curl -fsS -D qa/results/assets-duduq-fit-route.headers -o /dev/null 'http://127.0.0.1:4175/play/english/year-1/module-04/?duduqModule=Y1M04&duduqItem=Y1M04-Q010&__duduq_fit=1'
              grep -Eiq '^X-DUDUQ-Fit:[[:space:]]*1' qa/results/assets-duduq-fit-route.headers
              echo QA_PAGES_RUNTIME_AND_FIT_MIDDLEWARE_READY; exit 0
            fi
            if ! kill -0 "$(cat /tmp/duduq-assets-reuse-pages.pid)" 2>/dev/null; then
              echo 'WRANGLER_EXITED_BEFORE_HTTP_READY'
              cat /tmp/duduq-assets-reuse-pages.log
              for logfile in "$HOME"/.config/.wrangler/logs/*.log; do [ -f "$logfile" ] && { echo "WRANGLER_INTERNAL_LOG=$logfile"; cat "$logfile"; }; done
              exit 1
            fi
            sleep 1
          done
          echo 'WRANGLER_HTTP_READY_TIMEOUT'
          cat /tmp/duduq-assets-reuse-pages.log
          for logfile in "$HOME"/.config/.wrangler/logs/*.log; do [ -f "$logfile" ] && { echo "WRANGLER_INTERNAL_LOG=$logfile"; cat "$logfile"; }; done
          exit 1

      # Tablet Canary validation must run against the source Canary host at
      # localhost:4173, not against the compiled V26 Pages preview at :4175.
      # See duduq-tablet-hud-candidate-qa.yml for the independent real-browser
      # CSS-only experiment and its failure evidence. Never count this V26
      # candidate workflow as systemic Core 1.0.12 certification.
      # Collect real curricular entrypoint evidence independently from the
      # /play/target-shooter/ Gold Master demonstration route. This probe can
      # fail without blessing the candidate; the gameplay gate below still
      # remains strict and prevents release.
      - name: Independent browser QA for non-temporary media still lacking approval
        run: |
          node --check qa/audit-non-temporary-media-browser.mjs
          node qa/audit-non-temporary-media-browser.mjs
          echo "Letter/scene rendering and hash PASS never implies pedagogical approval."

      - name: Probe Y1M04 real curricular entrypoint before mechanic gameplay
        continue-on-error: true
        env:
          DUDUQ_MEDIA_QA_MODULES: Y1M04
        run: |
          node --check qa/browser-media-candidate-smoke.mjs
          node qa/browser-media-candidate-smoke.mjs

      - name: Audit 30 curricular module entrypoints in Chromium across desktop tablet mobile
        continue-on-error: true
        env:
          DUDUQ_MEDIA_QA_MODULES: Y1M01,Y1M02,Y1M03,Y1M04,Y1M05,Y1M06,Y2M01,Y2M02,Y2M03,Y2M04,Y2M05,Y2M06,Y3M01,Y3M02,Y3M03,Y3M04,Y3M05,Y3M06,Y4M01,Y4M02,Y4M03,Y4M04,Y4M05,Y4M06,Y5M01,Y5M02,Y5M03,Y5M04,Y5M05,Y5M06
        run: |
          node --check qa/browser-media-candidate-smoke.mjs
          node qa/browser-media-candidate-smoke.mjs
          echo "This verifies 90 real module-entrypoint boots only; NOT 600 interactions, semantic correctness, or production approval."

      - name: Probe Target Shooter mobile visual containment in ephemeral candidate
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4175
        run: |
          node --check qa/target-shooter-mobile-containment-probe.mjs
          node qa/target-shooter-mobile-containment-probe.mjs
          echo "Browser CSS experiment only; any PASS here DOES NOT certify a release."

      - name: Enforce 90 of 90 curricular entrypoint boots as a hard gate
        if: ${{ !cancelled() }}
        run: |
          node --check qa/tests/verify-30-route-browser-smoke.mjs
          node qa/tests/verify-30-route-browser-smoke.mjs qa/results/media-browser-qa/report.json

      - name: Test all affected questions in desktop, tablet and mobile, plus real Target Shooter input
        run: |
          node --check qa/assets-duduq-reuse-browser-qa.mjs
          node qa/assets-duduq-reuse-browser-qa.mjs

      - name: Verify affected media questions with full real gameplay
        run: |
          node --check qa/assets-duduq-reuse-affected-gameplay.e2e.mjs
          node qa/assets-duduq-reuse-affected-gameplay.e2e.mjs

      - name: Enforce real mobile target visibility and pointer-readiness gate
        if: ${{ !cancelled() }}
        run: |
          node --check qa/tests/verify-target-shooter-mobile-containment.mjs
          node qa/tests/verify-target-shooter-mobile-containment.mjs qa/results/target-shooter-mobile-containment/report.json
          echo "This gate certifies only hitbox geometry and DOM pointer readiness; not curriculum/gameplay or production."

      - name: Persist full source catalog, 600-question crosswalk, build and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duduq-assets-source-reuse-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            qa/results/assets-duduq-source-inventory.json
            qa/results/assets-duduq-question-crosswalk.json
            qa/results/assets-duduq-import-verification.json
            qa/results/assets-duduq-pre-import-baseline.json
            qa/results/assets-duduq-safe-retirement-plan.json
            qa/results/assets-duduq-browser/**
            qa/results/target-shooter-mobile-containment/**
            qa/results/media-browser-qa/**
            qa/results/media-closure-inventory.json
            qa/results/media-module-closure.json
            qa/results/media-closure-consistency.json
            qa/results/non-temporary-media-review/**
            qa/results/y1m04-v26-build.json
            qa/results/asset-integrity-report.json
            qa/results/assets-duduq-fit-route.headers
            /tmp/duduq-assets-reuse-pages.log

      - name: State the publication boundary
        if: always()
        run: |
          echo "This workflow builds and serves only an ephemeral local Pages candidate; it does not authenticate, upload, deploy, merge or change production."
          echo "Imported assets remain temporary and pedagogical QA pending until owner review."
  pig-exact-source-qa:
    if: ${{ !startsWith(github.ref_name, 'qa/duduq-phase2-') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[phase2]')) }}
    name: One exact pig PNG to 3 media IDs and 7 Y2M05 questions
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "true"
      DUDUQ_QA_ONLY: "1"
      BASE_URL: http://127.0.0.1:4175
      ASSETS_DUDUQ_SOURCE_COMMIT: 50fb80a89a5779d73f81c96aab35f6e86193d769
    steps:
      - name: Checkout QA branch without write access
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned Assets-DuduQ source read-only
        uses: actions/checkout@v4
        with:
          repository: augustoborgessousa93/Assets-DuduQ
          ref: 50fb80a89a5779d73f81c96aab35f6e86193d769
          path: assets-source
          persist-credentials: false

      - name: Install Node 22, Cloudflare local runtime and Chromium
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install real-browser QA
        run: |
          npm install --no-save playwright@1.55.0 wrangler@latest
          npx playwright install --with-deps chromium

      - name: Compile pristine V26 Pages product with 600 immutable questions
        run: bash qa/build-v26-topic-first-paint-qa.sh

      - name: Verify immutable source and replace pig only in ephemeral compiled registry
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C assets-source rev-parse HEAD)" = "$ASSETS_DUDUQ_SOURCE_COMMIT"
          test -z "$(git -C assets-source status --porcelain)"
          node --check qa/replace-pig-from-assets-duduq.mjs
          node qa/replace-pig-from-assets-duduq.mjs assets-source
          node qa/replace-pig-from-assets-duduq.mjs assets-source --apply
          test -f qa/results/pig-source-direct-reuse.json
          echo "ONE_REAL_ASSETS_DUDUQ_PIG_PNG_HASH_BOUND_TO_3_IDS_7_QUESTIONS"

      - name: Boot the exact compiled candidate on local Cloudflare Pages runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npx wrangler pages dev dist-pages --ip 127.0.0.1 --port 4175 --compatibility-date 2026-10-30 > /tmp/duduq-pig-pages.log 2>&1 &
          echo $! > /tmp/duduq-pig-server.pid
          for i in {1..35}; do
            if curl -fsS http://127.0.0.1:4175/ > /dev/null; then
              echo "PIG_PAGES_COMPILED_RUNTIME_READY"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/duduq-pig-server.pid)" 2>/dev/null; then
              cat /tmp/duduq-pig-pages.log; exit 1
            fi
            sleep 1
          done
          cat /tmp/duduq-pig-pages.log
          exit 1

      - name: Validate pig asset SHA and 14 real Chromium curricular route boots
        run: |
          node --check qa/verify-pig-direct-reuse-browser.mjs
          node qa/verify-pig-direct-reuse-browser.mjs
          echo "PIG_REAL_IMAGE_AND_7_QUESTION_BOOT_PASS_CANDIDATE_ONLY"

      - name: Add four farm animals from exact source to the same Y2M05 QA product
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check qa/replace-farm-animal-batch-from-assets-duduq.mjs
          node qa/replace-farm-animal-batch-from-assets-duduq.mjs assets-source
          node qa/replace-farm-animal-batch-from-assets-duduq.mjs assets-source --apply
          node --check qa/verify-farm-animal-source-batch-browser.mjs
          node qa/verify-farm-animal-source-batch-browser.mjs
          echo "FOUR_MORE_PNGS_REUSED_FOR_13_ADDITIONAL_PROVISIONAL_IDS"

      - name: Independently validate exact bilingual vocabulary reuse on the SAME compiled source QA product
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check qa/replace-safe-vocabulary-from-assets-duduq.mjs
          node qa/replace-safe-vocabulary-from-assets-duduq.mjs assets-source
          node qa/replace-safe-vocabulary-from-assets-duduq.mjs assets-source --apply
          node --check qa/verify-vocabulary-source-browser.mjs
          node qa/verify-vocabulary-source-browser.mjs
          node -e 'const r=require("./qa/results/vocabulary-source-batch.json"); const b=require("./qa/results/vocabulary-source-browser.json"); if(r.changedMediaIds!==157||r.usedUniquePngs!==16||r.affectedQuestions!==60||b.changedMediaIds!==157||b.images!==16||b.browserRoutes!==46||r.releaseApproved!==false||r.humanPedagogicalApproval!==false)process.exit(1); console.log("INDEPENDENT_VOCAB_QA_PASS_NOT_RELEASE_APPROVED")'

      - name: Preserve actual compiled pig-containing distribution for review
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -czf "$RUNNER_TEMP/duduq-pig-direct-v26-qa.tar.gz" -C dist-pages .
          sha256sum "$RUNNER_TEMP/duduq-pig-direct-v26-qa.tar.gz" > qa/results/pig-distribution-tar.sha256
          test -s "$RUNNER_TEMP/duduq-pig-direct-v26-qa.tar.gz"
          echo "COMPILED_CANDIDATE_RETAINED_NOT_DEPLOYED"

      - name: Upload source-verifiable evidence and compiled QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duduq-direct-pig-source-candidate-${{ github.run_id }}
          retention-days: 60
          if-no-files-found: warn
          compression-level: 0
          path: |
            qa/results/pig-source-direct-reuse.json
            qa/results/pig-source-direct-browser.json
            qa/results/farm-animal-source-batch.json
            qa/results/farm-animal-batch-browser.json
            qa/results/vocabulary-source-batch.json
            qa/results/vocabulary-source-browser.json
            qa/results/pig-distribution-tar.sha256
            ${{ runner.temp }}/duduq-pig-direct-v26-qa.tar.gz
            /tmp/duduq-pig-pages.log

      - name: Explicit no-production boundary
        if: always()
        run: |
          echo "Only disposable compiled QA output changed. Source questions and answer keys unchanged."
          echo "The pig candidate remains PEDAGOGICAL_QA_PENDING, without merge or production deploy."

  phase2-v28-source-reuse:
    if: ${{ github.event_name == 'push' && !startsWith(github.ref_name, 'qa/duduq-phase2-') && contains(github.event.head_commit.message, '[phase2]') && !contains(github.event.head_commit.message, '[banana-preflight]') }}
    name: Phase 2 - exact source reuse on immutable V28 hotfix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      DUDUQ_QA_ONLY: "1"
      BASE_URL: http://127.0.0.1:4175
      SOURCE_COMMIT: 50fb80a89a5779d73f81c96aab35f6e86193d769
      BASELINE_TAG: duduq-v28-y1m02-seven-numeral-leaf-hotfix-20261101
      BASELINE_SHA256: 2f7c72381dbab18eeb3f2c6a9771e636cbacc46aa04232a762f13ca5730c2f0e
      PHASE2_TAG: duduq-phase2-safe-contrast-qa-20261102
    steps:
      - name: Checkout review code and pinned original image repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: augustoborgessousa93/Assets-DuduQ
          ref: 50fb80a89a5779d73f81c96aab35f6e86193d769
          path: assets-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recover exactly the deployed and approved V28 hotfix build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C assets-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C assets-source status --porcelain)"
          mkdir -p "$RUNNER_TEMP/phase2-original" dist-pages
          gh release download "$BASELINE_TAG" -R "$GITHUB_REPOSITORY" --pattern duduq-v28-y1m02-seven-leaf-hotfix.tar.gz --dir "$RUNNER_TEMP/phase2-original"
          echo "$BASELINE_SHA256  $RUNNER_TEMP/phase2-original/duduq-v28-y1m02-seven-leaf-hotfix.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/phase2-original/duduq-v28-y1m02-seven-leaf-hotfix.tar.gz" -C dist-pages
          test -s dist-pages/.duduq-pages-manifest
      - name: Preflight and apply only safe, exact, previously provisional bindings
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check qa/replace-phase2-source-reuse-from-assets-duduq.mjs
          node qa/replace-phase2-source-reuse-from-assets-duduq.mjs assets-source
          node qa/replace-phase2-source-reuse-from-assets-duduq.mjs assets-source --apply
      - name: Verify every manifest hash and all 600 unchanged curricular contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          const root=path.resolve('dist-pages');
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const lines=readFileSync(root+'/.duduq-pages-manifest','utf8').trimEnd().split(/\r?\n/);
          assert(lines.length>=2709,'MANIFEST_INCOMPLETE');
          const names=new Set();
          for(const line of lines){
            const pos=line.lastIndexOf(' '),rel=line.slice(0,pos),expected=line.slice(pos+1);
            assert(pos>0&&/^[a-f0-9]{64}$/.test(expected)&&!names.has(rel),'BAD_MANIFEST_ENTRY');
            names.add(rel);
            const full=path.resolve(root,rel);assert(full.startsWith(root+path.sep),'UNSAFE_MANIFEST_PATH');
            assert.equal(sha(readFileSync(full)),expected,'BAD_FILE_SHA:'+rel);
          }
          let n=0;
          for(let y=1;y<=5;y++)for(let m=1;m<=6;m++){
            const mm=String(m).padStart(2,'0'),rel='content/english/year-'+y+'/module-'+mm+'/questions.json';
            const q=JSON.parse(readFileSync(root+'/'+rel));
            assert.equal(q.moduleId,'Y'+y+'M'+mm);assert.equal(q.items?.length,20);
            n+=20;
          }
          assert.equal(n,600);
          const r=JSON.parse(readFileSync('qa/results/phase2-source-reuse-batch.json'));
          assert(r.changedMediaIds>0&&r.changedMediaIds<=38,'NO_VERIFIED_PHASE2_CHANGES');
          assert(r.images.length>0&&r.images.length<=5,'BAD_PHASE2_IMAGE_COUNT');
          assert.equal(r.questionsChanged,0);assert.equal(r.answerKeysChanged,0);
          assert.equal(r.releaseApproved,false);assert.equal(r.productionDeployed,false);
          console.log(JSON.stringify({status:'PASS_PHASE2_ALL_HASHES_AND_600_CONTRACTS',entries:lines.length,mediaIds:r.changedMediaIds,images:r.images.length,questions:600,skipped:r.skipped.length}));
          NODE
      - name: Install real Chromium and boot the exact compiled candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4175 --bind 127.0.0.1 --directory dist-pages > /tmp/duduq-phase2-pages.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duduq-phase2-pages.log
          exit 1
      - name: Verify original PNG bytes and real mobile/tablet question rendering
        run: |
          node --check qa/verify-phase2-source-browser.mjs
          node qa/verify-phase2-source-browser.mjs
      - name: Publish ONE immutable QA package only after all gates pass
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$PHASE2_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::PHASE2_TAG_ALREADY_EXISTS"; exit 1
          fi
          tar -czf "$RUNNER_TEMP/duduq-phase2-safe-contrast-qa.tar.gz" -C dist-pages .
          (cd "$RUNNER_TEMP" && sha256sum duduq-phase2-safe-contrast-qa.tar.gz > duduq-phase2-safe-contrast-qa.sha256)
          gh release create "$PHASE2_TAG" "$RUNNER_TEMP/duduq-phase2-safe-contrast-qa.tar.gz" "$RUNNER_TEMP/duduq-phase2-safe-contrast-qa.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "DUDUQ Phase 2 - contrast-safe source QA candidate" --notes "Contrast-safe source-image replacements on V28 hotfix baseline, 600 immutable questions and real-browser QA. White deliberately deferred after screenshot review. QA-only package; not production." --prerelease
          echo "ONE_NEW_PHASE2_QA_PACKAGE_CREATED_NO_PRODUCTION_DEPLOY"
      - name: Retain Phase 2 audit and real-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duduq-phase2-exact-source-evidence-${{ github.run_id }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            qa/results/phase2-source-reuse-batch.json
            qa/results/phase2-source-browser.json
            /tmp/duduq-phase2-pages.log

