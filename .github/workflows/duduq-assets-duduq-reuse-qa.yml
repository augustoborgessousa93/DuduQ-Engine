name: DUDUQ - Reuse exact Assets-DuduQ media in isolated QA

on:
  push:
    branches:
      - integration/assets-duduq-reuse-20261031
    paths:
      - ".github/workflows/duduq-assets-duduq-reuse-qa.yml"
      - "qa/audit-assets-duduq-source.mjs"
      - "qa/catalog-assets-duduq-matches.mjs"
      - "qa/tests/verify-assets-duduq-crosswalk.mjs"
      - "qa/tests/verify-30-route-browser-smoke.mjs"
      - "qa/prepare-assets-duduq-reuse.mjs"
      - "qa/verify-assets-duduq-reuse-preparation.mjs"
      - "qa/verify-assets-duduq-import.mjs"
      - "qa/assets-duduq-reuse-browser-qa.mjs"
      - "qa/assert-media-closure-coherence.mjs"
      - "qa/audit-non-temporary-media-browser.mjs"
      - "qa/target-shooter-mobile-containment-probe.mjs"
      - "scripts/duduq-import-chatgpt-bundle.mjs"
      - "scripts/duduq-image-pipeline.mjs"
      - "docs/qa/media-audit-20261029/**"
  pull_request:
    branches:
      - automation/duduq-media-source-only-fix-20261029
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/duduq-assets-duduq-reuse-qa.yml"
      - "qa/audit-assets-duduq-source.mjs"
      - "qa/catalog-assets-duduq-matches.mjs"
      - "qa/tests/verify-assets-duduq-crosswalk.mjs"
      - "qa/tests/verify-30-route-browser-smoke.mjs"
      - "qa/prepare-assets-duduq-reuse.mjs"
      - "qa/verify-assets-duduq-reuse-preparation.mjs"
      - "qa/verify-assets-duduq-import.mjs"
      - "qa/assets-duduq-reuse-browser-qa.mjs"
      - "qa/assert-media-closure-coherence.mjs"
      - "qa/audit-non-temporary-media-browser.mjs"
      - "qa/target-shooter-mobile-containment-probe.mjs"
      - "scripts/duduq-import-chatgpt-bundle.mjs"
      - "scripts/duduq-image-pipeline.mjs"
      - "docs/qa/media-audit-20261029/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duduq-assets-duduq-reuse-${{ github.ref }}
  # Preserve the in-flight Chromium audit when new QA commits arrive.
  # GitHub may replace a pending run, but must not cancel the running evidence.
  cancel-in-progress: false

jobs:
  isolated-v26-media-reuse:
    name: Inventory, guarded import and real-browser Y1M04 verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      BASE_URL: http://127.0.0.1:4175
      ASSETS_DUDUQ_SOURCE_COMMIT: 50fb80a89a5779d73f81c96aab35f6e86193d769
      DUDUQ_MEDIA_CANDIDATE_BUNDLE: qa/media-candidates/assets-duduq-reuse-20261030
      DUDUQ_MEDIA_BROWSER_OUT: qa/results/assets-duduq-browser
    steps:
      - name: Checkout isolated DUDUQ review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false

      - name: Checkout read-only Assets-DuduQ source at pinned commit
        uses: actions/checkout@v4
        with:
          repository: augustoborgessousa93/Assets-DuduQ
          ref: 50fb80a89a5779d73f81c96aab35f6e86193d769
          path: assets-source
          persist-credentials: false

      - name: Node.js 22 and real Chromium
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm install --no-save playwright@1.55.0 wrangler@latest
          npx playwright install --with-deps chromium
          npx wrangler --version

      - name: Verify the exact read-only source revision and audit all files
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C assets-source rev-parse HEAD)" = "$ASSETS_DUDUQ_SOURCE_COMMIT"
          test -z "$(git -C assets-source status --porcelain)"
          mkdir -p qa/results
          node qa/audit-assets-duduq-source.mjs assets-source --out=qa/results/assets-duduq-source-inventory.json
          node qa/catalog-assets-duduq-matches.mjs qa/results/assets-duduq-source-inventory.json --out=qa/results/assets-duduq-question-crosswalk.json
          node qa/tests/verify-assets-duduq-crosswalk.mjs qa/results/assets-duduq-question-crosswalk.json

      - name: Prepare only exact, pre-reviewed temporary bindings
        run: |
          node --check qa/prepare-assets-duduq-reuse.mjs
          node qa/prepare-assets-duduq-reuse.mjs assets-source --out=qa/media-candidates/assets-duduq-reuse-20261030
          node qa/tests/verify-assets-duduq-reuse-preparation.mjs qa/media-candidates/assets-duduq-reuse-20261030

      - name: Build official V26 QA artifact and verify all 30 modules / 600 contracts
        run: |
          bash qa/build-v26-topic-first-paint-qa.sh
          export EXPECTED_ARTIFACT_SHA256="$(sha256sum dist-pages/.duduq-pages-manifest | awk '{print toupper($1)}')"
          export EXPECTED_COMPILED_FILE_COUNT=2674
          echo "CANDIDATE_MANIFEST_SHA256=$EXPECTED_ARTIFACT_SHA256 EXPECTED_FILES=$EXPECTED_COMPILED_FILE_COUNT"
          node qa/verify-artifact.mjs

      - name: Snapshot contracts and dry-run guarded 600-question import
        run: |
          node qa/verify-assets-duduq-import.mjs snapshot qa/media-candidates/assets-duduq-reuse-20261030
          node scripts/duduq-import-chatgpt-bundle.mjs qa/media-candidates/assets-duduq-reuse-20261030

      - name: Apply candidate-only media registry overlay and verify no question changes
        run: |
          node scripts/duduq-import-chatgpt-bundle.mjs qa/media-candidates/assets-duduq-reuse-20261030 --apply
          node qa/verify-assets-duduq-import.mjs verify qa/media-candidates/assets-duduq-reuse-20261030
          export EXPECTED_ARTIFACT_SHA256="$(sha256sum dist-pages/.duduq-pages-manifest | awk '{print toupper($1)}')"
          export EXPECTED_COMPILED_FILE_COUNT=2680
          echo "CANDIDATE_WITH_MEDIA_OVERLAY_MANIFEST_SHA256=$EXPECTED_ARTIFACT_SHA256 EXPECTED_FILES=$EXPECTED_COMPILED_FILE_COUNT"
          node qa/verify-artifact.mjs
          node qa/audit-media-completion.mjs
          node qa/check-media-module-closure.mjs --input=qa/results/media-closure-inventory.json --output=qa/results/media-module-closure.json
          node --check qa/assert-media-closure-coherence.mjs
          node qa/assert-media-closure-coherence.mjs
          node qa/media-safe-retirement.mjs --root=dist-pages --output=qa/results/assets-duduq-safe-retirement-plan.json
          node --test qa/tests/duduq-media-binding-usage-guard.test.mjs
          node --test qa/tests/duduq-media-safe-retirement.test.mjs

      - name: Run exact compiled candidate with Cloudflare Pages Functions locally
        shell: bash
        run: |
          set -Eeuo pipefail
          npx wrangler pages dev dist-pages --ip 127.0.0.1 --port 4175 --compatibility-date 2026-10-30 --log-level debug > /tmp/duduq-assets-reuse-pages.log 2>&1 &
          echo $! > /tmp/duduq-assets-reuse-pages.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then
              curl -fsS -D qa/results/assets-duduq-fit-route.headers -o /dev/null 'http://127.0.0.1:4175/play/english/year-1/module-04/?duduqModule=Y1M04&duduqItem=Y1M04-Q010&__duduq_fit=1'
              grep -Eiq '^X-DUDUQ-Fit:[[:space:]]*1' qa/results/assets-duduq-fit-route.headers
              echo QA_PAGES_RUNTIME_AND_FIT_MIDDLEWARE_READY; exit 0
            fi
            if ! kill -0 "$(cat /tmp/duduq-assets-reuse-pages.pid)" 2>/dev/null; then
              echo 'WRANGLER_EXITED_BEFORE_HTTP_READY'
              cat /tmp/duduq-assets-reuse-pages.log
              for logfile in "$HOME"/.config/.wrangler/logs/*.log; do [ -f "$logfile" ] && { echo "WRANGLER_INTERNAL_LOG=$logfile"; cat "$logfile"; }; done
              exit 1
            fi
            sleep 1
          done
          echo 'WRANGLER_HTTP_READY_TIMEOUT'
          cat /tmp/duduq-assets-reuse-pages.log
          for logfile in "$HOME"/.config/.wrangler/logs/*.log; do [ -f "$logfile" ] && { echo "WRANGLER_INTERNAL_LOG=$logfile"; cat "$logfile"; }; done
          exit 1

      # Tablet Canary validation must run against the source Canary host at
      # localhost:4173, not against the compiled V26 Pages preview at :4175.
      # See duduq-tablet-hud-candidate-qa.yml for the independent real-browser
      # CSS-only experiment and its failure evidence. Never count this V26
      # candidate workflow as systemic Core 1.0.12 certification.
      # Collect real curricular entrypoint evidence independently from the
      # /play/target-shooter/ Gold Master demonstration route. This probe can
      # fail without blessing the candidate; the gameplay gate below still
      # remains strict and prevents release.
      - name: Independent browser QA for non-temporary media still lacking approval
        run: |
          node --check qa/audit-non-temporary-media-browser.mjs
          node qa/audit-non-temporary-media-browser.mjs
          echo "Letter/scene rendering and hash PASS never implies pedagogical approval."

      - name: Probe Y1M04 real curricular entrypoint before mechanic gameplay
        continue-on-error: true
        env:
          DUDUQ_MEDIA_QA_MODULES: Y1M04
        run: |
          node --check qa/browser-media-candidate-smoke.mjs
          node qa/browser-media-candidate-smoke.mjs

      - name: Audit 30 curricular module entrypoints in Chromium across desktop tablet mobile
        continue-on-error: true
        env:
          DUDUQ_MEDIA_QA_MODULES: Y1M01,Y1M02,Y1M03,Y1M04,Y1M05,Y1M06,Y2M01,Y2M02,Y2M03,Y2M04,Y2M05,Y2M06,Y3M01,Y3M02,Y3M03,Y3M04,Y3M05,Y3M06,Y4M01,Y4M02,Y4M03,Y4M04,Y4M05,Y4M06,Y5M01,Y5M02,Y5M03,Y5M04,Y5M05,Y5M06
        run: |
          node --check qa/browser-media-candidate-smoke.mjs
          node qa/browser-media-candidate-smoke.mjs
          echo "This verifies 90 real module-entrypoint boots only; NOT 600 interactions, semantic correctness, or production approval."

      - name: Probe Target Shooter mobile visual containment in ephemeral candidate
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4175
        run: |
          node --check qa/target-shooter-mobile-containment-probe.mjs
          node qa/target-shooter-mobile-containment-probe.mjs
          echo "Browser CSS experiment only; any PASS here DOES NOT certify a release."

      - name: Enforce 90 of 90 curricular entrypoint boots as a hard gate
        if: ${{ !cancelled() }}
        run: |
          node --check qa/tests/verify-30-route-browser-smoke.mjs
          node qa/tests/verify-30-route-browser-smoke.mjs qa/results/media-browser-qa/report.json

      - name: Test all affected questions in desktop, tablet and mobile, plus real Target Shooter input
        run: |
          node --check qa/assets-duduq-reuse-browser-qa.mjs
          node qa/assets-duduq-reuse-browser-qa.mjs

      - name: Persist full source catalog, 600-question crosswalk, build and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duduq-assets-source-reuse-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            qa/results/assets-duduq-source-inventory.json
            qa/results/assets-duduq-question-crosswalk.json
            qa/results/assets-duduq-import-verification.json
            qa/results/assets-duduq-pre-import-baseline.json
            qa/results/assets-duduq-safe-retirement-plan.json
            qa/results/assets-duduq-browser/**
            qa/results/target-shooter-mobile-containment/**
            qa/results/media-browser-qa/**
            qa/results/media-closure-inventory.json
            qa/results/media-module-closure.json
            qa/results/media-closure-consistency.json
            qa/results/non-temporary-media-review/**
            qa/results/y1m04-v26-build.json
            qa/results/asset-integrity-report.json
            qa/results/assets-duduq-fit-route.headers
            /tmp/duduq-assets-reuse-pages.log

      - name: State the publication boundary
        if: always()
        run: |
          echo "This workflow builds and serves only an ephemeral local Pages candidate; it does not authenticate, upload, deploy, merge or change production."
          echo "Imported assets remain temporary and pedagogical QA pending until owner review."