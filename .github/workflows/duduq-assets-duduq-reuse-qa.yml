      DUDUQ_QA_ONLY: "1"
    steps:
      - name: Checkout isolated DUDUQ review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false

      - name: Checkout read-only Assets-DuduQ source at pinned commit
        uses: actions/checkout@v4
        with:
          repository: augustoborgessousa93/Assets-DuduQ
          ref: 50fb80a89a5779d73f81c96aab35f6e86193d769
          path: assets-source
          persist-credentials: false

      - name: Node.js 22 and real Chromium
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm install --no-save playwright@1.55.0 wrangler@latest
          npx playwright install --with-deps chromium
          npx wrangler --version

      - name: Verify the exact read-only source revision and audit all files
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C assets-source rev-parse HEAD)" = "$ASSETS_DUDUQ_SOURCE_COMMIT"
          test -z "$(git -C assets-source status --porcelain)"
          mkdir -p qa/results
          node qa/audit-assets-duduq-source.mjs assets-source --out=qa/results/assets-duduq-source-inventory.json
          node qa/catalog-assets-duduq-matches.mjs qa/results/assets-duduq-source-inventory.json --out=qa/results/assets-duduq-question-crosswalk.json
          node qa/tests/verify-assets-duduq-crosswalk.mjs qa/results/assets-duduq-question-crosswalk.json

      - name: Prepare only exact, pre-reviewed temporary bindings
        run: |
          node --check qa/prepare-assets-duduq-reuse.mjs
          node qa/prepare-assets-duduq-reuse.mjs assets-source --out=qa/media-candidates/assets-duduq-reuse-20261030
          node qa/tests/verify-assets-duduq-reuse-preparation.mjs qa/media-candidates/assets-duduq-reuse-20261030

      - name: Build official V26 QA artifact and verify all 30 modules / 600 contracts
        run: |
          bash qa/build-v26-topic-first-paint-qa.sh
          export EXPECTED_ARTIFACT_SHA256="$(sha256sum dist-pages/.duduq-pages-manifest | awk '{print toupper($1)}')"
          export EXPECTED_COMPILED_FILE_COUNT=2674
          echo "CANDIDATE_MANIFEST_SHA256=$EXPECTED_ARTIFACT_SHA256 EXPECTED_FILES=$EXPECTED_COMPILED_FILE_COUNT"
          node qa/verify-artifact.mjs

      - name: Snapshot contracts and dry-run guarded 600-question import
        run: |
          node qa/verify-assets-duduq-import.mjs snapshot qa/media-candidates/assets-duduq-reuse-20261030
          node scripts/duduq-import-chatgpt-bundle.mjs qa/media-candidates/assets-duduq-reuse-20261030

      - name: Apply candidate-only media registry overlay and verify no question changes
        run: |
          node scripts/duduq-import-chatgpt-bundle.mjs qa/media-candidates/assets-duduq-reuse-20261030 --apply
          node qa/verify-assets-duduq-import.mjs verify qa/media-candidates/assets-duduq-reuse-20261030
          node --check qa/apply-target-shooter-mobile-containment-qa.mjs
          node qa/apply-target-shooter-mobile-containment-qa.mjs --apply
          export EXPECTED_ARTIFACT_SHA256="$(sha256sum dist-pages/.duduq-pages-manifest | awk '{print toupper($1)}')"
          export EXPECTED_COMPILED_FILE_COUNT=2680
          echo "CANDIDATE_WITH_MEDIA_OVERLAY_MANIFEST_SHA256=$EXPECTED_ARTIFACT_SHA256 EXPECTED_FILES=$EXPECTED_COMPILED_FILE_COUNT"
          node qa/verify-artifact.mjs
          node qa/audit-media-completion.mjs
          node qa/check-media-module-closure.mjs --input=qa/results/media-closure-inventory.json --output=qa/results/media-module-closure.json
          node --check qa/assert-media-closure-coherence.mjs
          node qa/assert-media-closure-coherence.mjs
          node qa/media-safe-retirement.mjs --root=dist-pages --output=qa/results/assets-duduq-safe-retirement-plan.json
          node --test qa/tests/duduq-media-binding-usage-guard.test.mjs
          node --test qa/tests/duduq-media-safe-retirement.test.mjs

      - name: Run exact compiled candidate with Cloudflare Pages Functions locally
        shell: bash
        run: |
          set -Eeuo pipefail
          npx wrangler pages dev dist-pages --ip 127.0.0.1 --port 4175 --compatibility-date 2026-10-30 --log-level debug > /tmp/duduq-assets-reuse-pages.log 2>&1 &
          echo $! > /tmp/duduq-assets-reuse-pages.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then
              curl -fsS -D qa/results/assets-duduq-fit-route.headers -o /dev/null 'http://127.0.0.1:4175/play/english/year-1/module-04/?duduqModule=Y1M04&duduqItem=Y1M04-Q010&__duduq_fit=1'
              grep -Eiq '^X-DUDUQ-Fit:[[:space:]]*1' qa/results/assets-duduq-fit-route.headers
              echo QA_PAGES_RUNTIME_AND_FIT_MIDDLEWARE_READY; exit 0
            fi
            if ! kill -0 "$(cat /tmp/duduq-assets-reuse-pages.pid)" 2>/dev/null; then
              echo 'WRANGLER_EXITED_BEFORE_HTTP_READY'
              cat /tmp/duduq-assets-reuse-pages.log
              for logfile in "$HOME"/.config/.wrangler/logs/*.log; do [ -f "$logfile" ] && { echo "WRANGLER_INTERNAL_LOG=$logfile"; cat "$logfile"; }; done
              exit 1
            fi
            sleep 1
          done
          echo 'WRANGLER_HTTP_READY_TIMEOUT'
          cat /tmp/duduq-assets-reuse-pages.log
          for logfile in "$HOME"/.config/.wrangler/logs/*.log; do [ -f "$logfile" ] && { echo "WRANGLER_INTERNAL_LOG=$logfile"; cat "$logfile"; }; done
          exit 1

