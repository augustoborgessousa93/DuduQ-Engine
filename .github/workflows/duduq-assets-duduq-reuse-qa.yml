    name: Inventory, guarded import and real-browser Y1M04 verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      BASE_URL: http://127.0.0.1:4175
      ASSETS_DUDUQ_SOURCE_COMMIT: 50fb80a89a5779d73f81c96aab35f6e86193d769
      DUDUQ_MEDIA_CANDIDATE_BUNDLE: qa/media-candidates/assets-duduq-reuse-20261030
