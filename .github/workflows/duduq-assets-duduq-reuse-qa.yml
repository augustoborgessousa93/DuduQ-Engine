          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const before='dist-pages',after='qa/dist-pages-banana-candidate';
          const p=JSON.parse(readFileSync('qa/results/phase2-banana-qa-patch.json','utf8'));
          assert(p.changedMediaIds>0&&p.changedMediaIds<=4);
          assert.equal(p.productionDeployed,false);
          const oldManifest=readFileSync(path.join(before,'.duduq-pages-manifest'),'utf8');
          const newManifest=readFileSync(path.join(after,'.duduq-pages-manifest'),'utf8');
          const parse=s=>new Map(s.trimEnd().split(/\r?\n/).map(line=>{const i=line.lastIndexOf(' ');return [line.slice(0,i),line.slice(i+1)]}));
          const a=parse(oldManifest),b=parse(newManifest);
          const registry='content/english/media/media-registry.json';
          assert.equal(b.size,a.size+1);
          for(const [rel,digest] of a){
            if(rel!==registry)assert.equal(b.get(rel),digest,'UNEXPECTED_MODIFIED_ASSET:'+rel);
            assert.equal(sha(readFileSync(path.join(after,rel))),b.get(rel),'MANIFEST_HASH_MISMATCH:'+rel);
          }
          assert.equal(sha(readFileSync(path.join(after,p.assetPath))),b.get(p.assetPath));
          assert.equal(sha(readFileSync(path.join(after,registry))),b.get(registry));
          console.log(JSON.stringify({isolatedQAOnly:true,changedMediaIds:p.changedMediaIds,questionsUnchanged:600}));
          NODE
      - name: Real Chromium checks for every changed banana question on mobile and desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          ELIGIBLE="$(node -p "require('./qa/results/phase2-banana-preflight.json').eligibleIds")"
