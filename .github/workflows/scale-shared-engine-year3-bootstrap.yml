name: Scale Shared Engine + Year 3 Bootstrap

on:
  pull_request:
    branches:
      - hotfix/year2-multimodal-dd-matching-diversity
      - main
  workflow_dispatch:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax shared layers and Year 3 bootstrap
        run: |
          node --check engine/duduq-loader-v1.js
          node --check engine/shared/bubble-pop-runtime-safety-v1.js
          node --check engine/shared/smart-visual-resolver-v1.js
          node --check content/english/year-3/year3-content-factory-v1.js
          node --check content/english/year-3/module-01/module-01-v1.js
          node --check test/scale/year3-bootstrap-static.mjs
      - name: Guard Canary and Year 3 thin-content contract
        run: node test/scale/year3-bootstrap-static.mjs

  browser-checkpoint:
    runs-on: ubuntu-latest
    needs: static-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/duduq-scale-http.log 2>&1 &
          echo $! > /tmp/duduq-scale-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duduq-scale-http.log
          exit 1
      - name: Smoke Year 3 M01 desktop and mobile
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/scale/year3-m01-smoke.mjs
