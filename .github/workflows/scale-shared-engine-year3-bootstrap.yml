name: Scale Shared Engine + Years 1-5 Baseline

on:
  pull_request:
    branches:
      - hotfix/year2-multimodal-dd-matching-diversity
      - main
  workflow_dispatch:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax shared layers and Years 1-5 gates
        run: |
          node --check engine/duduq-loader-v1.js
          node --check engine/shared/bubble-pop-runtime-safety-v1.js
          node --check engine/shared/smart-visual-resolver-v1.js
          node --check content/english/shared/scale-smart-visual-aliases-v1.js
          node --check content/english/shared/scale-content-compat-v1.js
          node --check content/english/year-3/year3-content-factory-v1.js
          for module in 01 02 03 04 05 06; do
            node --check "content/english/year-3/module-${module}/module-${module}-v1.js"
          done
          node --check content/english/year-4/year4-content-factory-v1.js
          for module in 01 02 03 04 05 06; do
            node --check "content/english/year-4/module-${module}/module-${module}-v1.js"
          done
          node --check content/english/year-5/year5-content-factory-v1.js
          for module in 01 02 03 04 05 06; do
            node --check "content/english/year-5/module-${module}/module-${module}-v1.js"
          done
          node --check test/scale/cross-year-architecture-audit.mjs
          node --check test/scale/year1-year2-baseline-smoke.mjs
          node --check test/scale/year3-bootstrap-static.mjs
          node --check test/scale/year3-v23-multimodal-contract.mjs
          node --check test/scale/year3-m02-frame-diagnostic.mjs
          node --check test/scale/year3-all-modules-smoke.mjs
          node --check test/scale/year3-smart-assets-audit.mjs
          node --check test/scale/year3-smart-assets-visual-proof.mjs
          node --check test/scale/year4-v23-functional-reading-contract.mjs
          node --check test/scale/year4-all-modules-smoke.mjs
          node --check test/scale/year5-v23-integrated-functional-contract.mjs
          node --check test/scale/year5-all-modules-smoke.mjs
      - name: Audit Years 1-5 architecture baseline
        run: node test/scale/cross-year-architecture-audit.mjs
      - name: Guard Canary and Year 3 90-item thin-content contract
        run: node test/scale/year3-bootstrap-static.mjs
      - name: Guard Year 3 multimodal v2.3 source contract
        run: node test/scale/year3-v23-multimodal-contract.mjs
      - name: Guard Year 4 functional-reading v2.3 source contract
        run: node test/scale/year4-v23-functional-reading-contract.mjs
      - name: Guard Year 5 integrated-functional v2.3 source contract
        run: node test/scale/year5-v23-integrated-functional-contract.mjs

  browser-checkpoint:
    runs-on: ubuntu-latest
    needs: static-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/duduq-scale-http.log 2>&1 &
          echo $! > /tmp/duduq-scale-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duduq-scale-http.log
          exit 1
      - name: Baseline Year 1-2 M01-M06 desktop and mobile
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/scale/year1-year2-baseline-smoke.mjs
      - name: Diagnose Year 3 M02 final Drag Drop frame
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/scale/year3-m02-frame-diagnostic.mjs
      - name: Smoke Year 3 M01-M06 desktop and mobile
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/scale/year3-all-modules-smoke.mjs
      - name: Audit Year 3 smart visual assets
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/scale/year3-smart-assets-audit.mjs
      - name: Smoke Year 4 M01-M06 desktop and mobile
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/scale/year4-all-modules-smoke.mjs
      - name: Smoke Year 5 M01-M06 desktop and mobile
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/scale/year5-all-modules-smoke.mjs
      - name: Capture Year 3 smart asset visual proof
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173
          OUT_DIR: test-results/year3-smart-assets-visual-proof
        run: node test/scale/year3-smart-assets-visual-proof.mjs
      - name: Upload Year 3 smart asset visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: year3-smart-assets-visual-proof
          path: test-results/year3-smart-assets-visual-proof
          if-no-files-found: warn
          retention-days: 14
