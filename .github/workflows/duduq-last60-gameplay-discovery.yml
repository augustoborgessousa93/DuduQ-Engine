name: DUDUQ Last60 - 7 Mechanics Real Gameplay Discovery

on:
  push:
    branches:
      - qa/duduq-last60-gameplay-20261110
    paths:
      - qa/last60-seven-mechanic-discovery.mjs
      - qa/last60-gameplay-canary.mjs
      - qa/last60-audio-gate-7-mechanics.mjs
      - qa/apply-v29-smart-confirm-qa.mjs
      - core/adapters/v29/smart-sentence-confirm-qa.js
      - .github/workflows/duduq-last60-gameplay-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duduq-last60-seven-mechanics-20261110
  cancel-in-progress: true

jobs:
  seven-mechanic-interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      CI: "true"
      BASE_URL: "http://127.0.0.1:4175"
      DUDUQ_QA_ONLY: "1"
      DUDUQ_VISUAL_REVIEW: "1"
      CF_PAGES_BRANCH: "release/duduq-phase2-orange-fruit-20261103"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin production source tree and seven mechanic QA syntax
        run: |
          set -Eeuo pipefail
          node --check qa/phase2-last60-candidate.mjs
          node --check qa/last60-seven-mechanic-discovery.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('qa/plans/last60-official-assets-20261110.json'));
          const t=JSON.parse(readFileSync('qa/fixtures/source-tree-617-20261110.json'));
          assert.equal(p.assignments.length,60);
          assert.equal(new Set(p.assignments.map(x=>x.blobSha)).size,59);
          assert.equal(t.sha,p.sourceCommit);
          assert.equal(p.baseReleaseSha,'c250b1a942ecce5c27670411906550b7f06ec362');
          console.log('QA_SOURCE_PIN_PASS');
          NODE
      - name: Reconstruct released 08-Nov distribution (no source edits)
        run: |
          set -Eeuo pipefail
          bash qa/cloudflare-preview-v28-prebuilt.sh
          test -s dist-pages/.duduq-pages-manifest
      - name: Normalize only two previously proven original manifest drifts
        run: |
          set -Eeuo pipefail
          node qa/normalize-last60-baseline-manifest.mjs
      - name: Integrate exact 60 media candidates and responsive V29 in QA dist
        run: |
          set -Eeuo pipefail
          node qa/phase2-last60-candidate.mjs --preview
          node qa/apply-last60-intro-responsive-preview.mjs --preview
          test -s qa/results/last60-candidate-20261110.json
      - name: Inject Smart Sentence QA-only native Confirm synchronization with hash contract
        run: |
          node --check qa/apply-v29-smart-confirm-qa.mjs
          node qa/apply-v29-smart-confirm-qa.mjs --preview
          test -s qa/results/v29-smart-confirm-qa-adapter.json

      - name: Start local isolated distribution
        run: |
          set -Eeuo pipefail
          python3 -m http.server 4175 --bind 127.0.0.1 --directory dist-pages > /tmp/duduq-last60-gameplay.log 2>&1 &
          for k in $(seq 1 45); do
            if curl -fsS "$BASE_URL/" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duduq-last60-gameplay.log
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect the seven real mechanics, exact curricular options and active controls
        run: |
          node qa/last60-seven-mechanic-discovery.mjs
      - name: Real mouse audio-control unlock, one canary per game mechanic
        run: |
          node --check qa/last60-audio-gate-7-mechanics.mjs
          node qa/last60-audio-gate-7-mechanics.mjs

      - name: Exercise seven real interactive gameplay canaries (correct/wrong/pairs/drag/bubble)
        run: |
          node --check qa/last60-gameplay-canary.mjs
          node qa/last60-gameplay-canary.mjs

      - name: Attach seven screenshots, canonical question contracts and DOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duduq-last60-seven-mechanic-discovery-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            qa/results/last60-gameplay-discovery/**
            qa/results/last60-gameplay-gates/**
            qa/results/last60-gameplay-canary/**
            qa/results/v29-smart-confirm-qa-adapter.json
            qa/results/last60-candidate-20261110.json
      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only interaction discovery; no release merge or Cloudflare publish."
          echo "No Gold Master, audio, question answer, runtime or media source changes."
