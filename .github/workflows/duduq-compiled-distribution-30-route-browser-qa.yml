name: DUDUQ Compiled Distribution - 30 Curricular Route Browser QA

on:
  push:
    branches:
      - integration/duduq-m1-qa-consolidated-20261031
    paths:
      - .github/workflows/duduq-compiled-distribution-30-route-browser-qa.yml
      - core/adapters/v28/intro-mobile-touch-target.css
      - qa/apply-intro-mobile-touch-target-v28.mjs
      - qa/tests/verify-intro-mobile-touch-target-v28.test.mjs
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Exact successful candidate artifact run
        required: true
        type: string
        default: "41317907501"
      source_run_id:
        description: Exact successful independent source QA run
        required: true
        type: string
        default: "41317907548"
      artifact_source_sha:
        description: Commit SHA shared by both runs
        required: true
        type: string
        default: "9f9d83e8ecf946e4f37051b38ceb718d61d5a5b2"

permissions:
  contents: read
  actions: read

concurrency:
  group: duduq-compiled-30-route-artifact-gate
  cancel-in-progress: true

jobs:
  compiled-30-route-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_RUN: ${{ inputs.artifact_run_id || '41258948433' }}
      SOURCE_RUN: ${{ inputs.source_run_id || '41258948442' }}
      ARTIFACT_SOURCE_SHA: ${{ inputs.artifact_source_sha || 'a0aa607e0a205641f9a876889bd5f1ed6c620a00' }}
      BASE_URL: "http://127.0.0.1:4175"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify archived candidate and independent source QA on identical SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          for RUN in "$ARTIFACT_RUN" "$SOURCE_RUN"; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .conclusion)" = success
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .head_sha)" = "$ARTIFACT_SOURCE_SHA"
          done
          mkdir -p "$RUNNER_TEMP/duduq-verified" dist-pages qa/results
          gh run download "$ARTIFACT_RUN" -R "$GITHUB_REPOSITORY" \
            --name "duduq-media-distribution-candidate-$ARTIFACT_RUN" \
            --dir "$RUNNER_TEMP/duduq-verified"
          # upload-artifact@v4 preserves paths relative to its least common
          # ancestor (/home/runner/work), not the individual input directories.
          # Resolve both exact filenames once; never guess or accept duplicates.
          mapfile -d '' TARS < <(find "$RUNNER_TEMP/duduq-verified" -type f -name duduq-review-distribution.tar.gz -print0)
          mapfile -d '' SUMS < <(find "$RUNNER_TEMP/duduq-verified" -type f -name duduq-review-distribution.sha256 -print0)
          test "${#TARS[@]}" -eq 1 && test "${#SUMS[@]}" -eq 1
          TAR="${TARS[0]}"
          SUM="${SUMS[0]}"
          test -s "$TAR" && test -s "$SUM"
          read -r EXPECTED FILENAME < "$SUM"
          [[ "$EXPECTED" =~ ^[a-f0-9]{64}$ ]]
          test "$FILENAME" = duduq-review-distribution.tar.gz
          test "$(sha256sum "$TAR" | cut -d' ' -f1)" = "$EXPECTED"
          tar -xzf "$TAR" -C dist-pages
          test -s dist-pages/.duduq-pages-manifest
          test -s dist-pages/content/english/media/media-registry.json
          mkdir -p qa/results
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          const root='dist-pages';
          const manifest=readFileSync('dist-pages/.duduq-pages-manifest');
          const digest=bytes=>createHash('sha256').update(bytes).digest('hex');
          const entries=new Map(manifest.toString('utf8').trimEnd().split(/\r?\n/).map(row=>{
            const pos=row.lastIndexOf(' ');assert(pos>0,'BAD_MANIFEST_ROW');return [row.slice(0,pos),row.slice(pos+1)];
          }));
          const intro='play/intro-module/index.html';
          const adapter='core/adapters/v28/intro-mobile-touch-target.css';
          const introBytes=readFileSync(path.join(root,intro));
          const adapterBytes=readFileSync(path.join(root,adapter));
          const introText=introBytes.toString('utf8');
          assert.equal((introText.match(/data-duduq-release="v28-intro-mobile-touch-target"/g)||[]).length,1,'V28_LINK_NOT_UNIQUE');
          assert.equal(digest(introBytes),entries.get(intro),'INTRO_HASH_NOT_BOUND');
          assert.equal(digest(adapterBytes),entries.get(adapter),'V28_ADAPTER_HASH_NOT_BOUND');
          const report={schemaVersion:'DUDUQ_INTRO_MOBILE_TOUCH_TARGET_V28',status:'HASH_BOUND_COMPILED_ADAPTER_VERIFIED_IN_EXACT_ARTIFACT',intro,introSha256:digest(introBytes),adapter,adapterSha256:digest(adapterBytes),manifestCandidateSha256:digest(manifest),manifestEntryCount:entries.size,visualGeometryChanged:false,touchTargetOnly:true,minimumVerifiedViewportWidth:280,minimumTargetCssPixels:44,curriculumChanged:false,answersChanged:false,mediaChanged:false,pedagogicalApprovalChanged:false,releaseApproved:false,productionDeployed:false};
          writeFileSync('qa/results/intro-mobile-touch-target-v28.json',`${JSON.stringify(report,null,2)}\n`);
          NODE
          node --check qa/apply-intro-mobile-touch-target-v28.mjs
          node --test qa/tests/verify-intro-mobile-touch-target-v28.test.mjs
          if grep -q 'data-duduq-release="v28-intro-mobile-touch-target"' dist-pages/play/intro-module/index.html; then
            test -s dist-pages/core/adapters/v28/intro-mobile-touch-target.css
          else
            DUDUQ_COMPILED_RELEASE_HOTFIX=1 node qa/apply-intro-mobile-touch-target-v28.mjs --apply
          fi
      - name: Verify all manifest bytes and 600 curricular contracts before browser
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          const root=path.resolve('dist-pages');
          const rows=readFileSync(path.join(root,'.duduq-pages-manifest'),'utf8').trimEnd().split(/\r?\n/);
          assert(rows.length>2700,'INCOMPLETE_COMPILED_MANIFEST');
          const seen=new Set();
          for(const row of rows){
            const pos=row.lastIndexOf(' '),rel=row.slice(0,pos),expected=row.slice(pos+1);
            assert(pos>0 && /^[a-f0-9]{64}$/.test(expected) && !seen.has(rel),'BAD_MANIFEST_ROW');
            seen.add(rel);
            const p=path.resolve(root,rel);
            assert(p.startsWith(root+path.sep),'UNSAFE_MANIFEST_PATH');
            assert.equal(createHash('sha256').update(readFileSync(p)).digest('hex'),expected,'HASH_MISMATCH:'+rel);
          }
          let total=0;
          for(let y=1;y<=5;y++)for(let m=1;m<=6;m++){
            const mm=String(m).padStart(2,'0');
            const rel='content/english/year-'+y+'/module-'+mm+'/questions.json';
            assert(seen.has(rel),'QUESTION_CONTRACT_NOT_IN_MANIFEST:'+rel);
            const data=JSON.parse(readFileSync(path.join(root,rel),'utf8'));
            assert.equal(data.items.length,20,'QUESTION_COUNT_CHANGED:'+rel);
            total+=data.items.length;
          }
          assert.equal(total,600);
          console.log('PASS_ARCHIVED_ARTIFACT_MANIFEST_AND_600_QUESTIONS');
          NODE
      - name: Install real Chromium for compiled product boot tests
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server serving the extracted immutable candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m http.server 4175 --bind 127.0.0.1 --directory dist-pages > "$RUNNER_TEMP/duduq-compiled-http.log" 2>&1 &
          for i in {1..30}; do
            if curl -fsS "$BASE_URL/" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/duduq-compiled-http.log"
          exit 1
      - name: Real Chromium boot of all 30 curricular module entrypoints on three viewports
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import {writeFileSync} from 'node:fs';
          const base=process.env.BASE_URL,records=[];
          const views=[{width:390,height:844},{width:768,height:1024},{width:1440,height:900}];
          const browser=await chromium.launch({headless:true});
          try {
            for(const viewport of views){
              const context=await browser.newContext({viewport});
              for(let year=1;year<=5;year++)for(let module=1;module<=6;module++){
                const mm=String(module).padStart(2,'0');
                const route='/play/english/year-'+year+'/module-'+mm+'/';
                const page=await context.newPage(),errors=[];
                page.on('pageerror',e=>errors.push('JS:'+String(e.message||e)));
                page.on('response',r=>{
                  if(r.url().startsWith(base)&&r.status()>=400&&!r.url().includes('favicon.ico'))
                    errors.push('HTTP_'+r.status()+':'+r.url());
                });
                try{
                  const nav=await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:30000});
                  if(nav?.status()!==200)throw Error('MODULE_ROUTE_HTTP_'+nav?.status());
                  await page.waitForFunction(()=>{
                    const text=document.body?.innerText?.trim()||'';
                    return text.length>=20||[...document.querySelectorAll('button')].some(b=>b.getBoundingClientRect().width>0);
                  },null,{timeout:10000});
                  await page.waitForTimeout(700);
                  const state=await page.evaluate(()=>{
                    const visible=e=>{
                      const r=e.getBoundingClientRect(),s=getComputedStyle(e);
                      return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden';
                    };
                    const images=[...document.images].filter(visible);
                    return {bodyTextLength:document.body?.innerText?.trim().length||0,
                      visibleButtons:[...document.querySelectorAll('button')].filter(visible).length,
                      visibleImages:images.length,
                      brokenVisibleImages:images.filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.currentSrc||i.src),
                      viewportWidth:window.innerWidth,
                      documentScrollWidth:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0),
                      title:document.title};
                  });
                  // R147/R148 responsive regression: test the actual compiled product,
                  // including visible same-origin game frames, not just the host shell.
                  const horizontalOverflowPx=Math.max(0,state.documentScrollWidth-state.viewportWidth);
                  const frameOverflows=[];
                  for(const frame of page.frames()){
                    if(frame===page.mainFrame()||!frame.url().startsWith(base))continue;
                    const frameElement=await frame.frameElement();
                    if(!(await frameElement.isVisible()))continue;
                    const geometry=await frame.evaluate(()=>{
                      const doc=document.documentElement;
                      return {viewportWidth:window.innerWidth,
                        scrollWidth:Math.max(doc.scrollWidth,document.body?.scrollWidth||0)};
                    });
                    const overflowPx=Math.max(0,geometry.scrollWidth-geometry.viewportWidth);
                    if(overflowPx>2)frameOverflows.push({url:frame.url(),overflowPx});
                  }
                  if(horizontalOverflowPx>2||frameOverflows.length)
                    throw Error('COMPILED_RESPONSIVE_HORIZONTAL_OVERFLOW:'+JSON.stringify({
                      hostOverflowPx:horizontalOverflowPx,frameOverflows}));
                  if(state.brokenVisibleImages.length)throw Error('BROKEN_VISIBLE_IMAGE:'+state.brokenVisibleImages.join(','));
                  if(errors.length)throw Error('BROWSER_ERRORS:'+errors.join('|'));
                  records.push({year,module,viewport:viewport.width,status:'PASS',...state,
                    horizontalOverflowPx,frameOverflows});
                }catch(e){
                  records.push({year,module,viewport:viewport.width,status:'FAIL',error:String(e.message||e),browserErrors:errors});
                }finally{await page.close();}
              }
              await context.close();
            }
          }finally{await browser.close();}
          const failures=records.filter(r=>r.status==='FAIL');
          const report={schemaVersion:'DUDUQ_COMPILED_30_MODULE_3_VIEWPORT_BOOT_AND_RESPONSIVE_V2',
            artifactRun:Number(process.env.ARTIFACT_RUN),sourceRun:Number(process.env.SOURCE_RUN),
            artifactSourceSha:process.env.ARTIFACT_SOURCE_SHA,
            expectedCases:90,observedCases:records.length,passed:records.length-failures.length,
            failed:failures.length,cases:records,technicalBootAndResponsiveGeometryOnly:true,
            pedagogicalApproval:false,gameplayCertified:false,year3GameplayCertified:false,
            productionReleaseApproved:false,productionDeployed:false};
          writeFileSync('qa/results/compiled-30-route-browser-qa.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({observed:records.length,passed:report.passed,failed:failures.length,
            firstFailures:failures.slice(0,8)}));
          if(records.length!==90||failures.length)process.exitCode=1;
          NODE
      - name: Real pointer interaction through compiled module intros and Year3 responsive entries
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import {writeFileSync} from 'node:fs';
          const base=process.env.BASE_URL,records=[],cases=[];
          for(let year=1;year<=5;year++)for(let module=1;module<=6;module++)
            cases.push({year,module,viewport:{width:1440,height:900}});
          for(const width of [390,768])for(let module=1;module<=6;module++)
            cases.push({year:3,module,viewport:{width,height:width===390?844:1024}});
          const browser=await chromium.launch({headless:true});
          try {
            for(const test of cases){
              const {year,module,viewport}=test;
              const route='/play/english/year-'+year+'/module-'+String(module).padStart(2,'0')+'/';
              const context=await browser.newContext({viewport,reducedMotion:'reduce'});
              const page=await context.newPage(),errors=[];
              page.on('pageerror',e=>errors.push('JS:'+String(e.message||e)));
              page.on('response',r=>{
                if(r.url().startsWith(base)&&r.status()>=400&&!r.url().includes('favicon.ico'))
                  errors.push('HTTP_'+r.status()+':'+r.url());
              });
              const record={year,module,viewport:viewport.width,route,status:'FAIL'};
              try {
                const nav=await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:30000});
                if(nav?.status()!==200)throw Error('INTRO_HTTP_'+nav?.status());
                const start=page.getByRole('button',{name:/iniciar (?:jogo|missão)/i}).first();
                await start.waitFor({state:'visible',timeout:15000});
                const bounds=await start.boundingBox();
                if(!bounds||bounds.width<20||bounds.height<20)throw Error('INTRO_START_TOO_SMALL');
                const x=bounds.x+bounds.width/2,y=bounds.y+bounds.height/2;
                const hit=await start.evaluate((el,p)=>{
                  const node=document.elementFromPoint(p.x,p.y);
                  return node===el||el.contains(node);
                },{x,y});
                if(!hit)throw Error('INTRO_START_NOT_POINTER_HITTABLE');
                record.beforeUrl=page.url();
                await page.mouse.click(x,y);
                // Do not accept a pre-existing ENGINE_READY flag or hidden game DOM
                // as proof that the learner's real pointer click entered gameplay.
                await page.waitForFunction(()=>{
                  const visible=el=>{
                    const r=el.getBoundingClientRect(),s=getComputedStyle(el);
                    return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden';
                  };
                  const startStillHittable=[...document.querySelectorAll('button')].some(b=>{
                    if(!/iniciar (?:jogo|missão)/i.test(b.textContent||'')||!visible(b))return false;
                    const r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
                    const hit=document.elementFromPoint(x,y);
                    return hit===b||b.contains(hit);
                  });
                  const mechanicRoute=/\/play\/(drag-drop|drag-drop-multimedia|target-shooter|matching|memory-quest|bubble-pop|smart-sentence)\//.test(location.pathname);
                  const playableFrame=[...document.querySelectorAll('iframe')].some(f=>{
                    if(!visible(f))return false;
                    try{return (f.contentDocument?.body?.children.length||0)>0;}catch{return false;}
                  });
                  const visibleGame=[...document.querySelectorAll('#game.game-screen,.duduq-game-screen,.duduq-mechanic-frame')].some(visible);
                  return !startStillHittable&&(mechanicRoute||playableFrame||visibleGame);
                },null,{timeout:20000});
                record.afterUrl=page.url();
                if(errors.length)throw Error('BROWSER_ERRORS:'+errors.join('|'));
                record.status='PASS';
                record.realMouseClick=true;
              }catch(e){
                record.error=String(e.message||e);
                record.browserErrors=errors;
              }finally{
                records.push(record);
                await page.close();
                await context.close();
              }
            }
          }finally{await browser.close();}
          const failures=records.filter(r=>r.status!=='PASS');
          const report={schemaVersion:'DUDUQ_COMPILED_INTRO_POINTER_AND_YEAR3_ENTRY_QA_V2',
            artifactRun:Number(process.env.ARTIFACT_RUN),
            artifactSourceSha:process.env.ARTIFACT_SOURCE_SHA,
            expectedCases:42,observedCases:records.length,passed:records.length-failures.length,
            failed:failures.length,cases:records,realPointerIntroOnly:true,transitionRequiresVisibleGameAndDismissedStart:true,
            gameplayCertified:false,year3GameplayCertified:false,
            pedagogicalApproval:false,releaseApproved:false,productionDeployed:false};
          writeFileSync('qa/results/compiled-intro-pointer-year3-qa.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({observed:records.length,passed:report.passed,failed:report.failed,
            firstFailures:failures.slice(0,10)}));
          if(records.length!==42||failures.length)process.exitCode=1;
          NODE
      - name: Real touchscreen entry for Year3 modules on mobile and tablet
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import {writeFileSync} from 'node:fs';
          const base=process.env.BASE_URL,records=[];
          const views=[{width:390,height:844},{width:768,height:1024}];
          const browser=await chromium.launch({headless:true});
          try {
            for(const viewport of views) {
              const context=await browser.newContext({viewport,hasTouch:true,reducedMotion:'reduce'});
              try {
                for(let module=1;module<=6;module++) {
                  const route='/play/english/year-3/module-'+String(module).padStart(2,'0')+'/';
                  const page=await context.newPage(),errors=[];
                  const record={module,viewport:viewport.width,route,status:'FAIL'};
                  page.on('pageerror',e=>errors.push('JS:'+String(e.message||e)));
                  page.on('response',r=>{
                    if(r.url().startsWith(base)&&r.status()>=400&&!r.url().includes('favicon.ico'))
                      errors.push('HTTP_'+r.status()+':'+r.url());
                  });
                  await page.addInitScript(()=>{
                    // Persist real pointerdown evidence across the intro -> game navigation.
                    window.__duduqTouchObserved=sessionStorage.getItem('duduq-touch-pointerdown')==='true';
                    document.addEventListener('pointerdown',e=>{
                      if(e.pointerType==='touch'){
                        sessionStorage.setItem('duduq-touch-pointerdown','true');
                        window.__duduqTouchObserved=true;
                      }
                    },true);
                  });
                  try {
                    const nav=await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:30000});
                    if(nav?.status()!==200)throw Error('TOUCH_INTRO_HTTP_'+nav?.status());
                    const start=page.getByRole('button',{name:/iniciar (?:jogo|missão)/i}).first();
                    await start.waitFor({state:'visible',timeout:15000});
                    const bounds=await start.boundingBox();
                    record.startBounds=bounds;
                    if(!bounds||bounds.width<44||bounds.height<44)throw Error('TOUCH_START_TOO_SMALL');
                    const x=bounds.x+bounds.width/2,y=bounds.y+bounds.height/2;
                    const hit=await start.evaluate((el,p)=>{
                      const node=document.elementFromPoint(p.x,p.y);
                      return node===el||el.contains(node);
                    },{x,y});
                    if(!hit)throw Error('TOUCH_START_OBSTRUCTED');
                    await page.touchscreen.tap(x,y);
                    await page.waitForFunction(()=>{
                      const visible=el=>{
                        const r=el.getBoundingClientRect(),s=getComputedStyle(el);
                        return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden';
                      };
                      const startStillHittable=[...document.querySelectorAll('button')].some(b=>{
                        if(!/iniciar (?:jogo|missão)/i.test(b.textContent||'')||!visible(b))return false;
                        const r=b.getBoundingClientRect(),hit=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                        return hit===b||b.contains(hit);
                      });
                      const mechanicRoute=/\/play\/(drag-drop|drag-drop-multimedia|target-shooter|matching|memory-quest|bubble-pop|smart-sentence)\//.test(location.pathname);
                      const playableFrame=[...document.querySelectorAll('iframe')].some(f=>{
                        if(!visible(f))return false;
                        try{return (f.contentDocument?.body?.children.length||0)>0;}catch{return false;}
                      });
                      const visibleGame=[...document.querySelectorAll('#game.game-screen,.duduq-game-screen,.duduq-mechanic-frame')].some(visible);
                      return sessionStorage.getItem('duduq-touch-pointerdown')==='true'&&!startStillHittable&&
                        (mechanicRoute||playableFrame||visibleGame);
                    },null,{timeout:20000});
                    const geometry=await page.evaluate(()=>({
                      hostOverflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),
                      touchObserved:sessionStorage.getItem('duduq-touch-pointerdown')==='true'
                    }));
                    if(geometry.hostOverflow>2)throw Error('TOUCH_HOST_OVERFLOW:'+geometry.hostOverflow);
                    if(errors.length)throw Error('TOUCH_BROWSER_ERRORS:'+errors.join('|'));
                    record.status='PASS';
                    record.touchObserved=geometry.touchObserved;
                    record.afterUrl=page.url();
                  }catch(e){
                    record.error=String(e.message||e);
                    record.browserErrors=errors;
                    // Diagnostics only: preserve the strict 44px and actual-touch assertions.
                    try {
                      record.diagnostics=await page.evaluate(()=>{
                        const visible=el=>{
                          const r=el.getBoundingClientRect(),s=getComputedStyle(el);
                          return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden';
                        };
                        const buttons=[...document.querySelectorAll('button')].filter(
                          b=>/iniciar (?:jogo|missão)/i.test(b.textContent||''));
                        const starts=buttons.map(b=>{
                          const r=b.getBoundingClientRect(),s=getComputedStyle(b);
                          const hit=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                          return {text:(b.textContent||'').trim().slice(0,80),
                            x:r.x,y:r.y,width:r.width,height:r.height,
                            visible:visible(b),pointerEvents:s.pointerEvents,
                            centerHit:hit===b||b.contains(hit),
                            hitTag:hit?.tagName||null,hitClass:String(hit?.className||'').slice(0,100)};
                        });
                        return {url:location.href,touchObserved:sessionStorage.getItem('duduq-touch-pointerdown')==='true',
                          viewport:{width:innerWidth,height:innerHeight},
                          hostOverflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),
                          startButtons:starts,visibleGameNodes:[...document.querySelectorAll(
                            '#game.game-screen,.duduq-game-screen,.duduq-mechanic-frame')].filter(visible).length,
                          frames:[...document.querySelectorAll('iframe')].map(f=>({
                            src:f.getAttribute('src'),visible:visible(f),
                            width:f.getBoundingClientRect().width,height:f.getBoundingClientRect().height}))};
                      });
                      if(module===1) {
                        const shot='qa/results/compiled-year3-touch-diagnostic-'+viewport.width+'.png';
                        await page.screenshot({path:shot,animations:'disabled'});
                        record.screenshot=shot;
                      }
                    }catch(diagnosticError){
                      record.diagnosticCaptureError=String(diagnosticError.message||diagnosticError);
                    }
                  }finally{records.push(record);await page.close();}
                }
              }finally{await context.close();}
            }
          }finally{await browser.close();}
          const failures=records.filter(r=>r.status!=='PASS');
          const report={schemaVersion:'DUDUQ_YEAR3_REAL_TOUCH_INTRO_QA_V1',
            artifactRun:Number(process.env.ARTIFACT_RUN),artifactSourceSha:process.env.ARTIFACT_SOURCE_SHA,
            expectedCases:12,observedCases:records.length,passed:records.length-failures.length,
            failed:failures.length,cases:records,realTouchscreenTap:true,
            gameplayCertified:false,year3GameplayCertified:false,
            pedagogicalApproval:false,releaseApproved:false,productionDeployed:false};
          writeFileSync('qa/results/compiled-year3-touch-intro-qa.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({observed:records.length,passed:report.passed,failed:report.failed,
            firstFailures:failures.slice(0,12)}));
          if(records.length!==12||failures.length)process.exitCode=1;
          NODE
      - name: Package exact V28 compiled QA candidate only after all Chromium gates PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const v28=JSON.parse(readFileSync('qa/results/intro-mobile-touch-target-v28.json','utf8'));
          const touch=JSON.parse(readFileSync('qa/results/compiled-year3-touch-intro-qa.json','utf8'));
          const boots=JSON.parse(readFileSync('qa/results/compiled-30-route-browser-qa.json','utf8'));
          const pointer=JSON.parse(readFileSync('qa/results/compiled-intro-pointer-year3-qa.json','utf8'));
          assert.equal(v28.status,'HASH_BOUND_COMPILED_ADAPTER_APPLIED');
          assert.equal(v28.releaseApproved,false);
          assert.equal(v28.productionDeployed,false);
          assert.equal(v28.mediaChanged,false);
          assert.equal(boots.passed,90);assert.equal(boots.failed,0);
          assert.equal(pointer.passed,42);assert.equal(pointer.failed,0);
          assert.equal(touch.passed,12);assert.equal(touch.failed,0);
          assert.equal(touch.realTouchscreenTap,true);
          assert.equal(touch.releaseApproved,false);
          console.log('V28_QA_ARCHIVE_GUARDS_PASS: 90 boots, 42 mouse, 12 touch, no release approval');
          NODE
          mkdir -p qa/results/v28-compiled-candidate
          tar -czf qa/results/v28-compiled-candidate/duduq-v28-compiled-candidate.tar.gz -C dist-pages .
          (
            cd qa/results/v28-compiled-candidate
            sha256sum duduq-v28-compiled-candidate.tar.gz > duduq-v28-compiled-candidate.sha256
            sha256sum -c duduq-v28-compiled-candidate.sha256
          )
      - name: Preserve V28 compiled QA candidate with hash and release boundary
        uses: actions/upload-artifact@v4
        with:
          name: duduq-v28-compiled-qa-candidate-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            qa/results/v28-compiled-candidate/duduq-v28-compiled-candidate.tar.gz
            qa/results/v28-compiled-candidate/duduq-v28-compiled-candidate.sha256
            qa/results/intro-mobile-touch-target-v28.json
      - name: Preserve exact-artifact Chromium evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duduq-compiled-30-route-browser-qa-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            qa/results/compiled-30-route-browser-qa.json
            qa/results/compiled-intro-pointer-year3-qa.json
            qa/results/compiled-year3-touch-intro-qa.json
            qa/results/compiled-year3-touch-diagnostic-*.png
            qa/results/intro-mobile-touch-target-v28.json
      - name: Explicit release boundary
        if: always()
        run: |
          echo "Boot, image loading, responsive geometry and intro pointer entry only; NOT full gameplay, pedagogical approval, Year3 gameplay certification, or production deployment."
          echo "No Cloudflare credentials or production mutation used."
