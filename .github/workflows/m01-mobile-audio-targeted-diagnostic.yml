name: M01 Post-Merge Sanity

on:
  push:
    branches:
      - diag/m01-mobile-audio-r146
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m01-postmerge-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Preserve sanity test and checkout merge commit
        run: |
          cp test/systemic/year1-m01-postmerge-sanity-final.mjs /tmp/year1-m01-postmerge-sanity-final.mjs
          git fetch origin bc8eadb945484cbdc4c7a539eb1b65fda7b35c87
          git checkout --detach bc8eadb945484cbdc4c7a539eb1b65fda7b35c87
          cp /tmp/year1-m01-postmerge-sanity-final.mjs test/systemic/.year1-m01-postmerge-sanity-final.tmp.mjs

      - name: Fix sanity stage-transition sentinel only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/systemic/.year1-m01-postmerge-sanity-final.tmp.mjs')
          text = path.read_text(encoding='utf-8')

          correct_marker = '''  await ddFrame.locator('.duduq-dd2-bank-items .duduq-dd2-item[data-dd2-item-id="C"]').first().click({ force: true });'''
          capture = '''  await page.evaluate(() => {
            const doc = document.querySelector("iframe")?.contentDocument;
            window.__DUDUQ_SANITY_Q02_TARGET_SRC__ = doc?.querySelector('.duduq-dd2-target[data-dd2-target-id] img')?.currentSrc || "";
          });
          assert(await page.evaluate(() => Boolean(window.__DUDUQ_SANITY_Q02_TARGET_SRC__)), "Contexto visual Q02 ausente antes da transição para Q03.");

          ''' + correct_marker

          weak_return = '''    return Boolean(s?.stepIndex === 1 && !s.transitioning && doc?.querySelector('.duduq-dd2-bank-items .duduq-dd2-item[data-dd2-item-id="A"]'));'''
          strong_return = '''    const previousSrc = window.__DUDUQ_SANITY_Q02_TARGET_SRC__ || "";
            const nextSrc = doc?.querySelector('.duduq-dd2-target[data-dd2-target-id] img')?.currentSrc || "";
            const items = [...(doc?.querySelectorAll(".duduq-dd2-bank-items .duduq-dd2-item") || [])];
            return Boolean(s?.stepIndex === 1 && !s.transitioning && previousSrc && nextSrc && nextSrc !== previousSrc && items.length === 3 && items.every((item) => !item.disabled));'''

          if text.count(correct_marker) != 1:
              raise SystemExit(f'Expected one Q02 correct marker, got {text.count(correct_marker)}')
          if text.count(weak_return) != 1:
              raise SystemExit(f'Expected one weak Q02→Q03 return, got {text.count(weak_return)}')

          text = text.replace(correct_marker, capture, 1).replace(weak_return, strong_return, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check test/systemic/.year1-m01-postmerge-sanity-final.tmp.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start merged M01 local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/duduq-m01-sanity-http.log 2>&1 &
          echo $! > /tmp/duduq-m01-sanity-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duduq-m01-sanity-http.log
          exit 1

      - name: Run proportional M01 post-merge sanity
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/systemic/.year1-m01-postmerge-sanity-final.tmp.mjs
