name: M01 Mobile Audio Targeted Diagnostic

on:
  push:
    branches:
      - diag/m01-mobile-audio-r146
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile-audio-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/duduq-mobile-http.log 2>&1 &
          echo $! > /tmp/duduq-mobile-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duduq-mobile-http.log
          exit 1

      - name: Diagnose mobile Drag Drop audio only
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node test/systemic/year1-m01-mobile-audio-targeted-diagnostic.mjs

      - name: Apply observer latch to PR QA only
        run: |
          cp test/systemic/apply-m01-audio-latch-qa-patch.mjs /tmp/apply-m01-audio-latch-qa-patch.mjs
          git fetch origin homolog-year1-m01-official
          git checkout -B homolog-year1-m01-official origin/homolog-year1-m01-official
          node /tmp/apply-m01-audio-latch-qa-patch.mjs
          git diff --check
          test "$(git diff --name-only)" = "test/systemic/year1-m01-official-homologation.mjs"
          node --check test/systemic/year1-m01-official-homologation.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/systemic/year1-m01-official-homologation.mjs
          git commit -m "test(year1-m01): latch transient Drag Drop audio state"
          git push origin HEAD:homolog-year1-m01-official
