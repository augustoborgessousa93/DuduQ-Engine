name: M01 Mobile Audio Targeted Diagnostic

on:
  push:
    branches:
      - diag/m01-mobile-audio-r146
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-audio-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Preserve targeted test and checkout PR head
        run: |
          cp test/systemic/year1-m01-mobile-observer-targeted-final.mjs /tmp/year1-m01-mobile-observer-targeted-final.mjs
          git fetch origin homolog-year1-m01-official
          git checkout -B homolog-year1-m01-official origin/homolog-year1-m01-official

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start PR-head local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/duduq-mobile-http.log 2>&1 &
          echo $! > /tmp/duduq-mobile-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duduq-mobile-http.log
          exit 1

      - name: Validate final mobile observer latch on PR head
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node /tmp/year1-m01-mobile-observer-targeted-final.mjs
