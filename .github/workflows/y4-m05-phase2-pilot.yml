name: Y4 M05 Phase 2 Pilot

on:
  push:
    branches:
      - refactor/y4-m05-mechanic-orchestration-phase2-20260904
    paths:
      - "content/english/shared/pedagogical-orchestrator-v1.js"
      - "content/english/year-4/module-05/**"
      - "test/year4/y4-m05-phase2-unit.mjs"
      - ".github/workflows/y4-m05-phase2-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2-unit-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Y4 M05 Phase 2 gates
        run: node test/year4/y4-m05-phase2-unit.mjs
