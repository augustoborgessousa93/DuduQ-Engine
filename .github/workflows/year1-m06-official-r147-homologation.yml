name: Year 1 M06 Official R147 Homologation

on:
  push:
    branches:
      - homolog-year1-m06-official
    paths:
      - 'content/english/year-1/module-06/**'
      - 'test/systemic/year1-m06-official-r147-turbo-shard.mjs'
      - '.github/workflows/year1-m06-official-r147-homologation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m06-ten-criteria:
    name: M06 R147 — ${{ matrix.viewport }} — ${{ matrix.question_range }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - desktop-1366x768
          - fullhd-1920x1080
          - tablet-768x1024
          - mobile-390x844
        question_range:
          - Q01-Q04
          - Q05-Q08
          - Q09-Q12
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check content/english/year-1/module-06/module-06.js
          node --check content/english/year-1/module-06/m06-visual-composition.js
          node --check test/systemic/year1-m06-official-r147-turbo-shard.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start M06 candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/duduq-m06-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duduq-m06-http.log
          exit 1
      - name: Run M06 turbo shard
        env:
          BASE_URL: http://127.0.0.1:4173
          VIEWPORT_NAME: ${{ matrix.viewport }}
          QUESTION_RANGE: ${{ matrix.question_range }}
        run: node test/systemic/year1-m06-official-r147-turbo-shard.mjs
      - name: Upload M06 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: year1-m06-r147-${{ matrix.viewport }}-${{ matrix.question_range }}
          path: test-results/systemic/year1-m06-official/
          if-no-files-found: ignore
          retention-days: 14

  m06-aggregate:
    name: M06 R147 aggregate 12/12 shards 10/10
    needs: m06-ten-criteria
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all 12 viewport-range shards
        env:
          MATRIX_RESULT: ${{ needs.m06-ten-criteria.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "M06 R147 aggregate FAIL: matrix result=$MATRIX_RESULT" >&2
            exit 1
          fi
          echo 'M06 R147 PASS — 12/12 shards — 12/12 questions × 4 viewports — 10/10 criteria'
