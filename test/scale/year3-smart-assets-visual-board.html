<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Year 3 v2.3 — Multimodal Visual QA</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#eef5fb;color:#173d68}body{padding:24px}
    header{max-width:1240px;margin:0 auto 20px}h1{margin:0 0 8px;font-size:clamp(24px,3vw,38px)}p{margin:0;line-height:1.45;color:#48677f}
    #board{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
    .qa-card{min-width:0;background:#fff;border:2px solid #c7dceb;border-radius:20px;padding:14px;box-shadow:0 6px 18px rgba(22,61,104,.08);overflow:hidden}
    .qa-media{width:100%;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;background:#f7fbff;border:1px solid #d9e7f1;border-radius:14px;overflow:hidden}
    .qa-media img{display:block;width:100%;height:100%;object-fit:contain;max-width:100%;max-height:100%}
    .qa-query{margin:10px 0 5px;font-size:15px;font-weight:800;overflow-wrap:anywhere}.qa-meta{font-size:12px;color:#5d768a;overflow-wrap:anywhere}
    .gap{border-color:#c62828}.broken{border-color:#ef6c00}
    @media(max-width:520px){body{padding:12px}#board{grid-template-columns:1fr 1fr;gap:10px}.qa-card{padding:9px;border-radius:14px}.qa-query{font-size:12px}.qa-meta{font-size:10px}}
  </style>
</head>
<body>
  <header>
    <h1>Year 3 • v2.3 • Multimodal Visual QA</h1>
    <p>Prova técnica dos estímulos de maior risco da revisão multimodal: perfis narrados, calendários, contexto, operações, objetos, quantidades, transportes e partes do corpo.</p>
  </header>
  <main id="board" aria-label="Painel de auditoria visual v2.3"></main>
  <script src="/engine/releases/core/1.0.9/duduq-assets.js"></script>
  <script src="/engine/shared/smart-visual-resolver-v1.js"></script>
  <script src="/content/english/year-3/year3-content-factory-v1.js?v=1.1.0"></script>
  <script>
    (() => {
      const queries = [
        "profile:maya","profile:maya:10","profile:ana:12","profile:sister:8","profile:grandfather:50",
        "duo:leo:mia","duo:maya:leo",
        "calendar:may:12","calendar:may:9","calendar:june:12","calendar:march:12",
        "math:2 + 3 = 5:+","math:5 − 2 = 3:−","math:3 × 2 = 6:×","math:8 ÷ 2 = 4:÷","math:4 + 1 = 5:=",
        "10","ball","three turtles","3 yellow ducks","7 white cats","2 brown rabbits","big blue pencil",
        "one red circle","6 blue rectangles","3 small circles","2 big triangles","2 yellow stars","4 green squares","7 red squares",
        "green car","red and blue bus","big truck","hands","nose","eyes","hair","two big hands","two green eyes","brown hair"
      ];
      const board=document.getElementById("board");
      const results=[];
      for(const query of queries){
        const resolved=window.DuduQYear3Factory?.resolveVisual?.(query)||null;
        const card=document.createElement("article");
        card.className="qa-card"+(resolved?.src?"":" gap");
        card.dataset.query=query;card.dataset.status=resolved?.status||"asset-gap";card.dataset.kind=resolved?.kind||"context";
        const media=document.createElement("div");media.className="qa-media";
        if(resolved?.src){const img=document.createElement("img");img.src=resolved.src;img.alt=query;img.loading="eager";img.decoding="sync";img.addEventListener("error",()=>card.classList.add("broken"));media.appendChild(img);}
        const title=document.createElement("div");title.className="qa-query";title.textContent=query;
        const meta=document.createElement("div");meta.className="qa-meta";meta.textContent=`${resolved?.status||"asset-gap"} • ${resolved?.kind||"context"}`;
        card.append(media,title,meta);board.appendChild(card);results.push({query,status:resolved?.status||"asset-gap",kind:resolved?.kind||"context",src:resolved?.src||null});
      }
      window.__YEAR3_SMART_VISUAL_BOARD__={version:"2.3.1",resolverVersion:window.DuduQSmartVisual?.version||null,factoryVersion:window.DuduQYear3Factory?.version||null,results};
    })();
  </script>
</body>
</html>
