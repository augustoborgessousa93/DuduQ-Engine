<!doctype html>
<meta charset="utf-8">
<title>DuduQ Matching universal-host E2E</title>
<style>html,body,#root{margin:0;width:100%;height:100%;overflow:hidden}#root{min-height:320px}</style>
<div id="root"></div>
<script>
  window.DUDUQ_ENGINE_BASE = window.location.origin;
  window.__matchingE2E = { registration: null, audioCalls: 0 };
  window.DuduQ = { registerMechanic(entry) { window.__matchingE2E.registration = entry; } };
</script>
<script src="/core/duduq-screen-runtime.js"></script>
<script src="/core/duduq-matching-visual-bridge.js"></script>
<script src="/mechanics/matching.js"></script>
<script>
  const image = "/test/matching/gold-master-candidate-v1/assets/duduq-hud-mascot.png";
  const makeQuestion = (id, prompt) => ({
    id, statement: prompt, instruction: "Ouça e relacione.", audio: { text: prompt, language: "en-US" },
    metadata: { matching: {
      mode: "audio-image", assets: { greeting: image, goodbye: image },
      leftItems: [{ id: "hello", spokenText: "Hello", audioDescription: "Listen Hello" }, { id: "goodbye", spokenText: "Goodbye", audioDescription: "Listen Goodbye" }],
      rightItems: [{ id: "greeting", imageAssetKey: "greeting", alt: "Greeting" }, { id: "farewell", imageAssetKey: "goodbye", alt: "Farewell" }],
      pairs: [{ leftId: "hello", rightId: "greeting" }, { leftId: "goodbye", rightId: "farewell" }],
      behavior: { connectionMode: "1x1", interactionMode: "smart", shuffleLeft: false, shuffleRight: false }
    }}
  });
  window.__matchingE2E.start = () => {
    window.__matchingE2E.destroy?.();
    const root = document.getElementById("root"); root.replaceChildren();
    const payload = { title: "Matching E2E", questions: [makeQuestion("q1", "Question one"), makeQuestion("q2", "Question two")] };
    window.__matchingE2E.destroy = window.__matchingE2E.registration.mount({ container: root, payload, context: { year: 2, moduleId: "e2e", totalSteps: 2 }, onComplete(result) { window.__matchingE2E.complete = result; } });
  };
  window.__matchingE2E.start();
</script>
