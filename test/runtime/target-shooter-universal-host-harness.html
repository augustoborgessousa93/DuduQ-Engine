<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Target Shooter Universal Host E2E</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#root{width:100%;height:100%;min-height:320px}</style></head>
<body><main id="root"></main>
<script>window.DUDUQ_ENGINE_BASE = new URL("../..", window.location.href).href.replace(/\/$/, "");</script>
<script src="../../core/duduq-screen-runtime.js"></script>
<script src="../../core/duduq-target-shooter-visual-bridge.js"></script>
<script src="../../core/duduq-schema.js"></script>
<script src="../../core/duduq-host.js"></script>
<script src="../../mechanics/target-shooter.js"></script>
<script>
(function () {
  const item = (id, label, emoji) => ({ id, label, emoji, display: "image" });
  const question = {
    id: "target-e2e-1",
    statement: "Find the cat",
    instruction: "Shoot the correct target.",
    feedback: { correct: "Correct!", incorrect: "Try again." },
    metadata: { targetShooter: {
      audioText: "Cat", mode: "image-to-response", shape: "balloon",
      correctIds: ["cat"],
      items: [item("cat", "CAT", "🐱"), item("dog", "DOG", "🐶"), item("bird", "BIRD", "🐦")],
      difficulty: { objectCount: 3, requiredCorrect: 1, spawnIntervalMs: 10, targetSize: 110 }
    }}
  };
  const nextQuestion = {
    id: "target-e2e-2",
    statement: "Find the dog",
    instruction: "Shoot the dog target.",
    feedback: { correct: "Second correct!", incorrect: "Try the dog." },
    metadata: { targetShooter: { audioText: "Dog", mode: "image-to-response", shape: "shield", correctIds: ["dog"], items: [item("dog", "DOG", "🐶"), item("cat", "CAT", "🐱")], difficulty: { objectCount: 2, requiredCorrect: 1, spawnIntervalMs: 10, targetSize: 110 } }}
  };
  const api = { question, nextQuestion, root: document.getElementById("root") };
  window.__TARGET_E2E__ = api;
  window.DuduQ.start({ id: "target-e2e", year: 1, steps: [
    { id: "target-step-1", mechanic: "target-shooter", payload: { title: "Target Shooter", questions: [question] }, options: {} },
    { id: "target-step-2", mechanic: "target-shooter", payload: { title: "Target Shooter", questions: [nextQuestion] }, options: {} }
  ] });
  window.__TARGET_E2E__.ready = true;
})();
</script>
</body></html>
