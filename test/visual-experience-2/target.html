<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>DuduQ — Target Shooter — Visual Experience 2.0</title>
  <style>html,body,#root{width:100%;height:100%;margin:0}body{background:#edf5fa}#error{padding:24px;font:18px/1.5 system-ui;color:#763018}</style>
  <script>window.DUDUQ_ENGINE_BASE=new URL('../../',location.href).href.replace(/\/$/,'');</script>
  <script src="https://cdn.jsdelivr.net/gh/augustoborgessousa93/Assets-DuduQ@f0f8bed8e8c24fad4eae204bf4a5cc84a8d8263f/asset-catalog/runtime-index.js"></script>
  <script src="../../engine/releases/core/1.0.12/duduq-assets.js"></script>
  <script src="../../engine/releases/core/1.0.12/duduq-schema.js"></script>
  <script src="../../engine/releases/core/1.0.12/duduq-sound.js"></script>
  <script src="../../engine/releases/core/1.0.12/duduq-host.js"></script>
  <script id="duduq-world-fusion-core-script" src="../../engine/releases/core/1.0.12/duduq-world-fusion.js"></script>
  <link id="duduq-world-fusion-core-style" rel="stylesheet" href="../../engine/releases/core/1.0.12/duduq-world-fusion.css">
  <script src="../../engine/releases/mechanics/target-shooter/1.0.21/target-shooter.js"></script>
  <script src="../../content/english/year-1/module-01/module-01.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    (async function () {
      const params=new URLSearchParams(location.search);
      const isBefore=params.get('visual')==='before';
      window.VX_EVIDENCE={variant:isBefore?'before':'after',events:[],source:'content/english/year-1/module-01/module-01.js'};
      for(const type of ['duduq:step-complete','duduq:module-complete','duduq:step-start']) {
        window.addEventListener(type,event=>window.VX_EVIDENCE.events.push({type,detail:event.detail}));
      }
      try {
        if(!isBefore) await new Promise((resolve,reject)=>{
          const script=document.createElement('script');
          script.src='../../engine/visual-experience-2/target-pilot.js';
          script.onload=resolve;script.onerror=reject;document.head.append(script);
        });
        const source=window.DUDUQ_CONTENT.english.year1.module01;
        const activities=source.activities.filter(activity=>activity.mechanic==='target-shooter');
        const steps=activities.flatMap(activity=>activity.questions.map(question=>({
          id:question.id,mechanic:'target-shooter',
          payload:{title:activity.title,year:source.year,questions:[question]},
          options:{skill:activity.skill}
        })));
        window.VX_EVIDENCE.questions=steps.map(step=>step.payload.questions[0]);
        // All original Target questions, in their source order. Other mechanics
        // are omitted only from this isolated review page, never the module.
        window.DuduQ.start({id:'vx2-target-review',title:source.title,year:source.year,
          subject:source.subject,module:source.module,container:'#root',steps});
      } catch(error) {
        window.VX_EVIDENCE.error=String(error);
        const message=document.createElement('p');message.id='error';
        message.textContent='Não foi possível abrir o piloto: '+String(error);
        document.getElementById('root').append(message);
      }
    })();
  </script>
</body>
</html>
