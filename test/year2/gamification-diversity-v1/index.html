<!doctype html>
<html lang="pt-BR" data-duduq-homologation="year2-gamification-diversity-v1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>DuduQ — Year 2 Gamification Diversity v1</title>
  <style>
    html,body,#root{margin:0;width:100%;height:100%}
    body{overflow:hidden;background:#eef6fb}
    html[data-duduq-homologation] .duduq-intro{opacity:0!important;pointer-events:none!important}
  </style>
</head>
<body>
  <div id="root">Preparando homologação de diversidade do 2º ano...</div>
  <script>
  (function(){
    "use strict";
    const params=new URLSearchParams(location.search);
    const moduleNumber=Math.max(1,Math.min(6,Number(params.get("module")||2)));
    const modulePadded=String(moduleNumber).padStart(2,"0");
    const focusId=String(params.get("focus")||"").trim();
    const engineBase=new URL("../../..",location.href).href.replace(/\/$/,"");
    window.DUDUQ_ENGINE_BASE=engineBase;

    function load(src){
      return new Promise((resolve,reject)=>{
        const script=document.createElement("script");
        script.src=src+(src.includes("?")?"&":"?")+"t="+Date.now();
        script.async=false;
        script.onload=resolve;
        script.onerror=()=>reject(new Error("Falha ao carregar "+src));
        document.head.appendChild(script);
      });
    }

    function installAutoStart(){
      let attempts=0;
      const timer=window.setInterval(()=>{
        attempts+=1;
        const button=document.querySelector(".duduq-intro-start-button");
        if(button&&!button.disabled){window.clearInterval(timer);button.click();return}
        if(attempts>260)window.clearInterval(timer);
      },25);
    }

    function focusModule(module,id){
      if(!id)return module;
      for(const activity of module.activities||[]){
        const question=(activity.questions||[]).find((item)=>item.id===id);
        if(!question)continue;
        return Object.freeze({
          ...module,
          id:`${module.id}-qa-focus-${id.toLowerCase()}`,
          description:`${module.description} — QA focus ${id}.`,
          activities:[{...activity,id:`${activity.id}-qa-focus`,questions:[question]}],
          mechanicDistribution:{[activity.mechanic]:1},
          qaFocus:{id,mechanic:activity.mechanic,sourceModuleId:module.id}
        });
      }
      throw new Error("Questão de foco não encontrada no módulo revisado: "+id);
    }

    const y2Base="../../../content/english/year-2";
    load(y2Base+"/year2-v22-homolog-core.js")
      .then(()=>load(y2Base+"/year2-v22-homolog-editorial-assets.js"))
      .then(()=>load(y2Base+"/year2-v23-multimodal-adapter.js"))
      .then(()=>load(y2Base+`/module-${modulePadded}/module-${modulePadded}-v23-multimodal.js`))
      .then(()=>load(y2Base+"/year2-v24-gamification-diversity-adapter.js"))
      .then(()=>load(y2Base+"/year2-v24-bubble-exact-alternatives-patch.js"))
      .then(()=>{
        const sourceKey=`module${modulePadded}v23multimodal`;
        const outputKey=`module${modulePadded}v24diversified`;
        const source=window.DUDUQ_CONTENT?.english?.year2?.[sourceKey];
        if(!source)throw new Error("Módulo fonte indisponível: "+sourceKey);
        const diversified=window.DuduQYear2GamificationDiversityExact.apply(source);
        window.DUDUQ_CONTENT.english.year2[outputKey]=focusModule(diversified,focusId);
        window.DUDUQ_GAME_CONFIG=Object.freeze({
          engineBase,
          channel:"homolog-year2-gamification-diversity-v1",
          label:`DuduQ — English — Year 2 — Module ${modulePadded} — Gamification Diversity v1`,
          modulePath:["english","year2",outputKey],
          requiredMechanics:["drag-drop","matching","bubble-pop","target-shooter","word-slash"],
          contentScript:"./noop-content.js?v=diversity-v1"
        });
        window.DUDUQ_YEAR2_DIVERSITY_HOMOLOG=Object.freeze({module:moduleNumber,sourceKey,outputKey,focusId,ready:true});
        installAutoStart();
        return load("../../../engine/duduq-player-v1.js");
      })
      .then(()=>load("../../../engine/duduq-loader-v1.js"))
      .catch((error)=>{
        console.error("[DuduQ Year2 Gamification Diversity]",error);
        document.getElementById("root").textContent="Erro ao carregar homologação de diversidade.";
      });
  })();
  </script>
</body>
</html>
