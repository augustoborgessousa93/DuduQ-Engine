<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>DuduQ — Drag & Drop 2.0.24 Single Choice Harness</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#eef6fb;font-family:system-ui,sans-serif}
    body{overflow:hidden}
    #mount{width:100vw;height:100vh;min-height:0;overflow:hidden}
  </style>
</head>
<body>
  <main id="mount" aria-label="Harness Drag & Drop"></main>

  <script>
    window.DUDUQ_ENGINE_BASE = new URL("../../..", window.location.href).href.replace(/\/$/, "");
    window.__DD224_RESULTS__ = [];
    window.__DD224_COMPLETIONS__ = [];
    window.__DD224_ERRORS__ = [];
    window.__DD224_DESTROY__ = null;

    window.addEventListener("error", function (event) {
      window.__DD224_ERRORS__.push(String(event && event.message || event));
    });
    window.addEventListener("unhandledrejection", function (event) {
      window.__DD224_ERRORS__.push(String(event && event.reason && (event.reason.stack || event.reason.message) || event.reason || event));
    });
    window.addEventListener("message", function (event) {
      const data = event.data;
      if (data && data.type === "DUDUQ_DRAG_DROP_RESULT") {
        window.__DD224_RESULTS__.push(data.payload);
      }
    });
  </script>
  <script src="../../../engine/releases/core/1.0.11/duduq-host.js?dd224=harness"></script>
  <script src="../../../engine/releases/mechanics/drag-drop/2.0.24/drag-drop.js?dd224=harness"></script>
  <script>
    window.dd224Mechanic = function () {
      return window.DuduQ && window.DuduQ.getMechanic && window.DuduQ.getMechanic("drag-drop");
    };

    window.dd224Validate = function (payload) {
      const mechanic = window.dd224Mechanic();
      return Boolean(mechanic && mechanic.version === "2.0.24" && mechanic.validate(payload));
    };

    window.dd224Mount = function (payload, context) {
      const mechanic = window.dd224Mechanic();
      if (!mechanic || mechanic.version !== "2.0.24") {
        throw new Error("Drag & Drop 2.0.24 não registrado.");
      }
      if (typeof window.__DD224_DESTROY__ === "function") {
        try { window.__DD224_DESTROY__(); } catch (_) {}
      }
      window.__DD224_RESULTS__ = [];
      window.__DD224_COMPLETIONS__ = [];
      const mount = document.getElementById("mount");
      mount.innerHTML = "";
      window.__DD224_DESTROY__ = mechanic.mount({
        container: mount,
        payload: payload,
        context: Object.assign({
          subject: "english",
          year: 1,
          module: 1,
          stepId: payload && payload.id || "dd224-harness",
          stepTitle: payload && payload.title || "SINGLE CHOICE",
          stepIndex: 0,
          totalSteps: 1
        }, context || {}),
        onComplete: function (result) {
          window.__DD224_COMPLETIONS__.push(result);
        }
      });
      return true;
    };
  </script>
</body>
</html>
