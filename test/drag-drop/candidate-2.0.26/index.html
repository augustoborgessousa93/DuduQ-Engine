<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>DuduQ — Drag & Drop 2.0.26 Candidate</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#eef6fb;font-family:system-ui,sans-serif}
    body{overflow:hidden}
    #mount{width:100vw;height:100vh;min-height:0;overflow:hidden}
  </style>
</head>
<body>
  <main id="mount" aria-label="Drag & Drop 2.0.26 candidate balanced cards"></main>

  <script>
    window.DUDUQ_ENGINE_BASE = new URL("../../..", window.location.href).href.replace(/\/$/, "");
    window.__DD226_RESULTS__ = [];
    window.__DD226_COMPLETIONS__ = [];
    window.addEventListener("message", function (event) {
      var data = event.data;
      if (data && data.type === "DUDUQ_DRAG_DROP_RESULT") window.__DD226_RESULTS__.push(data.payload);
    });
  </script>

  <script src="../../../engine/releases/core/1.0.12/duduq-host.js?dd226=complete-review-r6"></script>
  <script src="../../../engine/releases/mechanics/drag-drop/2.0.26/drag-drop.js?dd226=complete-review-r6"></script>
  <script>
    (function () {
      "use strict";

      var ASSET_BASE = "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Imagens%20Ilustrativa/";
      var payload = {
        id: "dd226-balanced-cards-preview",
        title: "CLASSIFIQUE AS IMAGENS",
        instruction: "Arraste as imagens para os destinos. Depois, confirme.",
        assets: {
          "cat-img": ASSET_BASE + "pet-cat-gato.png",
          "dog-img": ASSET_BASE + "pet-dog-cachorro.png",
          "pencil-img": ASSET_BASE + "school-object-pencil-lapis.png",
          "backpack-img": ASSET_BASE + "school-object-backpack-mochila.png"
        },
        behavior: {
          shuffleItems: false,
          shuffleTargets: false,
          lockCorrectItemsOnRetry: true,
          returnIncorrectItemsOnRetry: true
        },
        payload: {
          mode: "classification",
          strategy: "classification",
          items: [
            { id:"cat", label:"CAT", imageAsset:{assetKey:"cat-img"}, alt:"Cat", targetId:"pets", required:true },
            { id:"dog", label:"DOG", imageAsset:{assetKey:"dog-img"}, alt:"Dog", targetId:"pets", required:true },
            { id:"pencil", label:"PENCIL", imageAsset:{assetKey:"pencil-img"}, alt:"Pencil", targetId:"school", required:true },
            { id:"backpack", label:"BACKPACK", imageAsset:{assetKey:"backpack-img"}, alt:"Backpack", targetId:"school", required:true }
          ],
          targets: [
            { id:"pets", label:"ANIMAIS", capacity:2, kind:"category" },
            { id:"school", label:"OBJETOS ESCOLARES", capacity:2, kind:"category" }
          ]
        },
        feedback: {
          correct: "Muito bem! Tudo certo.",
          incorrect: "Revise os itens e tente novamente."
        }
      };

      function mountCandidate() {
        var mechanic = window.DuduQ && window.DuduQ.getMechanic && window.DuduQ.getMechanic("drag-drop");
        if (!mechanic || mechanic.version !== "2.0.26") {
          throw new Error("Drag & Drop 2.0.26 candidate não registrada.");
        }
        window.__DD226_MECHANIC_VERSION__ = mechanic.version;
        mechanic.mount({
          container: document.getElementById("mount"),
          payload: payload,
          context: {
            subject:"english",
            year:2,
            module:1,
            stepId:"dd226-balanced-cards-preview",
            stepTitle:"Balanced Cards",
            stepIndex:0,
            totalSteps:1
          },
          onComplete:function (result) { window.__DD226_COMPLETIONS__.push(result); }
        });
      }

      mountCandidate();
    })();
  </script>
</body>
</html>
