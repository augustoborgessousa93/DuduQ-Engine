<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>DuduQ — Drag & Drop 2.0.25 Visual R1</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#eef6fb;font-family:system-ui,sans-serif}
    body{overflow:hidden}
    #mount{width:100vw;height:100vh;min-height:0;overflow:hidden}
  </style>
</head>
<body>
  <main id="mount" aria-label="Exemplo isolado Drag & Drop 2.0.25 Visual R1"></main>

  <script>
    window.DUDUQ_ENGINE_BASE = new URL("../../..", window.location.href).href.replace(/\/$/, "");
    window.__DD225VR_RESULTS__ = [];
    window.__DD225VR_COMPLETIONS__ = [];
    window.__DD225VR_ERRORS__ = [];
    window.__DD225VR_DESTROY__ = null;

    window.addEventListener("error", function (event) {
      window.__DD225VR_ERRORS__.push(String(event && event.message || event));
    });
    window.addEventListener("unhandledrejection", function (event) {
      window.__DD225VR_ERRORS__.push(String(event && event.reason && (event.reason.stack || event.reason.message) || event.reason || event));
    });
    window.addEventListener("message", function (event) {
      const data = event.data;
      if (data && data.type === "DUDUQ_DRAG_DROP_RESULT") {
        window.__DD225VR_RESULTS__.push(data.payload);
      }
    });
  </script>

  <script src="../../../engine/releases/core/1.0.12/duduq-host.js?dd225vr=r1"></script>
  <script src="../../../engine/releases/mechanics/drag-drop/2.0.25/drag-drop.js?dd225vr=r1"></script>
  <script src="./visual-refinement.js?v=1"></script>
  <script>
    (function () {
      "use strict";

      const ASSET_BASE = "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Imagens%20Ilustrativa/";
      const ASSETS = {
        "cat-img": ASSET_BASE + "pet-cat-gato.png",
        "dog-img": ASSET_BASE + "pet-dog-cachorro.png",
        "pencil-img": ASSET_BASE + "school-object-pencil-lapis.png",
        "backpack-img": ASSET_BASE + "school-object-backpack-mochila.png"
      };

      function payload(id) {
        return {
          id: id || "dd225-visual-r1",
          title: "CLASSIFIQUE AS IMAGENS",
          instruction: "Arraste as imagens para os destinos. Depois, confirme.",
          assets: ASSETS,
          behavior: {
            shuffleItems: false,
            shuffleTargets: false,
            lockCorrectItemsOnRetry: true,
            returnIncorrectItemsOnRetry: true
          },
          payload: {
            mode: "classification",
            strategy: "classification",
            items: [
              {
                id: "cat",
                label: "CAT",
                imageAsset: { assetKey: "cat-img" },
                alt: "Cat",
                targetId: "pets",
                required: true
              },
              {
                id: "dog",
                label: "DOG",
                imageAsset: { assetKey: "dog-img" },
                alt: "Dog",
                targetId: "pets",
                required: true
              },
              {
                id: "pencil",
                label: "PENCIL",
                imageAsset: { assetKey: "pencil-img" },
                alt: "Pencil",
                targetId: "school",
                required: true
              },
              {
                id: "backpack",
                label: "BACKPACK",
                imageAsset: { assetKey: "backpack-img" },
                alt: "Backpack",
                targetId: "school",
                required: true
              }
            ],
            targets: [
              { id: "pets", label: "ANIMAIS", capacity: 2, kind: "category" },
              { id: "school", label: "OBJETOS ESCOLARES", capacity: 2, kind: "category" }
            ]
          },
          feedback: {
            correct: "Muito bem! Tudo certo.",
            incorrect: "Revise apenas os itens incorretos e tente novamente."
          }
        };
      }

      function containSuccessDecoration(mount) {
        const STYLE_ID = "dd225-vr-success-decoration-containment";
        const CSS = `
          @media (max-width:520px) {
            .duduq-engine-complete {
              overflow: clip !important;
              contain: paint !important;
              isolation: isolate !important;
            }
          }

          /*
             Short desktop/tablet landscape: compact both destinations and the
             remaining option bank so every card stays inside the activity
             surface. This is preview-only and does not alter DD 2.0.25.
          */
          @media (max-height:720px) and (min-width:700px) {
            .duduq-dd2-root[data-dd225-visual-r1="true"] .duduq-dd2-arena {
              gap: 5px !important;
              padding-bottom: 6px !important;
            }
            .duduq-dd2-root[data-dd225-visual-r1="true"] .duduq-dd2-targets {
              align-items: start !important;
            }
            .duduq-dd2-root[data-dd225-visual-r1="true"] .duduq-dd2-target {
              min-height: 0 !important;
              height: 156px !important;
              max-height: 156px !important;
              padding: 18px 7px 6px !important;
            }
            .duduq-dd2-root[data-dd225-visual-r1="true"] .duduq-dd2-target-head {
              min-height: 34px !important;
              padding: 2px 5px !important;
            }
            .duduq-dd2-root[data-dd225-visual-r1="true"] .duduq-dd2-zone {
              min-height: 94px !important;
              height: 94px !important;
              max-height: 94px !important;
              padding: 4px !important;
              gap: 5px !important;
            }
            .duduq-dd2-root[data-dd225-visual-r1="true"] .duduq-dd2-zone .duduq-dd2-item-shell {
              min-height: 86px !important;
              height: 86px !important;
              max-height: 86px !important;
              display: flex !important;
              align-items: stretch !important;
              overflow: visible !important;
            }
            .duduq-dd2-root[data-dd225-visual-r1="true"] .duduq-dd2-zone .duduq-dd2-item[data-has-media="true"][data-placed="true"] {
              min-height: 86px !important;
              height: 86px !important;
              max-height: 86px !important;
              padding: 4px 6px 5px !important;
              gap: 1px !important;
              overflow: visible !important;
              box-sizing: border-box !important;
            }
            .duduq-dd2-root[data-dd225-visual-r1="true"] .duduq-dd2-zone .duduq-dd2-item[data-has-media="true"][data-placed="true"] .duduq-dd2-item-media {
              height: 56px !important;
              max-height: 56px !important;
              object-fit: contain !important;
              flex: 0 0 56px !important;
            }
            .duduq-dd2-root[data-dd225-visual-r1="true"] .duduq-dd2-zone .duduq-dd2-item[data-has-media="true"][data-placed="true"] > span:not(.duduq-dd2-audio-mark) {
              display: block !important;
              min-height: 17px !important;
              height: 17px !important;
              margin: 0 !important;
              padding: 0 2px !important;
              line-height: 17px !important;
              white-space: nowrap !important;
              overflow: visible !important;
              box-sizing: border-box !important;
              flex: 0 0 17px !important;
            }
            .duduq-dd2-root[data-dd225-visual-r1="true"] .duduq-dd2-bank[data-empty="false"] {
              min-height: 92px !important;
              height: 92px !important;
              max-height: 92px !important;
              padding: 4px 8px 6px !important;
              margin: 0 !important;
            }
            .duduq-dd2-root[data-dd225-visual-r1="true"] .duduq-dd2-bank[data-empty="false"] .duduq-dd2-bank-items {
              align-items: center !important;
              gap: 10px !important;
            }
            .duduq-dd2-root[data-dd225-visual-r1="true"] .duduq-dd2-bank[data-empty="false"] .duduq-dd2-item[data-has-media="true"] {
              min-height: 80px !important;
              height: 80px !important;
              max-height: 80px !important;
              padding: 4px 7px !important;
              gap: 2px !important;
            }
            .duduq-dd2-root[data-dd225-visual-r1="true"] .duduq-dd2-bank[data-empty="false"] .duduq-dd2-item[data-has-media="true"] .duduq-dd2-item-media {
              height: 54px !important;
              max-height: 54px !important;
              object-fit: contain !important;
            }
          }
        `;

        function inject() {
          const frame = mount.querySelector("iframe");
          let doc;
          try { doc = frame && frame.contentDocument; } catch (_) { return; }
          if (!doc || !doc.head || doc.getElementById(STYLE_ID)) return;
          const style = doc.createElement("style");
          style.id = STYLE_ID;
          style.textContent = CSS;
          doc.head.appendChild(style);
        }

        inject();
        const observer = new MutationObserver(inject);
        observer.observe(mount, { childList: true, subtree: true });
        window.setTimeout(inject, 0);
        window.setTimeout(inject, 80);
        window.setTimeout(inject, 240);
      }

      window.dd225vrMechanic = function () {
        return window.DuduQ && window.DuduQ.getMechanic && window.DuduQ.getMechanic("drag-drop");
      };

      window.dd225vrPayload = payload;

      window.dd225vrMount = function (customPayload) {
        const mechanic = window.dd225vrMechanic();
        if (!mechanic || mechanic.version !== "2.0.25") {
          throw new Error("Drag & Drop 2.0.25 não registrada.");
        }
        if (typeof window.__DD225VR_DESTROY__ === "function") {
          try { window.__DD225VR_DESTROY__(); } catch (_) {}
        }
        window.__DD225VR_RESULTS__ = [];
        window.__DD225VR_COMPLETIONS__ = [];
        const mount = document.getElementById("mount");
        mount.innerHTML = "";
        window.__DD225VR_DESTROY__ = mechanic.mount({
          container: mount,
          payload: customPayload || payload(),
          context: {
            subject: "english",
            year: 2,
            module: 1,
            stepId: "dd225-visual-r1",
            stepTitle: "Visual R1",
            stepIndex: 0,
            totalSteps: 1
          },
          onComplete: function (result) {
            window.__DD225VR_COMPLETIONS__.push(result);
          }
        });
        window.DD225VisualRefinementR1 && window.DD225VisualRefinementR1.watchMount(mount);
        containSuccessDecoration(mount);
        return true;
      };

      window.dd225vrMount();
    })();
  </script>
</body>
</html>
