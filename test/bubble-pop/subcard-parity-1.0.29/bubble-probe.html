<style>html,body,#mount{margin:0;width:100%;height:100%;overflow:hidden}body{background:#eef6fb}#probe-status{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;padding:28px;box-sizing:border-box;background:linear-gradient(145deg,#f7fbff,#e6f3fb);color:#17375e;font:900 18px/1.4 Nunito,system-ui,sans-serif;text-align:center}#probe-status[data-state="ready"]{display:none}#probe-status[data-state="error"]{color:#a61b12;background:#fff1f0}</style>

<body>
<div id="probe-status" data-state="loading">CARREGANDO BUBBLE POP 1.0.29…</div>
<div id="mount"></div>
<script>
(function(){
  "use strict";
  const q={id:"BP-PARITY-29",subject:"Língua Inglesa",year:1,module:0,difficulty:"easy",statement:"WORDS",instruction:"Estoure a bolha com a palavra APPLE.",contentLanguage:"en",instructionLanguage:"pt-BR",feedbackLanguage:"pt-BR",audio:{enabled:true,text:"Apple.",language:"en-US"},alternatives:[{id:"apple",text:"APPLE",metadata:{tone:"green",speechText:"apple"}},{id:"house",text:"HOUSE",metadata:{tone:"blue",speechText:"house"}},{id:"dog",text:"DOG",metadata:{tone:"orange",speechText:"dog"}}],answer:{type:"single",value:"apple"},feedback:{correct:"Muito bem!",incorrect:"Tente novamente.",language:"pt-BR"},delivery:{mechanic:"bubble-pop",preferred:["bubble-pop"],allowImage:false,allowAudio:true},metadata:{screenTitle:"WORDS"}};
  const root=document.documentElement,mount=document.getElementById("mount"),status=document.getElementById("probe-status");
  function phase(message,state){const value=state||"loading";root.dataset.probeState=value;root.dataset.probeMessage=String(message||"");status.dataset.state=value;status.textContent=message||""}
  try{
    const mechanic=window.DuduQ?.getMechanic?.("bubble-pop");
    if(!mechanic)throw new Error("Adapter Bubble Pop 1.0.29 não registrado");
    mechanic.mount({container:mount,payload:{title:"BUBBLE POP",questions:[q]},context:{year:1,subject:"Língua Inglesa",module:0,stepIndex:0,totalSteps:1},onComplete:function(){}});
    const started=Date.now();
    const timer=setInterval(function(){
      const frame=mount.querySelector(".duduq-mechanic-frame iframe");
      if(frame){try{window.DuduQWorldFusion?.refresh?.()}catch(_){}}
      let doc=null;try{doc=frame?.contentDocument||null}catch(_){}
      const game=doc?.querySelector(".duduq-bp-root"),card=doc?.querySelector(".duduq-bp-instruction"),fusion=doc?.documentElement?.classList.contains("duduq-world-fusion"),profile=doc?.documentElement?.getAttribute("data-duduq-literacy-early"),parity=doc?.getElementById("duduq-bubble-pop-shell-parity-1-0-29");
      if(game&&card&&fusion&&profile!==null&&parity){clearInterval(timer);phase("","ready");return}
      phase(game?"BUBBLE POP MONTADO; APLICANDO PARIDADE DO SUBCARD…":"INICIALIZANDO BUBBLE POP…","loading");
      if(Date.now()-started>60000){clearInterval(timer);phase("TIMEOUT: BUBBLE POP NÃO MONTOU.","error")}
    },250);
  }catch(error){root.dataset.probeError=String(error?.message||error);phase("ERRO: "+String(error?.message||error),"error")}
})();
</script>
