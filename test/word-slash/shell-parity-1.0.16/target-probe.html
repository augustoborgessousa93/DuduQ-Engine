<style>html,body,#mount{margin:0;width:100%;height:100%;overflow:hidden}body{background:#eef6fb}#probe-status{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;padding:28px;box-sizing:border-box;background:linear-gradient(145deg,#f7fbff,#e6f3fb);color:#17375e;font:900 18px/1.4 Nunito,system-ui,sans-serif;text-align:center}#probe-status[data-state="ready"]{display:none}#probe-status[data-state="error"]{color:#a61b12;background:#fff1f0}</style>

<script>window.DUDUQ_ENGINE_BASE=new URL("../../../..",location.href).href.replace(/\/$/,"");</script>

<script src="../../../engine/releases/mechanics/target-shooter/1.0.21/target-shooter.js?probe=1211"></script>
</head>
<body>
<div id="probe-status" data-state="loading">CARREGANDO TARGET SHOOTER 1.0.21…</div>
<div id="mount"></div>
<script>
(function(){
  "use strict";
  const q={id:"PARITY-TS-1",year:1,statement:"NUMBERS",instruction:"Ouça e toque na imagem correta.",audio:{enabled:true,text:"one",language:"en-US"},feedback:{correct:"Muito bem!",incorrect:"Tente novamente."},metadata:{screenTitle:"NUMBERS",targetShooter:{audioText:"one",mode:"audio-to-image",shape:"cloud",correctIds:["n1"],difficulty:{speed:.48,objectCount:3,spawnIntervalMs:170,requiredCorrect:1,targetSize:150,timeLimitMs:0,timerMode:"none"},items:[{id:"n1",label:"ONE",display:"text",accent:"#FFD166"},{id:"n2",label:"TWO",display:"text",accent:"#4EB4FF"},{id:"n3",label:"THREE",display:"text",accent:"#7FD8C9"}]}}};
  const root=document.documentElement,mount=document.getElementById("mount"),status=document.getElementById("probe-status");
  function phase(message,state){const value=state||"loading";root.dataset.probeState=value;root.dataset.probeMessage=String(message||"");status.dataset.state=value;status.textContent=message||""}
  try{
    const mechanic=window.DuduQ?.getMechanic?.("target-shooter");
    if(!mechanic)throw new Error("Adapter Target Shooter 1.0.21 não registrado");
    phase("BUSCANDO RUNTIME TARGET SHOOTER 1.0.21…","loading");
    mechanic.mount({container:mount,payload:{title:"NUMBERS",questions:[q]},context:{year:1,subject:"Língua Inglesa",module:2,stepIndex:0,totalSteps:1},onComplete:function(){}});
    root.dataset.probe="mounted";
    const started=Date.now();
    const timer=setInterval(function(){
      const frame=mount.querySelector(".duduq-mechanic-frame iframe");
      let doc=null;try{doc=frame?.contentDocument||null}catch(_){}
      if(mount.textContent.includes("Erro ao preparar a atividade")){
        clearInterval(timer);phase("FALHA AO CARREGAR O RUNTIME TARGET SHOOTER 1.0.21.","error");return;
      }
      const game=doc?.querySelector(".duduq-ts-root");
      const fusion=doc?.documentElement?.classList.contains("duduq-world-fusion");
      const profile=doc?.documentElement?.getAttribute("data-duduq-literacy-early");
      root.dataset.probeFusion=fusion&&profile!==null?"ready":"pending";
      if(game&&fusion&&profile!==null){clearInterval(timer);phase("","ready");return}
      if(game){phase("TARGET MONTADO; APLICANDO WORLD FUSION…","loading")}
      else if(frame?.srcdoc){phase("INICIALIZANDO A INTERFACE TARGET SHOOTER…","loading")}
      if(Date.now()-started>45000){clearInterval(timer);phase("TIMEOUT: O TARGET SHOOTER NÃO CONCLUIU A MONTAGEM.","error")}
    },250);
  }catch(error){root.dataset.probe="error";root.dataset.probeError=String(error?.message||error);phase("ERRO: "+String(error?.message||error),"error");console.error(error)}
})();
</script>
</body>
</html>
