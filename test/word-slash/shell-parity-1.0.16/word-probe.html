<body>
<div id="probe-status" data-state="loading">CARREGANDO WORD SLASH 1.0.16…</div>
<div id="mount"></div>
<script>
(function(){
  "use strict";
  const q={id:"PARITY-WS-16",year:1,statement:"WORD",instruction:"Corte somente a palavra APPLE.",audio:{enabled:true,text:"Slice the word apple.",language:"en-US"},feedback:{correct:"Muito bem!",incorrect:"Tente novamente."},metadata:{screenTitle:"WORDS",wordSlash:{mode:"correct-word",target:{label:"APPLE",value:"apple",spokenText:"apple"},goal:3,difficulty:{maxObjects:4,timeLimitSeconds:38,correctProbability:.5},objects:[{id:"apple-word",type:"word",label:"APPLE",value:"apple",category:"fruit",weight:3},{id:"table-word",type:"word",label:"TABLE",value:"table",category:"object"},{id:"house-word",type:"word",label:"HOUSE",value:"house",category:"place"},{id:"dog-word",type:"word",label:"DOG",value:"dog",category:"animal"}]}}};
  const root=document.documentElement;
  const mount=document.getElementById("mount");
  const status=document.getElementById("probe-status");
  function phase(message,state){
    const value=state||"loading";
    root.dataset.probeState=value;
    root.dataset.probeMessage=String(message||"");
    status.dataset.state=value;
    status.textContent=message||"";
  }
  try{
    const mechanic=window.DuduQ?.getMechanic?.("word-slash");
    if(!mechanic)throw new Error("Adapter Word Slash 1.0.16 não registrado");
    phase("BUSCANDO RUNTIME WORD SLASH 1.0.16…","loading");
    mechanic.mount({container:mount,payload:{title:"WORD SLASH",questions:[q]},context:{year:1,subject:"Língua Inglesa",module:0,stepIndex:0,totalSteps:1},onComplete:function(){}});
    root.dataset.probe="mounted";
    const started=Date.now();
    const timer=setInterval(function(){
      const frame=mount.querySelector(".duduq-mechanic-frame iframe");
      let doc=null;
      try{doc=frame?.contentDocument||null}catch(_){}
      if(mount.textContent.includes("Erro ao preparar a atividade")){
        clearInterval(timer);
        phase("FALHA AO CARREGAR O RUNTIME WORD SLASH 1.0.16.","error");
        return;
      }
      const game=doc?.querySelector(".duduq-ws-root");
      const fusion=doc?.documentElement?.classList.contains("duduq-world-fusion");
      const profile=doc?.documentElement?.getAttribute("data-duduq-literacy-early");
      if(game&&fusion&&profile!==null){
        clearInterval(timer);
        phase("","ready");
        return;
      }
      if(game){
        phase("RUNTIME MONTADO; APLICANDO WORLD FUSION…","loading");
      }else if(frame?.srcdoc){
        phase("INICIALIZANDO A INTERFACE WORD SLASH…","loading");
      }
      if(Date.now()-started>45000){
        clearInterval(timer);
        phase("TIMEOUT: O RUNTIME NÃO CONCLUIU A MONTAGEM.","error");
      }
    },250);
  }catch(error){
    root.dataset.probe="error";
    root.dataset.probeError=String(error?.message||error);
    phase("ERRO: "+String(error?.message||error),"error");
    console.error(error);
  }
})();
</script>
</body>
