<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>DuduQ Engine — Teste Drag & Drop Universal</title>

  <link
    rel="stylesheet"
    href="./core/duduq-theme.css?v=110"
  >
</head>

<body>

  <div id="root">
    Carregando DuduQ Engine...
  </div>

  <!-- =====================================================
       DUDUQ CORE
       ===================================================== -->

  <script src="./core/duduq-assets.js?v=100"></script>

  <script src="./core/duduq-sound.js?v=100"></script>

  <script src="./core/duduq-schema.js?v=100"></script>

  <script src="./core/duduq-host.js?v=110"></script>

  <!-- =====================================================
       MECÂNICA
       ===================================================== -->

  <script src="./mechanics/drag-drop.js?v=100"></script>

  <!-- =====================================================
       TESTE — SCHEMA UNIVERSAL
       ===================================================== -->

  <script>

    window.addEventListener(
      "DOMContentLoaded",
      function () {

        const root =
          document.getElementById(
            "root"
          );

        /* ===============================================
           VERIFICAÇÃO DO SCHEMA
           =============================================== */

        if (!window.DuduQSchema) {

          root.innerHTML =
            "Erro: DuduQ Schema não foi carregado.";

          return;
        }

        /* ===============================================
           VERIFICAÇÃO DO HOST
           =============================================== */

        if (!window.DuduQ) {

          root.innerHTML =
            "Erro: DuduQ Engine não foi carregado.";

          return;
        }

        /* ===============================================
           VERIFICAÇÃO DA MECÂNICA
           =============================================== */

        if (
          !window.DuduQ.hasMechanic(
            "drag-drop"
          )
        ) {

          root.innerHTML =
            "Erro: Drag & Drop não foi registrado.";

          return;
        }

        /* ===============================================
           MÓDULO DE TESTE
           =============================================== */

        window.DuduQ.start({

          id:
            "teste-drag-drop-schema-1ano",

          year:
            1,

          subject:
            "Língua Inglesa",

          module:
            1,

          container:
            "#root",

          steps: [

            {

              id:
                "classificacao-animais-frutas",

              mechanic:
                "drag-drop",

              payload: {

                id:
                  "drag-drop-categories-test",

                title:
                  "Animals and Fruits",

                description:
                  "Teste do Drag & Drop usando o Schema universal DuduQ.",

                subject:
                  "Língua Inglesa",

                year:
                  1,

                module:
                  1,

                contentLanguage:
                  "en",

                instructionLanguage:
                  "pt-BR",

                feedbackLanguage:
                  "pt-BR",

                questions: [

                  {

                    id:
                      "animals-fruits-01",

                    skill: {

                      code:
                        "VOCAB-CATEGORIES-01",

                      description:
                        "Classificar vocabulário básico em língua inglesa por categoria semântica."
                    },

                    difficulty:
                      "easy",

                    statement:
                      "Animals and Fruits",

                    instruction:
                      "Arraste cada palavra para a categoria correta.",

                    contentLanguage:
                      "en",

                    instructionLanguage:
                      "pt-BR",

                    feedbackLanguage:
                      "pt-BR",

                    audio: {

                      enabled:
                        true,

                      text:
                        "Arraste cada palavra para a categoria correta.",

                      language:
                        "pt-BR",

                      role:
                        "instruction"
                    },

                    alternatives: [

                      {

                        id:
                          "dog",

                        text:
                          "DOG"

                      },

                      {

                        id:
                          "apple",

                        text:
                          "APPLE"

                      },

                      {

                        id:
                          "cat",

                        text:
                          "CAT"

                      },

                      {

                        id:
                          "banana",

                        text:
                          "BANANA"

                      }

                    ],

                    answer: {

                      type:
                        "pairs",

                      value: [

                        {
                          source:
                            "dog",

                          target:
                            "animals"
                        },

                        {
                          source:
                            "cat",

                          target:
                            "animals"
                        },

                        {
                          source:
                            "apple",

                          target:
                            "fruits"
                        },

                        {
                          source:
                            "banana",

                          target:
                            "fruits"
                        }

                      ]

                    },

                    feedback: {

                      correct:
                        "Excelente! Todos os itens estão na categoria correta.",

                      incorrect:
                        "Observe as categorias e tente novamente.",

                      language:
                        "pt-BR"

                    },

                    delivery: {

                      mechanic:
                        "auto",

                      preferred: [
                        "drag-drop"
                      ],

                      allowImage:
                        true,

                      allowAudio:
                        true

                    },

                    metadata: {

                      title:
                        "Animals and Fruits",

                      layout:
                        "categories",

                      shuffleItems:
                        true,

                      shuffleTargets:
                        false,

                      estimatedSeconds:
                        45,

                      targets: [

                        {

                          id:
                            "animals",

                          label:
                            "ANIMALS"

                        },

                        {

                          id:
                            "fruits",

                          label:
                            "FRUITS"

                        }

                      ]

                    }

                  }

                ]

              }

            }

          ]

        });

      }
    );

  </script>

</body>

</html>
