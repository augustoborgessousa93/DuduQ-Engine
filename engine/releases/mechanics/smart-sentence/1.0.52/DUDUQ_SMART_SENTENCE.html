    background: var(--dq-surface);
    color: var(--dq-heading);
    box-shadow: 0 3px 0 var(--dq-depth);
  }

  .duduq-progress-trail {
    width: 100%;
    max-width: 580px;
    min-height: 52px;
    grid-template-columns: minmax(0,1fr) auto;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    border: 0;
    border-radius: 18px;
    background: transparent;
    box-shadow: none;
  }

  .duduq-progress-trail::before { display: none; }

  .duduq-progress-copy {
    grid-column: 2;
    display: block;
    min-width: max-content;
    padding: 0;
  }

  .duduq-progress-copy span { display: none; }

  .duduq-progress-copy strong {
    display: block;
    color: var(--dq-heading);
    font-family: Nunito, sans-serif;
    font-size: 13px;
    font-weight: 900;
    line-height: 1;
  }

  .duduq-progress-track,
  .duduq-progress-trail .duduq-progress-track {
    box-sizing: border-box;
    grid-column: 1;
    height: 16px;
    min-height: 16px;
    max-height: 16px;
    margin: 0 18px;
    border: 2px solid var(--dq-border-strong);
    border-radius: 999px;
    background: var(--dq-soft-surface);
    box-shadow:
      inset 0 2px 4px rgba(31,65,99,.13),
      0 2px 0 rgba(184,197,214,.8);
  }

  .duduq-progress-fill {
    border-radius: 999px;
    background: linear-gradient(180deg, #1471CF 0%, var(--dq-primary) 72%, #004892 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.26);
  }

  .duduq-progress-fill::after { animation-duration: 4.6s; opacity: .34; }

  .duduq-progress-trail[data-density="normal"] .duduq-progress-marker,
  .duduq-progress-trail[data-density="dense"] .duduq-progress-marker,
  .duduq-progress-marker {
    width: 22px;
    height: 22px;
    border: 2px solid var(--dq-border-strong);
    background: var(--dq-surface);
    color: var(--dq-muted);
    font-size: .7rem;
    box-shadow:
      0 3px 0 var(--dq-depth),
      0 7px 14px rgba(31,65,99,.08),
      inset 0 1px 0 #fff;
  }

  .duduq-progress-marker[data-status="current"] {
    border-color: var(--dq-primary);
    background: var(--dq-primary);
    color: #fff;
    box-shadow:
      0 4px 0 var(--dq-primary-depth),
      0 0 0 4px rgba(0,86,179,.11),
      0 9px 16px rgba(0,86,179,.14);
  }

  .duduq-progress-marker[data-status="complete"] {
    border-color: #D49A16;
    background: #FFD43B;
    color: #744E00;
    box-shadow: 0 4px 0 #C88B08, 0 8px 15px rgba(210,145,0,.14);
  }

  .duduq-mascot[data-size="idle"] { width: 64px; height: 64px; }
  .duduq-mascot[data-size="feedback"] { width: 84px; height: 84px; }
  .duduq-mascot[data-size="transition"] { width: 96px; height: 96px; }
  .duduq-mascot[data-size="complete"] { width: 154px; height: 154px; }

  .duduq-engine-header-mascot-slot {
    width: 72px;
    min-width: 72px;
    height: 64px;
    overflow: visible;
  }

  .duduq-engine-header-mascot-slot .duduq-mascot[data-size="idle"] {
    width: 64px;
    height: 64px;
  }

  .duduq-engine-stage { overflow: visible; }

  /* Enunciado canônico */
  .duduq-engine-stage .duduq-matching-instruction {
    width: min(760px, 100%);
    min-height: 60px;
    margin: clamp(14px,2.2vh,24px) auto clamp(24px,3.2vh,32px);
    grid-template-columns: 48px minmax(0,1fr) 48px;
    gap: 12px;
    padding: 8px 14px 10px;
    border: 2px solid var(--dq-border-strong);
    border-radius: 999px;
    background: rgba(255,255,255,.96);
    box-shadow:
      0 4px 0 var(--dq-depth),
      0 12px 24px rgba(31,65,99,.07),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-matching-instruction h2 {
    color: var(--dq-primary);
    font-family: Fredoka, Nunito, sans-serif;
    font-size: clamp(18px,2vw,28px);
    font-weight: 800;
    line-height: 1.16;
  }

  .duduq-engine-stage .duduq-matching-instruction-spacer,
  .duduq-engine-stage .duduq-matching-audio-shell,
  .duduq-engine-stage .duduq-matching-audio {
    width: 48px;
    height: 48px;
  }

  .duduq-engine-stage .duduq-matching-audio {
    border: 2px solid var(--dq-primary-depth);
    background: linear-gradient(180deg,#1471CF 0%,var(--dq-primary) 72%,#004892 100%);
    color: #fff;
    box-shadow:
      0 5px 0 var(--dq-primary-depth),
      0 10px 18px rgba(0,86,179,.18),
      inset 0 2px 0 rgba(255,255,255,.36);
  }

  .duduq-engine-stage .duduq-matching-audio[data-playing="true"] {
    border-color: #359500;
    background: linear-gradient(180deg,#70E90E 0%,#58CC02 62%,#49B900 100%);
    color: var(--dq-success-text);
    box-shadow:
      0 5px 0 #2F8A00,
      0 10px 18px rgba(57,156,0,.20),
      inset 0 2px 0 rgba(255,255,255,.36);
  }

  .duduq-matching-audio svg,
  .duduq-matching-item-audio svg { width: 22px; height: 22px; }

  /* Composição do Matching */
  .duduq-matching-root {
    color: var(--dq-text);
    font-family: Nunito, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .duduq-matching-surface {
    width: min(1000px,100%);
    gap: 0;
    padding: 0 clamp(4px,.8vw,12px);
  }

  .duduq-matching-board {
    width: min(980px,100%);
    grid-template-columns: minmax(0,1fr) clamp(72px,8vw,92px) minmax(0,1fr);
    align-items: stretch;
    gap: clamp(14px,1.8vw,22px);
    margin: 0 auto;
    padding: clamp(18px,2.25vw,26px);
    border: 2px solid var(--dq-border);
    border-radius: 24px;
    background:
      radial-gradient(circle at 15% 10%, rgba(239,248,255,.86), transparent 34%),
      radial-gradient(circle at 85% 88%, rgba(241,252,239,.68), transparent 32%),
      rgba(255,255,255,.94);
    box-shadow:
      0 4px 0 var(--dq-depth),
      0 14px 28px rgba(31,65,99,.075),
      inset 0 1px 0 #fff;
  }

  .duduq-matching-column {
    width: 100%;
    gap: clamp(14px,1.8vh,18px);
  }

  .duduq-matching-board[data-density="comfortable"] .duduq-matching-column {
    gap: clamp(16px,2.2vh,22px);
  }

  .duduq-matching-board[data-density="balanced"] .duduq-matching-column {
    gap: clamp(13px,1.7vh,17px);
  }

  .duduq-matching-board[data-density="compact"] .duduq-matching-column {
    gap: clamp(9px,1.25vh,12px);
  }

  .duduq-matching-column-title {
    min-height: 26px;
    color: var(--dq-muted);
    font: 900 13px/1 Nunito,sans-serif;
    letter-spacing: .055em;
  }

  .duduq-matching-card-shell {
    width: 100%;
    max-width: none;
  }

  .duduq-matching-card {
    width: 100%;
    min-height: 88px;
    grid-template-columns: 44px minmax(0,1fr) 44px;
    gap: 8px;
    padding: clamp(10px,1.2vw,14px);
    border: 2px solid var(--dq-border-strong);
    border-radius: 20px;
    background: linear-gradient(180deg,#FFFFFF 0%,#FAFCFE 100%);
    color: var(--dq-text);
    box-shadow:
      0 4px 0 var(--dq-depth),
      0 10px 18px rgba(31,65,99,.075),
      inset 0 1px 0 #fff;
    transition:
      transform 120ms ease,
      border-color 160ms ease,
      background-color 160ms ease,
      box-shadow 140ms ease,
      filter 140ms ease;
  }

  .duduq-matching-card:hover:not(:disabled) {
    border-color: #91ABC3;
    transform: translateY(-2px);
    filter: brightness(1.015);
    box-shadow:
      0 5px 0 var(--dq-depth),
      0 13px 22px rgba(31,65,99,.10),
      inset 0 1px 0 #fff;
  }

  .duduq-matching-card:active:not(:disabled) {
    transform: translateY(3px) scale(.992);
    box-shadow: 0 1px 0 var(--dq-depth), 0 4px 8px rgba(31,65,99,.06);
  }

  .duduq-matching-card[data-selected="true"] {
    border-color: var(--dq-selected-border);
    background: var(--dq-selected-bg);
    box-shadow:
      0 4px 0 var(--dq-primary-depth),
      0 0 0 4px rgba(0,86,179,.14),
      0 11px 20px rgba(0,86,179,.10);
  }

  .duduq-matching-card[data-paired="true"] {
    border-color: #8DAFCB;
    background: #FBFDFF;
  }

  .duduq-matching-card[data-feedback="correct"] {
    border-color: var(--dq-success-border);
    background: var(--dq-success-bg);
    color: var(--dq-success-text);
    box-shadow:
      0 4px 0 var(--dq-success-depth),
      0 10px 18px rgba(70,163,2,.10),
      inset 0 1px 0 #fff;
  }

  .duduq-matching-card[data-feedback="retry"] {
    border-color: var(--dq-retry-border);
    background: var(--dq-retry-bg);
    color: var(--dq-retry-text);
    box-shadow:
      0 4px 0 var(--dq-retry-depth),
      0 10px 18px rgba(183,28,28,.08),
      inset 0 1px 0 #fff;
  }

  .duduq-matching-card-content {
    font-family: Nunito, ui-rounded, system-ui, sans-serif;
    font-size: clamp(16px,1.8vw,21px);
    font-weight: 900;
    line-height: 1.12;
  }

  .duduq-matching-media {
    width: clamp(72px,7.8vw,96px);
    height: clamp(72px,7.8vw,96px);
    filter: drop-shadow(0 4px 7px rgba(31,65,99,.08));
  }

  .duduq-matching-color {
    width: clamp(68px,7.2vw,90px);
    height: clamp(68px,7.2vw,90px);
    border-radius: 18px;
  }

  .duduq-matching-port {
    width: 22px;
    height: 22px;
    border: 3px solid #9FB3C6;
    background: var(--dq-soft-surface);
  }

  .duduq-matching-card[data-selected="true"] .duduq-matching-port,
  .duduq-matching-card[data-paired="true"] .duduq-matching-port {
    border-color: var(--dq-primary);
  }

  .duduq-matching-card[data-feedback="correct"] .duduq-matching-port {
    border-color: var(--dq-success-border);
  }

  .duduq-matching-card[data-feedback="retry"] .duduq-matching-port {
    border-color: var(--dq-retry-border);
  }

  .duduq-matching-line {
    stroke: var(--dq-primary);
    stroke-width: 5;
    opacity: .86;
    filter: drop-shadow(0 2px 0 rgba(0,58,122,.18));
  }

  .duduq-matching-line[data-feedback="correct"] { stroke: var(--dq-success-border); }
  .duduq-matching-line[data-feedback="retry"] { stroke: var(--dq-retry-border); }

  .duduq-matching-center-guide::before {
    background: linear-gradient(180deg,transparent,rgba(175,192,211,.44),transparent);
  }

  .duduq-matching-item-audio {
    width: 36px;
    height: 36px;
    border: 2px solid var(--dq-primary-depth);
    background: linear-gradient(180deg,#1471CF,var(--dq-primary));
    box-shadow: 0 3px 0 var(--dq-primary-depth), 0 7px 12px rgba(0,86,179,.15);
  }

  .duduq-matching-item-audio[data-playing="true"] {
    border-color: #359500;
    background: linear-gradient(180deg,#70E90E 0%,#58CC02 62%,#49B900 100%);
    color: var(--dq-success-text);
    box-shadow: 0 3px 0 #2F8A00, 0 0 0 5px rgba(88,204,2,.14);
  }

  .duduq-matching-action-slot {
    min-height: 88px;
    place-items: start center;
    padding: clamp(14px,2vh,20px) 0 12px;
    overflow: visible;
  }

  .duduq-matching-primary {
    width: min(220px,100%);
    min-height: 56px;
    padding: 0 28px;
    border: 2px solid var(--dq-primary-depth);
    border-radius: 18px;
    background: linear-gradient(180deg,#1471CF 0%,var(--dq-primary) 72%,#004892 100%);
    color: #fff;
    box-shadow:
      0 6px 0 var(--dq-primary-depth),
      0 12px 22px rgba(0,86,179,.16),
      inset 0 2px 0 rgba(255,255,255,.28);
    font: 900 19px/1 Fredoka,Nunito,sans-serif;
  }

  .duduq-matching-primary:disabled {
    border-color: var(--dq-disabled-border);
    background: var(--dq-disabled);
    color: var(--dq-disabled-text);
    box-shadow: 0 4px 0 var(--dq-disabled-depth);
  }

  /* Feedback e transição iguais à base */
  .duduq-engine-feedback {
    width: min(860px,calc(100% - 20px));
    margin: 12px auto 0;
  }

  .duduq-engine-feedback-card,
  .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card,
  .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
    width: 100%;
    min-height: 104px;
    grid-template-columns: 84px minmax(0,1fr) auto;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    border: 2px solid var(--dq-border);
    border-radius: 24px;
    background: var(--dq-surface);
    box-shadow: 0 4px 0 var(--dq-depth), 0 12px 24px rgba(31,65,99,.07);
  }

  .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card {
    border-color: var(--dq-success-border);
    background: var(--dq-success-bg);
    color: var(--dq-success-text);
    box-shadow: 0 4px 0 var(--dq-success-depth), 0 10px 20px rgba(70,163,2,.12);
  }

  .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
    border-color: var(--dq-retry-border);
    background: var(--dq-retry-bg);
    color: var(--dq-retry-text);
    box-shadow: 0 4px 0 var(--dq-retry-depth), 0 10px 20px rgba(183,28,28,.10);
  }

  .duduq-engine-feedback .duduq-mascot[data-size="feedback"] {
    width: 84px;
    height: 84px;
  }

  .duduq-engine-feedback-action {
    min-height: 52px;
    min-width: 190px;
    border-radius: 18px;
    font-family: Fredoka,Nunito,sans-serif;
    font-weight: 900;
  }

  .duduq-star-burst[data-variant="answer"] .duduq-star-particle { animation-duration: 820ms; }
  .duduq-star-burst[data-variant="lesson"] .duduq-star-particle { animation-duration: 1450ms; }

  @media (min-width:1120px) {
    .duduq-engine-header {
      grid-template-columns: minmax(0,1fr) minmax(480px,580px) minmax(0,1fr);
    }
  }

  @media (min-width:721px) {
    .duduq-matching-board[data-density="comfortable"] .duduq-matching-card {
      height: clamp(108px,15vh,124px);
    }

    .duduq-matching-board[data-density="balanced"] .duduq-matching-card {
      height: clamp(92px,12.5vh,108px);
    }

    .duduq-matching-board[data-density="compact"] .duduq-matching-card {
      height: clamp(68px,8.5vh,84px);
      min-height: 0;
    }
  }

  @media (max-width:720px) {
    .duduq-engine-root { padding: 8px; }

      min-height: 70px;
      margin-bottom: 16px;

    }

    .duduq-progress-trail .duduq-progress-track {

    }

    .duduq-engine-header-mascot-slot {
      width: 58px;
      min-width: 58px;
      height: 52px;
    }

    .duduq-engine-stage .duduq-matching-instruction {
      grid-template-columns: 44px minmax(0,1fr) 44px;

    }

    .duduq-engine-stage .duduq-matching-instruction-spacer,
    .duduq-engine-stage .duduq-matching-audio-shell,

      width: 44px;
      height: 44px;
    }

    .duduq-matching-board {
      grid-template-columns: minmax(0,1fr) 38px minmax(0,1fr);

    .duduq-matching-board[data-density="balanced"] .duduq-matching-card { height: 88px; min-height: 88px; }
    .duduq-matching-board[data-density="compact"] .duduq-matching-card { height: 70px; min-height: 70px; }

    .duduq-matching-card-content {

    }

    .duduq-matching-media { width: clamp(56px,15vw,74px); height: clamp(56px,15vw,74px); }
    .duduq-matching-board[data-density="comfortable"] .duduq-matching-media { width: clamp(64px,17vw,80px); height: clamp(64px,17vw,80px); }
    .duduq-matching-color { width: clamp(48px,13vw,64px); height: clamp(48px,13vw,64px); }
    .duduq-matching-line { stroke-width: 4; }

    .duduq-matching-primary { min-width: 190px; min-height: 50px; font-size: 18px; }

    .duduq-engine-feedback {

    .duduq-engine-feedback-card,
    .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card,

    .duduq-matching-port { width: 12px; height: 12px; }
    .duduq-matching-port::after { width: 4px; height: 4px; }

    .duduq-matching-board[data-density="comfortable"] .duduq-matching-card { height: 78px; min-height: 78px; }
    .duduq-matching-board[data-density="balanced"] .duduq-matching-card { height: 68px; min-height: 68px; }
    .duduq-matching-board[data-density="compact"] .duduq-matching-card { height: 56px; min-height: 56px; }

<script id="duduq-golden-smart-submit-v5">
(function () {
  "use strict";

  document.addEventListener(
    "click",
    function (event) {
      const target =
        event.target instanceof Element
          ? event.target
          : null;

      const button =
        target?.closest?.(".duduq-matching-primary");

      if (!button || button.disabled) return;

      const slot =
        button.closest(".duduq-ss-action-slot");

      if (!slot) return;

      slot.setAttribute(
        "data-duduq-submitted",
        "true"
      );

      window.setTimeout(
        function () {
          if (!slot.isConnected) return;
          slot.removeAttribute(
            "data-duduq-submitted"
          );
        },
        1050
      );
    },
    true
  );
})();
</script>

<script id="duduq-canary-035-adaptive-space-script">
(function () {
  "use strict";
  let attempts = 0;
  let observer = null;

  function classify(stage) {
    const height = Math.round(stage.getBoundingClientRect().height || stage.clientHeight || 0);
    const width = Math.round(stage.getBoundingClientRect().width || stage.clientWidth || 0);
    let mode = "balanced";
    if (height > 0 && (height < 370 || width < 700)) mode = "compact";
    else if (height >= 455 && width >= 900) mode = "roomy";
    stage.setAttribute("data-duduq-fit", mode);
    stage.style.setProperty("--duduq-available-height", height + "px");
    stage.style.setProperty("--duduq-available-width", width + "px");
  }

  function bind() {
    const stage = document.querySelector(".duduq-engine-stage");
    if (!stage) {
      attempts += 1;
      if (attempts < 240) window.requestAnimationFrame(bind);
      return;
    }
    classify(stage);
    if (typeof ResizeObserver === "function") {
      observer = new ResizeObserver(function () { classify(stage); });
      observer.observe(stage);
    } else {
      window.addEventListener("resize", function () { classify(stage); }, { passive: true });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind, { once: true });
  } else {
    bind();
  }
})();
</script>

    [...active].forEach(control => {

  const activate = (control, fallbackMs = 5200) => {
    control = mark(control);
    if (!control) return;

    window.clearTimeout(fallbackTimer);
    fallbackTimer = window.setTimeout(() => {

    return document.contains(lastControl) ? lastControl : null;
  };

    document.querySelectorAll('.duduq-audio-standard').forEach(control => {
      const shell = control.closest('[data-playing]') || control.parentElement?.closest?.('[data-playing]');
      const nativePlaying = control.dataset.playing === 'true' || shell?.dataset?.playing === 'true';
      if (nativePlaying) activate(control, 12000);
      else if ((control.dataset.playing === 'false' || shell?.dataset?.playing === 'false') && active.has(control)) deactivate(control);
    });
  };

    const control = controlFrom(event.target);
    if (!control) return;
    lastControl = mark(control);

        const oldError = utterance.onerror;
        utterance.onend = event => {
          deactivate(control);
          if (typeof oldEnd === 'function') oldEnd.call(utterance, event);
        };
        utterance.onerror = event => {
          deactivate(control);
          if (typeof oldError === 'function') oldError.call(utterance, event);
        };

      return originalSpeak(utterance);
    };

    if (originalCancel) {

      if (mutation.type === 'attributes' && mutation.attributeName === 'data-playing') stateChanged = true;

    subtree: true,
    childList: true,
    attributes: true,
    attributeFilter: ['data-playing']

    speaker.setAttribute("fill","currentColor");

    const wave1=document.createElementNS(NS,"path");
    wave1.setAttribute("d","M15 8.5c1.3 1.8 1.3 5.2 0 7");
    wave1.setAttribute("fill","none");
    wave1.setAttribute("stroke","currentColor");
    wave1.setAttribute("stroke-width","2");

    const wave2=document.createElementNS(NS,"path");
    wave2.setAttribute("d","M18 6c2.7 3.4 2.7 8.6 0 12");
    wave2.setAttribute("fill","none");
    wave2.setAttribute("stroke","currentColor");
    wave2.setAttribute("stroke-width","2");
    wave2.setAttribute("stroke-linecap","round");

    return svg;
  }

  function ensureIcon(){
    document.querySelectorAll(".duduq-ss-audio").forEach(function(button){
      let svg=button.querySelector(':scope > svg[data-duduq-real-audio-061="true"]');
      if(!svg){
        Array.from(button.children).forEach(function(child){
          if(child.matches?.("svg")) child.remove();
        });
        button.prepend(makeIcon());
        svg=button.querySelector(':scope > svg[data-duduq-real-audio-061="true"]');
      }
      if(svg){
        svg.style.margin='auto';
        svg.style.transform='none';
      }
    });
  }

  function getQuestionSignature(){
    const heading=document.querySelector(".duduq-ss-instruction h2")?.textContent?.trim() || "";
    const prompt=document.querySelector(".duduq-ss-gap, .duduq-ss-sentence, .duduq-ss-main")?.textContent?.replace(/\s+/g," ").trim() || "";
    const img=document.querySelector(".duduq-ss-character img, .duduq-ss-card img")?.getAttribute("src") || "";
    const options=Array.from(document.querySelectorAll(".duduq-ss-option, .duduq-ss-choice, button"))
      .slice(0,6)
      .map(function(el){ return (el.textContent || "").replace(/\s+/g," ").trim(); })
      .filter(Boolean)
      .join("|");
    return [heading,prompt,img,options].join("Â§");
  }

  function setLock(value){
    if(value) html.setAttribute("data-duduq-ss-061-lock",value);
    else html.removeAttribute("data-duduq-ss-061-lock");
  }

  function feedbackText(){
    return Array.from(document.querySelectorAll(
      ".duduq-engine-feedback, .duduq-ss-feedback, [role='status'], [aria-live='polite'], [aria-live='assertive']"
    )).map(function(el){
      return el.textContent || "";
    }).join(" ").replace(/\s+/g," ").trim().toLowerCase();
  }

  function feedbackState(){
    const txt=feedbackText();
    if(/\bcorreto\b|\bcorrect\b|\bexcelente\b|\bperfeito\b/.test(txt)) return "success";
    if(/tente novamente|boa tentativa|incorreto|errado|try again/.test(txt)) return "retry";
    return "idle";
  }

  function syncState(){
    ensureIcon();

    const newSig=getQuestionSignature();
    if(newSig && currentQuestionSignature && newSig !== currentQuestionSignature){

    const observer=new MutationObserver(function(mutations){
      mutations.forEach(function(mutation){

<style id="duduq-canary-076-smart-native-matching-typography">
/* ==============================================================
   CANARY 076
   Usa deliberadamente a TIPOGRAFIA NATIVA do componente Matching,
   e nao a regra global posterior de 28px/800.

   Fonte real herdada pelo Matching: Nunito.
   Regra nativa Matching:
     font-size: clamp(18px, 2.3vw, 26px)
     font-weight: 700
     line-height: 1.12
   ============================================================== */

/*
 * IMPORTANTE:
 * O seletor NAO depende de .duduq-matching-display.
 * Ele atinge o h2 efetivamente renderizado.
 */
html body #root .duduq-engine-stage
.duduq-matching-instruction h2{
  margin:0!important;
  min-width:0!important;

  font-family:
    Nunito,
    ui-rounded,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif!important;

  font-size:clamp(18px,2.3vw,26px)!important;
  font-weight:700!important;
  line-height:1.12!important;
  letter-spacing:normal!important;

  font-style:normal!important;
  font-stretch:normal!important;
  font-variant:normal!important;
  font-synthesis:auto!important;
  font-kerning:auto!important;
  font-feature-settings:normal!important;
  font-variation-settings:normal!important;
  text-rendering:auto!important;

  text-align:center!important;
  text-transform:uppercase!important;
}

/* Respiro solicitado entre enunciado e card secundario. */
html body #root .duduq-engine-stage .duduq-ss-board{
  margin-top:12px!important;
}

@media (min-width:900px) and (max-height:700px){
  html body #root .duduq-engine-stage .duduq-ss-board{
    margin-top:8px!important;
  }
}

@media (max-width:720px){
  html body #root .duduq-engine-stage
  .duduq-matching-instruction h2{
    font-size:clamp(17px,5vw,22px)!important;
    font-weight:700!important;
    line-height:1.12!important;
    white-space:normal!important;
  }

  html body #root .duduq-engine-stage .duduq-ss-board{
    margin-top:8px!important;
  }
}
</style>
<script id="duduq-canary-076-smart-native-matching-typography-lock">
(function(){
  "use strict";

  if(window.__DUDUQ_CANARY_076_NATIVE_MATCHING_TYPO__) return;
  window.__DUDUQ_CANARY_076_NATIVE_MATCHING_TYPO__=true;

  function imp(el,prop,value){
    if(!el) return;
    try{
      el.style.setProperty(prop,value,"important");
    }catch(_){}
  }

  function apply(){
    /*
     * Nao depende da classe duduq-matching-display.
     * Se o Smart reconstruir o h2, o novo h2 recebe os valores novamente.
     */
    var titles=document.querySelectorAll(
      ".duduq-matching-instruction h2"
    );

    titles.forEach(function(title){
      imp(
        title,
        "font-family",
        'Nunito, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
      );
      imp(
        title,
        "font-size",
        window.innerWidth<=720
          ? "clamp(17px, 5vw, 22px)"
          : "clamp(18px, 2.3vw, 26px)"
      );
      imp(title,"font-weight","700");
      imp(title,"line-height","1.12");
      imp(title,"letter-spacing","normal");
      imp(title,"font-style","normal");
      imp(title,"font-stretch","normal");
      imp(title,"font-variant","normal");
      imp(title,"font-synthesis","auto");
      imp(title,"font-kerning","auto");
      imp(title,"font-feature-settings","normal");
      imp(title,"font-variation-settings","normal");
      imp(title,"text-rendering","auto");
      imp(title,"text-align","center");
      imp(title,"text-transform","uppercase");
    });

    var board=document.querySelector(".duduq-ss-board");
    if(board){
      var compact=
        window.innerWidth<=720 ||
        (window.innerWidth>=900 && window.innerHeight<=700);

      imp(board,"margin-top",compact ? "8px" : "12px");
    }
  }

  function report(){
    var title=document.querySelector(".duduq-matching-instruction h2");
    if(!title) return;

    var cs=getComputedStyle(title);

    console.info(
      "[DuduQ Canary 076] Smart instruction typography:",
      {
        selector:".duduq-matching-instruction h2",
        fontFamily:cs.fontFamily,
        fontSize:cs.fontSize,
        fontWeight:cs.fontWeight,
        lineHeight:cs.lineHeight,
        letterSpacing:cs.letterSpacing
      }
    );
  }

  var queued=false;
  function schedule(){
    if(queued) return;
    queued=true;

    requestAnimationFrame(function(){
      queued=false;
      apply();
    });
  }

  var root=document.getElementById("root")||document.documentElement;

  new MutationObserver(schedule).observe(root,{
    childList:true,
    subtree:true
  });

  window.addEventListener("resize",schedule,{passive:true});

  document.addEventListener("DOMContentLoaded",function(){
    apply();

    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(function(){
        apply();
        report();
      }).catch(report);
    }else{
      report();
    }
  },{once:true});

  apply();
  setTimeout(function(){
    apply();
    report();
  },700);
})();
</script>
