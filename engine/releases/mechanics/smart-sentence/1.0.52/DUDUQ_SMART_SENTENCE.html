  /* ========================================================================
     Host 1.0.11 \u2014 FINAL VISUAL POLISH
     - t\xEDtulo do cabe\xE7alho permanece im\xF3vel em todos os estados;
     - imagens dos alvos ganham presen\xE7a sem comprometer a \xE1rea de resposta;
     - indicadores de capacidade ficam mais leg\xEDveis para crian\xE7as e tablets;
     - feedback de sucesso vira uma faixa horizontal eficiente em desktop;
     - confirma\xE7\xE3o verde e conclus\xE3o recebem acabamento mais elegante.
     ======================================================================== */

  /* Reserva permanente do avatar: o t\xEDtulo n\xE3o salta quando o mascote muda
     do cabe\xE7alho para o feedback ou para a conclus\xE3o. */
  .duduq-engine-header-mascot-slot {
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    display: grid;
    place-items: center;
  }

  .duduq-engine-header-mascot-slot[data-visible="false"] {
    visibility: hidden;
  }

  .duduq-engine-header-mascot-slot .duduq-mascot[data-size="idle"] {
    width: 46px;
    height: 46px;
  }

  /* Aumenta a pista visual em aproximadamente 10%, mantendo o cart\xE3o e a
     \xE1rea de toque est\xE1veis. */
  .duduq-engine-stage .duduq-dd-target-media {
    width: clamp(120px, 13.6vw, 162px);
    height: clamp(120px, 13.6vw, 162px);
    filter: drop-shadow(0 8px 12px rgba(31,65,99,.095));
  }

  .duduq-engine-stage
    .duduq-dd-target[data-has-media="true"]
    .duduq-dd-target-head {
    min-height: clamp(142px, 19vh, 180px);
    padding-top: 5px;
  }

  /* Contador 0/1 e 1/1: leitura mais r\xE1pida, contraste maior e alinhamento
     consistente sem competir com a imagem. */
  .duduq-engine-stage .duduq-dd-capacity-badge {
    min-width: 31px !important;
    padding: 3px 7px !important;
    border: 1px solid #d9e4ef;
    background: #f2f6fa !important;
    color: #3f5874 !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95);
    font-size: 12.5px !important;
    line-height: 1.05;
    font-weight: 900 !important;
    font-variant-numeric: tabular-nums;
  }

  /* O acerto continua inequ\xEDvoco, por\xE9m com menos satura\xE7\xE3o repetida entre
     fundo, borda, sombra, item e selo. */
  .duduq-engine-stage
    .duduq-dd-target:has(.duduq-dd-item[data-feedback="correct"]) {
    border-color: #68cb4e;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,255,255,.9), transparent 58%),
      linear-gradient(180deg, #f7fff4 0%, #effbea 100%);
    box-shadow:
      0 3px 0 #65bc4f,
      0 9px 20px rgba(48,145,37,.085),
      inset 0 1px 0 rgba(255,255,255,.96);
  }

  .duduq-engine-stage .duduq-dd-item[data-feedback="correct"] {
    border-color: #45b72c;
    background: linear-gradient(180deg, #ffffff 0%, #f3ffef 100%);
    box-shadow:
      0 4px 0 #319f19,
      0 7px 13px rgba(48,145,37,.10),
      inset 0 1px 0 rgba(255,255,255,.98);
  }

  /* No desktop, mensagem e a\xE7\xE3o ocupam a mesma linha. O bot\xE3o deixa de
     flutuar no centro de uma caixa muito larga. */
  @media (min-width: 760px) {
    .duduq-engine-feedback[data-state="success"]
      .duduq-engine-feedback-card {
      grid-template-columns: 62px minmax(0, 1fr) minmax(220px, 280px);
      gap: 14px 20px;
      min-height: 88px;
      padding: 13px 18px 15px;
    }

    .duduq-engine-feedback[data-state="success"]
      .duduq-engine-feedback-action {
      grid-column: auto;
      justify-self: end;
      width: 100%;
      margin-top: 0;
    }

    .duduq-engine-feedback[data-state="retry"]
      .duduq-engine-feedback-card {
      grid-template-columns: 62px minmax(0, 1fr);
      min-height: 80px;
      padding: 12px 18px 14px;
    }
  }

  /* Conclus\xE3o: aproxima personagem e mensagem e concentra a luz no n\xFAcleo
     celebrativo, evitando um grande halo vazio. */
  .duduq-engine-complete {
    background:
      radial-gradient(ellipse 40% 34% at 50% 27%, rgba(190,255,169,.52), rgba(229,255,220,.24) 58%, transparent 76%),
      linear-gradient(180deg, #ffffff 0%, #f8fff6 100%);
  }

  }

  @media (max-width: 900px) {

  @media (max-width: 720px) {

      width: 40px;

      flex-basis: 40px;
    }

    .duduq-engine-header-mascot-slot .duduq-mascot[data-size="idle"] {

    .duduq-engine-stage

  @media (max-width: 520px) {
    .duduq-engine-header-mascot-slot {
      width: 36px;
      height: 36px;
      flex-basis: 36px;
    }

    .duduq-engine-header-mascot-slot .duduq-mascot[data-size="idle"] {
      width: 36px;
      height: 36px;
    }

    .duduq-engine-stage .duduq-dd-target-media {
      width: clamp(86px, 27vw, 112px);
      height: clamp(86px, 27vw, 112px);
    }
  }


  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     Continuidade visual sobre a arquitetura homologada:
     - raiz transparente para receber cen\xE1rios externos sem retrabalho;
     - uma \xFAnica escala de profundidade para cart\xF5es e controles;
     - destinos receptivos em vez de grandes caixas tracejadas;
     - feedback menos saturado e com leitura mais r\xE1pida;
     - composi\xE7\xE3o preservada em desktop, tablet, celular e baixa altura.
     ======================================================================== */

  :root {
    --premium-ink: #16375b;
    --premium-muted: #526d84;
    --premium-line: rgba(132, 171, 190, .42);
    --premium-surface: rgba(255, 255, 255, .925);
    --premium-surface-soft: rgba(247, 252, 252, .86);
    --premium-depth: #b9cfd7;
    --premium-blue: #0b73d1;
    --premium-blue-deep: #07549f;
    --premium-green: #52bd35;
    --premium-green-deep: #359b21;
    --premium-coral: #e77a62;
    --premium-coral-deep: #bf5d48;
  }

  .duduq-engine-root {
    padding: clamp(7px, 1vw, 14px);
    background: transparent;
    color: var(--premium-ink);
  }

  .duduq-engine-shell {
    width: min(1220px, 100%);
  }

  .duduq-engine-header {
    gap: 8px 14px;
    margin-bottom: 10px;
    padding: 9px 12px 10px;
    border: 1px solid var(--premium-line);
    border-radius: 20px;
    background: var(--premium-surface);
    box-shadow:
      0 4px 0 rgba(157, 188, 199, .68),
      0 15px 32px rgba(43, 89, 110, .12),
      inset 0 1px 0 rgba(255, 255, 255, .98);
    -webkit-backdrop-filter: blur(14px) saturate(1.04);
    backdrop-filter: blur(14px) saturate(1.04);
  }

  .duduq-engine-header-main {
    gap: 10px;
  }

  .duduq-engine-heading h1 {
    color: #102e52;
    font-size: clamp(1.12rem, 2vw, 1.45rem);
    letter-spacing: -.018em;
  }

  .duduq-engine-toolbar {
    gap: 7px;
  }

  .duduq-engine-toolbar .duduq-engine-button {
    min-height: 38px;
    padding: 7px 12px;
    border: 1px solid rgba(137, 166, 187, .48);
    border-radius: 13px;
    background: rgba(255, 255, 255, .84);
    color: #173b63;
    box-shadow:
      0 3px 0 rgba(162, 184, 199, .78),
      0 7px 14px rgba(43, 76, 105, .08),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-toolbar .duduq-engine-button:hover:not(:disabled) {
    transform: translateY(-1px);
    background: #fff;
    box-shadow:
      0 4px 0 rgba(151, 178, 195, .82),
      0 10px 18px rgba(43, 76, 105, .11),
      inset 0 1px 0 #fff;
  }

  .duduq-progress-trail {
    gap: 5px;
    padding: 5px 9px 8px;
    overflow: visible;
    border: 0;
    border-radius: 14px;
    background: transparent;
    box-shadow: none;
  }

  .duduq-progress-trail::before {
    display: none;
  }

  .duduq-progress-copy {
    padding-inline: 3px;
  }

  .duduq-progress-copy span {
    color: #4b6681;
    font-size: .64rem;
  }

  .duduq-progress-copy strong {
    color: #173b63;
    font-size: .84rem;
  }

  .duduq-progress-track {
    height: 13px;
    margin: 1px 13px 0;
    border: 1px solid #a9c2d2;
    background: #dce8ee;
    box-shadow:
      0 3px 0 #b5c9d2,
      inset 0 2px 4px rgba(55, 84, 118, .14),
      inset 0 -1px 0 rgba(255,255,255,.88);
  }

  .duduq-progress-track::after,
  .duduq-progress-fill::before,
  .duduq-progress-fill::after {
    display: none;
  }

  .duduq-progress-fill {
    background: #1889e7;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.48),
      inset 0 -1px 0 rgba(2,72,145,.18);
  }

  .duduq-progress-marker {
    width: 29px;
    height: 29px;
    border-width: 1px;
    background: #f8fbfc;
    box-shadow:
      0 3px 0 #aebfca,
      0 7px 13px rgba(33, 67, 104, .12),
      inset 0 1px 0 #fff;
    font-size: .92rem;

  .duduq-progress-marker::after {

  .duduq-progress-marker[data-status="current"] {

    box-shadow:
      0 4px 0 #075aa8,
      0 0 0 4px rgba(24,137,231,.11),

      inset 0 2px 0 rgba(255,255,255,.46);

  .duduq-progress-marker[data-status="complete"] {

    background: #ffd34e;
    box-shadow:
      0 4px 0 #c88b08,

  .duduq-engine-stage .duduq-dd-surface {

  .duduq-engine-stage .duduq-dd-instruction {

  .duduq-engine-stage .duduq-dd-audio-shell > button {

  .duduq-engine-stage .duduq-dd-board {

  .duduq-engine-stage .duduq-dd-target-grid {

  .duduq-engine-stage .duduq-dd-target,

  .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {

  .duduq-engine-stage

  .duduq-engine-stage .duduq-dd-target-media {

  .duduq-engine-stage .duduq-dd-capacity-badge {

  .duduq-engine-stage .duduq-dd-target-items {

  .duduq-engine-stage .duduq-dd-target[data-active-target="true"] {
    border-color: #2f94ed;
    background: rgba(244, 251, 255, .98);
    box-shadow:
      0 4px 0 #86b7d9,
      0 0 0 5px rgba(47,148,237,.12),
      0 16px 30px rgba(31,116,194,.13),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage
    .duduq-dd-target[data-active-target="true"]
    .duduq-dd-target-items {
    border-color: #2f94ed;
    background: #f2f9ff;
    box-shadow: 0 0 0 4px rgba(47,148,237,.10);
  }

  .duduq-engine-stage .duduq-dd-target[data-occupied="true"] .duduq-dd-target-items {
    border-color: transparent;
    background: transparent;
  }

  .duduq-engine-stage .duduq-dd-empty-note {
    color: #60778a;
    font-size: 12.5px;
    font-weight: 800;
  }

  .duduq-engine-stage .duduq-dd-pool {
    min-height: 94px;
    gap: 4px;
    padding: 7px 10px 12px;
    border: 1px solid rgba(151, 185, 196, .46);
    border-radius: 22px;
    background: var(--premium-surface-soft);
    box-shadow:
      0 3px 0 rgba(166, 192, 201, .68),
      0 11px 24px rgba(44, 89, 109, .085),
      inset 0 1px 0 #fff;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }

  .duduq-engine-stage .duduq-dd-pool-head {
    min-height: 26px;
    color: #425f78;
    font-size: 13px;
  }

  .duduq-engine-stage .duduq-dd-pool-items {
    min-height: 58px;
    gap: clamp(12px, 1.4vw, 18px);
    padding-bottom: 4px;
  }

  .duduq-engine-stage .duduq-dd-item {
    min-width: clamp(126px, 15vw, 166px);
    min-height: 54px;
    border: 1.5px solid #a8bfd1;
    border-radius: 17px;
    background: #fff;
    color: #102e52;
    box-shadow:
      0 5px 0 #9fb7c9,
      0 11px 18px rgba(37, 72, 103, .105),
      inset 0 2px 0 #fff;
    font-size: clamp(17px, 1.8vw, 21px);
  }

  @media (hover: hover) and (pointer: fine) {
    .duduq-engine-stage .duduq-dd-item:hover:not(:disabled):not([aria-disabled="true"]) {
      transform: translateY(-3px) scale(1.018);
      box-shadow:
        0 7px 0 #93aec2,
        0 15px 23px rgba(37, 72, 103, .14),
        inset 0 2px 0 #fff;
    }
  }

  .duduq-engine-stage .duduq-dd-item[data-selected="true"] {
    border-color: var(--premium-blue);
    background: #f5faff;
    box-shadow:
      0 5px 0 var(--premium-blue-deep),
      0 0 0 4px rgba(11,115,209,.12),
      0 12px 20px rgba(11,115,209,.14);
  }

  .duduq-engine-stage .duduq-dd-item[data-feedback="correct"] {
    border-color: #65c74c;
    background: #f8fff5;
    box-shadow:
      0 4px 0 var(--premium-green-deep),
      0 8px 15px rgba(48,145,37,.10),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-item[data-feedback="retry"] {
    border-color: #ed947e;
    background: #fff8f5;
    box-shadow:
      0 4px 0 var(--premium-coral-deep),
      0 8px 15px rgba(183, 77, 58, .09),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage
    .duduq-dd-target:has(.duduq-dd-item[data-feedback="correct"]) {
    border-color: #83d36b;
    background: rgba(248, 255, 246, .96);
    box-shadow:
      0 4px 0 #6ab953,
      0 11px 22px rgba(48,145,37,.085),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-action-slot {
    min-height: 66px;
    padding: 8px 0 4px;
  }

  .duduq-engine-stage .duduq-dd-primary {
    width: min(246px, 100%);
    min-height: 54px;
    border-radius: 17px;
    font-size: 18px;
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"] {
    background: var(--premium-blue);
    box-shadow:
      0 5px 0 var(--premium-blue-deep),
      0 12px 21px rgba(9,103,201,.18),
      inset 0 2px 0 rgba(255,255,255,.28);
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="false"] {
    background: rgba(227, 236, 241, .92);
    color: #74889a;
    box-shadow:
      0 4px 0 #bdccd5,
      inset 0 1px 0 rgba(255,255,255,.78);
  }

  .duduq-engine-feedback {
    margin-top: 7px;
  }

  .duduq-engine-feedback-card {
    border-width: 1px;
    border-radius: 21px;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }

  .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card {
    border-color: rgba(100, 190, 78, .72);
    background: rgba(246, 255, 243, .94);
    box-shadow:
      0 4px 0 rgba(83, 172, 57, .78),
      0 13px 25px rgba(54,169,0,.11),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
    border-color: rgba(229, 143, 109, .72);
    background: rgba(255, 248, 243, .95);
    box-shadow:
      0 4px 0 rgba(210, 113, 73, .72),
      0 13px 25px rgba(166,75,22,.09),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-feedback-action,
  .duduq-engine-complete-action {
    min-height: 54px;
    border-radius: 17px;
    background: var(--premium-blue);
    box-shadow:
      0 5px 0 var(--premium-blue-deep),
      0 12px 21px rgba(9,103,201,.18),
      inset 0 2px 0 rgba(255,255,255,.28);
  }

  .duduq-engine-complete {
    min-height: clamp(342px, 58vh, 448px);
    border: 1px solid rgba(137, 183, 145, .52);
    border-radius: 28px;
    background: rgba(250, 255, 248, .94);
    box-shadow:
      0 6px 0 rgba(147, 190, 148, .52),
      0 24px 48px rgba(46, 94, 65, .13),
      inset 0 1px 0 #fff;
    -webkit-backdrop-filter: blur(15px);
    backdrop-filter: blur(15px);
  }

  .duduq-mascot[data-state="complete"] .duduq-mascot-body {
    overflow: visible;
  }

  .duduq-mascot[data-state="complete"] img {
    transform: scale(3.45);
    object-position: 50% 52%;
  }

  @media (min-width: 900px) and (max-height: 720px) {
    .duduq-engine-root {
      padding: 6px 8px 9px;
    }

    .duduq-engine-header {
      margin-bottom: 8px;
      padding-block: 7px 8px;
    }

    .duduq-progress-trail {
      padding-block: 4px 6px;
    }

    .duduq-engine-stage .duduq-dd-instruction {
      min-height: 56px;
      margin-bottom: 10px;
    }

    .duduq-engine-stage .duduq-dd-target,
    .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
      min-height: 172px;
    }

    .duduq-engine-stage
      .duduq-dd-target[data-has-media="true"]
      .duduq-dd-target-head {
      min-height: 118px;
    }

    .duduq-engine-stage .duduq-dd-target-media {
      width: 118px;
      height: 118px;
    }

    .duduq-engine-stage .duduq-dd-pool {
      min-height: 86px;
      padding-block: 5px 9px;
    }

    .duduq-engine-stage .duduq-dd-action-slot {
      min-height: 59px;
      padding-top: 5px;
    }
  }

  @media (max-width: 720px) {
    .duduq-engine-header {
      border-radius: 17px;
    }

    .duduq-engine-stage .duduq-dd-target,
    .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
      border-radius: 19px;
    }

    .duduq-engine-stage .duduq-dd-target-items {
      width: calc(100% - 18px);
      margin-bottom: 9px;
    }

    .duduq-engine-stage .duduq-dd-pool {
      border-radius: 18px;
    }
  }

  @media (max-width: 520px) {
    .duduq-engine-root {
      padding: 6px;
    }

    .duduq-engine-stage .duduq-dd-instruction {
      width: calc(100% - 8px);
      border-radius: 22px;
    }

    .duduq-engine-stage .duduq-dd-target-items {
      min-height: 48px;
      flex-basis: 48px;
    }

    .duduq-engine-stage .duduq-dd-item {
      min-width: 78px;
      min-height: 50px;
      border-radius: 15px;
    }
  }


  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     Integra\xE7\xE3o visual desacoplada do cen\xE1rio, mascote sem recorte e
     recompensa leve com confete estrelado de execu\xE7\xE3o \xFAnica.
     ======================================================================== */

  .duduq-engine-root {
    --premium-surface: rgba(255, 255, 255, .97);
    --premium-surface-soft: rgba(248, 252, 253, .94);
    isolation: isolate;
    background: transparent !important;
    background-image: none !important;
  }

  .duduq-engine-header,
  .duduq-engine-stage .duduq-dd-instruction,
  .duduq-engine-stage .duduq-dd-target,
  .duduq-engine-stage .duduq-dd-pool,
  .duduq-engine-feedback-card,
  .duduq-engine-complete {
    background-clip: padding-box;
  }

  /* O slot agora enquadra o PNG completo. O zoom continua compensando a
     margem transparente original, mas n\xE3o recorta chap\xE9u, bra\xE7os ou base. */
  .duduq-mascot,
  .duduq-mascot-body,
  .duduq-engine-feedback-card,
  .duduq-engine-complete {
    overflow: visible;
  }

  .duduq-mascot-body {
    transform-origin: 50% 78%;
  }

  .duduq-mascot img {
    backface-visibility: hidden;
  }

  .duduq-mascot[data-size="idle"] {
    width: 46px;
    height: 46px;
  }

  .duduq-mascot[data-size="feedback"] {
    width: 86px;
    height: 86px;
  }

  .duduq-mascot[data-size="transition"] {
    width: 106px;
    height: 106px;
  }

  .duduq-mascot[data-size="complete"] {
    width: 174px;
    height: 174px;
  }

  .duduq-mascot[data-state="idle"] img {
    transform: scale(3.45);
    object-position: 50% 52%;
  }

  .duduq-mascot[data-state="transition"] img {
    transform: scale(3.35);
    object-position: 50% 52%;
  }

  .duduq-mascot[data-state="success"] img,
  .duduq-mascot[data-state="retry"] img {
    transform: scale(3.3);
    object-position: 50% 52%;
  }

  .duduq-mascot[data-state="complete"] img {
    transform: scale(3.12);
    object-position: 50% 54%;
  }

  .duduq-mascot[data-state="idle"] .duduq-mascot-body {
    animation: duduq-premium-breathe 4.8s cubic-bezier(.45, 0, .55, 1) infinite;
    will-change: transform;
  }

  @keyframes duduq-premium-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    48% { transform: translateY(-1.5px) scale(1.012, .994); }
    56% { transform: translateY(-1.5px) scale(1.009, .996); }
  }

  /* Confete estrelado: uma \xFAnica explos\xE3o por acerto, sem depend\xEAncias,
     sem mudan\xE7a de layout e sem interceptar intera\xE7\xE3o. */
  .duduq-star-burst[data-origin="mascot"][data-variant="answer"] {
    inset: -165%;
    contain: layout style paint;
  }

  .duduq-star-burst[data-origin="mascot"][data-variant="answer"]
    .duduq-star-particle {
    font-size: 14px;
    animation-name: duduq-premium-confetti-pop;
    animation-duration: 1040ms;
  }

  .duduq-star-burst[data-origin="mascot"][data-variant="answer"]
    .duduq-star-particle:nth-child(3n + 2) {
    font-size: 11px;
  }

  .duduq-star-burst[data-origin="mascot"][data-variant="answer"]
    .duduq-star-particle:nth-child(4n) {
    font-size: 17px;
  }

  .duduq-star-particle:nth-child(5n + 1) { color: #ffd43b; }
  .duduq-star-particle:nth-child(5n + 2) { color: #55c83a; }
  .duduq-star-particle:nth-child(5n + 3) { color: #2e9cf4; }
  .duduq-star-particle:nth-child(5n + 4) { color: #ff8068; }
  .duduq-star-particle:nth-child(5n + 5) { color: #8b70e8; }

  @keyframes duduq-premium-confetti-pop {
    0% {
      transform: translate(-50%, -50%) scale(.25) rotate(0deg);
      opacity: 0;
    }
    14% { opacity: 1; }
    72% { opacity: .95; }
    100% {
      transform:
        translate(
          calc(-50% + var(--star-x)),
          calc(-50% + var(--star-y))
        )
        scale(.82)
        rotate(var(--star-rotation));
      opacity: 0;
    }
  }

  @media (max-width: 520px) {
    .duduq-mascot[data-size="idle"] {
      width: 42px;
      height: 42px;
    }

    .duduq-mascot[data-size="feedback"] {
      width: 76px;
      height: 76px;
    }

    .duduq-mascot[data-size="complete"] {
      width: 154px;
      height: 154px;
    }

    .duduq-star-burst[data-origin="mascot"][data-variant="answer"] {
      inset: -145%;
    }
  }


  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     HUD enxuto, feedback sem sobreposi\xE7\xE3o e respira\xE7\xE3o em camadas separadas.
     Nenhuma regra altera estado, hit target, avalia\xE7\xE3o ou navega\xE7\xE3o.
     ======================================================================== */

  .duduq-engine-header {
    gap: 6px 12px;
    margin-bottom: 9px;
    padding: 8px 12px;
  }

  .duduq-progress-trail {
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    min-height: 28px;
    padding: 0 4px 2px;
  }

  .duduq-progress-copy {
    grid-column: 2;
    grid-row: 1;
    display: block;
    padding: 0;
  }

  .duduq-progress-copy span {
    display: none;
  }

  .duduq-progress-copy strong {
    display: block;
    color: #294e74;
    font-size: .78rem;
    line-height: 1;
  }

  .duduq-progress-track {
    grid-column: 1;
    grid-row: 1;
    height: 9px;
    margin: 0 13px;
    border-width: 1px;
    box-shadow:
      0 2px 0 #b5c9d2,
      inset 0 1px 3px rgba(55, 84, 118, .13);
  }

  .duduq-progress-marker {
    width: 24px;
    height: 24px;
    border-width: 1px;
    font-size: .74rem;
    box-shadow:
      0 2px 0 #aebfca,
      0 5px 10px rgba(33, 67, 104, .10),
      inset 0 1px 0 #fff;
  }

  .duduq-progress-marker[data-status="current"] {
    box-shadow:
      0 3px 0 #075aa8,
      0 0 0 3px rgba(24,137,231,.10),
      0 6px 12px rgba(6,101,190,.13),
      inset 0 1px 0 rgba(255,255,255,.46);
  }

  .duduq-progress-marker[data-status="complete"] {
    box-shadow:
      0 3px 0 #c88b08,
      0 6px 12px rgba(210,145,0,.15),
      inset 0 1px 0 rgba(255,255,255,.58);
  }

  @media (min-width: 980px) {
    .duduq-engine-header {
      grid-template-columns:
        minmax(280px, .85fr)
        minmax(300px, 1.1fr)
        auto;
      min-height: 64px;
    }

    .duduq-engine-header-main {
      grid-column: 1;
      grid-row: 1;
    }

    .duduq-progress-trail {
      grid-column: 2;
      grid-row: 1;
    }

    .duduq-engine-toolbar {
      grid-column: 3;
      grid-row: 1;
    }
  }

  /* A coluna do personagem considera a \xE1rea vis\xEDvel real do PNG ampliado.
     O texto deixa de come\xE7ar sob o mascote, mesmo com confete ativo. */
  .duduq-engine-feedback-card {
    column-gap: 16px;
  }

  .duduq-engine-feedback .duduq-mascot[data-size="feedback"] {
    width: 80px;
    height: 80px;
    justify-self: center;
    align-self: center;
    margin: 0;
    animation: duduq-feedback-breathe 4.6s cubic-bezier(.45, 0, .55, 1) 620ms infinite;
    transform-origin: 50% 78%;
    will-change: transform;
  }

  @media (min-width: 760px) {
    .duduq-engine-feedback[data-state="success"]
      .duduq-engine-feedback-card {
      grid-template-columns: 110px minmax(0, 1fr) minmax(220px, 280px);
      gap: 12px 18px;
      padding-left: 14px;
    }

    .duduq-engine-feedback[data-state="retry"]
      .duduq-engine-feedback-card {
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 12px 18px;
      padding-left: 14px;
    }
  }

  @media (max-width: 759px) {
    .duduq-engine-feedback-card,
    .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card,
    .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
      grid-template-columns: 94px minmax(0, 1fr);
      gap: 10px 12px;
    }
  }

  /* O repouso do cabe\xE7alho e os feedbacks respiram em elementos distintos.
     Assim, a entrada de acerto/erro continua intacta e n\xE3o h\xE1 disputa de
     transform entre anima\xE7\xF5es. */
  .duduq-mascot[data-state="idle"] .duduq-mascot-body {
    animation: duduq-premium-breathe 4.4s cubic-bezier(.45, 0, .55, 1) infinite;
  }

  .duduq-engine-complete .duduq-mascot[data-size="complete"] {
    animation: duduq-complete-breathe 5.1s cubic-bezier(.45, 0, .55, 1) 760ms infinite;
    transform-origin: 50% 80%;
    will-change: transform;
  }

  @keyframes duduq-premium-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    48% { transform: translateY(-2.1px) scale(1.016, .992); }
    56% { transform: translateY(-2.1px) scale(1.012, .994); }
  }

  @keyframes duduq-feedback-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2px) scale(1.014, .994); }
  }

  @keyframes duduq-complete-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2.4px) scale(1.012, .995); }
  }

  .duduq-mascot[data-reduced-motion="true"],
  .duduq-mascot[data-reduced-motion="true"] .duduq-mascot-body {
    animation: none !important;
    transform: none !important;
    will-change: auto;
  }

  @media (max-width: 520px) {
    .duduq-progress-trail {
      gap: 7px;
      min-height: 26px;
    }

    .duduq-progress-copy strong {
      font-size: .72rem;
    }

    .duduq-engine-feedback-card,
    .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card,
    .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
      grid-template-columns: 84px minmax(0, 1fr);
      padding-inline: 10px;
    }

    .duduq-engine-feedback .duduq-mascot[data-size="feedback"] {
      width: 72px;
      height: 72px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .duduq-mascot {
      animation: none !important;
      transform: none !important;
      will-change: auto;
    }
  }


  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     Centro \xF3ptico real no HUD, respiro superior e conclus\xE3o sem halo verde.
     ======================================================================== */

  .duduq-engine-root {
    padding-top: clamp(16px, 2.2vh, 22px);
  }

  @media (min-width: 1120px) {
    .duduq-engine-header {
      grid-template-columns:
        minmax(0, 1fr)
        minmax(480px, 580px)
        minmax(0, 1fr);
      gap: 14px;
    }

    .duduq-engine-header-main {
      justify-self: start;
      width: 100%;
    }

    .duduq-progress-trail {
      width: 100%;
      max-width: 580px;
      justify-self: center;
    }

    .duduq-engine-toolbar {
      justify-self: end;
    }
  }

  @media (min-width: 900px) and (max-height: 720px) {
    .duduq-engine-root {
      padding-top: 14px;
    }
  }

  /* A conclus\xE3o mant\xE9m o significado de sucesso na borda e no texto, mas
     elimina a grande mancha verde atr\xE1s do personagem e sua anima\xE7\xE3o cont\xEDnua. */
  .duduq-engine-complete {
    background:
      linear-gradient(
        180deg,
        rgba(255, 255, 255, .985) 0%,
        rgba(248, 252, 254, .97) 100%
      );
  }

  .duduq-engine-complete::before {
    display: none;
    animation: none !important;
  }

  /* Respira\xE7\xE3o um pouco mais presente, ainda lenta e sem filtros ou repaints
     caros. Cada estado continua animando apenas um transform composto. */
  .duduq-mascot[data-state="idle"] .duduq-mascot-body {
    animation: duduq-premium-breathe 4.2s cubic-bezier(.45, 0, .55, 1) infinite;
  }

  .duduq-engine-feedback .duduq-mascot[data-size="feedback"] {
    animation: duduq-feedback-breathe 4.15s cubic-bezier(.45, 0, .55, 1) 620ms infinite;
  }

  .duduq-engine-complete .duduq-mascot[data-size="complete"] {

  <script>

(() => {
  "use strict";
  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
  const root = $("#root");
  const configEl = $("#duduq-smart-sentence-config");

  const Assets = {
    mascots: {
      idle: window.DUDUQ_ASSETS.mascots.idle,
      success: window.DUDUQ_ASSETS.mascots.correct,
      retry: window.DUDUQ_ASSETS.mascots.error,
      transition: window.DUDUQ_ASSETS.mascots.transition,
      complete: window.DUDUQ_ASSETS.mascots.complete
    },
    media: {
      dog: "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%3E%0A%20%20%20%20%3Crect%20width%3D%22120%22%20height%3D%22120%22%20rx%3D%2230%22%20fill%3D%22%23FFF0E8%22/%3E%0A%20%20%20%20%3Ctext%20x%3D%2260%22%20y%3D%2283%22%20text-anchor%3D%22middle%22%20font-size%3D%2270%22%3E%F0%9F%90%B6%3C/text%3E%0A%20%20%20%20%3C/svg%3E",
      pizza: "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%3E%0A%20%20%20%20%3Crect%20width%3D%22120%22%20height%3D%22120%22%20rx%3D%2230%22%20fill%3D%22%23FFF0E8%22/%3E%0A%20%20%20%20%3Ctext%20x%3D%2260%22%20y%3D%2283%22%20text-anchor%3D%22middle%22%20font-size%3D%2270%22%3E%F0%9F%8D%95%3C/text%3E%0A%20%20%20%20%3C/svg%3E"
    }
  };

  const Events = new EventTarget();

  const Utilities = {
    normalize(value, rules={}) {
      let text = String(value ?? "");
      if (rules.trimSpaces !== false) text = text.trim();
      if (rules.collapseSpaces) text = text.replace(/\s+/g, " ");
      if (!rules.punctuationSensitive) text = text.replace(/[.,!?;:'"“”‘’()[\]{}]/g, "");
      if (!rules.caseSensitive) text = text.toLocaleLowerCase("en-US");
      return text;
    },
    liveRandom() {
      try {
        const cryptoApi =
          globalThis.crypto &&
          typeof globalThis.crypto.getRandomValues === "function"
            ? globalThis.crypto
            : null;

        if (cryptoApi) {
          const buffer = new Uint32Array(1);
          cryptoApi.getRandomValues(buffer);
          return buffer[0] / 4294967296;
        }
      } catch (_) {}

      return Math.random();
    },
    shuffle(values) {
      const out = [...values];
      for (let i=out.length-1;i>0;i--) {
        const j = Math.floor(this.liveRandom()*(i+1));
        [out[i],out[j]]=[out[j],out[i]];
      }
      return out;
    },
    sameOrder(a, b) {
      return (
        Array.isArray(a) &&
        Array.isArray(b) &&
        a.length === b.length &&
        a.every((value, index) => value === b[index])
      );
    },
    presentationStore() {
      const candidates = [];

      try {
        if (window.parent && window.parent !== window) {
          candidates.push(window.parent);
        }
      } catch (_) {}

      candidates.push(window);

      for (const host of candidates) {
        try {
          if (!host.__DUDUQ_PRESENTATION_ORDERS_V2__) {
            Object.defineProperty(
              host,
              "__DUDUQ_PRESENTATION_ORDERS_V2__",
              {
                value: Object.create(null),
                configurable: true
              }
            );
          }

          return host.__DUDUQ_PRESENTATION_ORDERS_V2__;
        } catch (_) {}
      }

      return null;
    },
    readOrder(key, source) {
      const shared = this.presentationStore();

      try {
        const stored = shared?.[key];
        if (
          Array.isArray(stored) &&
          stored.length === source.length &&
          [...stored].sort().join("\u0001") ===
            [...source].sort().join("\u0001")
        ) {
          return [...stored];
        }
      } catch (_) {}

      const storages = [];
      try { storages.push(localStorage); } catch (_) {}
      try { storages.push(sessionStorage); } catch (_) {}

      for (const storage of storages) {
        try {
          const raw = storage.getItem(key);
          if (!raw) continue;

          const parsed = JSON.parse(raw);

          if (
            Array.isArray(parsed) &&
            parsed.length === source.length &&
            [...parsed].sort().join("\u0001") ===
              [...source].sort().join("\u0001")
          ) {
            return parsed;
          }
        } catch (_) {}
      }

      return null;
    },
    writeOrder(key, order) {
      const shared = this.presentationStore();

      try {
        if (shared) shared[key] = [...order];
      } catch (_) {}

      try {
        localStorage.setItem(key, JSON.stringify(order));
      } catch (_) {}

      try {
        sessionStorage.setItem(key, JSON.stringify(order));
      } catch (_) {}
    },
    antiRepeatShuffle(values, key) {
      return window.DuduQPresentationV4.order(
        values,
        "smart-sentence:" + key,
        () => this.liveRandom(),
        `${GameState.presentationEpoch}:${key}`
      );
    },
    escape(text) {
      const div = document.createElement("div");
      div.textContent = String(text ?? "");
      return div.innerHTML;
    }
  };

  const Config = {
    parse() {
      if (!configEl) throw new Error("Config JSON não encontrado.");
      const parsed = JSON.parse(configEl.textContent);
      this.validate(parsed);
      return parsed;
    },
    validate(cfg) {
      if (!cfg || cfg.schemaVersion !== 1) throw new Error("schemaVersion inválida.");
      if (!Array.isArray(cfg.stages) || !cfg.stages.length) throw new Error("A Smart Sentence precisa de etapas.");
      const ids = new Set();
      cfg.stages.forEach((stage, index) => {
        if (!stage.id || ids.has(stage.id)) throw new Error(`ID de etapa inválido/duplicado em ${index}.`);
        ids.add(stage.id);
        if (!stage.mode || !stage.instruction) throw new Error(`Etapa ${stage.id}: modo e instrução são obrigatórios.`);
        if (!Array.isArray(stage.segments)) throw new Error(`Etapa ${stage.id}: segments deve ser array.`);
      });
    }
  };

  const GameState = {
    stageIndex: 0,
    completed: new Set(),
    answers: {},
    activeGapId: null,
    movingGapId: null,
    feedback: "idle",
    attempts: 0,
    audioPlaying: false,
    attention: false,
    successAnimation: false,
    optionOrder: {},
    presentationEpoch: 0,
    lessonComplete: false
  };

  const ValidationEngine = {
    accepted(gap, value) {
      const accepted = [gap.answer, ...(gap.alternatives || [])];
      const rules = gap.validation || {};
      const normalized = Utilities.normalize(value, rules);
      return accepted.some(answer => Utilities.normalize(answer, rules) === normalized);
    },
    validateStage(stage, answers) {
      if (stage.expectedSequence) {
        const actual = stage.segments.filter(s => s.type === "gap").map(s => answers[s.id] || "");
        const expected = stage.expectedSequence;
        const ok = actual.length === expected.length && actual.every((v,i) => Utilities.normalize(v,{trimSpaces:true,collapseSpaces:true,punctuationSensitive:false,caseSensitive:false}) === Utilities.normalize(expected[i],{trimSpaces:true,collapseSpaces:true,punctuationSensitive:false,caseSensitive:false}));
        return { isCorrect: ok, detail: { actual, expected } };
      }
      const gaps = stage.gaps || [];
      const gapResults = gaps.map(gap => ({ id: gap.id, correct: this.accepted(gap, answers[gap.id] || "") }));
      return { isCorrect: gapResults.every(x => x.correct), detail: { gaps: gapResults } };
    }
  };

  const GapEngine = {
    gapIds(stage) { return stage.segments.filter(s => s.type === "gap").map(s => s.id); },
    firstEmpty(stage) { return this.gapIds(stage).find(id => !GameState.answers[id]) || null; },
    select(stage, gapId) {
      GameState.activeGapId = gapId;
      InteractionManager.touch();
      SentenceEngine.render();
    },
    set(stage, gapId, value) {
      GameState.movingGapId = null;
      GameState.answers[gapId] = value;
      GameState.activeGapId = this.firstEmpty(stage) || gapId;
      InteractionManager.touch();
      Events.dispatchEvent(new CustomEvent("gap-filled",{detail:{gapId,value}}));
      SentenceEngine.render();
    },
    remove(stage, gapId) {
      if (!stage.interaction?.allowRemove) return;
      delete GameState.answers[gapId];
      GameState.activeGapId = gapId;
      InteractionManager.touch();
      SentenceEngine.render();
    }
  };

  const ReorderEngine = {
    enabled(stage) {
      return Boolean(stage.wordBank || stage.expectedSequence);
    },
    select(stage, gapId) {
      if (!this.enabled(stage) || !GameState.answers[gapId]) return false;

      if (GameState.movingGapId === gapId) {
        delete GameState.answers[gapId];
        GameState.movingGapId = null;
        GameState.activeGapId = gapId;
        InteractionManager.touch(false);
        SentenceEngine.render();
        return true;
      }

      GameState.movingGapId = gapId;
      GameState.activeGapId = gapId;
      InteractionManager.touch(false);
      SentenceEngine.render();
      return true;
    },
    move(stage, targetGapId) {
      const sourceGapId = GameState.movingGapId;
      if (!sourceGapId || sourceGapId === targetGapId) return false;

      const sourceValue = GameState.answers[sourceGapId];
      if (!sourceValue) {
        GameState.movingGapId = null;
        return false;
      }

      const targetValue = GameState.answers[targetGapId];
      GameState.answers[targetGapId] = sourceValue;

      if (targetValue) {
        GameState.answers[sourceGapId] = targetValue;
      } else {
        delete GameState.answers[sourceGapId];
      }

      GameState.movingGapId = null;
      GameState.activeGapId = GapEngine.firstEmpty(stage) || targetGapId;
      InteractionManager.touch(false);

      Events.dispatchEvent(new CustomEvent("sentence-reordered", {
        detail: {
          sourceGapId,
          targetGapId,
          swapped: Boolean(targetValue)
        }
      }));

      SentenceEngine.render();
      return true;
    },
    handleGap(stage, gapId) {
      if (!this.enabled(stage)) return false;

      const filled = Boolean(GameState.answers[gapId]);

      if (GameState.movingGapId) {
        if (GameState.movingGapId === gapId) {
          return this.select(stage, gapId);
        }
        return this.move(stage, gapId);
      }

      if (filled) {
        return this.select(stage, gapId);
      }

      GameState.activeGapId = gapId;
      InteractionManager.touch(false);
      SentenceEngine.render();
      return true;
    }
  };

  const WordEngine = {
    bank(stage) {
      const values = stage.wordBank || [];
      if (stage.interaction?.lockOptionOrder === true) {
        return [...values];
      }

      const key = `${stage.id}::word-bank::${values.join("\u0001")}`;

      if (!Array.isArray(GameState.optionOrder[key])) {
        GameState.optionOrder[key] =
          Utilities.antiRepeatShuffle(values, key);
      }

      return [...GameState.optionOrder[key]];
    },
    use(stage, word) {
      const activeTarget = GameState.activeGapId && !GameState.answers[GameState.activeGapId]
        ? GameState.activeGapId
        : null;
      const target = activeTarget || GapEngine.firstEmpty(stage);
      if (!target) return;
      GapEngine.set(stage, target, word);
    },
    isUsed(stage, word, occurrenceIndex) {
      const used = Object.values(GameState.answers);
      let count = 0;
      for (const value of used) if (value === word) count++;
      return occurrenceIndex < count;
    }
  };

  const AnswerEngine = {
    choose(stage, value) {
      const gapId = GameState.activeGapId || GapEngine.firstEmpty(stage) || stage.gaps?.[0]?.id;
      if (!gapId) return;
      GapEngine.set(stage, gapId, value);
    },
    input(stage, gapId, value) {
      GameState.answers[gapId] = value;
      InteractionManager.touch(false);
      ProgressManager.updateConfirmState();
    },
    ready(stage) {
      return GapEngine.gapIds(stage).every(id => String(GameState.answers[id] ?? "").trim().length > 0);
    },
    submit(stage) {
      if (!this.ready(stage) || GameState.feedback === "success") return;
      const result = ValidationEngine.validateStage(stage, GameState.answers);
      GameState.attempts += 1;
      if (result.isCorrect) FeedbackManager.success(stage, result);
      else FeedbackManager.retry(stage, result);
    }
  };

  const AudioManager = {
    cancel() {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      GameState.audioPlaying = false;
      this.sync();
    },
    play(text, locale="en-US") {
      if (!text || !("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") return;
      this.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = locale; u.rate = .92; u.pitch = 1;
      GameState.audioPlaying = true; GameState.attention = false; this.sync();
      u.onend = u.onerror = () => { GameState.audioPlaying = false; this.sync(); };
      speechSynthesis.speak(u);
    },
    sync() {
      const shell = $(".duduq-ts-audio-shell");
      const button = $(".duduq-ts-audio-button");
      if (shell) {
        shell.dataset.playing = GameState.audioPlaying ? "true" : "false";
        shell.dataset.attention = GameState.attention ? "true" : "false";
      }
      if (button) button.dataset.playing = GameState.audioPlaying ? "true" : "false";
    }
  };

  const ListeningEngine = {
    text(stage) { return stage.listening?.text || stage.instructionSpoken || stage.instruction; },
    play(stage) { AudioManager.play(this.text(stage), stage.listening?.locale || SentenceEngine.config.language || "en-US"); }
  };

  const SmartDragAdapter = {
    available() {
      const provider = window.DuduQSmartDragEngine;
      return !!(provider && typeof provider.mountSentenceOrder === "function");
    },
    attach(stage) {
      if (stage.interaction?.type !== "drag") return false;
      if (!this.available()) {
        console.info("[Smart Sentence] Smart Drag engine não exposto no host; mantendo fallback de toque/teclado.");
        return false;
      }
      window.DuduQSmartDragEngine.mountSentenceOrder({
        root: $(".duduq-ss-board"),
        words: stage.wordBank || [],
        slots: GapEngine.gapIds(stage),
        onChange(sequence) {
          GapEngine.gapIds(stage).forEach((id,i) => {
            if (sequence[i]) GameState.answers[id] = sequence[i];
            else delete GameState.answers[id];
          });
          SentenceEngine.render();
        }
      });
      return true;
    }
  };

  const InteractionManager = {
    timer: null,
    touch(render=true) {
      GameState.feedback = GameState.feedback === "retry" ? "idle" : GameState.feedback;
      GameState.attention = false;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => {
        if (!GameState.lessonComplete && GameState.feedback === "idle") {
          GameState.attention = true;
          AudioManager.sync();
        }
      }, SentenceEngine.config.inactivityAttentionMs || 8000);
      FeedbackManager.hideRetryIfNeeded();
    }
  };

  const AnimationEngine = {
    markSuccess() {
      GameState.successAnimation = true;

      // Confirma visualmente a resposta correta sem depender de um novo render.
      // Assim o card preenchido muda para verde no mesmo frame do feedback.
      $$(".duduq-ss-gap[data-filled=\"true\"]").forEach((gap) => {
        gap.dataset.correct = "true";
        gap.dataset.active = "false";
      });

      // Mantém também a palavra de origem identificada como correta durante o feedback.
      $$(".duduq-ss-token[data-used=\"true\"]").forEach((token) => {
        token.dataset.correct = "true";
      });

      const card = $(".duduq-ss-sentence-card");
      if (card) {
        // Reinicia a animação para que o confete seja disparado em todo acerto.
        card.dataset.success = "false";
        void card.offsetWidth;
        card.dataset.success = "true";
      }
    }
  };

  const ProgressManager = {
    update() {
      const total = SentenceEngine.config.stages.length;
      const safeCurrentIndex = total > 0 ? Math.min(Math.max(GameState.stageIndex, 0), total - 1) : 0;
      const completedCount = GameState.lessonComplete ? total : GameState.completed.size;
      const visualProgressCount = GameState.lessonComplete
        ? total
        : Math.max(completedCount, safeCurrentIndex);
      const ratio = total > 0 ? visualProgressCount / total : 0;

      const trail = $(".duduq-progress-trail");
      const copy = $(".duduq-progress-copy strong");

      if (copy) {
        copy.textContent = GameState.lessonComplete
          ? `${total} de ${total} etapas`
          : `Etapa ${Math.min(safeCurrentIndex + 1, total)} de ${total}`;
      }

      if (trail) {
        trail.style.setProperty("--lesson-progress", String(Math.max(0, Math.min(ratio, 1))));
        trail.dataset.style = "duolingo";
        trail.dataset.density = total > 6 ? "dense" : "normal";
        trail.dataset.complete = GameState.lessonComplete ? "true" : "false";
        trail.dataset.reducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches ? "true" : "false";
        trail.setAttribute("aria-valuemin", "0");
        trail.setAttribute("aria-valuemax", String(total));
        trail.setAttribute("aria-valuenow", String(completedCount));
        trail.setAttribute("aria-valuetext", `${completedCount} de ${total} etapas concluídas`);
      }
    },
    updateConfirmState() {
      const btn = $(".duduq-matching-primary");
      if (!btn) return;
      btn.disabled = !AnswerEngine.ready(SentenceEngine.stage());
    }
  };

  const SentenceSpeech = {
    activeTimer: null,
    text(stage) {
      const pieces = (stage?.segments || []).map((segment) => {
        if (segment?.type === "text") return String(segment.text || "");
        if (segment?.type === "gap") return String(GameState.answers?.[segment.id] || "");
        return "";
      });

      const composed = pieces
        .filter(Boolean)
        .join(" ")
        .replace(/\s+([.,!?;:])/g, "$1")
        .replace(/\s+/g, " ")
        .trim();

      if (composed) return composed;

      /* CANARY 048: todos os formatos do Smart Sentence leem a frase correta.
         Se um formato nao expuser segments, usa a frase visivel ja preenchida. */
      const visibleSentence =
        document.querySelector(".duduq-ss-sentence")?.textContent
          ?.replace(/\s+([.,!?;:])/g, "$1")
          ?.replace(/\s+/g, " ")
          ?.trim();

      return visibleSentence || "";
    },
    synths() {
      const list = [];
      try {
        if (window.speechSynthesis) list.push(window.speechSynthesis);
      } catch (_) {}
      try {
        if (
          window.parent &&
          window.parent !== window &&
          window.parent.speechSynthesis &&
          !list.includes(window.parent.speechSynthesis)
        ) {
          list.push(window.parent.speechSynthesis);
        }
      } catch (_) {}
      return list;
    },
    busy() {
      return this.synths().some((synth) => {
        try { return Boolean(synth.speaking || synth.pending); }
        catch (_) { return false; }
      });
    },
    cancelPendingTimer() {
      if (this.activeTimer !== null) {
        clearTimeout(this.activeTimer);
        this.activeTimer = null;
      }
    },
    playWhenClear(stage, onDone) {
      const text = this.text(stage);
      if (!text) {
        if (typeof onDone === "function") onDone();
        return false;
      }

      this.cancelPendingTimer();
      try { window.DuduQSound?.stop?.("correct"); } catch (_) {}
      const startedAt = Date.now();
      let quietSince = null;
      const maxWaitMs = 4800;
      const quietWindowMs = 260;

      const finish = () => {
        GameState.audioPlaying = false;
        AudioManager.sync();
        if (typeof onDone === "function") onDone();
      };

      const tryStart = () => {
        const now = Date.now();
        if (this.busy() && now - startedAt < maxWaitMs) {
          quietSince = null;
          this.activeTimer = setTimeout(tryStart, 120);
          return;
        }

        if (quietSince === null) quietSince = now;
        if (now - quietSince < quietWindowMs && now - startedAt < maxWaitMs) {
          this.activeTimer = setTimeout(tryStart, 90);
          return;
        }

        this.activeTimer = null;

        /* A frase correta tem prioridade total: nenhum feedback padrao pode entrar depois. */
        try { window.DuduQSound?.stop?.("correct"); } catch (_) {}
        /* Limpa qualquer fala residual imediatamente antes da frase correta. */
        this.synths().forEach((synth) => {
          try { synth.cancel(); } catch (_) {}
        });

        if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
          finish();
          return;
        }

        try {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = "en-US";
          utterance.rate = .90;
          utterance.pitch = 1;
          GameState.audioPlaying = true;
          GameState.attention = false;
          AudioManager.sync();
          utterance.onend = finish;
          utterance.onerror = finish;
          window.speechSynthesis.speak(utterance);
        } catch (_) {
          finish();
        }
      };

      /* O feedback visual e o som curto de acerto entram primeiro. */
      this.activeTimer = setTimeout(tryStart, 320);
      return true;
    }
  };

  const FeedbackManager = {
    node() { return $(".duduq-engine-feedback"); },
    hideRetryIfNeeded() {
      if (GameState.feedback !== "idle") return;
      const node = this.node();
      if (node) node.hidden = true;
    },
    show(kind, title, message) {
      const node = this.node();
      node.hidden = false;
      node.dataset.state = kind;
      const asset = Assets.mascots[kind === "success" ? "success" : "retry"];
      node.innerHTML = `
        <div class="duduq-engine-feedback-card" role="status">
          ${SentenceRenderer.mascot(kind, "feedback", asset)}
          <div class="duduq-engine-feedback-copy"><strong>${Utilities.escape(title)}</strong><span>${Utilities.escape(message)}</span></div>
        </div>`;
    },
    success(stage, result) {
      GameState.feedback = "success";
      window.DuduQSound?.stop?.("correct");
      window.DuduQSound?.play("ding", { volume: 0.30, minGapMs: 700 });
      GameState.completed.add(stage.id);
      AnimationEngine.markSuccess();
      this.show("success","Correto!",stage.feedback?.success || "Muito bem!");
      ProgressManager.update();
      const completedSpeech = SentenceSpeech.text(stage);
      let successCompletionSent = false;
      const completeSuccess = () => {
        if (successCompletionSent) return;
        successCompletionSent = true;

        /* CANARY 050:
           Em modo hospedado, o Player recebe a conclusao uma unica vez.
           O runtime nao troca de etapa internamente e o Confirmar nao volta. */
        Events.dispatchEvent(new CustomEvent("answer",{detail:{stageId:stage.id,...result}}));

        /* CANARY 051:
           Contrato explicito Runtime -> Adapter, igual ao padrao robusto
           usado pelas mecanicas que transitam corretamente no Host. */
        if (
          SentenceEngine.config?.hostedByDuduQ &&
          window.parent &&
          window.parent !== window
        ) {
          try {
            window.parent.postMessage(
              {
                type: "DUDUQ_SMART_SENTENCE_COMPLETE",
                stageId: stage.id,
                isCorrect: true
              },
              "*"
            );
          } catch (_) {}
        }

        if (!SentenceEngine.config?.hostedByDuduQ) {
          setTimeout(() => SentenceEngine.advance(), 260);
        }
      };

      if (completedSpeech) {
        SentenceSpeech.playWhenClear(stage, completeSuccess);

        /* Watchdog: alguns navegadores podem deixar speechSynthesis sem onend.
           A frase continua tendo prioridade; este timer so impede a atividade
           de ficar presa para sempre sem chegar a Proxima missao. */
        if (SentenceEngine.config?.hostedByDuduQ) {
          const watchdogMs = Math.max(
            6200,
            Number(SentenceEngine.config?.autoAdvanceAfterCorrectMs || 5200) + 1000
          );
          setTimeout(completeSuccess, watchdogMs);
        }
      } else if (stage.listening?.replayAfterSuccess) {
        setTimeout(() => ListeningEngine.play(stage), 280);
        setTimeout(completeSuccess, 1550);
      } else {
        setTimeout(completeSuccess, 850);
      }
    },
    retry(stage, result) {
      GameState.feedback = "retry";
      window.DuduQSound?.play("error", { volume: 0.48, minGapMs: 520 });
      this.show("retry","Tente novamente",stage.feedback?.retry || "Revise a frase e tente outra vez.");

      $$('.duduq-ss-gap[data-filled="true"]').forEach((gap) => {
        gap.dataset.retry = "true";
        gap.dataset.active = "false";
      });

      $$('.duduq-ss-token[data-used="true"]').forEach((token) => {
        token.dataset.retry = "true";
      });

      const retryDuration = SentenceEngine.config.retryFeedbackDurationMs || 900;
      setTimeout(() => {
        $$('.duduq-ss-gap[data-retry="true"]').forEach((gap) => delete gap.dataset.retry);
        $$('.duduq-ss-token[data-retry="true"]').forEach((token) => delete token.dataset.retry);
      }, retryDuration);

      Events.dispatchEvent(new CustomEvent("answer",{detail:{stageId:stage.id,...result}}));
    }
  };

  const SentenceRenderer = {
    speakerIcon() {
      return `<svg viewBox="0 0 24 24" width="23" height="23" fill="none" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" fill="currentColor"/><path d="M15 8.5c1.3 1.8 1.3 5.2 0 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 6c2.7 3.4 2.7 8.6 0 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
    },
    mascot(state,size,src) {
      return `<figure class="duduq-mascot" data-state="${state}" data-size="${size}" data-reduced-motion="false">
        <div class="duduq-mascot-body"><img src="${src}" alt="Mascote DuduQ" draggable="false"></div>
      </figure>`;
    },
    instruction(stage) {
      const hasAudio = Boolean(stage.listening?.text || stage.instructionSpoken);
      return `<section class="duduq-matching-instruction" data-has-image="false" aria-label="InstruÃ§Ã£o">
        <h2 class="duduq-matching-display">${Utilities.escape(stage.instruction)}</h2>
        ${hasAudio ? `<span class="duduq-ts-audio-shell" data-playing="false" data-attention="${GameState.attention}">
          <span class="duduq-ts-audio-waves" aria-hidden="true"><span class="duduq-ts-audio-wave"></span><span class="duduq-ts-audio-wave"></span></span>
          <button type="button" class="duduq-ts-audio-button" data-playing="false" aria-label="Ouvir instruÃ§Ã£o">${this.speakerIcon()}</button>
        </span>` : `<span class="duduq-ts-audio-shell" aria-hidden="true"></span>`}
      </section>`;
    },
    meta(stage) {
      const chips = [];
      if (stage.timeLimitSeconds) chips.push(`<span class="duduq-ss-chip">Tempo <strong>${stage.timeLimitSeconds}s</strong></span>`);
      if (stage.maxAttempts) chips.push(`<span class="duduq-ss-chip">Tentativas <strong>${GameState.attempts}/${stage.maxAttempts}</strong></span>`);
      if (stage.category) chips.push(`<span class="duduq-ss-chip">${Utilities.escape(stage.category)}</span>`);
      return chips.length ? `<div class="duduq-ss-meta">${chips.join("")}</div>` : "";
    },
    segment(stage, seg) {
      if (seg.type === "text") return `<span class="duduq-ss-text">${Utilities.escape(seg.text)}</span>`;
      if (seg.type === "highlight") return `<span class="duduq-ss-highlight">${Utilities.escape(seg.text)}</span>`;
      if (seg.type === "image") {
        const src = seg.src || Assets.media[seg.assetKey] || "";
        return `<img class="duduq-ss-inline-image" src="${src}" alt="${Utilities.escape(seg.alt || "")}">`;
      }
      if (seg.type === "gap") {
        const value = GameState.answers[seg.id] || "";
        const active = GameState.activeGapId === seg.id || (!GameState.activeGapId && GapEngine.firstEmpty(stage) === seg.id);
        const typing = stage.interaction?.type === "typing" || stage.mode === "typing" || (stage.mode === "listening" && stage.responseMode === "typing");
        if (typing) {
          const safe = Utilities.escape(value);
          return `<input class="duduq-ss-input" data-gap-id="${Utilities.escape(seg.id)}" value="${safe}" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Digite a resposta">`;
        }
        const reorderable = ReorderEngine.enabled(stage);
        const moving = GameState.movingGapId === seg.id;
        const reorderTarget = Boolean(GameState.movingGapId && GameState.movingGapId !== seg.id);
        const label = value
          ? (reorderable
              ? `Palavra ${Utilities.escape(value)}. Toque para selecionar e reorganizar.`
              : `Lacuna preenchida com ${Utilities.escape(value)}. Toque para remover.`)
          : (reorderable && GameState.movingGapId
              ? "Espaço de destino. Toque para mover a palavra selecionada."
              : "Lacuna vazia");

        return `<button type="button" class="duduq-ss-gap" data-gap-id="${Utilities.escape(seg.id)}" data-active="${active}" data-filled="${Boolean(value)}" data-correct="${GameState.feedback === "success"}" data-moving="${moving}" data-reorder-target="${reorderTarget}" aria-pressed="${moving}" aria-label="${label}"><span class="duduq-ss-gap-text">${value ? Utilities.escape(value) : "&nbsp;"}</span></button>`;
      }
      return "";
    },
    bank(stage) {
      if (
        stage.interaction?.type === "typing" ||
        stage.mode === "typing" ||
        (stage.mode === "listening" && stage.responseMode === "typing")
      ) return "";

      let values = [];

      if (stage.wordBank) {
        values = WordEngine.bank(stage);
      } else {
        const activeId =
          GameState.activeGapId ||
          GapEngine.firstEmpty(stage) ||
          stage.gaps?.[0]?.id;

        const gap =
          (stage.gaps || []).find(g => g.id === activeId) ||
          stage.gaps?.[0];

        values = Array.isArray(gap?.options)
          ? [...gap.options]
          : [];

        if (
          stage.interaction?.lockOptionOrder !== true &&
          values.length > 1
        ) {
          const key =
            `${stage.id}::${activeId || "gap"}::${values.join("\u0001")}`;

          if (!Array.isArray(GameState.optionOrder[key])) {
            GameState.optionOrder[key] =
              Utilities.antiRepeatShuffle(values, key);
          }

          values = [...GameState.optionOrder[key]];
        }
      }

      const occurrenceMap = {};
      const tokens = values.map(word => {
        const idx = occurrenceMap[word] || 0;
        occurrenceMap[word] = idx + 1;

        const used = stage.wordBank
          ? WordEngine.isUsed(stage, word, idx)
          : Object.values(GameState.answers).includes(word);

        const correctUsed =
          used && GameState.feedback === "success";

        return `<button type="button" class="duduq-ss-token" data-word="${Utilities.escape(word)}" data-used="${used}" data-correct="${correctUsed}" ${used ? "disabled" : ""}>${Utilities.escape(word)}</button>`;
      }).join("");

      return `<div class="duduq-ss-options-panel" data-count="${values.length}">
        <div class="duduq-ss-bank" role="group" aria-label="Escolha uma resposta">${tokens}</div>
      </div>`;
    },
    helper(stage) {
      if (
        stage.interaction?.type === "typing" ||
        stage.mode === "typing" ||
        (stage.mode === "listening" && stage.responseMode === "typing")
      ) return "";

      const text = stage.wordBank
        ? (
            GameState.movingGapId
              ? "Escolha o novo espaço."
              : "Toque nas palavras na ordem correta."
          )
        : "Escolha uma palavra.";

      return `<p class="duduq-ss-helper">${Utilities.escape(text)}</p>`;
    },
    board(stage) {
      const separateContext = stage.segments.some(s => s.type === "image") && stage.mode === "complete-image";
      const sentenceSegments = separateContext ? stage.segments.filter(s => s.type !== "image") : stage.segments;
      const context = separateContext ? `<div class="duduq-ss-context">${stage.segments.filter(s=>s.type==="image").map(s=>`<img src="${s.src || Assets.media[s.assetKey] || ""}" alt="${Utilities.escape(s.alt || "")}">`).join("")}</div>` : "";
      return `<div class="duduq-ss-board" data-mode="${stage.mode}">
        ${context}
        <div class="duduq-ss-sentence-card" data-success="${GameState.successAnimation}">
          <i class="duduq-ss-spark"></i><i class="duduq-ss-spark"></i><i class="duduq-ss-spark"></i>
          <i class="duduq-ss-confetti"></i><i class="duduq-ss-confetti"></i><i class="duduq-ss-confetti"></i><i class="duduq-ss-confetti"></i><i class="duduq-ss-confetti"></i><i class="duduq-ss-confetti"></i><i class="duduq-ss-confetti"></i>
          <div class="duduq-ss-sentence">${sentenceSegments.map(seg => this.segment(stage,seg)).join("")}</div>
        </div>
        ${this.bank(stage)}
      </div>`;
    }
  };

  const SentenceEngine = {
    config: null,
    stage() { return this.config.stages[GameState.stageIndex]; },
    init() {
      this.config = Config.parse();
      this.bindHeader();
      this.resetStageState();
      this.render();
      InteractionManager.touch(false);
    },
    resetStageState() {
      GameState.answers = {};
      GameState.activeGapId = null;
      GameState.movingGapId = null;
      GameState.feedback = "idle";
      GameState.attempts = 0;
      GameState.successAnimation = false;
      GameState.attention = false;
      GameState.optionOrder = {};
      AudioManager.cancel();
    },
    bindHeader() {
      $("#restartButton").addEventListener("click", () => this.restart());
      $("#fullscreenButton").addEventListener("click", () => this.toggleFullscreen());
      document.addEventListener("fullscreenchange", () => this.syncFullscreen());
    },
    syncFullscreen() {
      const btn = $("#fullscreenButton");
      const active = Boolean(document.fullscreenElement);
      btn.setAttribute("aria-pressed", String(active));
      $(".duduq-engine-fullscreen-icon", btn).textContent = active ? "🗗" : "⛶";
      btn.setAttribute("aria-label", active ? "Sair da tela cheia" : "Abrir em tela cheia");
    },
    async toggleFullscreen() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen?.();
        else await document.documentElement.requestFullscreen?.({navigationUI:"hide"});
      } catch (err) { console.warn("Fullscreen indisponível:", err); }
    },
    restart() {
      GameState.presentationEpoch += 1;
      GameState.stageIndex = 0; GameState.completed = new Set(); GameState.lessonComplete = false;
      this.resetStageState(); FeedbackManager.node().hidden = true; this.render(); ProgressManager.update();
    },
    advance() {
      const total = this.config.stages.length;
      if (GameState.stageIndex >= total - 1) {
        if (this.config.hostedByDuduQ === true) {
          return;
        }
        GameState.lessonComplete = true;
        window.DuduQSound?.play("win", { volume: 0.64, minGapMs: 1800, exclusive: true });
        this.renderComplete();
        return;
      }
      GameState.stageIndex += 1;
      this.resetStageState();
      FeedbackManager.node().hidden = true;
      this.render();
      ProgressManager.update();
      InteractionManager.touch(false);
    },
    render() {
      if (GameState.lessonComplete) return this.renderComplete();
      const stage = this.stage();
      if (!GameState.activeGapId) GameState.activeGapId = GapEngine.firstEmpty(stage);
      const stageEl = $(".duduq-engine-stage");
      stageEl.innerHTML = `<div class="duduq-ss-root" data-mode="${stage.mode}">
        <div class="duduq-ss-surface">
          ${SentenceRenderer.instruction(stage)}
          ${SentenceRenderer.meta(stage)}
          ${SentenceRenderer.board(stage)}
          ${SentenceRenderer.helper(stage)}
          <div class="duduq-ss-action-slot duduq-matching-action-slot" data-feedback-state="${GameState.feedback}">
            <button type="button" class="duduq-matching-primary" ${AnswerEngine.ready(stage) ? "" : "disabled"}>CONFIRMAR</button>
          </div>
          <output class="duduq-ss-live" aria-live="polite" aria-atomic="true"></output>
        </div>
      </div>`;
      this.bindStage(stage);
      ProgressManager.update();
      AudioManager.sync();
      if (stage.listening?.autoPlay) setTimeout(() => ListeningEngine.play(stage), 420);
      SmartDragAdapter.attach(stage);
    },
    bindStage(stage) {
      const audioBtn = $(".duduq-ts-audio-button");
      if (audioBtn) audioBtn.addEventListener("click", () => { InteractionManager.touch(); ListeningEngine.play(stage); });
      $$(".duduq-ss-gap").forEach(gap => gap.addEventListener("click", () => {
        const id = gap.dataset.gapId;

        if (ReorderEngine.handleGap(stage, id)) {
          return;
        }

        if (GameState.answers[id]) {
          GapEngine.remove(stage,id);
        } else {
          GapEngine.select(stage,id);
        }
      }));
      $$(".duduq-ss-token").forEach(token => token.addEventListener("click", () => {
        const word = token.dataset.word;
        if (stage.wordBank) WordEngine.use(stage,word);
        else AnswerEngine.choose(stage,word);
      }));
      $$(".duduq-ss-input").forEach(input => {
        input.addEventListener("input", () => AnswerEngine.input(stage,input.dataset.gapId,input.value));
        input.addEventListener("keydown", e => { if (e.key === "Enter") AnswerEngine.submit(stage); });
      });
      $(".duduq-matching-primary")?.addEventListener("click", () => AnswerEngine.submit(stage));
    },
    renderComplete() {
      ProgressManager.update();
      $(".duduq-engine-stage").innerHTML = `<section class="duduq-engine-complete" role="status">
        ${SentenceRenderer.mascot("complete","complete",Assets.mascots.complete)}
        <h2>Parabéns! Lição concluída</h2>
        <p>Você completou ${this.config.stages.length} de ${this.config.stages.length} etapas da Smart Sentence.</p>
        <button type="button" class="duduq-engine-button" id="playAgainButton">Jogar novamente</button>
      </section>`;
      FeedbackManager.node().hidden = true;
      $("#playAgainButton").addEventListener("click", () => this.restart());
      const trail = $(".duduq-progress-trail");
      if (trail) {
        trail.style.setProperty("--lesson-progress", "1");
        trail.dataset.complete = "true";
        trail.setAttribute("aria-valuenow", String(this.config.stages.length));
        trail.setAttribute("aria-valuetext", `${this.config.stages.length} de ${this.config.stages.length} etapas concluídas`);
      }
      $(".duduq-progress-copy strong").textContent = `${this.config.stages.length} de ${this.config.stages.length} etapas`;
    }
  };

  const PublicAPI = {
    SentenceEngine, SentenceRenderer, GapEngine, ReorderEngine, WordEngine, AnswerEngine, ValidationEngine,
    ListeningEngine, AudioManager, InteractionManager, AnimationEngine, FeedbackManager,
    ProgressManager, GameState, Config, Events, Utilities, SmartDragAdapter,
    ready: false,
    initError: null
  };

  window.DUDUQ_SMART_SENTENCE = PublicAPI;

  try {
    SentenceEngine.init();
    PublicAPI.ready = true;
  } catch (error) {
    PublicAPI.initError =
      error instanceof Error
        ? error.message
        : String(error);

    console.error(error);

    root.innerHTML = `<div style="max-width:760px;margin:40px auto;padding:20px;border:2px solid #ef9a9a;border-radius:18px;background:#fff;color:#8b1e1e;font-weight:800">
      Não foi possível iniciar a Smart Sentence.<br><br>${Utilities.escape(PublicAPI.initError)}
    </div>`;
  }
})();

  </script>
