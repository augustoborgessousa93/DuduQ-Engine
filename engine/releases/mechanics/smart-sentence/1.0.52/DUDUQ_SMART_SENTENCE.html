<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />

  <meta name="color-scheme" content="light" />
  <title>DuduQ — Smart Sentence 1.0.1</title>

  <style id="duduq-matching-head-base-exact">

    html, body, #root { width: 100%; min-height: 100%; margin: 0; background: transparent; }
    body { min-height: 100vh; font-family: Nunito, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #duduq-boot { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; color: #164274; font: 800 17px/1.45 ui-rounded, system-ui, sans-serif; text-align: center; background: #F7FBFF; z-index: 99999; }
    #duduq-boot[hidden] { display: none; }
    #duduq-runtime-error { white-space: pre-wrap; max-width: 760px; padding: 20px; border: 2px solid #ef9a9a; border-radius: 18px; background: #fff; color: #8b1e1e; box-shadow: 0 8px 28px rgba(50,70,90,.12); }



/* === DUDUQ GLOBAL OVERRIDES: FULLSCREEN + DUOLINGO PROGRESS === */
.duduq-engine-fullscreen-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 0;
}
.duduq-engine-fullscreen-icon {
  font-size: 17px;
  line-height: 1;
}
.duduq-engine-fullscreen-label {
  white-space: nowrap;
}

.duduq-progress-trail {
  gap: 8px !important;
  padding: 0 !important;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
}
.duduq-progress-trail::before { display: none !important; }
.duduq-progress-copy {
  display: flex !important;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  margin: 0 0 6px !important;
}
.duduq-progress-copy span { display: none !important; }
.duduq-progress-copy strong {
  color: #1D2B53 !important;
  font-family: Fredoka, Nunito, sans-serif !important;
  font-size: clamp(13px, 1.55vw, 18px) !important;
  font-weight: 700 !important;
  letter-spacing: 0 !important;
}
.duduq-progress-track {
  position: relative;
  overflow: hidden !important;
  min-height: 16px !important;
  height: 16px !important;
  border-radius: 999px !important;
  background: linear-gradient(180deg, #E6EEF6 0%, #DCE6F0 100%) !important;
  border: none !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 4px rgba(84,114,146,.15) !important;
}
.duduq-progress-track::after,
.duduq-progress-marker,
.duduq-progress-marker::after {
  display: none !important;
}
.duduq-progress-fill::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(115deg, transparent 18%, rgba(255,255,255,.10) 32%, rgba(255,255,255,.42) 46%, rgba(255,255,255,.16) 58%, transparent 72%);
  background-size: 180% 100%;
  animation: duduqProgressShine 2.6s linear infinite;
  pointer-events: none;
}
.duduq-progress-fill {
  border-radius: inherit !important;
  background: linear-gradient(180deg, #43B3FF 0%, #1592FF 100%) !important;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 1px 2px rgba(10,108,214,.16) !important;
}
.duduq-progress-fill::before {
  content: "";
  position: absolute;
  left: 1px;
  right: 1px;
  top: 1px;
  height: 42%;
  border-radius: 999px;
  background: rgba(255,255,255,.28);
}

@keyframes duduqProgressShine {
  0% { background-position: 140% 0; }
  100% { background-position: -40% 0; }
}

@media (max-width: 640px) {
  .duduq-engine-fullscreen-label { display: none; }
  .duduq-engine-fullscreen-button { min-width: 44px; padding-inline: 12px !important; }
  .duduq-progress-track { min-height: 14px !important; height: 14px !important; }
}


  </style>

  <style id="duduq-smart-sentence-mechanic">
.duduq-ss-root{width:100%;max-width:100%;color:var(--dq-text);font-family:Nunito,ui-rounded,system-ui,sans-serif}
.duduq-ss-surface{
  width:min(1000px,100%);max-width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;
  gap:var(--duduq-standard-block-gap);padding-top:var(--duduq-standard-stage-top-space)
}
.duduq-ss-instruction{
  width:min(760px,100%);min-height:60px;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;justify-items:center;
  gap:12px;padding:8px 14px 10px;margin:0;border:2px solid var(--dq-border-strong);border-radius:999px;background:rgba(255,255,255,.96);
  box-shadow:0 4px 0 var(--dq-depth),0 12px 24px rgba(31,65,99,.07),inset 0 1px 0 #fff
}
.duduq-ss-instruction h2{
  width:100%;margin:0;color:var(--dq-primary);font-family:Fredoka,Nunito,sans-serif;font-size:clamp(18px,2vw,28px);
  font-weight:800;line-height:1.16;letter-spacing:0;text-align:center
}
.duduq-ss-instruction-spacer{width:48px;height:48px}
.duduq-ss-audio-shell{position:relative;width:48px;height:48px;display:grid;place-items:center}
.duduq-ss-audio{
  position:relative;z-index:2;width:48px;height:48px;display:grid;place-items:center;padding:0;border:2px solid var(--dq-primary-depth);border-radius:999px;
  background:linear-gradient(180deg,#1471CF 0%,var(--dq-primary) 72%,#004892 100%);color:#fff;
  box-shadow:0 5px 0 var(--dq-primary-depth),0 10px 18px rgba(0,86,179,.18),inset 0 2px 0 rgba(255,255,255,.36);cursor:pointer
}
.duduq-ss-audio[data-playing="true"]{border-color:#359500;background:linear-gradient(180deg,#70E90E 0%,#58CC02 62%,#49B900 100%);color:#1B5E20;box-shadow:0 5px 0 #2F8A00,0 10px 18px rgba(57,156,0,.20),inset 0 2px 0 rgba(255,255,255,.36)}
.duduq-ss-audio svg{width:23px;height:23px}
.duduq-ss-audio-waves{position:absolute;inset:-7px;pointer-events:none}
.duduq-ss-audio-wave{position:absolute;inset:7px;border:3px solid var(--dq-primary);border-radius:999px;opacity:0}
.duduq-ss-audio-shell[data-playing="true"] .duduq-ss-audio-wave{animation:duduq-ss-wave 1.2s ease-out infinite}
.duduq-ss-audio-wave:nth-child(2){animation-delay:.16s!important}
.duduq-ss-audio-wave:nth-child(3){animation-delay:.32s!important}
.duduq-ss-audio-shell[data-attention="true"]:not([data-playing="true"])::after{content:"";position:absolute;inset:-5px;border:3px solid rgba(0,86,179,.25);border-radius:999px;animation:duduq-ss-attention 1.6s ease-in-out 2}
@keyframes duduq-ss-wave{0%{transform:scale(.76);opacity:.68}100%{transform:scale(1.62);opacity:0}}
@keyframes duduq-ss-attention{0%,100%{transform:scale(.9);opacity:0}50%{transform:scale(1.08);opacity:1}}
.duduq-ss-meta{width:min(900px,100%);display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0}
.duduq-ss-chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 11px;border:1px solid var(--dq-border);border-radius:999px;background:#fff;color:var(--dq-muted);box-shadow:0 2px 0 #d3dde7;font-weight:900;line-height:1}
.duduq-ss-chip strong{color:var(--dq-heading);font-weight:900}
.duduq-ss-board{
  position:relative;width:min(920px,100%);min-width:0;margin:0;padding:clamp(16px,2.4vw,26px);border:2px solid var(--dq-border);border-radius:26px;
  background:radial-gradient(circle at 12% 8%,rgba(239,248,255,.90),transparent 30%),radial-gradient(circle at 86% 90%,rgba(255,248,225,.62),transparent 28%),rgba(255,255,255,.96);
  box-shadow:0 4px 0 var(--dq-depth),0 14px 30px rgba(31,65,99,.075),inset 0 1px 0 #fff
}
.duduq-ss-context{display:flex;justify-content:center;margin-bottom:14px}
.duduq-ss-context img{display:block;width:clamp(104px,13vw,136px);height:clamp(104px,13vw,136px);object-fit:contain}
.duduq-ss-sentence-card{
  position:relative;width:100%;min-height:128px;display:flex;align-items:center;justify-content:center;padding:clamp(18px,3vw,30px);
  border:2px solid #C8D7E7;border-radius:22px;background:rgba(255,255,255,.94);
  box-shadow:inset 0 1px 0 #fff,0 3px 0 #C5D2E0,0 10px 22px rgba(31,65,99,.055);
  animation:duduq-ss-enter 320ms cubic-bezier(.2,.8,.2,1) both
}
.duduq-ss-sentence{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(7px,1vw,11px);
  color:var(--dq-heading);font-family:Fredoka,Nunito,sans-serif;font-size:clamp(24px,3.6vw,42px);font-weight:800;line-height:1.24;text-align:center
}
.duduq-ss-text, .duduq-ss-word, .duduq-ss-gap, .duduq-ss-token{white-space:nowrap;word-break:normal;overflow-wrap:normal;hyphens:none}
.duduq-ss-inline-image{width:clamp(74px,10vw,105px);height:clamp(74px,10vw,105px);object-fit:contain;margin-inline:4px}
.duduq-ss-highlight{padding:3px 8px;border-radius:10px;background:#FFF7D6;color:#6C5100}
.duduq-ss-gap{font-family:inherit;font-size:inherit;font-weight:inherit;line-height:inherit;letter-spacing:inherit;
  position:relative;min-width:clamp(112px,16vw,174px);min-height:58px;display:inline-flex;align-items:center;justify-content:center;padding:5px 13px;
  border:2px dashed #7C8CA3;border-radius:16px;background:linear-gradient(180deg,#FBFDFF,#F2F7FC);color:var(--dq-primary);
  box-shadow:inset 0 1px 0 #fff;cursor:pointer;transition:transform 150ms ease,border-color 160ms ease,box-shadow 160ms ease,background-color 160ms ease
}
.duduq-ss-gap::after{content:"";position:absolute;left:16px;right:16px;bottom:10px;height:3px;border-radius:999px;background:#C5D2E0;opacity:.65}
.duduq-ss-gap[data-active="true"]{border-style:solid;border-color:var(--dq-primary);background:#EFF6FF;box-shadow:0 0 0 4px rgba(0,86,179,.13),0 4px 0 #89ADD2;transform:translateY(-2px)}
.duduq-ss-gap[data-moving="true"]{border-style:solid;border-color:var(--dq-primary);background:linear-gradient(180deg,#F4F9FF 0%,#E7F2FF 100%);box-shadow:0 5px 0 var(--dq-primary-depth),0 0 0 5px rgba(0,86,179,.14),0 12px 20px rgba(0,86,179,.10);transform:translateY(-3px) scale(1.015)}
.duduq-ss-gap[data-reorder-target="true"]{border-style:dashed;border-color:#4C9FFF;background:#F8FBFF;box-shadow:inset 0 0 0 2px rgba(76,159,255,.08)}

.duduq-ss-gap[data-filled="true"]{border-style:solid;border-color:#75A9D8;background:#fff;box-shadow:0 4px 0 #A7BDD2}
.duduq-ss-gap[data-filled="true"]::after{display:none}
.duduq-ss-gap[data-correct="true"]{border-color:#58CC02;background:linear-gradient(180deg,#F2FFE6 0%,#DFF7D0 100%);color:#1B5E20;box-shadow:0 4px 0 #46A302,0 0 0 4px rgba(88,204,2,.16),0 12px 20px rgba(70,163,2,.12);animation:duduq-ss-correct 420ms cubic-bezier(.2,.9,.25,1.2)}
.duduq-ss-gap[data-correct="true"] .duduq-ss-gap-text{color:var(--dq-success-text)}
.duduq-ss-token[data-correct="true"]{border-color:var(--dq-success-border);background:linear-gradient(180deg,#F4FFE9 0%,var(--dq-success-bg) 100%);color:var(--dq-success-text);box-shadow:0 4px 0 var(--dq-success-depth),0 0 0 4px rgba(88,204,2,.12),0 10px 18px rgba(70,163,2,.12);opacity:1;transform:none;filter:none}
.duduq-ss-token[data-correct="true"]:disabled{opacity:1;color:var(--dq-success-text);cursor:default}
.duduq-ss-gap[data-retry="true"]{border-color:var(--dq-retry-border);background:linear-gradient(180deg,#FFF6F6 0%,var(--dq-retry-bg) 100%);color:var(--dq-retry-text);box-shadow:0 4px 0 var(--dq-retry-depth),0 0 0 4px rgba(183,28,28,.10),0 12px 20px rgba(183,28,28,.08);animation:duduq-ss-shake 360ms ease}
.duduq-ss-gap[data-retry="true"] .duduq-ss-gap-text{color:var(--dq-retry-text)}
.duduq-ss-token[data-retry="true"]{border-color:var(--dq-retry-border);background:linear-gradient(180deg,#FFF6F6 0%,var(--dq-retry-bg) 100%);color:var(--dq-retry-text);box-shadow:0 4px 0 var(--dq-retry-depth),0 0 0 4px rgba(183,28,28,.10),0 10px 18px rgba(183,28,28,.08);opacity:1;transform:none;filter:none}
.duduq-ss-token[data-retry="true"]:disabled{opacity:1;color:var(--dq-retry-text);cursor:default}
.duduq-ss-gap-text{font-family:inherit;font-size:inherit;font-weight:inherit;line-height:inherit;letter-spacing:inherit;position:relative;z-index:2;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.duduq-ss-input{
  min-width:clamp(150px,24vw,280px);max-width:min(460px,72vw);min-height:58px;padding:7px 14px;border:2px solid var(--dq-primary);border-radius:16px;background:#fff;
  color:var(--dq-heading);box-shadow:0 4px 0 #89ADD2;font-family:Fredoka,Nunito,sans-serif;font-size:clamp(20px,3vw,34px);font-weight:800;text-align:center;outline:none
}
.duduq-ss-input:focus{box-shadow:0 4px 0 #75A9D8,0 0 0 4px rgba(0,86,179,.13)}
.duduq-ss-divider{height:1px;margin:18px 0;background:linear-gradient(90deg,transparent,#D7E1EA 18%,#D7E1EA 82%,transparent)}
.duduq-ss-bank{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(10px,1.4vw,15px);min-height:76px}
.duduq-ss-token{
  min-height:52px;display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;border:2px solid #7C8CA3;border-radius:16px;background:#fff;color:var(--dq-heading);
  box-shadow:0 4px 0 var(--dq-depth),0 8px 14px rgba(15,23,42,.07);font-family:Fredoka,Nunito,sans-serif;font-size:clamp(17px,2.2vw,22px);font-weight:800;
  cursor:pointer;user-select:none;transition:transform 120ms ease,box-shadow 120ms ease,filter 120ms ease
}
@media (hover:hover) and (pointer:fine){.duduq-ss-token:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.02)}}
.duduq-ss-token:active:not(:disabled){transform:translateY(4px) scale(.985);box-shadow:none}
.duduq-ss-token[data-used="true"]{opacity:.28;transform:scale(.94);pointer-events:none}
.duduq-ss-token[data-selected="true"]{border-color:var(--dq-primary);background:#EFF6FF;box-shadow:0 4px 0 var(--dq-primary-depth),0 0 0 4px rgba(0,86,179,.12)}
.duduq-ss-helper{min-height:18px;margin:16px 0 2px;color:var(--dq-muted);font-size:13px;font-weight:800;line-height:1.35;text-align:center}
.duduq-ss-action-slot{width:min(920px,100%);min-height:88px;display:grid;place-items:start center;margin-top:8px;padding:14px 0 6px}
.duduq-matching-primary{
  width:min(220px,100%);min-height:56px;padding:0 28px;border:2px solid var(--dq-primary-depth);border-radius:18px;
  background:linear-gradient(180deg,#1471CF 0%,var(--dq-primary) 72%,#004892 100%);color:#fff;
  box-shadow:0 6px 0 var(--dq-primary-depth),0 12px 22px rgba(0,86,179,.16),inset 0 2px 0 rgba(255,255,255,.28);
  font-family:Fredoka,Nunito,sans-serif;font-size:19px;font-weight:800;line-height:1;cursor:pointer
}
.duduq-matching-primary:disabled{border-color:var(--dq-disabled-border);background:var(--dq-disabled);color:var(--dq-disabled-text);box-shadow:0 4px 0 var(--dq-disabled-depth);cursor:default}
.duduq-ss-sentence-card[data-success="true"]{animation:duduq-ss-sentence-success 620ms cubic-bezier(.2,.85,.2,1)}
.duduq-ss-spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#FFD43B;opacity:0;pointer-events:none}
.duduq-ss-sentence-card[data-success="true"] .duduq-ss-spark{animation:duduq-ss-spark 650ms ease-out both}
.duduq-ss-spark:nth-child(1){left:16%;top:25%;--x:-26px;--y:-34px}
.duduq-ss-spark:nth-child(2){left:78%;top:28%;--x:32px;--y:-28px}
.duduq-ss-spark:nth-child(3){left:52%;top:72%;--x:8px;--y:30px}
.duduq-ss-confetti{position:absolute;width:10px;height:16px;border-radius:3px;opacity:0;pointer-events:none;transform:translate3d(0,0,0) rotate(0deg)}
.duduq-ss-confetti:nth-child(4){left:14%;top:22%;background:#FFD43B;--cx:-48px;--cy:-92px;--cr:-220deg;animation-delay:0ms}
.duduq-ss-confetti:nth-child(5){left:24%;top:18%;background:#58CC02;--cx:-22px;--cy:-108px;--cr:180deg;animation-delay:40ms}
.duduq-ss-confetti:nth-child(6){left:36%;top:16%;background:#4CC9F0;--cx:-8px;--cy:-96px;--cr:-160deg;animation-delay:90ms}
.duduq-ss-confetti:nth-child(7){left:50%;top:14%;background:#FF7A00;--cx:0px;--cy:-112px;--cr:210deg;animation-delay:20ms}
.duduq-ss-confetti:nth-child(8){left:64%;top:16%;background:#FF5AA5;--cx:18px;--cy:-98px;--cr:-180deg;animation-delay:70ms}
.duduq-ss-confetti:nth-child(9){left:76%;top:18%;background:#7B61FF;--cx:36px;--cy:-108px;--cr:200deg;animation-delay:110ms}
.duduq-ss-confetti:nth-child(10){left:86%;top:22%;background:#58CC02;--cx:56px;--cy:-92px;--cr:-240deg;animation-delay:50ms}
.duduq-ss-sentence-card[data-success="true"] .duduq-ss-confetti{animation:duduq-ss-confetti 900ms cubic-bezier(.16,.84,.24,1) both}
@keyframes duduq-ss-enter{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes duduq-ss-correct{0%{transform:scale(.96)}55%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes duduq-ss-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes duduq-ss-sentence-success{0%,100%{transform:scale(1)}55%{transform:scale(1.012);box-shadow:0 4px 0 #B8D5A8,0 0 0 5px rgba(88,204,2,.08)}}
@keyframes duduq-ss-spark{0%{opacity:.95;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.1)}}
@keyframes duduq-ss-confetti{0%{opacity:0;transform:translate3d(0,-8px,0) rotate(0deg) scale(.8)}15%{opacity:1}100%{opacity:0;transform:translate3d(var(--cx),var(--cy),0) rotate(var(--cr)) scale(1)}}
.duduq-ss-live{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

<!-- DUDUQ CANARY 027 â€” PRESENTATION ORDER V4 -->
<script id="duduq-presentation-v4">
(function () {
  "use strict";
  if (window.DuduQPresentationV4) return;

  const SESSION_SLOT = "__DUDUQ_PRESENTATION_SESSION_V4__";
  const MEMORY_SLOT = "__DUDUQ_PRESENTATION_STATE_V4__";

  function sessionId() {
    if (window[SESSION_SLOT]) return window[SESSION_SLOT];
    let value = "";
    try {
      if (globalThis.crypto?.getRandomValues) {
        const data = new Uint32Array(2);
        globalThis.crypto.getRandomValues(data);
        value = data[0].toString(36) + "-" + data[1].toString(36);
      }
    } catch (_) {}
    if (!value) {
      value = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
    }
    try {
      Object.defineProperty(window, SESSION_SLOT, {
        value,
        configurable: true
      });
    } catch (_) {
      window[SESSION_SLOT] = value;
    }
    return value;
  }

  function memoryStore() {
    if (window[MEMORY_SLOT]) return window[MEMORY_SLOT];
    const store = Object.create(null);
    try {
      Object.defineProperty(window, MEMORY_SLOT, {
        value: store,
        configurable: true
      });
    } catch (_) {
      window[MEMORY_SLOT] = store;
    }
    return store;
  }

  function sameMembers(a, b) {
    if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
    const left = a.map(String).sort();
    const right = b.map(String).sort();
    return left.every((value, index) => value === right[index]);
  }

  function safeRandom(random) {
    try {
      const value = Number(random());
      if (Number.isFinite(value) && value >= 0 && value < 1) return value;
    } catch (_) {}
    return Math.random();
  }

  function shuffle(values, random) {
    const out = [...values];
    for (let index = out.length - 1; index > 0; index -= 1) {
      const swapIndex = Math.floor(safeRandom(random) * (index + 1));
      [out[index], out[swapIndex]] = [out[swapIndex], out[index]];
    }
    return out;
  }

  function score(candidate, baseline) {
    return candidate.reduce(
      (total, value, index) => total + (String(value) !== String(baseline[index]) ? 1 : 0),
      0
    );
  }

  function signature(values) {
    return values.map(String).join("\u0001");
  }

  function readState(storageKey, source) {
    const memory = memoryStore();
    const cached = memory[storageKey];
    if (cached && sameMembers(cached.order, source)) return cached;
    try {
      const parsed = JSON.parse(localStorage.getItem(storageKey) || "null");
      if (parsed && sameMembers(parsed.order, source)) {
        memory[storageKey] = parsed;
        return parsed;
      }
    } catch (_) {}
    return null;
  }

  function writeState(storageKey, state) {
    memoryStore()[storageKey] = state;
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
    } catch (_) {}
  }

  function order(values, key, random = Math.random, epochToken = null) {
    const source = [...values];
    if (source.length < 2) return source;

    const storageKey = "duduq:presentation:v4:" + String(key);
    const previousState = readState(storageKey, source);

    let sample = 0;
    if (epochToken === null || epochToken === undefined) {
      sample = Math.floor(safeRandom(random) * 4294967296) >>> 0;
    }

    const marker =
      sessionId() + ":" +
      (epochToken === null || epochToken === undefined
        ? sample.toString(36)
        : String(epochToken));

    if (
      previousState &&
      previousState.marker === marker &&
      sameMembers(previousState.order, source)
    ) {
      return [...previousState.order];
    }

    const baseline =
      previousState && sameMembers(previousState.order, source)
        ? [...previousState.order]
        : [...source];

    const recentHistory = Array.isArray(previousState?.history)
      ? previousState.history.slice(0, 8)
      : previousState?.order
        ? [signature(previousState.order)]
        : [];
    const recent = new Set(recentHistory);

    let best = [...source];
    let bestScore = score(best, baseline);
    let bestNovel = recent.has(signature(best)) ? 0 : 1;

    for (let attempt = 0; attempt < 64; attempt += 1) {
      const candidate = shuffle(source, random);
      const candidateScore = score(candidate, baseline);
      const candidateNovel = recent.has(signature(candidate)) ? 0 : 1;
      if (
        candidateScore > bestScore ||
        (candidateScore === bestScore && candidateNovel > bestNovel)
      ) {
        best = candidate;
        bestScore = candidateScore;
        bestNovel = candidateNovel;
      }
      if (candidateScore === source.length && candidateNovel === 1) break;
    }

    /*
      Para alternativas unicas sempre existe uma rotacao sem posicoes fixas.
      Ela funciona como fallback deterministico e tambem amplia a diversidade
      quando a amostragem aleatoria cai em uma ordem usada recentemente.
      Com duas alternativas, a troca e obrigatoria por limitacao combinatoria.
    */
    for (let shift = 1; shift < source.length; shift += 1) {
      const rotated = baseline.map(
        (_, index) => baseline[(index + shift) % baseline.length]
      );
      const rotatedScore = score(rotated, baseline);
      const rotatedNovel = recent.has(signature(rotated)) ? 0 : 1;
      if (
        rotatedScore > bestScore ||
        (rotatedScore === bestScore && rotatedNovel > bestNovel)
      ) {
        best = rotated;
        bestScore = rotatedScore;
        bestNovel = rotatedNovel;
      }
      if (bestScore === source.length && bestNovel === 1) break;
    }

    const bestSignature = signature(best);
    const history = [
      bestSignature,
      ...recentHistory.filter((entry) => entry !== bestSignature)
    ].slice(0, 8);

    const state = {
      marker,
      order: [...best],
      history,
      savedAt: Date.now()
    };
    writeState(storageKey, state);
    return [...best];
  }

  window.DuduQPresentationV4 = Object.freeze({
    version: "4.0.0",
    order,
    sessionId
  });
})();
</script>

(function () {
  if (window.DuduQAssets && window.DuduQAssets.version === "1.0.0") return;

  const ASSETS = Object.freeze({
    version: "1.0.0",
    repository: "augustoborgessousa93/Assets-DuduQ",
    mascots: Object.freeze({
      idle: "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/DUDUQ_IDLE.png",

      complete: "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Duduq_Li%C3%A7%C3%A3o%20concluida.png"
    }),
    sounds: Object.freeze({
      "bubble-pop": "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/bubble-pop.mp3",
      click: "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/click.mp3",

      pop: "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/pop.mp3",
      win: "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/you%20win.mp3"
    }),
    backgrounds: Object.freeze({
      "1": "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/1%C2%BA%20ano%20-whispering-woods.png",
      "2": "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/2%C2%BA%20ano%20-chroma-canyons.png",
      "3": "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/3%C2%BA%20ano%20-clockwork-valley.png",
      "4": "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/4%C2%BA%20ano%20-papercraft-campus.png",
      "5": "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/5%C2%BA%20ano%20-sky-lab.png"
    })
  });

  function normalizeYear(value) {
    const match = String(value == null ? "" : value).match(/[1-5]/);
    return match ? match[0] : "";
  }

  function applyYear(value) {
    const year = normalizeYear(value);
    if (!year || !ASSETS.backgrounds[year] || !document.body) return false;
    document.documentElement.setAttribute("data-duduq-ano-ativo", year);
    document.body.style.backgroundImage = 'url("' + ASSETS.backgrounds[year] + '")';
    document.body.style.backgroundPosition = "center top";
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundRepeat = "no-repeat";
    return true;
  }

  window.DUDUQ_ASSETS = ASSETS;
  window.DuduQAssets = Object.freeze({
    version: "1.0.0",
    assets: ASSETS,
    setYear: applyYear,
    getYear: function () {
      return document.documentElement.getAttribute("data-duduq-ano-ativo") || null;
    }
  });

  const params = new URLSearchParams(window.location.search);
  const requestedYear =
    params.get("ano") || params.get("year") || params.get("serie") || params.get("série") ||
    document.documentElement.getAttribute("data-duduq-ano") || window.DUDUQ_ANO;
  applyYear(requestedYear);
})();

<script id="duduq-sound-system-v1">
/* DUDUQ SOUND SYSTEM V1 — camada sonora padronizada, sem alteração visual/mecânica. */
(function () {
  if (window.DuduQSound && window.DuduQSound.version === "1.0.0") return;

  const SOURCES = window.DUDUQ_ASSETS.sounds;
  const DEFAULT_VOLUME = {"click":0.22,"pop":0.30,"bubble-pop":0.46,"ding":0.40,"correct":0.56,"error":0.48,"win":0.64};
  const DEFAULT_GAP = {"click":55,"pop":70,"bubble-pop":110,"ding":100,"correct":1200,"error":520,"win":1800};
  const channels = new Map();
  const lastPlay = new Map();
  let gestureUnlocked = false;

  Object.entries(SOURCES).forEach(([name, src]) => {
    try {
      const audio = new Audio(src);
      audio.preload = "auto";
      audio.volume = DEFAULT_VOLUME[name] || 0.5;
      channels.set(name, audio);
    } catch (_) {}
  });

  function stop(name) {
    const audio = channels.get(name);
    if (!audio) return;
    try { audio.pause(); audio.currentTime = 0; } catch (_) {}
  }

  function stopAll() { channels.forEach((_, name) => stop(name)); }

  function unlockAllFromGesture() {
    if (gestureUnlocked) return;
    gestureUnlocked = true;
    channels.forEach((audio) => {
      const oldMuted = audio.muted;
      const oldVolume = audio.volume;
      try {
        audio.muted = true;
        audio.currentTime = 0;
        const result = audio.play();
        const finish = () => {
          try { audio.pause(); audio.currentTime = 0; } catch (_) {}
          audio.muted = oldMuted;
          audio.volume = oldVolume;
        };
        if (result && typeof result.then === "function") result.then(() => window.setTimeout(finish, 0)).catch(() => finish());
        else finish();
      } catch (_) {
        audio.muted = oldMuted;
        audio.volume = oldVolume;
      }
    });
    document.removeEventListener("pointerdown", unlockAllFromGesture, true);
    document.removeEventListener("keydown", unlockAllFromGesture, true);
  }

  document.addEventListener("pointerdown", unlockAllFromGesture, true);
  document.addEventListener("keydown", unlockAllFromGesture, true);

  function start(name, options = {}) {
    const audio = channels.get(name);
    if (!audio) return null;
    const now = (window.performance && performance.now) ? performance.now() : Date.now();
    const minGapMs = Number.isFinite(options.minGapMs) ? options.minGapMs : (DEFAULT_GAP[name] || 0);
    const previous = lastPlay.get(name) || -Infinity;
    if (now - previous < minGapMs) return null;
    lastPlay.set(name, now);

    try {
      audio.pause();
      audio.currentTime = 0;
      audio.muted = false;
      audio.volume = Math.max(0, Math.min(1, Number.isFinite(options.volume) ? options.volume : (DEFAULT_VOLUME[name] || 0.5)));
      if (Number.isFinite(options.playbackRate)) audio.playbackRate = options.playbackRate;
      else audio.playbackRate = 1;
      const promise = audio.play();
      if (promise && typeof promise.catch === "function") promise.catch(() => {});
    } catch (_) {}
    return audio;
  }

  function play(name, options = {}) {
    const aliases = {"you win":"win","you-win":"win","bubblePop":"bubble-pop"};
    const normalized = aliases[name] || name;
    const delayMs = Number(options.delayMs) || 0;
    if (delayMs > 0) { window.setTimeout(() => start(normalized, options), delayMs); return null; }
    return start(normalized, options);
  }

  function isRestartControl(button) {
    const text = `${button.id || ""} ${button.className || ""} ${button.getAttribute?.("aria-label") || ""} ${button.textContent || ""}`.toLowerCase();
    return /restart|recome|reinici|jogar novamente|play again/.test(text);
  }

  window.DuduQSound = Object.freeze({version:"1.0.0",play,stop,stopAll,sources:Object.freeze({...SOURCES})});

  document.addEventListener("click", function (event) {
    const target = event.target instanceof Element ? event.target : null;
    const button = target?.closest?.("button, [role='button']");
    if (!button) return;
    if (button.disabled || button.getAttribute("aria-disabled") === "true" || button.dataset.duduqSound === "none") return;
    if (isRestartControl(button)) stop("win");
    if (button.matches(".duduq-bp-bubble, .duduq-ts-target, .duduq-mq-card, .duduq-ws-object")) return;
    play("click", {volume:0.22,minGapMs:55});
  }, true);
})();
</script>

    .duduq-dd-action-slot[data-feedback-state="retry"],
  .duduq-engine-stage
    .duduq-dd-action-slot[data-feedback-state="success"] {
    min-height: 0;
    height: 0;
    padding: 0;
    overflow: hidden;
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note) {
    min-height: 62px;
    gap: 2px;
    padding: 5px 12px 8px;
    border-color: #dfe7f0;
    background: rgba(248, 250, 252, .72);
    box-shadow: none;
    transition:
      min-height 180ms ease,
      padding 180ms ease,
      background-color 180ms ease,
      border-color 180ms ease;
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note)
    .duduq-dd-pool-head {
    min-height: 24px;
    padding-block: 0;
    color: #68778a;
    font-size: .82rem;
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note)
    .duduq-dd-pool-items {
    min-height: 24px;
    padding: 0 4px 2px;
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note)
    .duduq-dd-empty-note {
    color: #6b7a8e;
    font-size: .82rem;
    font-weight: 750;
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note)
    .duduq-dd-empty-note::before {
    content: "\u2713 ";
    color: var(--engine-success-bright);
    font-weight: 1000;
  }

  .duduq-star-burst {
    position: fixed;
    z-index: 8000;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .duduq-star-burst[data-origin="mascot"] {
    position: absolute;
    z-index: 6;
    inset: -115%;
    overflow: visible;
  }

  .duduq-star-burst[data-origin="mascot"] .duduq-star-particle {
    left: 50%;
    top: 50%;
    font-size: 15px;
  }

  .duduq-star-burst[data-origin="mascot"][data-variant="lesson"]
    .duduq-star-particle {
    top: 50%;
    font-size: 18px;
  }

  .duduq-star-particle {
    position: absolute;
    left: 50%;
    top: 58%;
    color: #f6c944;
    font-size: 18px;
    line-height: 1;
    opacity: 0;
    filter: drop-shadow(0 2px 2px rgba(78, 59, 0, 0.14));
    animation: duduq-star-pop 980ms cubic-bezier(.16, .78, .22, 1) var(--star-delay) both;
  }

  .duduq-star-burst[data-variant="lesson"] .duduq-star-particle {
    top: 46%;
    font-size: 20px;
    animation-duration: 1250ms;
  }

  .duduq-star-particle:nth-child(4n + 2) { color: #58cc02; }
  .duduq-star-particle:nth-child(4n + 3) { color: #64a8ff; }
  .duduq-star-particle:nth-child(4n + 4) { color: #ffffff; }

  @keyframes duduq-star-pop {
    0% {
      transform: translate(-50%, -50%) scale(.35) rotate(0deg);
      opacity: 0;
    }
    18% { opacity: .95; }
    100% {
      transform:
        translate(
          calc(-50% + var(--star-x)),
          calc(-50% + var(--star-y))
        )
        scale(.9)
        rotate(var(--star-rotation));
      opacity: 0;
    }
  }

  .duduq-engine-complete {
    position: relative;
    overflow: hidden;
    gap: 10px;
    border: 2px solid #d6ead7;
    background:
      radial-gradient(circle at 50% 26%, rgba(88, 204, 2, 0.15), transparent 35%),
      linear-gradient(180deg, #ffffff, #f7fcf6);
    box-shadow:
      0 7px 0 #d4e8d6,
      0 20px 42px rgba(24, 96, 46, 0.11);
  }

  .duduq-engine-complete-emblem {
    display: grid;
    width: 94px;
    height: 94px;
    margin-bottom: 4px;
    place-items: center;
    border: 3px solid #84dc67;
    border-radius: 50%;
    background: linear-gradient(180deg, #f9fff8, #e7f8e4);
    color: var(--engine-success);
    box-shadow:
      0 7px 0 #63bf45,
      0 18px 32px rgba(54, 169, 0, 0.18);
    font-size: 2.7rem;
    font-weight: 1000;
  }

  .duduq-engine-complete-reward {
    margin-bottom: 8px;
    color: #82620a;
    font-weight: 900;
  }


  /* Host 1.0.11 HTML QA FIX \u2014 hierarquia compacta e anima\xE7\xF5es disciplinadas */
  .duduq-engine-header-main {
    display: flex;
    min-width: 0;
    align-items: center;
    gap: 12px;
  }

  .duduq-mascot {
    position: relative;
    flex: 0 0 auto;
    margin: 0;
    pointer-events: none;
    user-select: none;
  }

  .duduq-mascot-body {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    transform-origin: 50% 84%;
    will-change: transform;
  }

  .duduq-mascot[data-state="idle"] .duduq-mascot-body {
    animation: duduq-mascot-breathe 3.8s ease-in-out infinite;
  }

  .duduq-mascot[data-state="success"] .duduq-mascot-body {
    animation:
      duduq-mascot-success-pop 560ms cubic-bezier(.16, .82, .24, 1) both,
      duduq-mascot-breathe 3.6s ease-in-out 620ms infinite;
  }

  .duduq-mascot[data-state="retry"] .duduq-mascot-body {
    animation:
      duduq-mascot-shake 480ms cubic-bezier(.36, .07, .19, .97) both,
      duduq-mascot-breathe 3.9s ease-in-out 560ms infinite;
  }

  .duduq-mascot[data-state="transition"] .duduq-mascot-body {
    animation:
      duduq-mascot-transition 720ms cubic-bezier(.16, .82, .24, 1) both,
      duduq-mascot-breathe 3.5s ease-in-out 760ms infinite;
  }

  .duduq-mascot[data-state="complete"] .duduq-mascot-body {
    animation:
      duduq-mascot-complete-pop 680ms cubic-bezier(.16, .82, .24, 1) both,
      duduq-mascot-breathe 3.5s ease-in-out 720ms infinite;
  }

  .duduq-mascot[data-reduced-motion="true"] .duduq-mascot-body {
    animation: none !important;
    transform: none !important;
  }

  @keyframes duduq-mascot-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    48% { transform: translateY(-2px) scale(1.018, 1.028); }
    56% { transform: translateY(-2px) scale(1.014, 1.022); }
  }

  @keyframes duduq-mascot-success-pop {
    0% { transform: translateY(8px) scale(.82) rotate(-3deg); opacity: .35; }
    58% { transform: translateY(-5px) scale(1.08) rotate(2deg); opacity: 1; }
    78% { transform: translateY(1px) scale(.98) rotate(-1deg); }
    100% { transform: translateY(0) scale(1) rotate(0); }
  }

  @keyframes duduq-mascot-shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    16% { transform: translateX(-5px) rotate(-2deg); }
    32% { transform: translateX(5px) rotate(2deg); }
    48% { transform: translateX(-4px) rotate(-1.5deg); }
    64% { transform: translateX(4px) rotate(1.5deg); }
    80% { transform: translateX(-2px) rotate(-.75deg); }
  }

  @keyframes duduq-mascot-transition {
    0% { transform: translateX(-8px) scale(.92) rotate(-3deg); opacity: .25; }
    56% { transform: translateX(5px) scale(1.04) rotate(2deg); opacity: 1; }
    78% { transform: translateX(-1px) scale(.99) rotate(-.5deg); }
    100% { transform: translateX(0) scale(1) rotate(0); }
  }

  @keyframes duduq-mascot-complete-pop {
    0% { transform: translateY(14px) scale(.78); opacity: 0; }
    55% { transform: translateY(-7px) scale(1.08); opacity: 1; }
    76% { transform: translateY(2px) scale(.98); }
    100% { transform: translateY(0) scale(1); }
  }

  .duduq-mascot[data-size="idle"] { width: 54px; height: 54px; }
  .duduq-mascot[data-size="feedback"] { width: 74px; height: 74px; }
  .duduq-mascot[data-size="transition"] { width: 96px; height: 96px; }
  .duduq-mascot[data-size="complete"] { width: 154px; height: 154px; }

  .duduq-mascot-body,
  .duduq-mascot img,
  .duduq-mascot-placeholder {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .duduq-mascot-placeholder {
    position: relative;
    display: grid;
    place-items: center;
    overflow: hidden;
    border: 2px dashed #b9c9db;
    border-radius: 36% 36% 42% 42%;
    background:
      radial-gradient(circle at 34% 26%, rgba(255,255,255,.95), transparent 19%),
      linear-gradient(155deg, #f7fbff, #dcecff);
    color: #1764ad;
    box-shadow:
      0 5px 0 #b6cbe0,
      0 12px 22px rgba(31, 90, 145, .12),
      inset 0 2px 0 rgba(255,255,255,.85);
  }

  .duduq-mascot[data-state="success"] .duduq-mascot-placeholder,
  .duduq-mascot[data-state="complete"] .duduq-mascot-placeholder {
    border-color: #8edb72;
    background:
      radial-gradient(circle at 34% 26%, rgba(255,255,255,.95), transparent 19%),
      linear-gradient(155deg, #f7fff4, #dff5d7);
    color: #2d8b20;
    box-shadow:
      0 6px 0 #70bd55,
      0 14px 25px rgba(54, 169, 0, .15),
      inset 0 2px 0 rgba(255,255,255,.9);
  }

  .duduq-mascot[data-state="transition"] .duduq-mascot-placeholder {
    border-color: #83b9ef;
    background:
      radial-gradient(circle at 34% 26%, rgba(255,255,255,.95), transparent 19%),
      linear-gradient(155deg, #f7fbff, #d8ebff);
    color: #0967c9;
    box-shadow:
      0 6px 0 #73a7d8,
      0 14px 25px rgba(9, 103, 201, .15),
      inset 0 2px 0 rgba(255,255,255,.9);
  }

  .duduq-mascot[data-state="retry"] .duduq-mascot-placeholder {
    border-color: #efb48c;
    background:
      radial-gradient(circle at 34% 26%, rgba(255,255,255,.95), transparent 19%),
      linear-gradient(155deg, #fffaf6, #ffe4d2);
    color: #a64b16;
    box-shadow:
      0 6px 0 #dd8a54,
      0 14px 25px rgba(166, 75, 22, .13),
      inset 0 2px 0 rgba(255,255,255,.9);
  }

  .duduq-mascot-monogram {
    font-size: clamp(.75rem, 2vw, 1.15rem);
    font-weight: 1000;
    letter-spacing: -.04em;
  }

  .duduq-mascot[data-size="complete"] .duduq-mascot-monogram {
    font-size: 2rem;
  }

  .duduq-mascot-state-icon {
    position: absolute;
    right: -1px;
    bottom: -1px;
    display: grid;
    width: 34%;
    aspect-ratio: 1;
    place-items: center;
    border: 2px solid #fff;
    border-radius: 999px;
    background: currentColor;
    color: #fff;
    box-shadow: 0 3px 0 rgba(20, 51, 86, .22);
    font-size: clamp(.65rem, 1.4vw, 1rem);
    font-weight: 1000;
  }

  .duduq-engine-feedback-card {
    grid-template-columns: 82px minmax(0, 1fr);
  }

  .duduq-engine-complete-hero {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 158px;
    margin-bottom: 2px;
  }

  .duduq-engine-complete-emblem {
    position: absolute;
    right: calc(50% - 82px);
    bottom: 4px;
    width: 54px;
    height: 54px;
    margin: 0;
    border-width: 2px;
    box-shadow:
      0 5px 0 #63bf45,
      0 12px 22px rgba(54, 169, 0, .17);
    font-size: 1.55rem;
  }

  /* Bot\xF5es f\xEDsicos inspirados em interfaces l\xFAdicas, sem copiar assets propriet\xE1rios. */
  .duduq-engine-button,
  .duduq-engine-stage .duduq-dd-primary {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    border: 2px solid transparent;
    border-radius: 16px;
    transform: translateY(0);
    transition:
      transform 90ms ease,
      filter 140ms ease,
      box-shadow 90ms ease;
    -webkit-tap-highlight-color: transparent;
  }

  .duduq-engine-button::before,
  .duduq-engine-stage .duduq-dd-primary::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 2px 8px auto;
    height: 42%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,.46), rgba(255,255,255,0));
    opacity: .8;
    pointer-events: none;
  }

  .duduq-engine-button::after,
  .duduq-engine-stage .duduq-dd-primary::after {
    content: "";
    position: absolute;
    z-index: 2;
    top: -45%;
    bottom: -45%;
    left: -55%;
    width: 34%;
    transform: rotate(18deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.56), transparent);
    opacity: 0;
    pointer-events: none;
  }

  .duduq-engine-button-primary,
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"] {
    border-color: #0b5db4;
    background: linear-gradient(180deg, #1984e8 0%, #0868cb 72%, #075eb9 100%);
    color: #fff;
    box-shadow:
      0 6px 0 #064a92,
      0 12px 22px rgba(9, 103, 201, .20),
      inset 0 2px 0 rgba(255,255,255,.38);
    text-shadow: 0 1px 0 rgba(0,0,0,.18);
  }

  .duduq-engine-button-secondary {
    border-color: #c6d5e5;
    background: linear-gradient(180deg, #ffffff 0%, #edf4fa 100%);
    color: #24364e;
    box-shadow:
      0 4px 0 #c0cfde,
      0 8px 16px rgba(38, 63, 92, .10),
      inset 0 2px 0 rgba(255,255,255,.95);
  }

  .duduq-engine-button:hover:not(:disabled),
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]:hover {
    filter: brightness(1.05) saturate(1.03);
  }

  .duduq-engine-button-primary:hover::after,
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]:hover::after {
    opacity: .78;
    animation: duduq-button-shine 760ms ease-out both;
  }

  .duduq-engine-button:active:not(:disabled),
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]:active {
    transform: translateY(5px);
    transition-duration: 45ms;
  }

  .duduq-engine-button-primary:active:not(:disabled),
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]:active {
    box-shadow:
      0 1px 0 #064a92,
      0 4px 8px rgba(9, 103, 201, .15),
      inset 0 2px 0 rgba(255,255,255,.25);
  }

  .duduq-engine-button-secondary:active:not(:disabled) {
    box-shadow:
      0 1px 0 #c0cfde,
      0 3px 7px rgba(38, 63, 92, .08),
      inset 0 1px 0 rgba(255,255,255,.8);
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="false"] {
    border-color: #d2dbe5;
    background: linear-gradient(180deg, #edf2f7, #dde5ee);
    color: #7a8797;
    box-shadow:
      0 4px 0 #c6d0dc,
      inset 0 2px 0 rgba(255,255,255,.75);
  }

  @keyframes duduq-button-shine {
    from { transform: translateX(0) rotate(18deg); opacity: 0; }
    20% { opacity: .85; }
    to { transform: translateX(520%) rotate(18deg); opacity: 0; }
  }

  /* Drop zones neutras at\xE9 a valida\xE7\xE3o; verde fica reservado ao acerto confirmado. */
  .duduq-engine-stage .duduq-dd-target,
  .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
    border: 2px dashed #c5d2e1;
    background: rgba(255,255,255,.64);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
  }

  .duduq-engine-stage .duduq-dd-target:has(.duduq-dd-item[data-feedback="correct"]) {
    border: 2px solid #73d454;
    background: #f4fff1;
    box-shadow:
      0 4px 0 #53b837,
      0 10px 20px rgba(54, 169, 0, .11),
      inset 0 2px 0 rgba(255,255,255,.9);
  }

  .duduq-engine-stage .duduq-dd-action-slot {
    position: sticky;
    z-index: 20;
    bottom: 0;
    padding: 16px 0 18px;
    background: linear-gradient(
      to bottom,
      rgba(244,247,251,0),
      rgba(244,247,251,.92) 32%,
      rgba(244,247,251,1) 68%
    );
  }

  /* \xC1udio e Check usam a mesma fam\xEDlia azul; as ondas ficam exclusivas do \xE1udio. */
  .duduq-engine-stage .duduq-dd-audio-shell > button {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    border: 2px solid #0b5db4 !important;
    background: linear-gradient(
      180deg,
      #218bea 0%,
      #0b70d5 70%,
      #0864bf 100%
    ) !important;
    color: #ffffff !important;
    box-shadow:
      0 5px 0 #064a92,
      0 10px 18px rgba(9, 103, 201, .22),
      inset 0 2px 0 rgba(255,255,255,.42) !important;
    transform: translateY(0);
    transition:
      transform 70ms ease,
      filter 140ms ease,
      box-shadow 70ms ease;
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button::before {
    content: "";
    position: absolute;
    inset: 2px 7px auto;
    height: 40%;
    border-radius: 999px;
    background: linear-gradient(
      180deg,
      rgba(255,255,255,.52),
      rgba(255,255,255,0)
    );
    pointer-events: none;
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button:hover:not(:disabled) {
    filter: brightness(1.06) saturate(1.03);
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow:
      0 1px 0 #064a92,
      0 4px 8px rgba(9, 103, 201, .16),
      inset 0 2px 0 rgba(255,255,255,.28) !important;
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button:disabled {
    opacity: .92;
    filter: saturate(.92);
  }

  .duduq-engine-stage .duduq-dd-audio-wave {
    border-color: #1682e5 !important;
  }

  .duduq-engine-stage
    .duduq-dd-audio-shell[data-highlight="true"]::after {
    border-color: rgba(22, 130, 229, .38) !important;
  }

  /* Brilho recorrente e discreto no Check quando ele est\xE1 dispon\xEDvel. */
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]::after {
    opacity: 0;
    animation: duduq-check-glint 3.7s ease-in-out 1s infinite;
  }

  @keyframes duduq-check-glint {
    0%, 62% {
      transform: translateX(0) rotate(18deg);
      opacity: 0;
    }
    69% { opacity: .82; }
    84% {
      transform: translateX(520%) rotate(18deg);
      opacity: 0;
    }
    100% {
      transform: translateX(520%) rotate(18deg);
      opacity: 0;
    }
  }

  /* Continuar \xE9 uma a\xE7\xE3o positiva: verde, f\xEDsica e com convite em onda suave. */
  .duduq-engine-feedback-action {
    border-color: #46ad00;
    background: linear-gradient(
      180deg,
      #68dc18 0%,
      #58cc02 68%,
      #4db900 100%
    );
    color: #ffffff;
    box-shadow:
      0 6px 0 #369600,
      0 12px 22px rgba(54, 169, 0, .22),
      inset 0 2px 0 rgba(255,255,255,.42);
    text-shadow: 0 1px 0 rgba(22, 86, 0, .24);
    animation: duduq-continue-invite 2.8s ease-in-out 1.15s infinite;
  }

  .duduq-engine-feedback-action:hover:not(:disabled) {
    filter: brightness(1.045) saturate(1.04);
    animation-play-state: paused;
  }

  .duduq-engine-feedback-action:focus-visible,
  .duduq-engine-feedback-action:active:not(:disabled) {
    animation-play-state: paused;
  }

  .duduq-engine-feedback-action:active:not(:disabled) {
    transform: translateY(5px);
    box-shadow:
      0 1px 0 #369600,
      0 4px 8px rgba(54, 169, 0, .16),
      inset 0 2px 0 rgba(255,255,255,.28);
  }

  @keyframes duduq-continue-invite {
    0%, 58%, 100% {
      box-shadow:
        0 6px 0 #369600,
        0 12px 22px rgba(54, 169, 0, .22),
        0 0 0 0 rgba(88, 204, 2, 0),
        inset 0 2px 0 rgba(255,255,255,.42);
    }
    72% {
      box-shadow:
        0 6px 0 #369600,
        0 12px 22px rgba(54, 169, 0, .22),
        0 0 0 0 rgba(88, 204, 2, .30),
        inset 0 2px 0 rgba(255,255,255,.42);
    }
    88% {
      box-shadow:
        0 6px 0 #369600,
        0 12px 22px rgba(54, 169, 0, .22),
        0 0 0 11px rgba(88, 204, 2, 0),
        inset 0 2px 0 rgba(255,255,255,.42);
    }
  }

  .duduq-engine-complete::before {
    content: "";
    position: absolute;
    inset: 8% 18% 34%;
    border-radius: 50%;
    background: radial-gradient(
      circle,
      rgba(88, 204, 2, .18),
      rgba(88, 204, 2, 0) 68%
    );
    animation: duduq-complete-halo 3.8s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes duduq-complete-halo {
    0%, 100% { transform: scale(.94); opacity: .62; }
    50% { transform: scale(1.06); opacity: 1; }
  }

  /* Trilha DuduQ: progresso crescente, sem pontuar erros ou velocidade. */
  .duduq-progress-trail {
    position: relative;
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
    min-width: 0;
    padding: 10px 14px 14px;
    overflow: hidden;
    border: 1px solid #cbdced;
    border-radius: 18px;
    background:
      radial-gradient(circle at 10% 0%, rgba(255,255,255,.96), transparent 34%),
      linear-gradient(180deg, #ffffff 0%, #edf6ff 100%);
    box-shadow:
      0 4px 0 #bfd1e3,
      0 10px 22px rgba(31, 79, 126, .10),
      inset 0 1px 0 rgba(255,255,255,.98);
    isolation: isolate;
  }

  .duduq-progress-trail::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      linear-gradient(115deg, transparent 0 38%, rgba(255,255,255,.42) 46%, transparent 54% 100%);
    transform: translateX(-110%);
    animation: duduq-progress-panel-glint 5.6s ease-in-out infinite;
  }

  .duduq-progress-copy {
    display: flex;
    min-width: 0;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding-inline: 2px;
  }

  .duduq-progress-copy span {
    color: #607188;
    font-size: .68rem;
    font-weight: 900;
    letter-spacing: .075em;
    text-transform: uppercase;
  }

  .duduq-progress-copy strong {
    color: #123f70;
    font-size: .92rem;
    font-weight: 1000;
    line-height: 1.15;
    white-space: nowrap;
  }

  .duduq-progress-track {
    position: relative;
    height: 19px;
    min-width: 0;
    margin: 2px 18px 0;
    overflow: visible;
    border: 2px solid #a9c2da;
    border-radius: 999px;
    background:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.22) 0 16px,
        rgba(111,143,176,.08) 16px 18px
      ),
      linear-gradient(180deg, #e8f0f7, #d5e2ee);
    box-shadow:
      0 4px 0 #b5c9dc,
      inset 0 4px 6px rgba(55, 84, 118, .14),
      inset 0 -1px 0 rgba(255,255,255,.92);
  }

  .duduq-progress-track::after {
    content: "";
    position: absolute;
    inset: 3px 4px auto;
    height: 4px;
    border-radius: 999px;
    background: rgba(255,255,255,.58);
    pointer-events: none;
  }

  .duduq-progress-fill {
    position: absolute;
    inset: 2px;
    right: auto;
    width: calc(100% - 4px);
    overflow: hidden;
    transform: scaleX(var(--lesson-progress));
    transform-origin: left center;
    border-radius: inherit;
    background: linear-gradient(180deg, #55bdff 0%, #1686e8 52%, #0866c4 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.52),
      inset 0 -2px 0 rgba(2,72,145,.20),
      0 0 14px rgba(9, 103, 201, .24);
    transition: transform 520ms cubic-bezier(.2,.8,.2,1);
  }

  .duduq-progress-fill::before {
    content: "";
    position: absolute;
    inset: 1px 3px auto;
    height: 4px;
    border-radius: 999px;
    background: rgba(255,255,255,.48);
  }

  .duduq-progress-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-130%);
    background: linear-gradient(
      105deg,
      transparent 24%,
      rgba(255,255,255,.66) 48%,
      transparent 72%
    );
    animation: duduq-progress-shimmer 3.6s ease-in-out infinite;
  }

  .duduq-progress-marker {
    position: absolute;
    z-index: 3;
    left: var(--marker-position);
    top: 50%;
    display: grid;
    width: 34px;
    height: 34px;
    place-items: center;
    transform: translate(-50%, -50%);
    border: 2px solid #b2c5d8;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffffff, #eaf1f7);
    color: #91a4b9;
    box-shadow:
      0 4px 0 #aebfd0,
      0 8px 14px rgba(33, 67, 104, .13),
      inset 0 2px 0 rgba(255,255,255,.98);
    font-size: 1.05rem;
    font-weight: 1000;
    line-height: 1;
  }

  .duduq-progress-marker::after {
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(255,255,255,.72);
    border-radius: inherit;
    pointer-events: none;
  }

  .duduq-progress-marker[data-status="current"] {
    border-color: #0f79dc;
    background: linear-gradient(180deg, #65c7ff, #1687e8 58%, #0864bf);
    color: #ffffff;
    text-shadow: 0 1px 0 #07539c;
    box-shadow:
      0 5px 0 #075aaa,
      0 0 0 5px rgba(22,130,229,.13),
      0 10px 18px rgba(6,101,190,.20),
      inset 0 2px 0 rgba(255,255,255,.54);
    animation: duduq-progress-current 2.8s ease-in-out infinite;
  }

  .duduq-progress-marker[data-status="complete"] {
    border-color: #e3a600;
    background: linear-gradient(180deg, #fff19a, #ffd23f 55%, #efad00);
    color: #fffdf0;
    text-shadow: 0 1px 0 #9f6d00;
    box-shadow:
      0 5px 0 #c98a00,
      0 9px 17px rgba(210,145,0,.23),
      0 0 0 4px rgba(255,202,40,.13),
      inset 0 2px 0 rgba(255,255,255,.66);
    animation: duduq-progress-star-pop 460ms cubic-bezier(.16,.82,.24,1) both;
  }

  .duduq-progress-trail[data-complete="true"] .duduq-progress-fill {
    background: linear-gradient(180deg, #ffe77a, #ffc928 58%, #eaa300);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.62),
      inset 0 -2px 0 rgba(147,96,0,.18),
      0 0 17px rgba(234,163,0,.28);
  }

  .duduq-progress-trail[data-density="dense"] .duduq-progress-marker {
    width: 26px;
    height: 26px;
    font-size: .82rem;
  }

  .duduq-progress-trail[data-style="continuous"] .duduq-progress-track {
    margin-inline: 5px;
  }

  .duduq-progress-compact {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 38px;
    padding: 7px 11px;
    border: 1px solid #d0dce8;
    border-radius: 999px;
    background: #eef5fb;
    color: #183b63;
    box-shadow: 0 3px 0 #c2d1df;
    font-weight: 900;
  }

  .duduq-progress-compact > span {
    color: #f0b400;
    text-shadow: 0 1px 0 #9d7100;
  }

  @keyframes duduq-progress-panel-glint {
    0%, 72% { transform: translateX(-110%); opacity: 0; }
    80% { opacity: .72; }
    96%, 100% { transform: translateX(110%); opacity: 0; }
  }

  @keyframes duduq-progress-shimmer {
    0%, 55% { transform: translateX(-120%); opacity: 0; }
    66% { opacity: .8; }
    88%, 100% { transform: translateX(160%); opacity: 0; }
  }

  @keyframes duduq-progress-current {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.07); }
  }

  @keyframes duduq-progress-star-pop {
    0% { transform: translate(-50%, -50%) scale(.65) rotate(-12deg); }
    62% { transform: translate(-50%, -50%) scale(1.16) rotate(5deg); }
    100% { transform: translate(-50%, -50%) scale(1) rotate(0); }
  }

  /* Microtransi\xE7\xE3o honesta: curta, sem porcentagem fict\xEDcia e sem alterar a mec\xE2nica. */
  .duduq-step-transition {
    position: fixed;
    z-index: 9000;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(19, 35, 56, .52);
    backdrop-filter: blur(5px);
  }

  .duduq-step-transition-card {
    display: grid;
    width: min(520px, 100%);
    place-items: center;
    gap: 14px;
    padding: 24px clamp(18px, 5vw, 36px) 28px;
    border: 2px solid #bcd9f4;
    border-radius: 28px;
    background:
      radial-gradient(circle at 50% 18%, rgba(72,174,255,.15), transparent 42%),
      linear-gradient(180deg, #ffffff, #edf7ff);
    box-shadow:
      0 8px 0 #91b9db,
      0 28px 70px rgba(6, 43, 80, .28),
      inset 0 2px 0 rgba(255,255,255,.96);
    text-align: center;
    animation: duduq-transition-card-in 260ms cubic-bezier(.16,.82,.24,1) both;
  }

  .duduq-step-transition-copy {
    display: grid;
    gap: 3px;
  }

  .duduq-step-transition-copy span {
    color: #0967c9;
    font-size: .72rem;
    font-weight: 1000;
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  .duduq-step-transition-copy strong {
    color: #173451;
    font-size: clamp(1rem, 3vw, 1.2rem);
  }

  .duduq-step-transition-track {
    position: relative;
    width: min(360px, 100%);
    height: 20px;
    overflow: hidden;
    border: 2px solid #9bbbd7;
    border-radius: 999px;
    background: #dbe8f3;
    box-shadow:
      inset 0 3px 5px rgba(44,75,108,.16),
      inset 0 -1px 0 rgba(255,255,255,.9);
  }

  .duduq-step-transition-fill {
    position: absolute;
    inset: 2px;
    right: auto;
    width: calc(100% - 4px);
    transform: scaleX(0);
    transform-origin: left center;
    border-radius: inherit;
    background: linear-gradient(180deg, #42b3ff, #0b73d8 68%, #075eb9);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.4);
    animation: duduq-transition-fill var(--transition-duration) cubic-bezier(.2,.75,.25,1) forwards;
  }

  .duduq-step-transition-star {
    position: absolute;
    right: -2px;
    top: 50%;
    transform: translateY(-50%);
    color: #ffd54d;
    filter: drop-shadow(0 2px 1px rgba(110,76,0,.28));
    font-size: 1.05rem;
  }

  @keyframes duduq-transition-card-in {
    from { transform: translateY(12px) scale(.96); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  @keyframes duduq-transition-fill {
    from { transform: scaleX(.04); }
    to { transform: scaleX(1); }
  }

  .duduq-step-transition[data-reduced-motion="true"] {
    backdrop-filter: none;
  }

  .duduq-step-transition[data-reduced-motion="true"] .duduq-step-transition-card,
  .duduq-step-transition[data-reduced-motion="true"] .duduq-step-transition-fill {
    animation: none !important;
  }

  .duduq-step-transition[data-reduced-motion="true"] .duduq-step-transition-fill {
    transform: scaleX(1);
  }

    min-height: 96px;
    gap: 6px;
    padding: 7px 10px 12px;
    border: 1px solid #dce4ec;
    border-radius: 16px;
    background: rgba(255,255,255,.42);
    box-shadow: none;
  }

  .duduq-engine-stage .duduq-dd-pool-head {
    min-height: 27px;
    padding: 0 8px;
    color: #657589;
    font-size: .8rem;
  }

  .duduq-engine-stage .duduq-dd-pool-items {
    min-height: 60px;
    gap: clamp(10px, 1.25vw, 15px);
    padding: 1px 4px 4px;
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note) {
    min-height: 48px;
    gap: 0;
    padding: 4px 10px 6px;
    border-color: #e1e8ef;
    background: rgba(248,250,252,.66);
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note)
    .duduq-dd-pool-head {
    min-height: 20px;
    font-size: .76rem;
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note)
    .duduq-dd-pool-items {
    min-height: 18px;
  }

  /* A\xE7\xE3o principal: um \xFAnico convite visual quando fica dispon\xEDvel. */
  .duduq-engine-stage .duduq-dd-action-slot {
    padding: 12px 0 13px;
  }

  .duduq-engine-stage .duduq-dd-primary {
    min-height: 52px;
    box-shadow:
      0 4px 0 #064a92,
      0 8px 14px rgba(9,103,201,.14),
      inset 0 1px 0 rgba(255,255,255,.35);
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"] {
    animation: duduq-check-ready-lean 420ms cubic-bezier(.2,.8,.2,1) 1 both !important;
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]::after {
    display: none;
    animation: none !important;
  }

  @keyframes duduq-check-ready-lean {
    0% { transform: translateY(0) scale(.985); filter: brightness(.98); }
    62% { transform: translateY(-1px) scale(1.018); filter: brightness(1.045); }
    100% { transform: translateY(0) scale(1); filter: brightness(1); }
  }

  /* Feedback: uma mensagem, um mascote e uma a\xE7\xE3o. */
  .duduq-engine-feedback {
    margin-top: 9px;
  }

  .duduq-engine-feedback-card {
    grid-template-columns: 56px minmax(0, 1fr);
    gap: 9px 12px;
    min-height: 76px;
    padding: 11px 14px 13px;
    border-width: 1px;
    border-radius: 16px;
    transform: none;
  }

  .duduq-mascot[data-size="feedback"] {
    width: 54px;
    height: 54px;
  }

  .duduq-engine-feedback-copy strong {
    font-size: 1rem;
  }

  .duduq-engine-feedback-copy span {
    font-size: .92rem;
    line-height: 1.3;
  }

  .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card {
    box-shadow:
      0 3px 0 #8bcf72,
      0 8px 16px rgba(54,169,0,.09);
  }

  .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
    box-shadow:
      0 3px 0 #e0a079,
      0 8px 16px rgba(166,75,22,.08);
  }

  .duduq-engine-feedback-action {
    width: min(260px, 100%);
    margin-top: 4px;
    box-shadow:
      0 4px 0 #369600,
      0 8px 15px rgba(54,169,0,.15),
      inset 0 1px 0 rgba(255,255,255,.4);
    animation: duduq-lean-action-in 260ms cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes duduq-lean-action-in {
    from { transform: translateY(5px); opacity: .35; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* Celebra\xE7\xE3o curta: tr\xEAs estrelas no acerto e oito na conclus\xE3o. */
  .duduq-star-particle {
    font-size: 15px;
    animation-duration: 820ms;
  }

  .duduq-star-burst[data-variant="lesson"] .duduq-star-particle {
    font-size: 18px;
    animation-duration: 1050ms;
  }

  .duduq-engine-complete::before {
    animation: none;
    opacity: .72;
  }

  @media (max-width: 720px) {
    .duduq-engine-header {
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 8px 9px 9px;
    }

    .duduq-engine-toolbar {
      width: auto;
      justify-content: flex-end;
    }

    .duduq-engine-toolbar .duduq-engine-button {

      padding-inline: 8px;
      font-size: .78rem;
    }

    .duduq-progress-trail {

      padding: 7px 9px 9px;
    }

      margin-inline: 12px;
    }

    .duduq-engine-stage .duduq-dd-target {
      min-height: 126px;
    }

      width: clamp(72px, 20vw, 94px);
      height: clamp(72px, 20vw, 94px);
    }
  }

  @media (max-width: 520px) {
    .duduq-engine-header {
      grid-template-columns: 1fr;
    }

    .duduq-engine-toolbar {
      width: 100%;
      justify-content: flex-end;
    }

    .duduq-engine-header-main {
      justify-content: center;
    }

    .duduq-engine-heading h1 {
      text-align: center;
    }

    .duduq-engine-stage .duduq-dd-item {
      min-height: 52px;
    }
  }


  /* ========================================================================
     Host 1.0.11 HTML QA FIX
     Presen\xE7a visual maior, fluxo vertical curto e nenhum efeito cont\xEDnuo.
     ======================================================================== */

  :root {
    --premium-blue: #0f82ea;
    --premium-blue-top: #4eb4ff;
    --premium-blue-depth: #0757a8;
    --premium-green: #55c900;
    --premium-green-top: #82eb18;
    --premium-green-depth: #319400;
    --premium-gold: #ffc928;
    --premium-ink: #14233a;
    --premium-soft: #f5f9fd;
  }

  .duduq-engine-root {
    padding: clamp(8px, 1vw, 14px);
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,.96) 0 15%, transparent 42%),
      linear-gradient(180deg, #f6f9fd 0%, #edf4fb 100%);
  }

  .duduq-engine-shell {
    width: min(1200px, 100%);
  }

  /* Cabe\xE7alho compacto com presen\xE7a premium, sem parecer dashboard. */
  .duduq-engine-header {
    gap: 8px 12px;
    margin-bottom: 12px;
    padding: 10px 13px 11px;
    border: 1px solid #ccdae8;
    border-radius: 18px;
    background: rgba(255,255,255,.94);
    box-shadow:
      0 3px 0 #c5d3e0,
      0 12px 28px rgba(34,72,110,.07),
      inset 0 1px 0 rgba(255,255,255,.95);
  }

  .duduq-engine-heading h1 {
    color: var(--premium-ink);
    font-size: clamp(1.12rem, 1.8vw, 1.42rem);
    letter-spacing: -.02em;
  }

  .duduq-engine-toolbar .duduq-engine-button {
    min-height: 38px;
    padding: 7px 12px;
    border-color: #c5d3e1;
    border-radius: 12px;
    background: linear-gradient(180deg, #ffffff 0%, #edf4fa 100%);
    color: #253d5c;
    box-shadow:
      0 3px 0 #b9c8d7,
      0 6px 12px rgba(31,67,103,.08),
      inset 0 1px 0 rgba(255,255,255,.96);
  }

  .duduq-engine-toolbar .duduq-engine-button:hover:not(:disabled) {
    transform: translateY(-1px);
    filter: brightness(1.015);
  }

  .duduq-engine-toolbar .duduq-engine-button:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #b9c8d7;
  }

  /* Progresso mais rico, por\xE9m est\xE1tico durante a resolu\xE7\xE3o. */
  .duduq-progress-trail {
    padding: 8px 12px 10px;
    border: 1px solid #cbd9e7;
    border-radius: 15px;
    background: linear-gradient(180deg, #fbfdff 0%, #f1f7fc 100%);
    box-shadow:
      0 2px 0 #bdccda,
      inset 0 1px 0 rgba(255,255,255,.95);
  }

  .duduq-progress-copy span {
    color: #536b87;
    font-size: .64rem;
    letter-spacing: .08em;
  }

  .duduq-progress-copy strong {
    color: #163b69;
    font-size: .88rem;
  }

  .duduq-progress-track {
    height: 14px;
    margin-inline: 15px;
    border: 1px solid #acc2d8;
    background: linear-gradient(180deg, #dce8f3, #edf4fa);
    box-shadow:
      inset 0 2px 4px rgba(45,78,111,.16),
      inset 0 -1px 0 rgba(255,255,255,.9),
      0 1px 0 rgba(255,255,255,.9);
  }

  .duduq-progress-fill {
    background: linear-gradient(180deg, var(--premium-blue-top), var(--premium-blue));
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.42),
      inset 0 -2px 0 rgba(0,72,146,.18);
  }

  .duduq-progress-marker {
    width: 27px;
    height: 27px;
    border-width: 1px;
    font-size: .82rem;
  }

  .duduq-progress-marker[data-status="current"] {
    background: linear-gradient(180deg, #42aaff, #117bdc);
    border-color: #0871ce;
    box-shadow:
      0 3px 0 #0757a8,
      0 0 0 4px rgba(17,123,220,.12),
      0 7px 12px rgba(8,83,155,.14);
  }

  .duduq-progress-marker[data-status="complete"] {
    background: linear-gradient(180deg, #ffe76a, var(--premium-gold));
    border-color: #dda000;
  }

  /* Instru\xE7\xE3o com leitura confort\xE1vel e bot\xE3o de \xE1udio integrado. */
  .duduq-engine-stage .duduq-dd-instruction {
    width: min(800px, 100%);
    min-height: 64px;
    margin-bottom: 16px;
    padding-block: 8px 11px;
    border: 1px solid #ccd9e6;
    border-radius: 999px;
    background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
    box-shadow:
      0 4px 0 #c2d0dd,
      0 12px 24px rgba(32,69,105,.08),
      inset 0 1px 0 rgba(255,255,255,.96);
  }

  .duduq-engine-stage .duduq-dd-instruction h2 {
    color: #111d31;
    font-size: clamp(1.15rem, 2.1vw, 1.65rem) !important;
    line-height: 1.16 !important;
  }

  .duduq-engine-stage .duduq-dd-board {
    width: min(1040px, 100%);
    gap: clamp(11px, 1.5vh, 17px);
  }

  /* Alvos maiores e com mais contraste de estrutura, sem revelar respostas. */
  .duduq-engine-stage .duduq-dd-target-grid {
    gap: clamp(10px, 1.2vw, 14px);
  }

  .duduq-engine-stage .duduq-dd-target,
  .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
    min-height: clamp(178px, 25vh, 228px);
    border: 2px dashed #c3d3e3;
    border-radius: 22px;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,255,255,.98), rgba(255,255,255,.72) 52%, transparent 72%),
      linear-gradient(180deg, #fbfdff 0%, #f5f9fd 100%);
    box-shadow:
      0 3px 0 #d1dce7,
      0 12px 24px rgba(32,68,103,.055),
      inset 0 1px 0 rgba(255,255,255,.98);
  }

  .duduq-engine-stage .duduq-dd-target[data-active-target="true"] {
    border-style: solid;
    border-color: #2f94ed;
    background: linear-gradient(180deg, #f7fbff 0%, #edf7ff 100%);
    box-shadow:
      0 0 0 4px rgba(47,148,237,.13),
      0 4px 0 #91bce2,
      0 14px 24px rgba(31,116,194,.10);
    transform: translateY(-1px) scale(1.012);
  }

  .duduq-engine-stage .duduq-dd-target-media {
    width: clamp(110px, 12.5vw, 148px);
    height: clamp(110px, 12.5vw, 148px);
    filter: drop-shadow(0 7px 10px rgba(31,65,99,.09));
  }

  .duduq-engine-stage .duduq-dd-target[data-has-media="true"] .duduq-dd-target-head {
    min-height: clamp(132px, 18vh, 168px);
    padding-top: 8px;
  }

  .duduq-engine-stage .duduq-dd-target-items {
    min-height: 66px;
    padding: 8px 12px 12px;
  }

  .duduq-engine-stage .duduq-dd-empty-note {
    color: #4b6079;
    font-size: .88rem;
    font-weight: 800;
  }

  /* Itens mais t\xE1teis e leg\xEDveis, com profundidade curta. */
  .duduq-engine-stage .duduq-dd-item {
    min-width: clamp(132px, 15vw, 164px);
    min-height: 62px;
    padding: 8px 16px;
    border: 2px solid #8fa5bd;
    border-radius: 17px;
    background: linear-gradient(180deg, #ffffff 0%, #f9fbfd 100%);
    color: #111c2e;
    box-shadow:
      0 4px 0 #b7c5d3,
      0 8px 16px rgba(18,43,70,.08),
      inset 0 1px 0 rgba(255,255,255,.98);
    font-size: clamp(1.02rem, 1.7vw, 1.28rem);
  }

  .duduq-engine-stage .duduq-dd-item[data-selected="true"] {
    border-color: #147bd9;
    background: linear-gradient(180deg, #ffffff, #eaf5ff);
    box-shadow:
      0 4px 0 #75a9d7,
      0 0 0 4px rgba(20,123,217,.13),
      0 10px 18px rgba(20,101,176,.09);
  }

  .duduq-engine-stage .duduq-dd-item[data-feedback="correct"] {
    background: linear-gradient(180deg, #ffffff, #efffe9);
  }

  .duduq-engine-stage .duduq-dd-item[data-feedback="retry"] {
    background: linear-gradient(180deg, #fffefe, #fff0f2);
  }

  /* Bandeja: forte quando possui op\xE7\xF5es, m\xEDnima quando vazia. */
  .duduq-engine-stage .duduq-dd-pool {
    min-height: 112px;
    padding: 9px 12px 14px;
    border: 1px solid #d1deea;
    border-radius: 20px;
    background: rgba(255,255,255,.62);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.96),
      0 2px 0 rgba(198,211,224,.55);
  }

  .duduq-engine-stage .duduq-dd-pool-head {
    color: #425a74;
    font-size: .82rem;
    letter-spacing: .01em;
  }

  .duduq-engine-stage .duduq-dd-pool-items {
    min-height: 68px;
    gap: clamp(12px, 1.4vw, 18px);
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note) {
    min-height: 58px;
    padding: 8px 12px;
    border-color: #d8e4ee;
    background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(246,250,253,.78));
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note)
    .duduq-dd-pool-head {
    display: none;
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note)
    .duduq-dd-pool-items {
    min-height: 40px;
    padding: 0;
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note)
    .duduq-dd-empty-note {
    color: #3f6a4d;
    font-size: .88rem;
    font-weight: 850;
  }

  /* Bot\xE3o Verificar mais pr\xF3ximo do fluxo e com press\xE3o f\xEDsica clara. */
  .duduq-engine-stage .duduq-dd-action-slot {
    min-height: 70px;
    padding: 8px 0 8px;
  }

  .duduq-engine-stage .duduq-dd-primary {
    width: min(240px, 100%);
    min-height: 56px;
    border-radius: 17px;
    background: linear-gradient(180deg, var(--premium-blue-top) 0%, var(--premium-blue) 58%, #0a6dcc 100%);
    box-shadow:
      0 5px 0 var(--premium-blue-depth),
      0 12px 22px rgba(15,103,195,.18),
      inset 0 2px 0 rgba(255,255,255,.38);
    font-size: 1.08rem;
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="false"] {
    background: linear-gradient(180deg, #eef3f7, #dfe8f0);
    color: #73869a;
    box-shadow:
      0 4px 0 #c1ceda,
      inset 0 1px 0 rgba(255,255,255,.85);
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]:active {
    transform: translateY(4px) scale(.992);
    box-shadow:
      0 1px 0 var(--premium-blue-depth),
      0 5px 10px rgba(15,103,195,.12),
      inset 0 1px 0 rgba(255,255,255,.32);
  }

  /* Feedback imediatamente ap\xF3s a a\xE7\xE3o, sem \xE1rea vazia ou rolagem desnecess\xE1ria. */
  .duduq-engine-feedback {
    margin-top: 8px;
    scroll-margin-block: 10px;
  }

  .duduq-engine-feedback:not([data-state="idle"]) {
    animation: duduq-premium-feedback-in 280ms cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes duduq-premium-feedback-in {
    from { opacity: .25; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .duduq-engine-feedback-card {
    grid-template-columns: 60px minmax(0, 1fr);
    min-height: 82px;
    padding: 12px 16px 14px;
    border-radius: 20px;
  }

  .duduq-mascot[data-size="feedback"] {
    width: 58px;
    height: 58px;
  }

  .duduq-engine-feedback-copy strong {
    font-size: 1.08rem;
  }

  .duduq-engine-feedback-action {
    width: min(280px, 100%);
    min-height: 54px;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--premium-green-top), var(--premium-green));
    box-shadow:
      0 5px 0 var(--premium-green-depth),

  .duduq-engine-feedback-action:active:not(:disabled) {

    box-shadow:
      0 1px 0 var(--premium-green-depth),
      0 5px 10px rgba(57,156,0,.12);

  /* Conclus\xE3o mais compacta, mais forte e proporcional ao conte\xFAdo. */

  .duduq-mascot[data-size="complete"] {
    width: 142px;
    height: 142px;

  .duduq-engine-complete h2 {
    font-size: clamp(1.65rem, 4vw, 2.35rem);
  }

  .duduq-engine-complete-action {
    width: min(280px, 100%);
    min-height: 54px;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--premium-blue-top), var(--premium-blue));
    box-shadow:
      0 5px 0 var(--premium-blue-depth),
      0 12px 20px rgba(15,103,195,.17),
      inset 0 2px 0 rgba(255,255,255,.34);
  }

  @media (max-width: 900px) {

      min-height: clamp(164px, 23vh, 205px);
    }

      width: clamp(98px, 15vw, 132px);

    }

  @media (max-width: 720px) {

  /* ========================================================================
     Host 1.0.11 \u2014 corre\xE7\xF5es observadas na homologa\xE7\xE3o HTML (1365 \xD7 640)
     - mascotes com \xE1rea transparente ampliados dentro do slot;
     - CTA volta ao fluxo normal para n\xE3o sobrepor a bandeja;
     - alvo ativo mant\xE9m geometria est\xE1vel;
     - composi\xE7\xE3o compacta em telas largas de baixa altura;
     - conclus\xE3o mais concentrada e sem emblema duplicado.
     ======================================================================== */

  /* Os PNGs atuais possuem uma grande margem transparente. O zoom acontece
     apenas dentro do recorte do slot; n\xE3o altera o layout nem o hit target. */
  .duduq-mascot-body {
    overflow: hidden;
  }

  .duduq-mascot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: 50% 50%;
    transform-origin: 50% 50%;
  }

  .duduq-mascot[data-state="idle"] img,
  .duduq-mascot[data-state="transition"] img {
    transform: scale(4.1);
  }

  .duduq-mascot[data-state="success"] img,
  .duduq-mascot[data-state="retry"] img {
    transform: scale(4.0);
  }

  .duduq-mascot[data-state="complete"] img {
    transform: scale(3.8);
  }

  /* O bot\xE3o sticky invadia a bandeja em viewports de baixa altura. */
  .duduq-engine-stage .duduq-dd-action-slot {
    position: static;
    z-index: auto;
    background: transparent;
  }

  /* O destaque n\xE3o muda tamanho nem posi\xE7\xE3o do alvo durante o drag. */
  .duduq-engine-stage .duduq-dd-target[data-active-target="true"] {
    border: 2px solid #2f94ed;
    transform: none;
    background: linear-gradient(180deg, #f8fcff 0%, #eef7ff 100%);
    box-shadow:
      inset 0 0 0 2px rgba(47,148,237,.18),
      0 3px 0 #9bc2e4,
      0 10px 22px rgba(31,116,194,.10);
  }

  .duduq-engine-stage
    .duduq-dd-target[data-active-target="true"]
    .duduq-dd-empty-note {
    opacity: 0;
  }

  /* A arte final do mascote j\xE1 assume o protagonismo da conclus\xE3o. */
  .duduq-engine-complete-emblem {
    display: none;
  }

  .duduq-engine-complete {
    min-height: clamp(330px, 57vh, 440px);
    padding-block: clamp(20px, 3vw, 32px);
  }

  .duduq-engine-complete-hero {
    min-height: 132px;
    margin-bottom: 0;
  }

  .duduq-engine-complete-eyebrow {
    margin-top: 0;
  }

  /* Densidade espec\xEDfica para notebook/desktop com pouca altura \xFAtil. */
  @media (min-width: 900px) and (max-height: 720px) {
    .duduq-engine-root {
      padding: 6px 8px 10px;
    }

    .duduq-engine-header {
      gap: 6px 10px;
