  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     Integra\xE7\xE3o visual desacoplada do cen\xE1rio, mascote sem recorte e
     recompensa leve com confete estrelado de execu\xE7\xE3o \xFAnica.
     ======================================================================== */

  .duduq-engine-root {
    --premium-surface: rgba(255, 255, 255, .97);
    --premium-surface-soft: rgba(248, 252, 253, .94);
    isolation: isolate;
    background: transparent !important;
    background-image: none !important;
  }

  .duduq-engine-header,
  .duduq-engine-stage .duduq-dd-instruction,
  .duduq-engine-stage .duduq-dd-target,
  .duduq-engine-stage .duduq-dd-pool,
  .duduq-engine-feedback-card,
  .duduq-engine-complete {
    background-clip: padding-box;
  }

  /* O slot agora enquadra o PNG completo. O zoom continua compensando a
     margem transparente original, mas n\xE3o recorta chap\xE9u, bra\xE7os ou base. */
  .duduq-mascot,
  .duduq-mascot-body,
  .duduq-engine-feedback-card,
  .duduq-engine-complete {
    overflow: visible;
  }

  .duduq-mascot-body {
    transform-origin: 50% 78%;
  }

  .duduq-mascot img {
    backface-visibility: hidden;
  }

  .duduq-mascot[data-size="idle"] {
    width: 46px;
    height: 46px;
  }

  .duduq-mascot[data-size="feedback"] {
    width: 86px;
    height: 86px;
  }

  .duduq-mascot[data-size="transition"] {
    width: 106px;
    height: 106px;
  }

  .duduq-mascot[data-size="complete"] {
    width: 174px;
    height: 174px;
  }

  .duduq-mascot[data-state="idle"] img {
    transform: scale(3.45);
    object-position: 50% 52%;
  }

  .duduq-mascot[data-state="transition"] img {
    transform: scale(3.35);
    object-position: 50% 52%;
  }

  .duduq-mascot[data-state="success"] img,
  .duduq-mascot[data-state="retry"] img {
    transform: scale(3.3);
    object-position: 50% 52%;
  }

  .duduq-mascot[data-state="complete"] img {
    transform: scale(3.12);
    object-position: 50% 54%;
  }

  .duduq-mascot[data-state="idle"] .duduq-mascot-body {
    animation: duduq-premium-breathe 4.8s cubic-bezier(.45, 0, .55, 1) infinite;
    will-change: transform;
  }

  @keyframes duduq-premium-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    48% { transform: translateY(-1.5px) scale(1.012, .994); }
    56% { transform: translateY(-1.5px) scale(1.009, .996); }
  }

  /* Confete estrelado: uma \xFAnica explos\xE3o por acerto, sem depend\xEAncias,
     sem mudan\xE7a de layout e sem interceptar intera\xE7\xE3o. */
  .duduq-star-burst[data-origin="mascot"][data-variant="answer"] {
    inset: -165%;
    contain: layout style paint;
  }

  .duduq-star-burst[data-origin="mascot"][data-variant="answer"]
    .duduq-star-particle {
    font-size: 14px;
    animation-name: duduq-premium-confetti-pop;
    animation-duration: 1040ms;
  }

  .duduq-star-burst[data-origin="mascot"][data-variant="answer"]
    .duduq-star-particle:nth-child(3n + 2) {
    font-size: 11px;
  }

  .duduq-star-burst[data-origin="mascot"][data-variant="answer"]
    .duduq-star-particle:nth-child(4n) {
    font-size: 17px;
  }

  .duduq-star-particle:nth-child(5n + 1) { color: #ffd43b; }
  .duduq-star-particle:nth-child(5n + 2) { color: #55c83a; }
  .duduq-star-particle:nth-child(5n + 3) { color: #2e9cf4; }
  .duduq-star-particle:nth-child(5n + 4) { color: #ff8068; }
  .duduq-star-particle:nth-child(5n + 5) { color: #8b70e8; }

  @keyframes duduq-premium-confetti-pop {
    0% {
      transform: translate(-50%, -50%) scale(.25) rotate(0deg);
      opacity: 0;
    }
    14% { opacity: 1; }
    72% { opacity: .95; }
    100% {
      transform:
        translate(
          calc(-50% + var(--star-x)),
          calc(-50% + var(--star-y))
        )
        scale(.82)
        rotate(var(--star-rotation));
      opacity: 0;
    }
  }

  @media (max-width: 520px) {
    .duduq-mascot[data-size="idle"] {
      width: 42px;
      height: 42px;
    }

    .duduq-mascot[data-size="feedback"] {
      width: 76px;
      height: 76px;
    }

    .duduq-mascot[data-size="complete"] {
      width: 154px;
      height: 154px;
    }

    .duduq-star-burst[data-origin="mascot"][data-variant="answer"] {
      inset: -145%;
    }
  }


  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     HUD enxuto, feedback sem sobreposi\xE7\xE3o e respira\xE7\xE3o em camadas separadas.
     Nenhuma regra altera estado, hit target, avalia\xE7\xE3o ou navega\xE7\xE3o.
     ======================================================================== */

  .duduq-engine-header {
    gap: 6px 12px;
    margin-bottom: 9px;
    padding: 8px 12px;
  }

  .duduq-progress-trail {
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    min-height: 28px;
    padding: 0 4px 2px;
  }

  .duduq-progress-copy {
    grid-column: 2;
    grid-row: 1;
    display: block;
    padding: 0;
  }

  .duduq-progress-copy span {
    display: none;
  }

  .duduq-progress-copy strong {
    display: block;
    color: #294e74;
    font-size: .78rem;
    line-height: 1;
  }

  .duduq-progress-track {
    grid-column: 1;
    grid-row: 1;
    height: 9px;
    margin: 0 13px;
    border-width: 1px;
    box-shadow:
      0 2px 0 #b5c9d2,
      inset 0 1px 3px rgba(55, 84, 118, .13);
  }

  .duduq-progress-marker {
    width: 24px;
    height: 24px;
    border-width: 1px;
    font-size: .74rem;
    box-shadow:
      0 2px 0 #aebfca,
      0 5px 10px rgba(33, 67, 104, .10),
      inset 0 1px 0 #fff;
  }

  .duduq-progress-marker[data-status="current"] {
    box-shadow:
      0 3px 0 #075aa8,
      0 0 0 3px rgba(24,137,231,.10),
      0 6px 12px rgba(6,101,190,.13),
      inset 0 1px 0 rgba(255,255,255,.46);
  }

  .duduq-progress-marker[data-status="complete"] {
    box-shadow:
      0 3px 0 #c88b08,
      0 6px 12px rgba(210,145,0,.15),
      inset 0 1px 0 rgba(255,255,255,.58);
  }

  @media (min-width: 980px) {
    .duduq-engine-header {
      grid-template-columns:
        minmax(280px, .85fr)
        minmax(300px, 1.1fr)
        auto;
      min-height: 64px;
    }

    .duduq-engine-header-main {
      grid-column: 1;
      grid-row: 1;
    }

    .duduq-progress-trail {
      grid-column: 2;
      grid-row: 1;
    }

    .duduq-engine-toolbar {
      grid-column: 3;
      grid-row: 1;
    }
  }

  /* A coluna do personagem considera a \xE1rea vis\xEDvel real do PNG ampliado.
     O texto deixa de come\xE7ar sob o mascote, mesmo com confete ativo. */
  .duduq-engine-feedback-card {
    column-gap: 16px;
  }

  .duduq-engine-feedback .duduq-mascot[data-size="feedback"] {
    width: 80px;
    height: 80px;
    justify-self: center;
    align-self: center;
    margin: 0;
    animation: duduq-feedback-breathe 4.6s cubic-bezier(.45, 0, .55, 1) 620ms infinite;
    transform-origin: 50% 78%;
    will-change: transform;
  }

  @media (min-width: 760px) {
    .duduq-engine-feedback[data-state="success"]
      .duduq-engine-feedback-card {
      grid-template-columns: 110px minmax(0, 1fr) minmax(220px, 280px);
      gap: 12px 18px;
      padding-left: 14px;
    }

    .duduq-engine-feedback[data-state="retry"]
      .duduq-engine-feedback-card {
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 12px 18px;
      padding-left: 14px;
    }
  }

  @media (max-width: 759px) {
    .duduq-engine-feedback-card,
    .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card,
    .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
      grid-template-columns: 94px minmax(0, 1fr);
      gap: 10px 12px;
    }
  }

  /* O repouso do cabe\xE7alho e os feedbacks respiram em elementos distintos.
     Assim, a entrada de acerto/erro continua intacta e n\xE3o h\xE1 disputa de
     transform entre anima\xE7\xF5es. */
  .duduq-mascot[data-state="idle"] .duduq-mascot-body {
    animation: duduq-premium-breathe 4.4s cubic-bezier(.45, 0, .55, 1) infinite;
  }

  .duduq-engine-complete .duduq-mascot[data-size="complete"] {
    animation: duduq-complete-breathe 5.1s cubic-bezier(.45, 0, .55, 1) 760ms infinite;
    transform-origin: 50% 80%;
    will-change: transform;
  }

  @keyframes duduq-premium-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    48% { transform: translateY(-2.1px) scale(1.016, .992); }
    56% { transform: translateY(-2.1px) scale(1.012, .994); }
  }

  @keyframes duduq-feedback-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2px) scale(1.014, .994); }
  }

  @keyframes duduq-complete-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2.4px) scale(1.012, .995); }
  }

  .duduq-mascot[data-reduced-motion="true"],
  .duduq-mascot[data-reduced-motion="true"] .duduq-mascot-body {
    animation: none !important;
    transform: none !important;
    will-change: auto;
  }

  @media (max-width: 520px) {
    .duduq-progress-trail {
      gap: 7px;
      min-height: 26px;
    }

    .duduq-progress-copy strong {
      font-size: .72rem;
    }

    .duduq-engine-feedback-card,
    .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card,
    .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
      grid-template-columns: 84px minmax(0, 1fr);
      padding-inline: 10px;
    }

    .duduq-engine-feedback .duduq-mascot[data-size="feedback"] {
      width: 72px;
      height: 72px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .duduq-mascot {
      animation: none !important;
      transform: none !important;
      will-change: auto;
    }
  }


  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     Centro \xF3ptico real no HUD, respiro superior e conclus\xE3o sem halo verde.
     ======================================================================== */

  .duduq-engine-root {
    padding-top: clamp(16px, 2.2vh, 22px);
  }

  @media (min-width: 1120px) {
    .duduq-engine-header {
      grid-template-columns:
        minmax(0, 1fr)
        minmax(480px, 580px)
        minmax(0, 1fr);
      gap: 14px;
    }

    .duduq-engine-header-main {
      justify-self: start;
      width: 100%;
    }

    .duduq-progress-trail {
      width: 100%;
      max-width: 580px;
      justify-self: center;
    }

    .duduq-engine-toolbar {
      justify-self: end;
    }
  }

  @media (min-width: 900px) and (max-height: 720px) {
    .duduq-engine-root {
      padding-top: 14px;
    }
  }

  /* A conclus\xE3o mant\xE9m o significado de sucesso na borda e no texto, mas
     elimina a grande mancha verde atr\xE1s do personagem e sua anima\xE7\xE3o cont\xEDnua. */
  .duduq-engine-complete {
    background:
      linear-gradient(
        180deg,
        rgba(255, 255, 255, .985) 0%,
        rgba(248, 252, 254, .97) 100%
      );
  }

  .duduq-engine-complete::before {
    display: none;
    animation: none !important;
  }

  /* Respira\xE7\xE3o um pouco mais presente, ainda lenta e sem filtros ou repaints
     caros. Cada estado continua animando apenas um transform composto. */
  .duduq-mascot[data-state="idle"] .duduq-mascot-body {
    animation: duduq-premium-breathe 4.2s cubic-bezier(.45, 0, .55, 1) infinite;
  }

  .duduq-engine-feedback .duduq-mascot[data-size="feedback"] {
    animation: duduq-feedback-breathe 4.15s cubic-bezier(.45, 0, .55, 1) 620ms infinite;
  }

  .duduq-engine-complete .duduq-mascot[data-size="complete"] {
    animation: duduq-complete-breathe 4.45s cubic-bezier(.45, 0, .55, 1) 760ms infinite;
  }

  @keyframes duduq-premium-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    48% { transform: translateY(-2.8px) scale(1.019, .990); }
    56% { transform: translateY(-2.8px) scale(1.015, .992); }
  }

  @keyframes duduq-feedback-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-3.4px) scale(1.022, .989); }
  }

  @keyframes duduq-complete-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-4.4px) scale(1.025, .987); }
  }

  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     Hierarquia final: progresso mais leg\xEDvel, feedback alinhado ao tabuleiro
     e CTA de avan\xE7o semanticamente verde. Apenas apresenta\xE7\xE3o \xE9 alterada.
     ======================================================================== */

  .duduq-engine-feedback {
    width: min(1000px, calc(100% - 20px));
    margin-inline: auto;
  }

  .duduq-engine-button,
  .duduq-engine-stage .duduq-dd-primary {
    text-transform: uppercase;
    letter-spacing: .035em;
  }

  .duduq-engine-stage .duduq-dd-primary {
    width: min(210px, 100%);
  }

  /* Um \xFAnico chamado t\xE1til quando a a\xE7\xE3o fica dispon\xEDvel. A vibra\xE7\xE3o \xE9
     curta, discreta e baseada apenas em transform; n\xE3o se repete em repouso. */
  .duduq-engine-stage
    .duduq-dd-action-slot[data-feedback-state="idle"]
    .duduq-dd-primary[data-enabled="true"] {
    animation: duduq-confirm-nudge 560ms cubic-bezier(.22, .75, .22, 1) 1 !important;
  }

  .duduq-engine-stage
    .duduq-dd-action-slot[data-feedback-state="retry"]
    .duduq-dd-primary,
  .duduq-engine-stage
    .duduq-dd-action-slot[data-feedback-state="success"]
    .duduq-dd-primary {
    animation: duduq-dd-check-exit 180ms ease-in forwards !important;
  }

  @keyframes duduq-confirm-nudge {
    0% { transform: translateX(0) scale(.985); }
    34% { transform: translateX(-1.8px) scale(1.012); }
    46% { transform: translateX(1.6px) scale(1.014); }
    58% { transform: translateX(-1.1px) scale(1.01); }
    72% { transform: translateX(.7px) scale(1.006); }
    100% { transform: translateX(0) scale(1); }
  }

  .duduq-engine-feedback[data-state="success"]
    .duduq-engine-feedback-action {
    border-color: #45ad00;
    background: linear-gradient(180deg, #70e90e 0%, #58cc02 58%, #4cba00 100%);
    color: #fff;
    box-shadow:
      0 5px 0 #359500,
      0 12px 20px rgba(57, 156, 0, .20),
      inset 0 2px 0 rgba(255, 255, 255, .32);
  }

  .duduq-engine-feedback[data-state="success"]
    .duduq-engine-feedback-action:hover:not(:disabled) {
    background: linear-gradient(180deg, #7af118 0%, #60d608 58%, #52c500 100%);
    box-shadow:
      0 6px 0 #359500,
      0 15px 24px rgba(57, 156, 0, .24),
      inset 0 2px 0 rgba(255, 255, 255, .36);
  }

  .duduq-engine-feedback[data-state="success"]
    .duduq-engine-feedback-action:active:not(:disabled) {
    background: linear-gradient(180deg, #5fd508 0%, #50c000 100%);
    box-shadow:
      0 2px 0 #359500,
      0 7px 13px rgba(57, 156, 0, .18),
      inset 0 1px 0 rgba(255, 255, 255, .24);
  }

  @media (max-width: 720px) {
    .duduq-engine-feedback {
      width: 100%;
    }
  }

  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     Profundidade mais limpa: mant\xE9m a base t\xE1til curta e reduz a n\xE9voa das
     sombras ambientais. As imagens crescem sem mudar a mec\xE2nica dos cart\xF5es.
     ======================================================================== */

  .duduq-engine-header {
    box-shadow:
      0 3px 0 rgba(157, 188, 199, .62),
      0 8px 16px rgba(43, 89, 110, .06),
      inset 0 1px 0 rgba(255, 255, 255, .98);
  }

  .duduq-engine-stage .duduq-dd-instruction {
    box-shadow:
      0 3px 0 rgba(161, 188, 199, .64),
      0 7px 14px rgba(43, 89, 110, .055),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-target,
  .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
    box-shadow:
      0 3px 0 rgba(164, 193, 201, .7),
      0 7px 14px rgba(44, 89, 109, .05),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-target[data-active-target="true"] {
    box-shadow:
      0 3px 0 #86b7d9,
      0 0 0 3px rgba(47, 148, 237, .1),
      0 8px 16px rgba(31, 116, 194, .075),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage
    .duduq-dd-target:has(.duduq-dd-item[data-feedback="correct"]) {
    box-shadow:
      0 3px 0 #6ab953,
      0 7px 14px rgba(48, 145, 37, .055),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-pool {
    box-shadow:
      0 3px 0 rgba(166, 192, 201, .62),
      0 6px 12px rgba(44, 89, 109, .045),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card {
    box-shadow:
      0 3px 0 rgba(83, 172, 57, .72),
      0 7px 14px rgba(54, 169, 0, .065),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
    box-shadow:
      0 3px 0 rgba(210, 113, 73, .68),
      0 7px 14px rgba(166, 75, 22, .055),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-complete {
    box-shadow:
      0 4px 0 rgba(147, 190, 148, .48),
      0 12px 24px rgba(46, 94, 65, .075),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-target-media {
    width: clamp(120px, 13vw, 158px);
    height: clamp(120px, 13vw, 158px);
    filter: drop-shadow(0 4px 8px rgba(31, 65, 99, .05));

<script id="duduq-canary-035-adaptive-space-script">
(function () {
  "use strict";
  let attempts = 0;
  let observer = null;

  function classify(stage) {
    const height = Math.round(stage.getBoundingClientRect().height || stage.clientHeight || 0);
    const width = Math.round(stage.getBoundingClientRect().width || stage.clientWidth || 0);
    let mode = "balanced";
    if (height > 0 && (height < 370 || width < 700)) mode = "compact";
    else if (height >= 455 && width >= 900) mode = "roomy";

<script id="duduq-canary-040-audio-playing-controller">
(() => {
  if (window.__DUDUQ_AUDIO_STANDARD_040__) return;
  window.__DUDUQ_AUDIO_STANDARD_040__ = true;

  const selector = [
    'button[class*="audio" i]',
    '[role="button"][class*="audio" i]',
    'button[class*="speaker" i]',
    '[role="button"][class*="speaker" i]',
    'button[class*="sound" i]',
    '[role="button"][class*="sound" i]',
    'button[class*="listen" i]',
    '[role="button"][class*="listen" i]',
    'button[data-role*="audio" i]',
    '[role="button"][data-role*="audio" i]',
    'button[data-action*="audio" i]',
    '[role="button"][data-action*="audio" i]',
    'button[aria-label*="Ã¡udio" i]',
    'button[aria-label*="audio" i]',
    'button[aria-label*="ouvir" i]',
    'button[aria-label*="escutar" i]',
    'button[aria-label*="som" i]',
    'button[aria-label*="listen" i]',
    'button[title*="Ã¡udio" i]',
    'button[title*="audio" i]',
    'button[title*="ouvir" i]',
    'button[title*="listen" i]'
  ].join(',');

  let lastControl = null;
  let lastControlAt = 0;
  let fallbackTimer = 0;
  const active = new Set();

  const controlFrom = (target) => {
    if (!(target instanceof Element)) return null;
    const direct = target.closest(selector);
    if (direct) return direct;
    const button = target.closest('button,[role="button"]');
    if (!button) return null;
    const text = [button.className, button.id, button.getAttribute('aria-label'), button.getAttribute('title'), button.dataset?.role, button.dataset?.action]
      .filter(Boolean).join(' ').toLowerCase();
    return /(audio|Ã¡udio|speaker|sound|listen|ouvir|escutar|som)/i.test(text) ? button : null;
  };

  const mark = (control) => {
    if (!control || !(control instanceof Element)) return null;
    control.classList.add('duduq-audio-standard');
    return control;
  };

  const scan = (root = document) => {
    try { root.querySelectorAll?.(selector).forEach(mark); } catch (_) {}
  };

  const deactivate = (control) => {
    if (!control) return;
    control.dataset.duduqAudioPlaying = 'false';
    active.delete(control);
  };

  const deactivateAllExcept = (keep) => {
    [...active].forEach(control => {
      if (control !== keep) deactivate(control);
    });
  };

  const activate = (control, fallbackMs = 5200) => {
    control = mark(control);
    if (!control) return;
    deactivateAllExcept(control);
    control.dataset.duduqAudioPlaying = 'true';
    active.add(control);
    window.clearTimeout(fallbackTimer);
    fallbackTimer = window.setTimeout(() => {
      if (control.dataset.playing !== 'true') deactivate(control);
    }, fallbackMs);
  };

  const recentControl = () => {
    if (!lastControl) return null;
    if (performance.now() - lastControlAt > 900) return null;
    return document.contains(lastControl) ? lastControl : null;
  };

  const syncNativePlayingState = () => {
    document.querySelectorAll('.duduq-audio-standard').forEach(control => {
      const shell = control.closest('[data-playing]') || control.parentElement?.closest?.('[data-playing]');
      const nativePlaying = control.dataset.playing === 'true' || shell?.dataset?.playing === 'true';
      if (nativePlaying) activate(control, 12000);
      else if ((control.dataset.playing === 'false' || shell?.dataset?.playing === 'false') && active.has(control)) deactivate(control);
    });
  };

  document.addEventListener('click', event => {
    const control = controlFrom(event.target);
    if (!control) return;
    lastControl = mark(control);
    lastControlAt = performance.now();
    activate(lastControl, 5200);
  }, true);

  if (window.HTMLMediaElement?.prototype?.play && !window.HTMLMediaElement.prototype.__duduq040Patched) {
    const originalPlay = window.HTMLMediaElement.prototype.play;
    const originalPause = window.HTMLMediaElement.prototype.pause;

    window.HTMLMediaElement.prototype.play = function(...args) {
      const control = recentControl();
      if (control) {

        const stop = () => deactivate(control);

        this.addEventListener('error', stop, { once: true });
        this.addEventListener('abort', stop, { once: true });
        this.addEventListener('pause', () => { if (this.ended || this.paused) stop(); }, { once: true });
      }
      return originalPlay.apply(this, args);
    };
    window.HTMLMediaElement.prototype.play.__duduq040Patched = true;

    window.HTMLMediaElement.prototype.pause = function(...args) {
      const result = originalPause.apply(this, args);
      [...active].forEach(deactivate);
      return result;
    };
  }

  if (window.speechSynthesis && typeof window.speechSynthesis.speak === 'function' && !window.speechSynthesis.__duduq040Patched) {
    const originalSpeak = window.speechSynthesis.speak.bind(window.speechSynthesis);
    const originalCancel = typeof window.speechSynthesis.cancel === 'function'
      ? window.speechSynthesis.cancel.bind(window.speechSynthesis)
      : null;

    window.speechSynthesis.speak = utterance => {
      const control = recentControl();
      if (control && utterance) {
        activate(control, 20000);
        const oldEnd = utterance.onend;
        const oldError = utterance.onerror;
        utterance.onend = event => {
          deactivate(control);
          if (typeof oldEnd === 'function') oldEnd.call(utterance, event);
        };
        utterance.onerror = event => {
          deactivate(control);
          if (typeof oldError === 'function') oldError.call(utterance, event);
        };
      }
      return originalSpeak(utterance);
    };

    if (originalCancel) {
      window.speechSynthesis.cancel = () => {
        const result = originalCancel();
        [...active].forEach(deactivate);
        return result;
      };
    }
    window.speechSynthesis.__duduq040Patched = true;
  }

  const observer = new MutationObserver(mutations => {
    let rescan = false;
    let stateChanged = false;
    for (const mutation of mutations) {
      if (mutation.type === 'childList') rescan = true;
      if (mutation.type === 'attributes' && mutation.attributeName === 'data-playing') stateChanged = true;
    }

    if (rescan || stateChanged) syncNativePlayingState();

    subtree: true,
    childList: true,
    attributes: true,
    attributeFilter: ['data-playing']
  });

  scan(document);
  syncNativePlayingState();
})();

<script id="duduq-canary-041-native-audio-observer">
(() => {

  const sync = (root = document) => {
    root.querySelectorAll?.('[data-playing]').forEach(node => {
      const playing = node.getAttribute('data-playing') === 'true';
      node.setAttribute('data-duduq-native-audio', playing ? 'playing' : 'idle');
      if (playing) node.setAttribute('aria-busy', 'true');
      else node.removeAttribute('aria-busy');
    });
  };

  const observer = new MutationObserver(mutations => {
    let shouldSync = false;
    for (const mutation of mutations) {
      if (mutation.type === 'childList') shouldSync = true;
      if (mutation.type === 'attributes' && mutation.attributeName === 'data-playing') shouldSync = true;
    }
    if (shouldSync) sync(document);
  });

  observer.observe(document.documentElement, {
    subtree: true,
    childList: true,
    attributes: true,
    attributeFilter: ['data-playing']
  });

  sync(document);
})();

    const cls = String(node.className || '');

    const role = node.getAttribute('role') || '';
    return audioWords.test(cls + ' ' + aria) || (role === 'button' && node.hasAttribute('data-playing'));

  function isPlayingAudio(node) {
    return node instanceof Element &&
      node.isConnected &&
      node.getAttribute('data-playing') === 'true' &&
      looksLikeAudio(node);
  }

  function markInstructionAudio() {
    document.querySelectorAll(instructionSelectors).forEach(button => {
      if (!(button instanceof Element)) return;
      const card = button.closest('[class*="instruction"], [class*="prompt"], [class*="enunciado"], [data-role="instruction"]');

      const anchor = shell && card.contains(shell) ? shell : button;
      anchor.setAttribute('data-duduq-instruction-audio-anchor', 'true');

    return halo;
  }

  function removeHalo(node) {
    const halo = halos.get(node);
    if (halo) halo.remove();
    halos.delete(node);
  }

  function positionHalo(node, halo) {
    if (!isPlayingAudio(node)) {
      removeHalo(node);
      return;
    }
    const rect = node.getBoundingClientRect();
    if (!rect.width || !rect.height) {
      halo.style.display = 'none';

    halo.style.left = `${rect.left}px`;
    halo.style.top = `${rect.top}px`;

    markInstructionAudio();

    const playing = new Set();
    document.querySelectorAll('[data-playing="true"]').forEach(node => {
      if (!isPlayingAudio(node)) return;

      const halo = halos.get(node) || createHalo(node);

    });

    if (syncQueued) return;

    requestAnimationFrame(sync);

    subtree: true,
    childList: true,
    attributes: true,
    attributeFilter: ['data-playing']
  });

  window.addEventListener('scroll', queueSync, { passive: true, capture: true });

    const tag = el.tagName.toLowerCase();
    if (nearlySquare(r)) score += 90;
    if (r.width >= 34 && r.width <= 84 && r.height >= 34 && r.height <= 84) score += 90;
    if (tag === 'button' || el.getAttribute('role') === 'button') score += 55;
    if (audioWords.test(cls + ' ' + aria)) score += 45;
    if (/audio-button|audio-btn|sound-button|speaker/.test(cls)) score += 40;
    if (el === original) score += 18;
    score -= Math.abs(r.width-r.height) * 1.6;
    score -= Math.max(0, Math.max(r.width,r.height)-92) * 2;

        candidates.add(shell);
        shell.querySelectorAll('button,[role="button"],[class*="audio-button"],[class*="sound-button"]').forEach(el => candidates.add(el));
      }

    let bestRect = rectOf(node);

      const r = rectOf(el);

    });

  }

    if (queued) return;
    queued = true;
    requestAnimationFrame(sync);
  }

<script id="duduq-canary-052-dragdrop-retry-red-script">
(function () {
  "use strict";

  const PREVIEW_MS = 1100;

  function isOptionCard(node) {
    return !!(
      node &&
      node.nodeType === 1 &&
      node.matches &&
      node.matches(".duduq-udd-item, .duduq-dd-item")
    );
  }

  function applyRetryPreview(card) {
    if (!isOptionCard(card)) return;

    card.classList.remove("duduq-canary-052-correct-lock");
    card.classList.add("duduq-canary-052-retry-preview");

    if (card.__duduqRetryTimer) {
      clearTimeout(card.__duduqRetryTimer);
    }

    card.__duduqRetryTimer = setTimeout(function () {
      card.classList.remove("duduq-canary-052-retry-preview");
    }, PREVIEW_MS);
  }

  function applyCorrectLock(card) {
    if (!isOptionCard(card)) return;
    card.classList.remove("duduq-canary-052-retry-preview");
    card.classList.add("duduq-canary-052-correct-lock");
  }

  function inspectCard(card) {
    if (!isOptionCard(card)) return;
    const feedback = card.getAttribute("data-feedback");

    if (feedback === "retry") {
      applyRetryPreview(card);
      return;
    }

    if (feedback === "correct") {
      applyCorrectLock(card);
    }
  }

  function scan(root) {
    if (!root || root.nodeType !== 1) return;

    if (isOptionCard(root)) {
      inspectCard(root);
    }

    if (root.querySelectorAll) {
      root
        .querySelectorAll(".duduq-udd-item, .duduq-dd-item")
        .forEach(inspectCard);
    }
  }

  function boot() {
    scan(document.body);

    const observer = new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        if (
          mutation.type === "attributes" &&
          mutation.attributeName === "data-feedback"
        ) {
          inspectCard(mutation.target);
          return;
        }

        if (mutation.type === "childList") {
          mutation.addedNodes.forEach(scan);
        }
      });
    });

    observer.observe(document.body, {
      subtree: true,
      childList: true,
      attributes: true,
      attributeFilter: ["data-feedback"]
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();
</script>

<script id="duduq-canary-057-drag-final-controls-script">
(function(){
  "use strict";
  if(window.__DUDUQ_DRAG_057__) return;
  window.__DUDUQ_DRAG_057__=true;

  const selector=[
    ".duduq-udd-audio",
    ".duduq-udd-item-audio",
    ".duduq-udd-target-audio"
  ].join(",");

  const svg=
    '<svg data-duduq-speaker-057="true" viewBox="0 0 24 24" width="23" height="23" fill="none" aria-hidden="true">'+
      '<path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" fill="currentColor"></path>'+
      '<path d="M15 8.5c1.3 1.8 1.3 5.2 0 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>'+
      '<path d="M18 6c2.7 3.4 2.7 8.6 0 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>'+
    '</svg>';

  function normalize(button){
    if(!(button instanceof Element) || !button.matches(selector)) return;
    if(!button.querySelector('[data-duduq-speaker-057="true"]')){
      button.innerHTML=svg;
    }
  }
  function scan(root){
    if(root instanceof Element && root.matches(selector)) normalize(root);
    root.querySelectorAll?.(selector).forEach(normalize);
  }
  function boot(){
    scan(document);
    const observer=new MutationObserver(function(mutations){
      mutations.forEach(function(m){
        m.addedNodes.forEach(function(node){
          if(node.nodeType===1) scan(node);
        });
      });
    });
    observer.observe(document.body,{subtree:true,childList:true});
  }
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",boot,{once:true});
  }else{
    boot();
  }
})();
</script>
