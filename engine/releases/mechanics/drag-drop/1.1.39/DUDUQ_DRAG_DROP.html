<!-- DUDUQ CANARY 027 â€” PRESENTATION ORDER V4 -->
<script id="duduq-presentation-v4">
(function () {
  "use strict";
  if (window.DuduQPresentationV4) return;

  const SESSION_SLOT = "__DUDUQ_PRESENTATION_SESSION_V4__";
  const MEMORY_SLOT = "__DUDUQ_PRESENTATION_STATE_V4__";

  function sessionId() {
    if (window[SESSION_SLOT]) return window[SESSION_SLOT];
    let value = "";
    try {
      if (globalThis.crypto?.getRandomValues) {
        const data = new Uint32Array(2);
        globalThis.crypto.getRandomValues(data);
        value = data[0].toString(36) + "-" + data[1].toString(36);
      }
    } catch (_) {}
    if (!value) {
      value = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
    }
    try {
      Object.defineProperty(window, SESSION_SLOT, {
        value,
        configurable: true
      });
    } catch (_) {
      window[SESSION_SLOT] = value;
    }
    return value;
  }

  function memoryStore() {
    if (window[MEMORY_SLOT]) return window[MEMORY_SLOT];
    const store = Object.create(null);
    try {
      Object.defineProperty(window, MEMORY_SLOT, {
        value: store,
        configurable: true
      });
    } catch (_) {
      window[MEMORY_SLOT] = store;
    }
    return store;
  }

  function sameMembers(a, b) {
    if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
    const left = a.map(String).sort();
    const right = b.map(String).sort();
    return left.every((value, index) => value === right[index]);
  }

  function safeRandom(random) {
    try {
      const value = Number(random());
      if (Number.isFinite(value) && value >= 0 && value < 1) return value;
    } catch (_) {}
    return Math.random();
  }

  function shuffle(values, random) {
    const out = [...values];
    for (let index = out.length - 1; index > 0; index -= 1) {
      const swapIndex = Math.floor(safeRandom(random) * (index + 1));
      [out[index], out[swapIndex]] = [out[swapIndex], out[index]];
    }
    return out;
  }

  function score(candidate, baseline) {
    return candidate.reduce(
      (total, value, index) => total + (String(value) !== String(baseline[index]) ? 1 : 0),
      0
    );
  }

  function signature(values) {
    return values.map(String).join("\u0001");
  }

  function readState(storageKey, source) {
    const memory = memoryStore();
    const cached = memory[storageKey];
    if (cached && sameMembers(cached.order, source)) return cached;
    try {
      const parsed = JSON.parse(localStorage.getItem(storageKey) || "null");
      if (parsed && sameMembers(parsed.order, source)) {
        memory[storageKey] = parsed;
        return parsed;
      }
    } catch (_) {}
    return null;
  }

  function writeState(storageKey, state) {
    memoryStore()[storageKey] = state;
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
    } catch (_) {}
  }

  function order(values, key, random = Math.random, epochToken = null) {
    const source = [...values];
    if (source.length < 2) return source;

    const storageKey = "duduq:presentation:v4:" + String(key);
    const previousState = readState(storageKey, source);

    let sample = 0;
    if (epochToken === null || epochToken === undefined) {
      sample = Math.floor(safeRandom(random) * 4294967296) >>> 0;
    }

    const marker =
      sessionId() + ":" +
      (epochToken === null || epochToken === undefined
        ? sample.toString(36)
        : String(epochToken));

    if (
      previousState &&
      previousState.marker === marker &&
      sameMembers(previousState.order, source)
    ) {
      return [...previousState.order];
    }

    const baseline =
      previousState && sameMembers(previousState.order, source)
        ? [...previousState.order]
        : [...source];

    const recentHistory = Array.isArray(previousState?.history)
      ? previousState.history.slice(0, 8)
      : previousState?.order
        ? [signature(previousState.order)]
        : [];
    const recent = new Set(recentHistory);

    let best = [...source];
    let bestScore = score(best, baseline);
    let bestNovel = recent.has(signature(best)) ? 0 : 1;

    for (let attempt = 0; attempt < 64; attempt += 1) {
      const candidate = shuffle(source, random);
      const candidateScore = score(candidate, baseline);
      const candidateNovel = recent.has(signature(candidate)) ? 0 : 1;
      if (
        candidateScore > bestScore ||
        (candidateScore === bestScore && candidateNovel > bestNovel)
      ) {
        best = candidate;
        bestScore = candidateScore;
        bestNovel = candidateNovel;
      }
      if (candidateScore === source.length && candidateNovel === 1) break;
    }

    /*
      Para alternativas unicas sempre existe uma rotacao sem posicoes fixas.
      Ela funciona como fallback deterministico e tambem amplia a diversidade
      quando a amostragem aleatoria cai em uma ordem usada recentemente.
      Com duas alternativas, a troca e obrigatoria por limitacao combinatoria.
    */
    for (let shift = 1; shift < source.length; shift += 1) {
      const rotated = baseline.map(
        (_, index) => baseline[(index + shift) % baseline.length]
      );
      const rotatedScore = score(rotated, baseline);
      const rotatedNovel = recent.has(signature(rotated)) ? 0 : 1;
      if (
        rotatedScore > bestScore ||
        (rotatedScore === bestScore && rotatedNovel > bestNovel)
      ) {
        best = rotated;
        bestScore = rotatedScore;
        bestNovel = rotatedNovel;
      }
      if (bestScore === source.length && bestNovel === 1) break;
    }

    const bestSignature = signature(best);
    const history = [
      bestSignature,
      ...recentHistory.filter((entry) => entry !== bestSignature)
    ].slice(0, 8);

    const state = {
      marker,
      order: [...best],
      history,
      savedAt: Date.now()
    };
    writeState(storageKey, state);
    return [...best];
  }

  window.DuduQPresentationV4 = Object.freeze({
    version: "4.0.0",
    order,
    sessionId
  });
})();
</script>

<script id="duduq-canary-028-feedback-viewport-guard">
(function () {
  "use strict";
  if (window.__DUDUQ_FEEDBACK_VIEWPORT_GUARD_028__) return;
  window.__DUDUQ_FEEDBACK_VIEWPORT_GUARD_028__ = true;

  let scheduled = false;
  function feedbackVisible(node) {
    if (!node || node.hidden) return false;
    const style = window.getComputedStyle(node);
    return style.display !== "none" && style.visibility !== "hidden";
  }
  function ensureVisible() {
    scheduled = false;
    const node = document.querySelector(".duduq-engine-feedback");
    if (!feedbackVisible(node)) return;
    requestAnimationFrame(function () {
      const rect = node.getBoundingClientRect();
      const margin = 16;
      if (rect.bottom > window.innerHeight - margin) {
        window.scrollBy({
          top: Math.ceil(rect.bottom - window.innerHeight + margin),
          left: 0,
          behavior: "smooth"
        });
      } else if (rect.top < margin) {
        node.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    });
  }
  function schedule() {
    if (scheduled) return;
    scheduled = true;
    setTimeout(ensureVisible, 30);
  }

  const observer = new MutationObserver(schedule);
  observer.observe(document.documentElement, {
    subtree: true,
    childList: true,
    attributes: true,
    attributeFilter: ["hidden", "data-state"]
  });
  document.addEventListener("fullscreenchange", function () { setTimeout(schedule, 80); });
  window.addEventListener("resize", schedule, { passive: true });
  window.addEventListener("orientationchange", schedule, { passive: true });
})();
</script>

<script id="duduq-canary-029-feedback-flow-guard">
(function () {
  "use strict";
  if (window.__DUDUQ_FEEDBACK_FLOW_029__) return;
  window.__DUDUQ_FEEDBACK_FLOW_029__ = true;

  let timer = null;
  function visible(node) {
    if (!node || node.hidden) return false;
    const style = getComputedStyle(node);
    return style.display !== "none" && style.visibility !== "hidden" && node.querySelector(".duduq-engine-feedback-card");
  }
  function keepInView() {
    timer = null;
    const feedback = document.querySelector(".duduq-engine-feedback");
    if (!visible(feedback)) return;
    requestAnimationFrame(function () {
      const rect = feedback.getBoundingClientRect();
      const bottomSafe = window.innerHeight - 14;
      if (rect.bottom > bottomSafe) {
        feedback.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
      }
    });
  }
  function schedule() {
    if (timer !== null) clearTimeout(timer);
    timer = setTimeout(keepInView, 60);
  }
  new MutationObserver(schedule).observe(document.documentElement, {
    subtree: true,
    childList: true,
    attributes: true,
    attributeFilter: ["data-state", "hidden"]
  });
  document.addEventListener("fullscreenchange", schedule);
  window.addEventListener("resize", schedule, { passive: true });
})();
</script>
<style id="duduq-canary-032-dragdrop-media-priority">
/* =====================================================================
   DUDUQ CANARY 032 â€” DRAG & DROP
   Reduz um pouco o card do audio/soltura e libera mais espaco visual

/* DUDUQ SOUND SYSTEM V1 — camada sonora padronizada, sem alteração visual/mecânica. */
(function () {
  if (window.DuduQSound && window.DuduQSound.version === "1.0.0") return;

  const SOURCES = window.DUDUQ_ASSETS.sounds;
  const DEFAULT_VOLUME = {"click":0.22,"pop":0.30,"bubble-pop":0.46,"ding":0.40,"correct":0.56,"error":0.48,"win":0.64};
  const DEFAULT_GAP = {"click":55,"pop":70,"bubble-pop":110,"ding":100,"correct":1200,"error":520,"win":1800};
  const channels = new Map();
  const lastPlay = new Map();
  let gestureUnlocked = false;

  Object.entries(SOURCES).forEach(([name, src]) => {
    try {
      const audio = new Audio(src);
      audio.preload = "auto";
      audio.volume = DEFAULT_VOLUME[name] || 0.5;
      channels.set(name, audio);
    } catch (_) {}
  });

  function stop(name) {
    const audio = channels.get(name);
    if (!audio) return;
    try { audio.pause(); audio.currentTime = 0; } catch (_) {}
  }

  function stopAll() { channels.forEach((_, name) => stop(name)); }

  function unlockAllFromGesture() {
    if (gestureUnlocked) return;
    gestureUnlocked = true;
    channels.forEach((audio) => {
      const oldMuted = audio.muted;
      const oldVolume = audio.volume;
      try {
        audio.muted = true;
        audio.currentTime = 0;
        const result = audio.play();
        const finish = () => {
          try { audio.pause(); audio.currentTime = 0; } catch (_) {}
          audio.muted = oldMuted;
          audio.volume = oldVolume;
        };
        if (result && typeof result.then === "function") result.then(() => window.setTimeout(finish, 0)).catch(() => finish());
        else finish();
      } catch (_) {
        audio.muted = oldMuted;
        audio.volume = oldVolume;
      }
    });
    document.removeEventListener("pointerdown", unlockAllFromGesture, true);
    document.removeEventListener("keydown", unlockAllFromGesture, true);
  }

  document.addEventListener("pointerdown", unlockAllFromGesture, true);
  document.addEventListener("keydown", unlockAllFromGesture, true);

  function start(name, options = {}) {
    const audio = channels.get(name);
    if (!audio) return null;
    const now = (window.performance && performance.now) ? performance.now() : Date.now();
    const minGapMs = Number.isFinite(options.minGapMs) ? options.minGapMs : (DEFAULT_GAP[name] || 0);
    const previous = lastPlay.get(name) || -Infinity;
    if (now - previous < minGapMs) return null;
    lastPlay.set(name, now);

    try {
      audio.pause();
      audio.currentTime = 0;
      audio.muted = false;
      audio.volume = Math.max(0, Math.min(1, Number.isFinite(options.volume) ? options.volume : (DEFAULT_VOLUME[name] || 0.5)));
      if (Number.isFinite(options.playbackRate)) audio.playbackRate = options.playbackRate;
      else audio.playbackRate = 1;
      const promise = audio.play();
      if (promise && typeof promise.catch === "function") promise.catch(() => {});
    } catch (_) {}
    return audio;
  }

  function play(name, options = {}) {
    const aliases = {"you win":"win","you-win":"win","bubblePop":"bubble-pop"};
    const normalized = aliases[name] || name;
    const delayMs = Number(options.delayMs) || 0;
    if (delayMs > 0) { window.setTimeout(() => start(normalized, options), delayMs); return null; }
    return start(normalized, options);
  }

  function isRestartControl(button) {
    const text = `${button.id || ""} ${button.className || ""} ${button.getAttribute?.("aria-label") || ""} ${button.textContent || ""}`.toLowerCase();
    return /restart|recome|reinici|jogar novamente|play again/.test(text);
  }

  window.DuduQSound = Object.freeze({version:"1.0.0",play,stop,stopAll,sources:Object.freeze({...SOURCES})});

  document.addEventListener("click", function (event) {
    const target = event.target instanceof Element ? event.target : null;
    const button = target?.closest?.("button, [role='button']");
    if (!button) return;
    if (button.disabled || button.getAttribute("aria-disabled") === "true" || button.dataset.duduqSound === "none") return;

    play("click", {volume:0.22,minGapMs:55});
  }, true);
})();

  /*
   * REFLOW DE ACESSIBILIDADE
   *
   * Em zoom de 200%, uma viewport 768\xD7768 passa a oferecer cerca de 384\xD7384
   * CSS px. Nesse cen\xE1rio, a mec\xE2nica deixa de tentar caber em altura fixa:

      width: 100%;
      max-width: 100%;

    .duduq-dd-pool {

    .duduq-dd-item,
    .duduq-dd-item[data-has-media="true"],

    .duduq-dd-item[data-compact="true"][data-has-media="true"] {

      duduq-mascot-breathe 3.5s ease-in-out 720ms infinite;
  }

  .duduq-mascot[data-reduced-motion="true"] .duduq-mascot-body {
    animation: none !important;
    transform: none !important;
  }

  @keyframes duduq-mascot-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    48% { transform: translateY(-2px) scale(1.018, 1.028); }
    56% { transform: translateY(-2px) scale(1.014, 1.022); }
  }

  @keyframes duduq-mascot-success-pop {
    0% { transform: translateY(8px) scale(.82) rotate(-3deg); opacity: .35; }
    58% { transform: translateY(-5px) scale(1.08) rotate(2deg); opacity: 1; }
    78% { transform: translateY(1px) scale(.98) rotate(-1deg); }
    100% { transform: translateY(0) scale(1) rotate(0); }
  }

  @keyframes duduq-mascot-shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    16% { transform: translateX(-5px) rotate(-2deg); }
    32% { transform: translateX(5px) rotate(2deg); }
    48% { transform: translateX(-4px) rotate(-1.5deg); }
    64% { transform: translateX(4px) rotate(1.5deg); }
    80% { transform: translateX(-2px) rotate(-.75deg); }
  }

  @keyframes duduq-mascot-transition {
    0% { transform: translateX(-8px) scale(.92) rotate(-3deg); opacity: .25; }
    56% { transform: translateX(5px) scale(1.04) rotate(2deg); opacity: 1; }
    78% { transform: translateX(-1px) scale(.99) rotate(-.5deg); }
    100% { transform: translateX(0) scale(1) rotate(0); }
  }

  @keyframes duduq-mascot-complete-pop {
    0% { transform: translateY(14px) scale(.78); opacity: 0; }
    55% { transform: translateY(-7px) scale(1.08); opacity: 1; }
    76% { transform: translateY(2px) scale(.98); }
    100% { transform: translateY(0) scale(1); }
  }

  .duduq-mascot[data-size="idle"] { width: 54px; height: 54px; }
  .duduq-mascot[data-size="feedback"] { width: 74px; height: 74px; }
  .duduq-mascot[data-size="transition"] { width: 96px; height: 96px; }
  .duduq-mascot[data-size="complete"] { width: 154px; height: 154px; }

  .duduq-mascot-body,
  .duduq-mascot img,
  .duduq-mascot-placeholder {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .duduq-mascot-placeholder {
    position: relative;
    display: grid;
    place-items: center;
    overflow: hidden;
    border: 2px dashed #b9c9db;
    border-radius: 36% 36% 42% 42%;
    background:
      radial-gradient(circle at 34% 26%, rgba(255,255,255,.95), transparent 19%),
      linear-gradient(155deg, #f7fbff, #dcecff);
    color: #1764ad;
    box-shadow:
      0 5px 0 #b6cbe0,
      0 12px 22px rgba(31, 90, 145, .12),
      inset 0 2px 0 rgba(255,255,255,.85);
  }

  .duduq-mascot[data-state="success"] .duduq-mascot-placeholder,
  .duduq-mascot[data-state="complete"] .duduq-mascot-placeholder {
    border-color: #8edb72;
    background:
      radial-gradient(circle at 34% 26%, rgba(255,255,255,.95), transparent 19%),
      linear-gradient(155deg, #f7fff4, #dff5d7);
    color: #2d8b20;
    box-shadow:
      0 6px 0 #70bd55,
      0 14px 25px rgba(54, 169, 0, .15),
      inset 0 2px 0 rgba(255,255,255,.9);
  }

  .duduq-mascot[data-state="transition"] .duduq-mascot-placeholder {
    border-color: #83b9ef;
    background:
      radial-gradient(circle at 34% 26%, rgba(255,255,255,.95), transparent 19%),
      linear-gradient(155deg, #f7fbff, #d8ebff);
    color: #0967c9;
    box-shadow:
      0 6px 0 #73a7d8,
      0 14px 25px rgba(9, 103, 201, .15),
      inset 0 2px 0 rgba(255,255,255,.9);
  }

  .duduq-mascot[data-state="retry"] .duduq-mascot-placeholder {
    border-color: #efb48c;
    background:
      radial-gradient(circle at 34% 26%, rgba(255,255,255,.95), transparent 19%),
      linear-gradient(155deg, #fffaf6, #ffe4d2);
    color: #a64b16;
    box-shadow:
      0 6px 0 #dd8a54,
      0 14px 25px rgba(166, 75, 22, .13),
      inset 0 2px 0 rgba(255,255,255,.9);
  }

  .duduq-mascot-monogram {
    font-size: clamp(.75rem, 2vw, 1.15rem);
    font-weight: 1000;
    letter-spacing: -.04em;
  }

  .duduq-mascot[data-size="complete"] .duduq-mascot-monogram {
    font-size: 2rem;
  }

  .duduq-mascot-state-icon {
    position: absolute;
    right: -1px;
    bottom: -1px;
    display: grid;
    width: 34%;
    aspect-ratio: 1;
    place-items: center;
    border: 2px solid #fff;
    border-radius: 999px;
    background: currentColor;
    color: #fff;
    box-shadow: 0 3px 0 rgba(20, 51, 86, .22);
    font-size: clamp(.65rem, 1.4vw, 1rem);
    font-weight: 1000;
  }

  .duduq-engine-feedback-card {
    grid-template-columns: 82px minmax(0, 1fr);
  }

  .duduq-engine-complete-hero {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 158px;
    margin-bottom: 2px;
  }

  .duduq-engine-complete-emblem {
    position: absolute;
    right: calc(50% - 82px);
    bottom: 4px;
    width: 54px;
    height: 54px;
    margin: 0;
    border-width: 2px;
    box-shadow:
      0 5px 0 #63bf45,
      0 12px 22px rgba(54, 169, 0, .17);
    font-size: 1.55rem;
  }

  /* Bot\xF5es f\xEDsicos inspirados em interfaces l\xFAdicas, sem copiar assets propriet\xE1rios. */
  .duduq-engine-button,
  .duduq-engine-stage .duduq-dd-primary {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    border: 2px solid transparent;
    border-radius: 16px;
    transform: translateY(0);
    transition:
      transform 90ms ease,
      filter 140ms ease,
      box-shadow 90ms ease;
    -webkit-tap-highlight-color: transparent;
  }

  .duduq-engine-button::before,
  .duduq-engine-stage .duduq-dd-primary::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 2px 8px auto;
    height: 42%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,.46), rgba(255,255,255,0));
    opacity: .8;
    pointer-events: none;
  }

  .duduq-engine-button::after,
  .duduq-engine-stage .duduq-dd-primary::after {
    content: "";
    position: absolute;
    z-index: 2;
    top: -45%;
    bottom: -45%;
    left: -55%;
    width: 34%;
    transform: rotate(18deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.56), transparent);
    opacity: 0;
    pointer-events: none;
  }

  .duduq-engine-button-primary,
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"] {
    border-color: #0b5db4;
    background: linear-gradient(180deg, #1984e8 0%, #0868cb 72%, #075eb9 100%);
    color: #fff;
    box-shadow:
      0 6px 0 #064a92,
      0 12px 22px rgba(9, 103, 201, .20),
      inset 0 2px 0 rgba(255,255,255,.38);
    text-shadow: 0 1px 0 rgba(0,0,0,.18);
  }

  .duduq-engine-button-secondary {
    border-color: #c6d5e5;
    background: linear-gradient(180deg, #ffffff 0%, #edf4fa 100%);
    color: #24364e;
    box-shadow:
      0 4px 0 #c0cfde,
      0 8px 16px rgba(38, 63, 92, .10),
      inset 0 2px 0 rgba(255,255,255,.95);
  }

  .duduq-engine-button:hover:not(:disabled),
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]:hover {
    filter: brightness(1.05) saturate(1.03);
  }

  .duduq-engine-button-primary:hover::after,
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]:hover::after {
    opacity: .78;
    animation: duduq-button-shine 760ms ease-out both;
  }

  .duduq-engine-button:active:not(:disabled),
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]:active {
    transform: translateY(5px);
    transition-duration: 45ms;
  }

  .duduq-engine-button-primary:active:not(:disabled),
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]:active {
    box-shadow:
      0 1px 0 #064a92,
      0 4px 8px rgba(9, 103, 201, .15),
      inset 0 2px 0 rgba(255,255,255,.25);
  }

  .duduq-engine-button-secondary:active:not(:disabled) {
    box-shadow:
      0 1px 0 #c0cfde,
      0 3px 7px rgba(38, 63, 92, .08),
      inset 0 1px 0 rgba(255,255,255,.8);
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="false"] {
    border-color: #d2dbe5;
    background: linear-gradient(180deg, #edf2f7, #dde5ee);
    color: #7a8797;
    box-shadow:
      0 4px 0 #c6d0dc,
      inset 0 2px 0 rgba(255,255,255,.75);
  }

  @keyframes duduq-button-shine {
    from { transform: translateX(0) rotate(18deg); opacity: 0; }
    20% { opacity: .85; }
    to { transform: translateX(520%) rotate(18deg); opacity: 0; }
  }

  /* Drop zones neutras at\xE9 a valida\xE7\xE3o; verde fica reservado ao acerto confirmado. */
  .duduq-engine-stage .duduq-dd-target,
  .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
    border: 2px dashed #c5d2e1;
    background: rgba(255,255,255,.64);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
  }

  .duduq-engine-stage .duduq-dd-target:has(.duduq-dd-item[data-feedback="correct"]) {
    border: 2px solid #73d454;
    background: #f4fff1;
    box-shadow:
      0 4px 0 #53b837,
      0 10px 20px rgba(54, 169, 0, .11),
      inset 0 2px 0 rgba(255,255,255,.9);
  }

  .duduq-engine-stage .duduq-dd-action-slot {
    position: sticky;
    z-index: 20;
    bottom: 0;
    padding: 16px 0 18px;
    background: linear-gradient(
      to bottom,
      rgba(244,247,251,0),
      rgba(244,247,251,.92) 32%,
      rgba(244,247,251,1) 68%
    );
  }

  /* \xC1udio e Check usam a mesma fam\xEDlia azul; as ondas ficam exclusivas do \xE1udio. */
  .duduq-engine-stage .duduq-dd-audio-shell > button {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    border: 2px solid #0b5db4 !important;
    background: linear-gradient(
      180deg,
      #218bea 0%,
      #0b70d5 70%,
      #0864bf 100%
    ) !important;
    color: #ffffff !important;
    box-shadow:
      0 5px 0 #064a92,
      0 10px 18px rgba(9, 103, 201, .22),
      inset 0 2px 0 rgba(255,255,255,.42) !important;
    transform: translateY(0);
    transition:
      transform 70ms ease,
      filter 140ms ease,
      box-shadow 70ms ease;
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button::before {
    content: "";
    position: absolute;
    inset: 2px 7px auto;
    height: 40%;
    border-radius: 999px;
    background: linear-gradient(
      180deg,
      rgba(255,255,255,.52),
      rgba(255,255,255,0)
    );
    pointer-events: none;
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button:hover:not(:disabled) {
    filter: brightness(1.06) saturate(1.03);
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow:
      0 1px 0 #064a92,
      0 4px 8px rgba(9, 103, 201, .16),
      inset 0 2px 0 rgba(255,255,255,.28) !important;
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button:disabled {
    opacity: .92;
    filter: saturate(.92);
  }

  .duduq-engine-stage .duduq-dd-audio-wave {
    border-color: #1682e5 !important;
  }

  .duduq-engine-stage
    .duduq-dd-audio-shell[data-highlight="true"]::after {
    border-color: rgba(22, 130, 229, .38) !important;
  }

  /* Brilho recorrente e discreto no Check quando ele est\xE1 dispon\xEDvel. */
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]::after {
    opacity: 0;
    animation: duduq-check-glint 3.7s ease-in-out 1s infinite;
  }

  @keyframes duduq-check-glint {
    0%, 62% {
      transform: translateX(0) rotate(18deg);
      opacity: 0;
    }
    69% { opacity: .82; }
    84% {
      transform: translateX(520%) rotate(18deg);
      opacity: 0;
    }
    100% {
      transform: translateX(520%) rotate(18deg);
      opacity: 0;
    }
  }

  /* Continuar \xE9 uma a\xE7\xE3o positiva: verde, f\xEDsica e com convite em onda suave. */
  .duduq-engine-feedback-action {
    border-color: #46ad00;
    background: linear-gradient(
      180deg,
      #68dc18 0%,
      #58cc02 68%,
      #4db900 100%
    );
    color: #ffffff;
    box-shadow:
      0 6px 0 #369600,
      0 12px 22px rgba(54, 169, 0, .22),
      inset 0 2px 0 rgba(255,255,255,.42);
    text-shadow: 0 1px 0 rgba(22, 86, 0, .24);
    animation: duduq-continue-invite 2.8s ease-in-out 1.15s infinite;
  }

  .duduq-engine-feedback-action:hover:not(:disabled) {
    filter: brightness(1.045) saturate(1.04);
    animation-play-state: paused;
  }

  .duduq-engine-feedback-action:focus-visible,
  .duduq-engine-feedback-action:active:not(:disabled) {
    animation-play-state: paused;
  }

  .duduq-engine-feedback-action:active:not(:disabled) {
    transform: translateY(5px);
    box-shadow:
      0 1px 0 #369600,
      0 4px 8px rgba(54, 169, 0, .16),
      inset 0 2px 0 rgba(255,255,255,.28);
  }

  @keyframes duduq-continue-invite {
    0%, 58%, 100% {
      box-shadow:
        0 6px 0 #369600,
        0 12px 22px rgba(54, 169, 0, .22),
        0 0 0 0 rgba(88, 204, 2, 0),
        inset 0 2px 0 rgba(255,255,255,.42);
    }
    72% {
      box-shadow:
        0 6px 0 #369600,
        0 12px 22px rgba(54, 169, 0, .22),
        0 0 0 0 rgba(88, 204, 2, .30),
        inset 0 2px 0 rgba(255,255,255,.42);
    }
    88% {
      box-shadow:
        0 6px 0 #369600,
        0 12px 22px rgba(54, 169, 0, .22),
        0 0 0 11px rgba(88, 204, 2, 0),
        inset 0 2px 0 rgba(255,255,255,.42);
    }
  }

  .duduq-engine-complete::before {
    content: "";
    position: absolute;
    inset: 8% 18% 34%;
    border-radius: 50%;
    background: radial-gradient(
      circle,
      rgba(88, 204, 2, .18),
      rgba(88, 204, 2, 0) 68%
    );
    animation: duduq-complete-halo 3.8s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes duduq-complete-halo {
    0%, 100% { transform: scale(.94); opacity: .62; }
    50% { transform: scale(1.06); opacity: 1; }
  }

  /* Trilha DuduQ: progresso crescente, sem pontuar erros ou velocidade. */
  .duduq-progress-trail {
    position: relative;
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
    min-width: 0;
    padding: 10px 14px 14px;
    overflow: hidden;
    border: 1px solid #cbdced;
    border-radius: 18px;
    background:
      radial-gradient(circle at 10% 0%, rgba(255,255,255,.96), transparent 34%),
      linear-gradient(180deg, #ffffff 0%, #edf6ff 100%);
    box-shadow:
      0 4px 0 #bfd1e3,
      0 10px 22px rgba(31, 79, 126, .10),
      inset 0 1px 0 rgba(255,255,255,.98);
    isolation: isolate;
  }

  .duduq-progress-trail::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      linear-gradient(115deg, transparent 0 38%, rgba(255,255,255,.42) 46%, transparent 54% 100%);
    transform: translateX(-110%);
    animation: duduq-progress-panel-glint 5.6s ease-in-out infinite;
  }

  .duduq-progress-copy {
    display: flex;
    min-width: 0;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding-inline: 2px;
  }

  .duduq-progress-copy span {
    color: #607188;
    font-size: .68rem;
    font-weight: 900;
    letter-spacing: .075em;
    text-transform: uppercase;
  }

  .duduq-progress-copy strong {
    color: #123f70;
    font-size: .92rem;
    font-weight: 1000;
    line-height: 1.15;
    white-space: nowrap;
  }

  .duduq-progress-track {
    position: relative;
    height: 19px;
    min-width: 0;
    margin: 2px 18px 0;
    overflow: visible;
    border: 2px solid #a9c2da;
    border-radius: 999px;
    background:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.22) 0 16px,
        rgba(111,143,176,.08) 16px 18px
      ),
      linear-gradient(180deg, #e8f0f7, #d5e2ee);
    box-shadow:
      0 4px 0 #b5c9dc,
      inset 0 4px 6px rgba(55, 84, 118, .14),
      inset 0 -1px 0 rgba(255,255,255,.92);
  }

  .duduq-progress-track::after {
    content: "";
    position: absolute;
    inset: 3px 4px auto;
    height: 4px;
    border-radius: 999px;
    background: rgba(255,255,255,.58);
    pointer-events: none;
  }

  .duduq-progress-fill {
    position: absolute;
    inset: 2px;
    right: auto;
    width: calc(100% - 4px);
    overflow: hidden;
    transform: scaleX(var(--lesson-progress));
    transform-origin: left center;
    border-radius: inherit;
    background: linear-gradient(180deg, #55bdff 0%, #1686e8 52%, #0866c4 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.52),
      inset 0 -2px 0 rgba(2,72,145,.20),
      0 0 14px rgba(9, 103, 201, .24);
    transition: transform 520ms cubic-bezier(.2,.8,.2,1);
  }

  .duduq-progress-fill::before {
    content: "";
    position: absolute;
    inset: 1px 3px auto;
    height: 4px;
    border-radius: 999px;
    background: rgba(255,255,255,.48);
  }

  .duduq-progress-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-130%);
    background: linear-gradient(
      105deg,
      transparent 24%,
      rgba(255,255,255,.66) 48%,
      transparent 72%
    );
    animation: duduq-progress-shimmer 3.6s ease-in-out infinite;
  }

  .duduq-progress-marker {
    position: absolute;
    z-index: 3;
    left: var(--marker-position);
    top: 50%;
    display: grid;
    width: 34px;
    height: 34px;
    place-items: center;
    transform: translate(-50%, -50%);
    border: 2px solid #b2c5d8;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffffff, #eaf1f7);
    color: #91a4b9;
    box-shadow:
      0 4px 0 #aebfd0,
      0 8px 14px rgba(33, 67, 104, .13),
      inset 0 2px 0 rgba(255,255,255,.98);
    font-size: 1.05rem;
    font-weight: 1000;
    line-height: 1;
  }

  .duduq-progress-marker::after {
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(255,255,255,.72);
    border-radius: inherit;
    pointer-events: none;
  }

  .duduq-progress-marker[data-status="current"] {
    border-color: #0f79dc;
    background: linear-gradient(180deg, #65c7ff, #1687e8 58%, #0864bf);
    color: #ffffff;
    text-shadow: 0 1px 0 #07539c;
    box-shadow:
      0 5px 0 #075aaa,
      0 0 0 5px rgba(22,130,229,.13),
      0 10px 18px rgba(6,101,190,.20),
      inset 0 2px 0 rgba(255,255,255,.54);
    animation: duduq-progress-current 2.8s ease-in-out infinite;
  }

  .duduq-progress-marker[data-status="complete"] {
    border-color: #e3a600;
    background: linear-gradient(180deg, #fff19a, #ffd23f 55%, #efad00);
    color: #fffdf0;
    text-shadow: 0 1px 0 #9f6d00;
    box-shadow:
      0 5px 0 #c98a00,
      0 9px 17px rgba(210,145,0,.23),
      0 0 0 4px rgba(255,202,40,.13),
      inset 0 2px 0 rgba(255,255,255,.66);
    animation: duduq-progress-star-pop 460ms cubic-bezier(.16,.82,.24,1) both;
  }

  .duduq-progress-trail[data-complete="true"] .duduq-progress-fill {
    background: linear-gradient(180deg, #ffe77a, #ffc928 58%, #eaa300);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.62),
      inset 0 -2px 0 rgba(147,96,0,.18),
      0 0 17px rgba(234,163,0,.28);
  }

  .duduq-progress-trail[data-density="dense"] .duduq-progress-marker {
    width: 26px;
    height: 26px;
    font-size: .82rem;
  }

  .duduq-progress-trail[data-style="continuous"] .duduq-progress-track {
    margin-inline: 5px;
  }

  .duduq-progress-compact {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 38px;
    padding: 7px 11px;
    border: 1px solid #d0dce8;
    border-radius: 999px;
    background: #eef5fb;
    color: #183b63;
    box-shadow: 0 3px 0 #c2d1df;
    font-weight: 900;
  }

  /* Microtransi\xE7\xE3o honesta: curta, sem porcentagem fict\xEDcia e sem alterar a mec\xE2nica. */
  .duduq-step-transition {
    position: fixed;
    z-index: 9000;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(19, 35, 56, .52);
    backdrop-filter: blur(5px);
  }

  .duduq-step-transition-card {
    display: grid;
    width: min(520px, 100%);
    place-items: center;
    gap: 14px;
    padding: 24px clamp(18px, 5vw, 36px) 28px;
    border: 2px solid #bcd9f4;
    border-radius: 28px;
    background:
      radial-gradient(circle at 50% 18%, rgba(72,174,255,.15), transparent 42%),
      linear-gradient(180deg, #ffffff, #edf7ff);
    box-shadow:
      0 8px 0 #91b9db,
      0 28px 70px rgba(6, 43, 80, .28),
      inset 0 2px 0 rgba(255,255,255,.96);
    text-align: center;
    animation: duduq-transition-card-in 260ms cubic-bezier(.16,.82,.24,1) both;
  }

  .duduq-step-transition-copy {
    display: grid;
    gap: 3px;
  }

  .duduq-step-transition-copy span {
    color: #0967c9;
    font-size: .72rem;
    font-weight: 1000;
    letter-spacing: .1em;

  .duduq-step-transition-track {
    position: relative;
    width: min(360px, 100%);
    height: 20px;
    overflow: hidden;
    border: 2px solid #9bbbd7;
    border-radius: 999px;
    background: #dbe8f3;
    box-shadow:
      inset 0 3px 5px rgba(44,75,108,.16),
      inset 0 -1px 0 rgba(255,255,255,.9);
  }

  .duduq-step-transition-fill {
    position: absolute;
    inset: 2px;
    right: auto;
    width: calc(100% - 4px);
    transform: scaleX(0);
    transform-origin: left center;
    border-radius: inherit;
    background: linear-gradient(180deg, #42b3ff, #0b73d8 68%, #075eb9);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.4);

  .duduq-step-transition-star {

  @keyframes duduq-transition-card-in {

  @keyframes duduq-transition-fill {

  .duduq-step-transition[data-reduced-motion="true"] {

    padding: clamp(8px, 1vw, 14px);
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,.96) 0 15%, transparent 42%),
      linear-gradient(180deg, #f6f9fd 0%, #edf4fb 100%);
  }

  .duduq-engine-shell {
    width: min(1200px, 100%);
  }

  /* Cabe\xE7alho compacto com presen\xE7a premium, sem parecer dashboard. */
  .duduq-engine-header {
    gap: 8px 12px;
    margin-bottom: 12px;
    padding: 10px 13px 11px;
    border: 1px solid #ccdae8;
    border-radius: 18px;
    background: rgba(255,255,255,.94);
    box-shadow:
      0 3px 0 #c5d3e0,
      0 12px 28px rgba(34,72,110,.07),
      inset 0 1px 0 rgba(255,255,255,.95);
  }

  .duduq-engine-heading h1 {
    color: var(--premium-ink);
    font-size: clamp(1.12rem, 1.8vw, 1.42rem);
    letter-spacing: -.02em;
  }

  .duduq-engine-toolbar .duduq-engine-button {
    min-height: 38px;
    padding: 7px 12px;
    border-color: #c5d3e1;
    border-radius: 12px;
    background: linear-gradient(180deg, #ffffff 0%, #edf4fa 100%);
    color: #253d5c;
    box-shadow:
      0 3px 0 #b9c8d7,
      0 6px 12px rgba(31,67,103,.08),
      inset 0 1px 0 rgba(255,255,255,.96);
  }

  .duduq-engine-toolbar .duduq-engine-button:hover:not(:disabled) {
    transform: translateY(-1px);
    filter: brightness(1.015);
  }

  .duduq-engine-toolbar .duduq-engine-button:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #b9c8d7;
  }

  /* Progresso mais rico, por\xE9m est\xE1tico durante a resolu\xE7\xE3o. */
  .duduq-progress-trail {
    padding: 8px 12px 10px;
    border: 1px solid #cbd9e7;
    border-radius: 15px;
    background: linear-gradient(180deg, #fbfdff 0%, #f1f7fc 100%);
    box-shadow:
      0 2px 0 #bdccda,
      inset 0 1px 0 rgba(255,255,255,.95);
  }

  .duduq-progress-copy span {
    color: #536b87;
    font-size: .64rem;
    letter-spacing: .08em;
  }

  .duduq-progress-copy strong {
    color: #163b69;
    font-size: .88rem;
  }

  .duduq-progress-track {
    height: 14px;
    margin-inline: 15px;
    border: 1px solid #acc2d8;
    background: linear-gradient(180deg, #dce8f3, #edf4fa);
    box-shadow:
      inset 0 2px 4px rgba(45,78,111,.16),
      inset 0 -1px 0 rgba(255,255,255,.9),
      0 1px 0 rgba(255,255,255,.9);
  }

  .duduq-progress-fill {
    background: linear-gradient(180deg, var(--premium-blue-top), var(--premium-blue));
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.42),
      inset 0 -2px 0 rgba(0,72,146,.18);
  }

  .duduq-progress-marker {
    width: 27px;
    height: 27px;
    border-width: 1px;
    font-size: .82rem;
  }

  .duduq-progress-marker[data-status="current"] {
    background: linear-gradient(180deg, #42aaff, #117bdc);
    border-color: #0871ce;
    box-shadow:
      0 3px 0 #0757a8,
      0 0 0 4px rgba(17,123,220,.12),
      0 7px 12px rgba(8,83,155,.14);
  }

  .duduq-progress-marker[data-status="complete"] {
    background: linear-gradient(180deg, #ffe76a, var(--premium-gold));
    border-color: #dda000;
  }

  /* Instru\xE7\xE3o com leitura confort\xE1vel e bot\xE3o de \xE1udio integrado. */
  .duduq-engine-stage .duduq-dd-instruction {
    width: min(800px, 100%);
    min-height: 64px;
    margin-bottom: 16px;
    padding-block: 8px 11px;
    border: 1px solid #ccd9e6;
    border-radius: 999px;
    background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
    box-shadow:
      0 4px 0 #c2d0dd,
      0 12px 24px rgba(32,69,105,.08),
      inset 0 1px 0 rgba(255,255,255,.96);
  }

  .duduq-engine-stage .duduq-dd-instruction h2 {
    color: #111d31;
    font-size: clamp(1.15rem, 2.1vw, 1.65rem) !important;
    line-height: 1.16 !important;
  }

  .duduq-engine-stage .duduq-dd-board {
    width: min(1040px, 100%);
    gap: clamp(11px, 1.5vh, 17px);
  }

  /* Alvos maiores e com mais contraste de estrutura, sem revelar respostas. */
  .duduq-engine-stage .duduq-dd-target-grid {
    gap: clamp(10px, 1.2vw, 14px);
  }

  .duduq-engine-stage .duduq-dd-target,
  .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
    min-height: clamp(178px, 25vh, 228px);
    border: 2px dashed #c3d3e3;
    border-radius: 22px;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,255,255,.98), rgba(255,255,255,.72) 52%, transparent 72%),
      linear-gradient(180deg, #fbfdff 0%, #f5f9fd 100%);
    box-shadow:
      0 3px 0 #d1dce7,
      0 12px 24px rgba(32,68,103,.055),
      inset 0 1px 0 rgba(255,255,255,.98);
  }

  .duduq-engine-stage .duduq-dd-target[data-active-target="true"] {
    border-style: solid;
    border-color: #2f94ed;
    background: linear-gradient(180deg, #f7fbff 0%, #edf7ff 100%);
    box-shadow:
      0 0 0 4px rgba(47,148,237,.13),
      0 4px 0 #91bce2,
      0 14px 24px rgba(31,116,194,.10);
    transform: translateY(-1px) scale(1.012);
  }

  .duduq-engine-stage .duduq-dd-target-media {
    width: clamp(110px, 12.5vw, 148px);
    height: clamp(110px, 12.5vw, 148px);
    filter: drop-shadow(0 7px 10px rgba(31,65,99,.09));
  }

  .duduq-engine-stage .duduq-dd-target[data-has-media="true"] .duduq-dd-target-head {
    min-height: clamp(132px, 18vh, 168px);
    padding-top: 8px;
  }

  .duduq-engine-stage .duduq-dd-target-items {
    min-height: 66px;
    padding: 8px 12px 12px;
  }

  .duduq-engine-stage .duduq-dd-empty-note {
    color: #4b6079;
    font-size: .88rem;
    font-weight: 800;
  }

  /* Itens mais t\xE1teis e leg\xEDveis, com profundidade curta. */
  .duduq-engine-stage .duduq-dd-item {
    min-width: clamp(132px, 15vw, 164px);
    min-height: 62px;
    padding: 8px 16px;
    border: 2px solid #8fa5bd;
    border-radius: 17px;
    background: linear-gradient(180deg, #ffffff 0%, #f9fbfd 100%);
    color: #111c2e;
    box-shadow:
      0 4px 0 #b7c5d3,
      0 8px 16px rgba(18,43,70,.08),
      inset 0 1px 0 rgba(255,255,255,.98);
    font-size: clamp(1.02rem, 1.7vw, 1.28rem);
  }

  .duduq-engine-stage .duduq-dd-item[data-selected="true"] {
    border-color: #147bd9;
    background: linear-gradient(180deg, #ffffff, #eaf5ff);
    box-shadow:
      0 4px 0 #75a9d7,
      0 0 0 4px rgba(20,123,217,.13),
      0 10px 18px rgba(20,101,176,.09);
  }

  .duduq-engine-stage .duduq-dd-item[data-feedback="correct"] {
    background: linear-gradient(180deg, #ffffff, #efffe9);
  }

  .duduq-engine-stage .duduq-dd-item[data-feedback="retry"] {
    background: linear-gradient(180deg, #fffefe, #fff0f2);
  }

  /* Bandeja: forte quando possui op\xE7\xF5es, m\xEDnima quando vazia. */
  .duduq-engine-stage .duduq-dd-pool {
    min-height: 112px;
    padding: 9px 12px 14px;
    border: 1px solid #d1deea;
    border-radius: 20px;
    background: rgba(255,255,255,.62);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.96),
      0 2px 0 rgba(198,211,224,.55);
  }

  .duduq-engine-stage .duduq-dd-pool-head {
    color: #425a74;
    font-size: .82rem;
    letter-spacing: .01em;
  }

  .duduq-engine-stage .duduq-dd-pool-items {
    min-height: 68px;
    gap: clamp(12px, 1.4vw, 18px);
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note) {
    min-height: 58px;
    padding: 8px 12px;
    border-color: #d8e4ee;
    background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(246,250,253,.78));
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note)
    .duduq-dd-pool-head {
    display: none;
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note)
    .duduq-dd-pool-items {
    min-height: 40px;
    padding: 0;
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note)
    .duduq-dd-empty-note {
    color: #3f6a4d;
    font-size: .88rem;
    font-weight: 850;
  }

  /* Bot\xE3o Verificar mais pr\xF3ximo do fluxo e com press\xE3o f\xEDsica clara. */
  .duduq-engine-stage .duduq-dd-action-slot {
    min-height: 70px;
    padding: 8px 0 8px;
  }

  .duduq-engine-stage .duduq-dd-primary {
    width: min(240px, 100%);
    min-height: 56px;
    border-radius: 17px;
    background: linear-gradient(180deg, var(--premium-blue-top) 0%, var(--premium-blue) 58%, #0a6dcc 100%);
    box-shadow:
      0 5px 0 var(--premium-blue-depth),
      0 12px 22px rgba(15,103,195,.18),
      inset 0 2px 0 rgba(255,255,255,.38);
    font-size: 1.08rem;
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="false"] {
    background: linear-gradient(180deg, #eef3f7, #dfe8f0);
    color: #73869a;
    box-shadow:
      0 4px 0 #c1ceda,
      inset 0 1px 0 rgba(255,255,255,.85);
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]:active {
    transform: translateY(4px) scale(.992);
    box-shadow:
      0 1px 0 var(--premium-blue-depth),
      0 5px 10px rgba(15,103,195,.12),
      inset 0 1px 0 rgba(255,255,255,.32);
  }

  /* Feedback imediatamente ap\xF3s a a\xE7\xE3o, sem \xE1rea vazia ou rolagem desnecess\xE1ria. */
  .duduq-engine-feedback {
    margin-top: 8px;
    scroll-margin-block: 10px;
  }

  .duduq-engine-feedback:not([data-state="idle"]) {
    animation: duduq-premium-feedback-in 280ms cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes duduq-premium-feedback-in {
    from { opacity: .25; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .duduq-engine-feedback-card {
    grid-template-columns: 60px minmax(0, 1fr);
    min-height: 82px;
    padding: 12px 16px 14px;
    border-radius: 20px;
  }

  .duduq-mascot[data-size="feedback"] {
    width: 58px;
    height: 58px;
  }

  .duduq-engine-feedback-copy strong {
    font-size: 1.08rem;
  }

  .duduq-engine-feedback-action {
    width: min(280px, 100%);
    min-height: 54px;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--premium-green-top), var(--premium-green));
    box-shadow:
      0 5px 0 var(--premium-green-depth),
      0 12px 20px rgba(57,156,0,.18),
      inset 0 2px 0 rgba(255,255,255,.32);
    font-size: 1rem;
  }

  .duduq-engine-feedback-action:active:not(:disabled) {
    transform: translateY(4px) scale(.992);
    box-shadow:
      0 1px 0 var(--premium-green-depth),
      0 5px 10px rgba(57,156,0,.12);
  }

  /* Conclus\xE3o mais compacta, mais forte e proporcional ao conte\xFAdo. */
  .duduq-engine-complete {
    min-height: clamp(360px, 62vh, 500px);
    padding: clamp(26px, 4vw, 44px) 22px;
    border-color: #cde4cb;
    border-radius: 28px;
    background:
      radial-gradient(circle at 50% 22%, rgba(200,255,183,.45), transparent 32%),
      linear-gradient(180deg, #ffffff 0%, #f7fff5 100%);
    box-shadow:
      0 7px 0 #d4ead2,
      0 24px 50px rgba(42,108,48,.11),
      inset 0 1px 0 rgba(255,255,255,.98);
  }

  .duduq-engine-complete-hero {
    margin-bottom: 4px;
  }

  .duduq-mascot[data-size="complete"] {
    width: 142px;
    height: 142px;
  }

  .duduq-engine-complete h2 {
    font-size: clamp(1.65rem, 4vw, 2.35rem);
  }

  .duduq-engine-complete-action {
    width: min(280px, 100%);
    min-height: 54px;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--premium-blue-top), var(--premium-blue));
    box-shadow:
      0 5px 0 var(--premium-blue-depth),
      0 12px 20px rgba(15,103,195,.17),
      inset 0 2px 0 rgba(255,255,255,.34);
  }

  @media (max-width: 900px) {
    .duduq-engine-stage .duduq-dd-target,
    .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
      min-height: clamp(164px, 23vh, 205px);
    }

    .duduq-engine-stage .duduq-dd-target-media {
      width: clamp(98px, 15vw, 132px);
      height: clamp(98px, 15vw, 132px);
    }
  }

  @media (max-width: 720px) {
    .duduq-engine-header {
      padding: 9px 10px 10px;
      border-radius: 16px;
    }

    .duduq-progress-track {
      height: 13px;
      margin-inline: 13px;
    }

    .duduq-engine-stage .duduq-dd-target,
    .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
      min-height: 150px;
      border-radius: 19px;
    }

    .duduq-engine-stage .duduq-dd-target-media {
      width: clamp(84px, 21vw, 112px);
      height: clamp(84px, 21vw, 112px);
    }

    .duduq-engine-stage .duduq-dd-target[data-has-media="true"] .duduq-dd-target-head {
      min-height: 112px;
    }

    .duduq-engine-stage .duduq-dd-item {
      min-width: 112px;
      min-height: 58px;
      padding-inline: 12px;
    }
  }

  @media (max-width: 520px) {
    .duduq-engine-root {
      padding: 6px;
    }

    .duduq-engine-header-main {
      justify-content: flex-start;
    }

    .duduq-engine-heading h1 {
      text-align: left;
    }

    .duduq-engine-toolbar {
      justify-content: stretch;
    }

    .duduq-engine-toolbar .duduq-engine-button {
      flex: 1 1 0;
    }

    .duduq-engine-stage .duduq-dd-instruction {
      width: 100%;
      min-height: 58px;
      margin-bottom: 12px;
    }

    .duduq-engine-stage .duduq-dd-target,
    .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
      min-height: 142px;
    }

    .duduq-engine-stage .duduq-dd-target-media {
      width: clamp(78px, 25vw, 104px);
      height: clamp(78px, 25vw, 104px);
    }

    .duduq-engine-stage .duduq-dd-pool {
      min-height: 98px;
    }

    .duduq-engine-feedback-card {
      grid-template-columns: 52px minmax(0, 1fr);
      padding-inline: 12px;
    }

    .duduq-mascot[data-size="feedback"] {
      width: 50px;
      height: 50px;
    }
  }



  /* ========================================================================
     Host 1.0.10 \u2014 corre\xE7\xF5es observadas na homologa\xE7\xE3o HTML (1365 \xD7 640)
     - mascotes com \xE1rea transparente ampliados dentro do slot;
     - CTA volta ao fluxo normal para n\xE3o sobrepor a bandeja;
     - alvo ativo mant\xE9m geometria est\xE1vel;
     - composi\xE7\xE3o compacta em telas largas de baixa altura;
     - conclus\xE3o mais concentrada e sem emblema duplicado.
     ======================================================================== */

  /* Os PNGs atuais possuem uma grande margem transparente. O zoom acontece
     apenas dentro do recorte do slot; n\xE3o altera o layout nem o hit target. */
  .duduq-mascot-body {
    overflow: hidden;
  }

  .duduq-mascot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: 50% 50%;
    transform-origin: 50% 50%;
  }

  .duduq-mascot[data-state="idle"] img,
  .duduq-mascot[data-state="transition"] img {
    transform: scale(4.1);
  }

  .duduq-mascot[data-state="success"] img,
  .duduq-mascot[data-state="retry"] img {
    transform: scale(4.0);
  }

  .duduq-mascot[data-state="complete"] img {
    transform: scale(3.8);
  }

  /* O bot\xE3o sticky invadia a bandeja em viewports de baixa altura. */
  .duduq-engine-stage .duduq-dd-action-slot {
    position: static;
    z-index: auto;
    background: transparent;
  }

  /* O destaque n\xE3o muda tamanho nem posi\xE7\xE3o do alvo durante o drag. */
  .duduq-engine-stage .duduq-dd-target[data-active-target="true"] {
    border: 2px solid #2f94ed;
    transform: none;
    background: linear-gradient(180deg, #f8fcff 0%, #eef7ff 100%);
    box-shadow:
      inset 0 0 0 2px rgba(47,148,237,.18),
      0 3px 0 #9bc2e4,
      0 10px 22px rgba(31,116,194,.10);
  }

  .duduq-engine-stage
    .duduq-dd-target[data-active-target="true"]
    .duduq-dd-empty-note {
    opacity: 0;
  }

  /* A arte final do mascote j\xE1 assume o protagonismo da conclus\xE3o. */
  .duduq-engine-complete-emblem {
    display: none;
  }

  .duduq-engine-complete {
    min-height: clamp(330px, 57vh, 440px);
    padding-block: clamp(20px, 3vw, 32px);
  }

  .duduq-engine-complete-hero {
    min-height: 132px;
    margin-bottom: 0;
  }

  .duduq-engine-complete-eyebrow {
    margin-top: 0;
  }

  /* Densidade espec\xEDfica para notebook/desktop com pouca altura \xFAtil. */
  @media (min-width: 900px) and (max-height: 720px) {
    .duduq-engine-root {
      padding: 6px 8px 10px;
    }

    .duduq-engine-header {
      gap: 6px 10px;
      margin-bottom: 9px;
      padding: 7px 12px 8px;
      border-radius: 16px;
    }

    .duduq-mascot[data-size="idle"] {
      width: 42px;
      height: 42px;
    }

    .duduq-engine-toolbar .duduq-engine-button {
      min-height: 34px;
      padding: 5px 10px;
    }

    .duduq-progress-trail {
      gap: 4px;
      padding: 5px 10px 7px;
    }

    .duduq-progress-track {
      height: 12px;
    }

    .duduq-engine-stage .duduq-dd-instruction {
      min-height: 56px;
      margin-bottom: 11px;
      padding-block: 6px 8px;
    }

    .duduq-engine-stage .duduq-dd-board {
      gap: 10px;
    }

    .duduq-engine-stage .duduq-dd-target,
    .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
      min-height: 178px;
    }

    .duduq-engine-stage .duduq-dd-target-media {
      width: 126px;
      height: 126px;
    }

    .duduq-engine-stage
      .duduq-dd-target[data-has-media="true"]
      .duduq-dd-target-head {
      min-height: 124px;
      padding-top: 4px;
    }

    .duduq-engine-stage .duduq-dd-target-items {
      min-height: 52px;
      padding: 4px 10px 9px;
    }

    .duduq-engine-stage .duduq-dd-pool {
      min-height: 94px;
      padding: 7px 10px 10px;
    }

    .duduq-engine-stage .duduq-dd-pool-items {
      min-height: 60px;
    }

    .duduq-engine-stage .duduq-dd-item {
      min-height: 56px;
    }

    .duduq-engine-stage .duduq-dd-action-slot {
      min-height: 60px;
      padding: 5px 0 4px;
    }

    .duduq-engine-stage .duduq-dd-primary {
      min-height: 52px;
    }

    .duduq-engine-feedback {
      margin-top: 5px;
    }

    .duduq-engine-feedback-card {
      min-height: 76px;
      padding: 10px 14px 12px;
    }

    .duduq-engine-complete {
      min-height: 360px;
      padding-block: 18px 24px;
    }

    .duduq-mascot[data-size="complete"] {
      width: 132px;
      height: 132px;
    }

    .duduq-engine-complete-hero {
      min-height: 122px;
    }
  }


  /* ========================================================================
     Host 1.0.11 \u2014 FINAL VISUAL POLISH
     - t\xEDtulo do cabe\xE7alho permanece im\xF3vel em todos os estados;
     - imagens dos alvos ganham presen\xE7a sem comprometer a \xE1rea de resposta;
     - indicadores de capacidade ficam mais leg\xEDveis para crian\xE7as e tablets;
     - feedback de sucesso vira uma faixa horizontal eficiente em desktop;
     - confirma\xE7\xE3o verde e conclus\xE3o recebem acabamento mais elegante.
     ======================================================================== */

  /* Reserva permanente do avatar: o t\xEDtulo n\xE3o salta quando o mascote muda
     do cabe\xE7alho para o feedback ou para a conclus\xE3o. */
  .duduq-engine-header-mascot-slot {
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    display: grid;
    place-items: center;
  }

  .duduq-engine-header-mascot-slot[data-visible="false"] {
    visibility: hidden;
  }

  .duduq-engine-header-mascot-slot .duduq-mascot[data-size="idle"] {
    width: 46px;
    height: 46px;
  }

  /* Aumenta a pista visual em aproximadamente 10%, mantendo o cart\xE3o e a
     \xE1rea de toque est\xE1veis. */
  .duduq-engine-stage .duduq-dd-target-media {
    width: clamp(120px, 13.6vw, 162px);
    height: clamp(120px, 13.6vw, 162px);
    filter: drop-shadow(0 8px 12px rgba(31,65,99,.095));
  }

  .duduq-engine-stage
    .duduq-dd-target[data-has-media="true"]
    .duduq-dd-target-head {
    min-height: clamp(142px, 19vh, 180px);
    padding-top: 5px;
  }

  /* Contador 0/1 e 1/1: leitura mais r\xE1pida, contraste maior e alinhamento
     consistente sem competir com a imagem. */
  .duduq-engine-stage .duduq-dd-capacity-badge {
    min-width: 31px !important;
    padding: 3px 7px !important;
    border: 1px solid #d9e4ef;
    background: #f2f6fa !important;
    color: #3f5874 !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95);
    font-size: 12.5px !important;
    line-height: 1.05;
    font-weight: 900 !important;
    font-variant-numeric: tabular-nums;
  }

  /* O acerto continua inequ\xEDvoco, por\xE9m com menos satura\xE7\xE3o repetida entre
     fundo, borda, sombra, item e selo. */
  .duduq-engine-stage
    .duduq-dd-target:has(.duduq-dd-item[data-feedback="correct"]) {
    border-color: #68cb4e;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,255,255,.9), transparent 58%),
      linear-gradient(180deg, #f7fff4 0%, #effbea 100%);
    box-shadow:
      0 3px 0 #65bc4f,
      0 9px 20px rgba(48,145,37,.085),
      inset 0 1px 0 rgba(255,255,255,.96);
  }

  .duduq-engine-stage .duduq-dd-item[data-feedback="correct"] {
    border-color: #45b72c;
    background: linear-gradient(180deg, #ffffff 0%, #f3ffef 100%);
    box-shadow:
      0 4px 0 #319f19,
      0 7px 13px rgba(48,145,37,.10),
      inset 0 1px 0 rgba(255,255,255,.98);
  }

  /* No desktop, mensagem e a\xE7\xE3o ocupam a mesma linha. O bot\xE3o deixa de
     flutuar no centro de uma caixa muito larga. */
  @media (min-width: 760px) {
    .duduq-engine-feedback[data-state="success"]
      .duduq-engine-feedback-card {
      grid-template-columns: 62px minmax(0, 1fr) minmax(220px, 280px);
      gap: 14px 20px;
      min-height: 88px;
      padding: 13px 18px 15px;
    }

    .duduq-engine-feedback[data-state="success"]
      .duduq-engine-feedback-action {
      grid-column: auto;
      justify-self: end;
      width: 100%;
      margin-top: 0;
    }

    .duduq-engine-feedback[data-state="retry"]
      .duduq-engine-feedback-card {
      grid-template-columns: 62px minmax(0, 1fr);
      min-height: 80px;
      padding: 12px 18px 14px;
    }
  }

  /* Conclus\xE3o: aproxima personagem e mensagem e concentra a luz no n\xFAcleo
     celebrativo, evitando um grande halo vazio. */
  .duduq-engine-complete {
    background:
      radial-gradient(ellipse 40% 34% at 50% 27%, rgba(190,255,169,.52), rgba(229,255,220,.24) 58%, transparent 76%),
      linear-gradient(180deg, #ffffff 0%, #f8fff6 100%);
  }

  .duduq-engine-complete-hero {
    min-height: 124px;
    margin-bottom: -3px;
  }

  .duduq-engine-complete-eyebrow {
    margin-top: -2px;
  }

  .duduq-engine-complete h2 {
    margin-top: 5px;
  }

  @media (min-width: 900px) and (max-height: 720px) {
    .duduq-engine-header-mascot-slot {
      width: 42px;
      height: 42px;
      flex-basis: 42px;
    }

    .duduq-engine-header-mascot-slot .duduq-mascot[data-size="idle"] {
      width: 42px;
      height: 42px;
    }

    .duduq-engine-stage .duduq-dd-target-media {
      width: 138px;
      height: 138px;
    }

    .duduq-engine-stage
      .duduq-dd-target[data-has-media="true"]
      .duduq-dd-target-head {
      min-height: 134px;
      padding-top: 1px;
    }

    .duduq-engine-feedback[data-state="success"]
      .duduq-engine-feedback-card {
      min-height: 78px;
      padding-block: 9px 11px;
    }

    .duduq-engine-complete-hero {
      min-height: 116px;
      margin-bottom: -5px;
    }
  }

  @media (max-width: 900px) {
    .duduq-engine-stage .duduq-dd-target-media {
      width: clamp(108px, 16vw, 144px);
      height: clamp(108px, 16vw, 144px);
    }
  }

  @media (max-width: 720px) {
    .duduq-engine-header-mascot-slot {
      width: 40px;
      height: 40px;
      flex-basis: 40px;
    }

    .duduq-engine-header-mascot-slot .duduq-mascot[data-size="idle"] {
      width: 40px;
      height: 40px;
    }

    .duduq-engine-stage .duduq-dd-target-media {
      width: clamp(92px, 22vw, 122px);
      height: clamp(92px, 22vw, 122px);
    }

    .duduq-engine-stage
      .duduq-dd-target[data-has-media="true"]
      .duduq-dd-target-head {
      min-height: 118px;
    }
  }

  @media (max-width: 520px) {
    .duduq-engine-header-mascot-slot {
      width: 36px;
      height: 36px;
      flex-basis: 36px;
    }

    .duduq-engine-header-mascot-slot .duduq-mascot[data-size="idle"] {
      width: 36px;
      height: 36px;
    }

    .duduq-engine-stage .duduq-dd-target-media {
      width: clamp(86px, 27vw, 112px);
      height: clamp(86px, 27vw, 112px);
    }
  }


  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     Continuidade visual sobre a arquitetura homologada:
     - raiz transparente para receber cen\xE1rios externos sem retrabalho;
     - uma \xFAnica escala de profundidade para cart\xF5es e controles;
     - destinos receptivos em vez de grandes caixas tracejadas;
     - feedback menos saturado e com leitura mais r\xE1pida;
     - composi\xE7\xE3o preservada em desktop, tablet, celular e baixa altura.
     ======================================================================== */

  :root {
    --premium-ink: #16375b;
    --premium-muted: #526d84;
    --premium-line: rgba(132, 171, 190, .42);
    --premium-surface: rgba(255, 255, 255, .925);
    --premium-surface-soft: rgba(247, 252, 252, .86);
    --premium-depth: #b9cfd7;
    --premium-blue: #0b73d1;
    --premium-blue-deep: #07549f;
    --premium-green: #52bd35;
    --premium-green-deep: #359b21;
    --premium-coral: #e77a62;
    --premium-coral-deep: #bf5d48;
  }

  .duduq-engine-root {
    padding: clamp(7px, 1vw, 14px);
    background: transparent;
    color: var(--premium-ink);
  }

  .duduq-engine-shell {
    width: min(1220px, 100%);
  }

  .duduq-engine-header {
    gap: 8px 14px;
    margin-bottom: 10px;
    padding: 9px 12px 10px;
    border: 1px solid var(--premium-line);
    border-radius: 20px;
    background: var(--premium-surface);
    box-shadow:
      0 4px 0 rgba(157, 188, 199, .68),
      0 15px 32px rgba(43, 89, 110, .12),
      inset 0 1px 0 rgba(255, 255, 255, .98);
    -webkit-backdrop-filter: blur(14px) saturate(1.04);
    backdrop-filter: blur(14px) saturate(1.04);
  }

  .duduq-engine-header-main {
    gap: 10px;
  }

  .duduq-engine-heading h1 {
    color: #102e52;
    font-size: clamp(1.12rem, 2vw, 1.45rem);
    letter-spacing: -.018em;
  }

  .duduq-engine-toolbar {
    gap: 7px;
  }

  .duduq-engine-toolbar .duduq-engine-button {
    min-height: 38px;
    padding: 7px 12px;
    border: 1px solid rgba(137, 166, 187, .48);
    border-radius: 13px;
    background: rgba(255, 255, 255, .84);
    color: #173b63;
    box-shadow:
      0 3px 0 rgba(162, 184, 199, .78),
      0 7px 14px rgba(43, 76, 105, .08),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-toolbar .duduq-engine-button:hover:not(:disabled) {
    transform: translateY(-1px);
    background: #fff;
    box-shadow:
      0 4px 0 rgba(151, 178, 195, .82),
      0 10px 18px rgba(43, 76, 105, .11),
      inset 0 1px 0 #fff;
  }

  .duduq-progress-trail {
    gap: 5px;
    padding: 5px 9px 8px;
    overflow: visible;
    border: 0;
    border-radius: 14px;
    background: transparent;
    box-shadow: none;
  }

  .duduq-progress-trail::before {
    display: none;
  }

  .duduq-progress-copy {
    padding-inline: 3px;
  }

  .duduq-progress-copy span {
    color: #4b6681;
    font-size: .64rem;
  }

  .duduq-progress-copy strong {
    color: #173b63;
    font-size: .84rem;
  }

  .duduq-progress-track {
    height: 13px;
    margin: 1px 13px 0;
    border: 1px solid #a9c2d2;
    background: #dce8ee;
    box-shadow:
      0 3px 0 #b5c9d2,
      inset 0 2px 4px rgba(55, 84, 118, .14),
      inset 0 -1px 0 rgba(255,255,255,.88);
  }

  .duduq-progress-track::after,
  .duduq-progress-fill::before,
  .duduq-progress-fill::after {
    display: none;
  }

  .duduq-progress-fill {
    background: #1889e7;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.48),
      inset 0 -1px 0 rgba(2,72,145,.18);
  }

  .duduq-progress-marker {
    width: 29px;
    height: 29px;
    border-width: 1px;
    background: #f8fbfc;
    box-shadow:
      0 3px 0 #aebfca,
      0 7px 13px rgba(33, 67, 104, .12),
      inset 0 1px 0 #fff;
    font-size: .92rem;
  }

  .duduq-progress-marker::after {
    display: none;
  }

  .duduq-progress-marker[data-status="current"] {
    border-color: #0e73ce;
    background: #1889e7;
    box-shadow:
      0 4px 0 #075aa8,
      0 0 0 4px rgba(24,137,231,.11),
      0 9px 16px rgba(6,101,190,.16),
      inset 0 2px 0 rgba(255,255,255,.46);
  }

  .duduq-progress-marker[data-status="complete"] {
    border-color: #e2ad17;
    background: #ffd34e;
    box-shadow:
      0 4px 0 #c88b08,
      0 8px 15px rgba(210,145,0,.18),
      inset 0 2px 0 rgba(255,255,255,.58);
  }

  .duduq-engine-stage .duduq-dd-surface {
    gap: clamp(8px, 1.2vh, 12px);
    padding-inline: clamp(3px, .8vw, 10px);
  }

  .duduq-engine-stage .duduq-dd-instruction {
    width: min(800px, calc(100% - 20px));
    min-height: 60px;
    margin-bottom: clamp(11px, 1.7vh, 17px);
    padding: 7px 14px 9px;
    border: 1px solid var(--premium-line);
    border-radius: 999px;
    background: var(--premium-surface);
    box-shadow:
      0 4px 0 rgba(161, 188, 199, .7),
      0 14px 27px rgba(43, 89, 110, .11),
      inset 0 1px 0 #fff;
    -webkit-backdrop-filter: blur(12px) saturate(1.03);
    backdrop-filter: blur(12px) saturate(1.03);
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button {
    background: var(--premium-blue) !important;
    box-shadow:
      0 5px 0 var(--premium-blue-deep) !important,
      0 10px 18px rgba(9, 103, 201, .18) !important,
      inset 0 2px 0 rgba(255,255,255,.32) !important;
  }

  .duduq-engine-stage .duduq-dd-board {
    width: min(1000px, 100%);
    gap: clamp(10px, 1.5vh, 16px);
  }

  .duduq-engine-stage .duduq-dd-target-grid {
    gap: clamp(10px, 1.25vw, 18px);
  }

  .duduq-engine-stage .duduq-dd-target,
  .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
    min-height: clamp(176px, 24vh, 216px);
    overflow: hidden;
    border: 1px solid rgba(151, 185, 196, .48);
    border-radius: 25px;
    background: var(--premium-surface);
    box-shadow:
      0 4px 0 rgba(164, 193, 201, .78),
      0 14px 28px rgba(44, 89, 109, .105),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
    border-color: #5da9df;
    background: rgba(245, 251, 255, .96);
    box-shadow:
      0 4px 0 #8eb9d6,
      0 0 0 4px rgba(24,137,231,.09),
      0 14px 28px rgba(44, 89, 109, .11),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-target-head {
    position: relative;
  }

  .duduq-engine-stage
    .duduq-dd-target[data-has-media="true"]
    .duduq-dd-target-head {
    min-height: clamp(126px, 17.5vh, 154px);
    padding: 4px 10px 0;
  }

  .duduq-engine-stage .duduq-dd-target-media {
    width: clamp(108px, 12vw, 144px);
    height: clamp(108px, 12vw, 144px);
    filter: drop-shadow(0 8px 12px rgba(31,65,99,.08));
  }

  .duduq-engine-stage .duduq-dd-capacity-badge {
    position: absolute;
    top: 10px;
    right: 11px;
    min-width: 29px !important;
    padding: 3px 6px !important;
    border: 1px solid rgba(160, 187, 202, .44);
    background: rgba(247, 251, 252, .94) !important;
    color: #4f6981 !important;
    box-shadow: 0 2px 5px rgba(53, 86, 111, .08);
    font-size: 11.5px !important;
  }

  .duduq-engine-stage .duduq-dd-target-items {
    width: calc(100% - 52px);
    min-height: 54px;
    flex: 0 0 54px;
    align-self: center;
    margin: 0 auto 13px;
    padding: 3px 8px;
    border: 2px dashed rgba(135, 174, 194, .46);
    border-radius: 999px;
    background: rgba(242, 249, 250, .76);
    transition:
      border-color 160ms ease,
      background-color 160ms ease,
      box-shadow 160ms ease;
  }

  .duduq-engine-stage .duduq-dd-target[data-active-target="true"] {
    border-color: #2f94ed;
    background: rgba(244, 251, 255, .98);
    box-shadow:
      0 4px 0 #86b7d9,
      0 0 0 5px rgba(47,148,237,.12),
      0 16px 30px rgba(31,116,194,.13),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage
    .duduq-dd-target[data-active-target="true"]
    .duduq-dd-target-items {
    border-color: #2f94ed;
    background: #f2f9ff;
    box-shadow: 0 0 0 4px rgba(47,148,237,.10);
  }

  .duduq-engine-stage .duduq-dd-target:has(.duduq-dd-item) .duduq-dd-target-items {
    border-color: transparent;
    background: transparent;
  }

  .duduq-engine-stage .duduq-dd-empty-note {
    color: #60778a;
    font-size: 12.5px;
    font-weight: 800;
  }

  .duduq-engine-stage .duduq-dd-pool {
    min-height: 94px;
    gap: 4px;
    padding: 7px 10px 12px;
    border: 1px solid rgba(151, 185, 196, .46);
    border-radius: 22px;
    background: var(--premium-surface-soft);
    box-shadow:
      0 3px 0 rgba(166, 192, 201, .68),
      0 11px 24px rgba(44, 89, 109, .085),
      inset 0 1px 0 #fff;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }

  .duduq-engine-stage .duduq-dd-pool-head {
    min-height: 26px;
    color: #425f78;
    font-size: 13px;
  }

  .duduq-engine-stage .duduq-dd-pool-items {
    min-height: 58px;
    gap: clamp(12px, 1.4vw, 18px);
    padding-bottom: 4px;
  }

  .duduq-engine-stage .duduq-dd-item {
    min-width: clamp(126px, 15vw, 166px);
    min-height: 54px;
    border: 1.5px solid #a8bfd1;
    border-radius: 17px;
    background: #fff;
    color: #102e52;
    box-shadow:
      0 5px 0 #9fb7c9,
      0 11px 18px rgba(37, 72, 103, .105),
      inset 0 2px 0 #fff;
    font-size: clamp(17px, 1.8vw, 21px);
  }

  @media (hover: hover) and (pointer: fine) {
    .duduq-engine-stage .duduq-dd-item:hover:not(:disabled):not([aria-disabled="true"]) {
      transform: translateY(-3px) scale(1.018);
      box-shadow:
        0 7px 0 #93aec2,
        0 15px 23px rgba(37, 72, 103, .14),
        inset 0 2px 0 #fff;
    }
  }

  .duduq-engine-stage .duduq-dd-item[data-selected="true"] {
    border-color: var(--premium-blue);
    background: #f5faff;
    box-shadow:
      0 5px 0 var(--premium-blue-deep),
      0 0 0 4px rgba(11,115,209,.12),
      0 12px 20px rgba(11,115,209,.14);
  }

  .duduq-engine-stage .duduq-dd-item[data-feedback="correct"] {
    border-color: #65c74c;
    background: #f8fff5;
    box-shadow:
      0 4px 0 var(--premium-green-deep),
      0 8px 15px rgba(48,145,37,.10),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-item[data-feedback="retry"] {
    border-color: #ed947e;
    background: #fff8f5;
    box-shadow:
      0 4px 0 var(--premium-coral-deep),
      0 8px 15px rgba(183, 77, 58, .09),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage
    .duduq-dd-target:has(.duduq-dd-item[data-feedback="correct"]) {
    border-color: #83d36b;
    background: rgba(248, 255, 246, .96);
    box-shadow:
      0 4px 0 #6ab953,
      0 11px 22px rgba(48,145,37,.085),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-action-slot {
    min-height: 66px;
    padding: 8px 0 4px;
  }

  .duduq-engine-stage .duduq-dd-primary {
    width: min(246px, 100%);
    min-height: 54px;
    border-radius: 17px;
    font-size: 18px;
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"] {
    background: var(--premium-blue);
    box-shadow:
      0 5px 0 var(--premium-blue-deep),
      0 12px 21px rgba(9,103,201,.18),
      inset 0 2px 0 rgba(255,255,255,.28);
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="false"] {
    background: rgba(227, 236, 241, .92);
    color: #74889a;
    box-shadow:
      0 4px 0 #bdccd5,
      inset 0 1px 0 rgba(255,255,255,.78);
  }

  .duduq-engine-feedback {
    margin-top: 7px;
  }

  .duduq-engine-feedback-card {
    border-width: 1px;
    border-radius: 21px;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }

  .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card {
    border-color: rgba(100, 190, 78, .72);
    background: rgba(246, 255, 243, .94);
    box-shadow:
      0 4px 0 rgba(83, 172, 57, .78),
      0 13px 25px rgba(54,169,0,.11),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
    border-color: rgba(229, 143, 109, .72);
    background: rgba(255, 248, 243, .95);
    box-shadow:
      0 4px 0 rgba(210, 113, 73, .72),
      0 13px 25px rgba(166,75,22,.09),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-feedback-action,
  .duduq-engine-complete-action {
    min-height: 54px;
    border-radius: 17px;
    background: var(--premium-blue);
    box-shadow:
      0 5px 0 var(--premium-blue-deep),
      0 12px 21px rgba(9,103,201,.18),
      inset 0 2px 0 rgba(255,255,255,.28);
  }

  .duduq-engine-complete {
    min-height: clamp(342px, 58vh, 448px);
    border: 1px solid rgba(137, 183, 145, .52);
    border-radius: 28px;
    background: rgba(250, 255, 248, .94);
    box-shadow:
      0 6px 0 rgba(147, 190, 148, .52),
      0 24px 48px rgba(46, 94, 65, .13),
      inset 0 1px 0 #fff;
    -webkit-backdrop-filter: blur(15px);
    backdrop-filter: blur(15px);
  }

  .duduq-mascot[data-state="complete"] .duduq-mascot-body {
    overflow: visible;
  }

  .duduq-mascot[data-state="complete"] img {
    transform: scale(3.45);
    object-position: 50% 52%;
  }

  @media (min-width: 900px) and (max-height: 720px) {
    .duduq-engine-root {

      min-height: 172px;
    }

    .duduq-engine-stage
      .duduq-dd-target[data-has-media="true"]

    }

    .duduq-engine-stage .duduq-dd-target-media {

    .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {

      margin-bottom: 9px;

    .duduq-engine-stage .duduq-dd-pool {

  @media (max-width: 520px) {

      padding: 6px;
    }

    .duduq-engine-stage .duduq-dd-instruction {
      width: calc(100% - 8px);
      border-radius: 22px;
    }

    .duduq-engine-stage .duduq-dd-target-items {
      min-height: 48px;
      flex-basis: 48px;

      min-height: 50px;
