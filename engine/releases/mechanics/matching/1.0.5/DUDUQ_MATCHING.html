  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     Continuidade visual sobre a arquitetura homologada:
     - raiz transparente para receber cen\xE1rios externos sem retrabalho;
     - uma \xFAnica escala de profundidade para cart\xF5es e controles;
     - destinos receptivos em vez de grandes caixas tracejadas;
     - feedback menos saturado e com leitura mais r\xE1pida;
     - composi\xE7\xE3o preservada em desktop, tablet, celular e baixa altura.
     ======================================================================== */

  :root {
    --premium-ink: #16375b;
    --premium-muted: #526d84;
    --premium-line: rgba(132, 171, 190, .42);
    --premium-surface: rgba(255, 255, 255, .925);
    --premium-surface-soft: rgba(247, 252, 252, .86);
    --premium-depth: #b9cfd7;
    --premium-blue: #0b73d1;
    --premium-blue-deep: #07549f;
    --premium-green: #52bd35;
    --premium-green-deep: #359b21;
    --premium-coral: #e77a62;
    --premium-coral-deep: #bf5d48;
  }

  .duduq-engine-root {
    padding: clamp(7px, 1vw, 14px);
    background: transparent;
    color: var(--premium-ink);
  }

  .duduq-engine-shell {
    width: min(1220px, 100%);
  }

  .duduq-engine-header {
    gap: 8px 14px;
    margin-bottom: 10px;
    padding: 9px 12px 10px;
    border: 1px solid var(--premium-line);
    border-radius: 20px;
    background: var(--premium-surface);
    box-shadow:
      0 4px 0 rgba(157, 188, 199, .68),
      0 15px 32px rgba(43, 89, 110, .12),
      inset 0 1px 0 rgba(255, 255, 255, .98);
    -webkit-backdrop-filter: blur(14px) saturate(1.04);
    backdrop-filter: blur(14px) saturate(1.04);
  }

  .duduq-engine-header-main {
    gap: 10px;
  }

  .duduq-engine-heading h1 {
    color: #102e52;
    font-size: clamp(1.12rem, 2vw, 1.45rem);
    letter-spacing: -.018em;
  }

  .duduq-engine-toolbar {
    gap: 7px;
  }

  .duduq-engine-toolbar .duduq-engine-button {
    min-height: 38px;
    padding: 7px 12px;
    border: 1px solid rgba(137, 166, 187, .48);
    border-radius: 13px;
    background: rgba(255, 255, 255, .84);
    color: #173b63;
    box-shadow:
      0 3px 0 rgba(162, 184, 199, .78),
      0 7px 14px rgba(43, 76, 105, .08),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-toolbar .duduq-engine-button:hover:not(:disabled) {
    transform: translateY(-1px);
    background: #fff;
    box-shadow:
      0 4px 0 rgba(151, 178, 195, .82),
      0 10px 18px rgba(43, 76, 105, .11),
      inset 0 1px 0 #fff;
  }

  .duduq-progress-trail {
    gap: 5px;
    padding: 5px 9px 8px;
    overflow: visible;
    border: 0;
    border-radius: 14px;
    background: transparent;
    box-shadow: none;
  }

  .duduq-progress-trail::before {
    display: none;
  }

  .duduq-progress-copy {
    padding-inline: 3px;
  }

  .duduq-progress-copy span {
    color: #4b6681;
    font-size: .64rem;
  }

  .duduq-progress-copy strong {
    color: #173b63;
    font-size: .84rem;
  }

  .duduq-progress-track {
    height: 13px;
    margin: 1px 13px 0;
    border: 1px solid #a9c2d2;
    background: #dce8ee;
    box-shadow:
      0 3px 0 #b5c9d2,
      inset 0 2px 4px rgba(55, 84, 118, .14),
      inset 0 -1px 0 rgba(255,255,255,.88);
  }

  .duduq-progress-track::after,
  .duduq-progress-fill::before,
  .duduq-progress-fill::after {
    display: none;
  }

  .duduq-progress-fill {
    background: #1889e7;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.48),
      inset 0 -1px 0 rgba(2,72,145,.18);
  }

  .duduq-progress-marker {
    width: 29px;
    height: 29px;
    border-width: 1px;
    background: #f8fbfc;
    box-shadow:
      0 3px 0 #aebfca,
      0 7px 13px rgba(33, 67, 104, .12),
      inset 0 1px 0 #fff;
    font-size: .92rem;
  }

  .duduq-progress-marker::after {
    display: none;
  }

  .duduq-progress-marker[data-status="current"] {
    border-color: #0e73ce;
    background: #1889e7;
    box-shadow:
      0 4px 0 #075aa8,
      0 0 0 4px rgba(24,137,231,.11),
      0 9px 16px rgba(6,101,190,.16),
      inset 0 2px 0 rgba(255,255,255,.46);
  }

  .duduq-progress-marker[data-status="complete"] {
    border-color: #e2ad17;
    background: #ffd34e;
    box-shadow:
      0 4px 0 #c88b08,
      0 8px 15px rgba(210,145,0,.18),
      inset 0 2px 0 rgba(255,255,255,.58);
  }

  .duduq-engine-stage .duduq-dd-surface {
    gap: clamp(8px, 1.2vh, 12px);
    padding-inline: clamp(3px, .8vw, 10px);
  }

  .duduq-engine-stage .duduq-dd-instruction {
    width: min(800px, calc(100% - 20px));
    min-height: 60px;
    margin-bottom: clamp(11px, 1.7vh, 17px);
    padding: 7px 14px 9px;
    border: 1px solid var(--premium-line);
    border-radius: 999px;
    background: var(--premium-surface);
    box-shadow:
      0 4px 0 rgba(161, 188, 199, .7),
      0 14px 27px rgba(43, 89, 110, .11),
      inset 0 1px 0 #fff;
    -webkit-backdrop-filter: blur(12px) saturate(1.03);
    backdrop-filter: blur(12px) saturate(1.03);
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button {
    background: var(--premium-blue) !important;
    box-shadow:
      0 5px 0 var(--premium-blue-deep) !important,
      0 10px 18px rgba(9, 103, 201, .18) !important,
      inset 0 2px 0 rgba(255,255,255,.32) !important;
  }

  .duduq-engine-stage .duduq-dd-board {
    width: min(1000px, 100%);
    gap: clamp(10px, 1.5vh, 16px);
  }

  .duduq-engine-stage .duduq-dd-target-grid {
    gap: clamp(10px, 1.25vw, 18px);
  }

  .duduq-engine-stage .duduq-dd-target,
  .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
    min-height: clamp(176px, 24vh, 216px);
    overflow: hidden;
    border: 1px solid rgba(151, 185, 196, .48);
    border-radius: 25px;
    background: var(--premium-surface);
    box-shadow:
      0 4px 0 rgba(164, 193, 201, .78),
      0 14px 28px rgba(44, 89, 109, .105),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
    border-color: #5da9df;
    background: rgba(245, 251, 255, .96);
    box-shadow:
      0 4px 0 #8eb9d6,
      0 0 0 4px rgba(24,137,231,.09),
      0 14px 28px rgba(44, 89, 109, .11),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-target-head {
    position: relative;
  }

  .duduq-engine-stage
    .duduq-dd-target[data-has-media="true"]
    .duduq-dd-target-head {
    min-height: clamp(126px, 17.5vh, 154px);
    padding: 4px 10px 0;
  }

  .duduq-engine-stage .duduq-dd-target-media {
    width: clamp(108px, 12vw, 144px);
    height: clamp(108px, 12vw, 144px);
    filter: drop-shadow(0 8px 12px rgba(31,65,99,.08));
  }

  .duduq-engine-stage .duduq-dd-capacity-badge {
    position: absolute;
    top: 10px;
    right: 11px;
    min-width: 29px !important;
    padding: 3px 6px !important;
    border: 1px solid rgba(160, 187, 202, .44);
    background: rgba(247, 251, 252, .94) !important;
    color: #4f6981 !important;
    box-shadow: 0 2px 5px rgba(53, 86, 111, .08);
    font-size: 11.5px !important;
  }

  .duduq-engine-stage .duduq-dd-target-items {
    width: calc(100% - 52px);
    min-height: 54px;
    flex: 0 0 54px;
    align-self: center;
    margin: 0 auto 13px;
    padding: 3px 8px;
    border: 2px dashed rgba(135, 174, 194, .46);
    border-radius: 999px;
    background: rgba(242, 249, 250, .76);
    transition:
      border-color 160ms ease,
      background-color 160ms ease,
      box-shadow 160ms ease;
  }

  .duduq-engine-stage .duduq-dd-target[data-active-target="true"] {
    border-color: #2f94ed;
    background: rgba(244, 251, 255, .98);
    box-shadow:
      0 4px 0 #86b7d9,
      0 0 0 5px rgba(47,148,237,.12),
      0 16px 30px rgba(31,116,194,.13),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage
    .duduq-dd-target[data-active-target="true"]
    .duduq-dd-target-items {
    border-color: #2f94ed;
    background: #f2f9ff;
    box-shadow: 0 0 0 4px rgba(47,148,237,.10);
  }

  .duduq-engine-stage .duduq-dd-target[data-occupied="true"] .duduq-dd-target-items {
    border-color: transparent;
    background: transparent;
  }

  .duduq-engine-stage .duduq-dd-empty-note {
    color: #60778a;
    font-size: 12.5px;
    font-weight: 800;
  }

  .duduq-engine-stage .duduq-dd-pool {
    min-height: 94px;
    gap: 4px;
    padding: 7px 10px 12px;
    border: 1px solid rgba(151, 185, 196, .46);
    border-radius: 22px;
    background: var(--premium-surface-soft);
    box-shadow:
      0 3px 0 rgba(166, 192, 201, .68),
      0 11px 24px rgba(44, 89, 109, .085),
      inset 0 1px 0 #fff;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }

  .duduq-engine-stage .duduq-dd-pool-head {
    min-height: 26px;
    color: #425f78;
    font-size: 13px;
  }

  .duduq-engine-stage .duduq-dd-pool-items {
    min-height: 58px;
    gap: clamp(12px, 1.4vw, 18px);
    padding-bottom: 4px;
  }

  .duduq-engine-stage .duduq-dd-item {
    min-width: clamp(126px, 15vw, 166px);
    min-height: 54px;
    border: 1.5px solid #a8bfd1;
    border-radius: 17px;
    background: #fff;
    color: #102e52;
    box-shadow:
      0 5px 0 #9fb7c9,
      0 11px 18px rgba(37, 72, 103, .105),
      inset 0 2px 0 #fff;
    font-size: clamp(17px, 1.8vw, 21px);
  }

  @media (hover: hover) and (pointer: fine) {
    .duduq-engine-stage .duduq-dd-item:hover:not(:disabled):not([aria-disabled="true"]) {
      transform: translateY(-3px) scale(1.018);
      box-shadow:
        0 7px 0 #93aec2,
        0 15px 23px rgba(37, 72, 103, .14),
        inset 0 2px 0 #fff;
    }
  }

  .duduq-engine-stage .duduq-dd-item[data-selected="true"] {
    border-color: var(--premium-blue);
    background: #f5faff;
    box-shadow:
      0 5px 0 var(--premium-blue-deep),
      0 0 0 4px rgba(11,115,209,.12),
      0 12px 20px rgba(11,115,209,.14);
  }

  .duduq-engine-stage .duduq-dd-item[data-feedback="correct"] {
    border-color: #65c74c;
    background: #f8fff5;
    box-shadow:
      0 4px 0 var(--premium-green-deep),
      0 8px 15px rgba(48,145,37,.10),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-item[data-feedback="retry"] {
    border-color: #ed947e;
    background: #fff8f5;
    box-shadow:
      0 4px 0 var(--premium-coral-deep),
      0 8px 15px rgba(183, 77, 58, .09),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage
    .duduq-dd-target:has(.duduq-dd-item[data-feedback="correct"]) {
    border-color: #83d36b;
    background: rgba(248, 255, 246, .96);
    box-shadow:
      0 4px 0 #6ab953,
      0 11px 22px rgba(48,145,37,.085),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-action-slot {
    min-height: 66px;
    padding: 8px 0 4px;
  }

  .duduq-engine-stage .duduq-dd-primary {
    width: min(246px, 100%);
    min-height: 54px;
    border-radius: 17px;
    font-size: 18px;
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"] {
    background: var(--premium-blue);
    box-shadow:
      0 5px 0 var(--premium-blue-deep),
      0 12px 21px rgba(9,103,201,.18),
      inset 0 2px 0 rgba(255,255,255,.28);
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="false"] {
    background: rgba(227, 236, 241, .92);
    color: #74889a;
    box-shadow:
      0 4px 0 #bdccd5,
      inset 0 1px 0 rgba(255,255,255,.78);
  }

  .duduq-engine-feedback {
    margin-top: 7px;
  }

  .duduq-engine-feedback-card {
    border-width: 1px;
    border-radius: 21px;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }

  .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card {
    border-color: rgba(100, 190, 78, .72);
    background: rgba(246, 255, 243, .94);
    box-shadow:
      0 4px 0 rgba(83, 172, 57, .78),
      0 13px 25px rgba(54,169,0,.11),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
    border-color: rgba(229, 143, 109, .72);
    background: rgba(255, 248, 243, .95);
    box-shadow:
      0 4px 0 rgba(210, 113, 73, .72),
      0 13px 25px rgba(166,75,22,.09),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-feedback-action,
  .duduq-engine-complete-action {
    min-height: 54px;
    border-radius: 17px;
    background: var(--premium-blue);
    box-shadow:
      0 5px 0 var(--premium-blue-deep),
      0 12px 21px rgba(9,103,201,.18),
      inset 0 2px 0 rgba(255,255,255,.28);
  }

  .duduq-engine-complete {
    min-height: clamp(342px, 58vh, 448px);
    border: 1px solid rgba(137, 183, 145, .52);
    border-radius: 28px;
    background: rgba(250, 255, 248, .94);
    box-shadow:
      0 6px 0 rgba(147, 190, 148, .52),
      0 24px 48px rgba(46, 94, 65, .13),
      inset 0 1px 0 #fff;
    -webkit-backdrop-filter: blur(15px);
    backdrop-filter: blur(15px);
  }

  .duduq-mascot[data-state="complete"] .duduq-mascot-body {
    overflow: visible;
  }

  .duduq-mascot[data-state="complete"] img {
    transform: scale(3.45);
    object-position: 50% 52%;
  }

  @media (min-width: 900px) and (max-height: 720px) {
    .duduq-engine-root {
      padding: 6px 8px 9px;
    }

    .duduq-engine-header {
      margin-bottom: 8px;
      padding-block: 7px 8px;
    }

    .duduq-progress-trail {
      padding-block: 4px 6px;
    }

    .duduq-engine-stage .duduq-dd-instruction {
      min-height: 56px;
      margin-bottom: 10px;
    }

    .duduq-engine-stage .duduq-dd-target,
    .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
      min-height: 172px;
    }

    .duduq-engine-stage
      .duduq-dd-target[data-has-media="true"]
      .duduq-dd-target-head {
      min-height: 118px;
    }

    .duduq-engine-stage .duduq-dd-target-media {
      width: 118px;
      height: 118px;
    }

    .duduq-engine-stage .duduq-dd-pool {
      min-height: 86px;
      padding-block: 5px 9px;
    }

    .duduq-engine-stage .duduq-dd-action-slot {
      min-height: 59px;
      padding-top: 5px;
    }
  }

  @media (max-width: 720px) {
    .duduq-engine-header {
      border-radius: 17px;
    }

    .duduq-engine-stage .duduq-dd-target,
    .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
      border-radius: 19px;
    }

    .duduq-engine-stage .duduq-dd-target-items {
      width: calc(100% - 18px);
      margin-bottom: 9px;
    }

    .duduq-engine-stage .duduq-dd-pool {
      border-radius: 18px;
    }
  }

  @media (max-width: 520px) {
    .duduq-engine-root {
      padding: 6px;
    }

    .duduq-engine-stage .duduq-dd-instruction {
      width: calc(100% - 8px);
      border-radius: 22px;
    }

    .duduq-engine-stage .duduq-dd-target-items {
      min-height: 48px;
      flex-basis: 48px;
    }

    .duduq-engine-stage .duduq-dd-item {
      min-width: 78px;
      min-height: 50px;
      border-radius: 15px;
    }
  }


  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     Integra\xE7\xE3o visual desacoplada do cen\xE1rio, mascote sem recorte e
     recompensa leve com confete estrelado de execu\xE7\xE3o \xFAnica.
     ======================================================================== */

  .duduq-engine-root {
    --premium-surface: rgba(255, 255, 255, .97);
    --premium-surface-soft: rgba(248, 252, 253, .94);
    isolation: isolate;
    background: transparent !important;
    background-image: none !important;
  }

  .duduq-engine-header,
  .duduq-engine-stage .duduq-dd-instruction,
  .duduq-engine-stage .duduq-dd-target,
  .duduq-engine-stage .duduq-dd-pool,
  .duduq-engine-feedback-card,
  .duduq-engine-complete {
    background-clip: padding-box;
  }

  /* O slot agora enquadra o PNG completo. O zoom continua compensando a
     margem transparente original, mas n\xE3o recorta chap\xE9u, bra\xE7os ou base. */
  .duduq-mascot,
  .duduq-mascot-body,
  .duduq-engine-feedback-card,
  .duduq-engine-complete {
    overflow: visible;
  }

  .duduq-mascot-body {
    transform-origin: 50% 78%;
  }

  .duduq-mascot img {
    backface-visibility: hidden;
  }

  .duduq-mascot[data-size="idle"] {
    width: 46px;
    height: 46px;
  }

  .duduq-mascot[data-size="feedback"] {
    width: 86px;
    height: 86px;
  }

  .duduq-mascot[data-size="transition"] {
    width: 106px;
    height: 106px;
  }

  .duduq-mascot[data-size="complete"] {
    width: 174px;
    height: 174px;
  }

  .duduq-mascot[data-state="idle"] img {
    transform: scale(3.45);
    object-position: 50% 52%;
  }

  .duduq-mascot[data-state="transition"] img {
    transform: scale(3.35);
    object-position: 50% 52%;
  }

  .duduq-mascot[data-state="success"] img,
  .duduq-mascot[data-state="retry"] img {
    transform: scale(3.3);
    object-position: 50% 52%;
  }

  .duduq-mascot[data-state="complete"] img {
    transform: scale(3.12);
    object-position: 50% 54%;
  }

  .duduq-mascot[data-state="idle"] .duduq-mascot-body {
    animation: duduq-premium-breathe 4.8s cubic-bezier(.45, 0, .55, 1) infinite;
    will-change: transform;
  }

  @keyframes duduq-premium-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    48% { transform: translateY(-1.5px) scale(1.012, .994); }
    56% { transform: translateY(-1.5px) scale(1.009, .996); }
  }

  /* Confete estrelado: uma \xFAnica explos\xE3o por acerto, sem depend\xEAncias,
     sem mudan\xE7a de layout e sem interceptar intera\xE7\xE3o. */
  .duduq-star-burst[data-origin="mascot"][data-variant="answer"] {
    inset: -165%;
    contain: layout style paint;
  }

  .duduq-star-burst[data-origin="mascot"][data-variant="answer"]
    .duduq-star-particle {
    font-size: 14px;
    animation-name: duduq-premium-confetti-pop;
    animation-duration: 1040ms;
  }

  .duduq-star-burst[data-origin="mascot"][data-variant="answer"]
    .duduq-star-particle:nth-child(3n + 2) {
    font-size: 11px;
  }

  .duduq-star-burst[data-origin="mascot"][data-variant="answer"]
    .duduq-star-particle:nth-child(4n) {
    font-size: 17px;
  }

  .duduq-star-particle:nth-child(5n + 1) { color: #ffd43b; }
  .duduq-star-particle:nth-child(5n + 2) { color: #55c83a; }
  .duduq-star-particle:nth-child(5n + 3) { color: #2e9cf4; }
  .duduq-star-particle:nth-child(5n + 4) { color: #ff8068; }
  .duduq-star-particle:nth-child(5n + 5) { color: #8b70e8; }

  @keyframes duduq-premium-confetti-pop {
    0% {
      transform: translate(-50%, -50%) scale(.25) rotate(0deg);
      opacity: 0;
    }
    14% { opacity: 1; }
    72% { opacity: .95; }
    100% {
      transform:
        translate(
          calc(-50% + var(--star-x)),
          calc(-50% + var(--star-y))
        )
        scale(.82)
        rotate(var(--star-rotation));
      opacity: 0;
    }
  }

  @media (max-width: 520px) {
    .duduq-mascot[data-size="idle"] {
      width: 42px;
      height: 42px;
    }

    .duduq-mascot[data-size="feedback"] {
      width: 76px;
      height: 76px;
    }

    .duduq-mascot[data-size="complete"] {
      width: 154px;
      height: 154px;
    }

    .duduq-star-burst[data-origin="mascot"][data-variant="answer"] {
      inset: -145%;
    }
  }


  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     HUD enxuto, feedback sem sobreposi\xE7\xE3o e respira\xE7\xE3o em camadas separadas.
     Nenhuma regra altera estado, hit target, avalia\xE7\xE3o ou navega\xE7\xE3o.
     ======================================================================== */

  .duduq-engine-header {
    gap: 6px 12px;
    margin-bottom: 9px;
    padding: 8px 12px;
  }

  .duduq-progress-trail {
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    min-height: 28px;
    padding: 0 4px 2px;
  }

  .duduq-progress-copy {
    grid-column: 2;
    grid-row: 1;
    display: block;
    padding: 0;
  }

  .duduq-progress-copy span {
    display: none;
  }

  .duduq-progress-copy strong {
    display: block;
    color: #294e74;
    font-size: .78rem;
    line-height: 1;
  }

  .duduq-progress-track {
    grid-column: 1;
    grid-row: 1;
    height: 9px;
    margin: 0 13px;
    border-width: 1px;
    box-shadow:
      0 2px 0 #b5c9d2,
      inset 0 1px 3px rgba(55, 84, 118, .13);
  }

  .duduq-progress-marker {
    width: 24px;
    height: 24px;
    border-width: 1px;
    font-size: .74rem;
    box-shadow:
      0 2px 0 #aebfca,
      0 5px 10px rgba(33, 67, 104, .10),
      inset 0 1px 0 #fff;
  }

  .duduq-progress-marker[data-status="current"] {
    box-shadow:
      0 3px 0 #075aa8,
      0 0 0 3px rgba(24,137,231,.10),
      0 6px 12px rgba(6,101,190,.13),
      inset 0 1px 0 rgba(255,255,255,.46);
  }

  .duduq-progress-marker[data-status="complete"] {
    box-shadow:
      0 3px 0 #c88b08,
      0 6px 12px rgba(210,145,0,.15),
      inset 0 1px 0 rgba(255,255,255,.58);
  }

  @media (min-width: 980px) {
    .duduq-engine-header {
      grid-template-columns:
        minmax(280px, .85fr)
        minmax(300px, 1.1fr)
        auto;
      min-height: 64px;
    }

    .duduq-engine-header-main {
      grid-column: 1;
      grid-row: 1;
    }

    .duduq-progress-trail {
      grid-column: 2;
      grid-row: 1;
    }

    .duduq-engine-toolbar {
      grid-column: 3;
      grid-row: 1;
    }
  }

  /* A coluna do personagem considera a \xE1rea vis\xEDvel real do PNG ampliado.
     O texto deixa de come\xE7ar sob o mascote, mesmo com confete ativo. */
  .duduq-engine-feedback-card {
    column-gap: 16px;
  }

  .duduq-engine-feedback .duduq-mascot[data-size="feedback"] {
    width: 80px;
    height: 80px;
    justify-self: center;
    align-self: center;
    margin: 0;
    animation: duduq-feedback-breathe 4.6s cubic-bezier(.45, 0, .55, 1) 620ms infinite;
    transform-origin: 50% 78%;
    will-change: transform;
  }

  @media (min-width: 760px) {
    .duduq-engine-feedback[data-state="success"]
      .duduq-engine-feedback-card {
      grid-template-columns: 110px minmax(0, 1fr) minmax(220px, 280px);
      gap: 12px 18px;
      padding-left: 14px;
    }

    .duduq-engine-feedback[data-state="retry"]
      .duduq-engine-feedback-card {
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 12px 18px;
      padding-left: 14px;
    }
  }

  @media (max-width: 759px) {
    .duduq-engine-feedback-card,
    .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card,
    .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
      grid-template-columns: 94px minmax(0, 1fr);
      gap: 10px 12px;
    }
  }

  /* O repouso do cabe\xE7alho e os feedbacks respiram em elementos distintos.
     Assim, a entrada de acerto/erro continua intacta e n\xE3o h\xE1 disputa de
     transform entre anima\xE7\xF5es. */
  .duduq-mascot[data-state="idle"] .duduq-mascot-body {
    animation: duduq-premium-breathe 4.4s cubic-bezier(.45, 0, .55, 1) infinite;
  }

  .duduq-engine-complete .duduq-mascot[data-size="complete"] {
    animation: duduq-complete-breathe 5.1s cubic-bezier(.45, 0, .55, 1) 760ms infinite;
    transform-origin: 50% 80%;
    will-change: transform;
  }

  @keyframes duduq-premium-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    48% { transform: translateY(-2.1px) scale(1.016, .992); }
    56% { transform: translateY(-2.1px) scale(1.012, .994); }
  }

  @keyframes duduq-feedback-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2px) scale(1.014, .994); }
  }

  @keyframes duduq-complete-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2.4px) scale(1.012, .995); }
  }

  .duduq-mascot[data-reduced-motion="true"],
  .duduq-mascot[data-reduced-motion="true"] .duduq-mascot-body {
    animation: none !important;
    transform: none !important;
    will-change: auto;
  }

  @media (max-width: 520px) {
    .duduq-progress-trail {
      gap: 7px;
      min-height: 26px;
    }

    .duduq-progress-copy strong {
      font-size: .72rem;
    }

    .duduq-engine-feedback-card,
    .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card,
    .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
      grid-template-columns: 84px minmax(0, 1fr);
      padding-inline: 10px;
    }

    .duduq-engine-feedback .duduq-mascot[data-size="feedback"] {
      width: 72px;
      height: 72px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .duduq-mascot {
      animation: none !important;
      transform: none !important;
      will-change: auto;
    }
  }


  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     Centro \xF3ptico real no HUD, respiro superior e conclus\xE3o sem halo verde.
     ======================================================================== */

  .duduq-engine-root {
    padding-top: clamp(16px, 2.2vh, 22px);
  }

  @media (min-width: 1120px) {
    .duduq-engine-header {
      grid-template-columns:
        minmax(0, 1fr)
        minmax(480px, 580px)
        minmax(0, 1fr);
      gap: 14px;
    }

    .duduq-engine-header-main {
      justify-self: start;
      width: 100%;
    }

    .duduq-progress-trail {
      width: 100%;
      max-width: 580px;
      justify-self: center;
    }

    .duduq-engine-toolbar {
      justify-self: end;
    }
  }

  @media (min-width: 900px) and (max-height: 720px) {
    .duduq-engine-root {
      padding-top: 14px;
    }
  }

  /* A conclus\xE3o mant\xE9m o significado de sucesso na borda e no texto, mas
     elimina a grande mancha verde atr\xE1s do personagem e sua anima\xE7\xE3o cont\xEDnua. */
  .duduq-engine-complete {
    background:
      linear-gradient(
        180deg,
        rgba(255, 255, 255, .985) 0%,
        rgba(248, 252, 254, .97) 100%
      );
  }

  .duduq-engine-complete::before {
    display: none;
    animation: none !important;
  }

  /* Respira\xE7\xE3o um pouco mais presente, ainda lenta e sem filtros ou repaints
     caros. Cada estado continua animando apenas um transform composto. */
  .duduq-mascot[data-state="idle"] .duduq-mascot-body {
    animation: duduq-premium-breathe 4.2s cubic-bezier(.45, 0, .55, 1) infinite;
  }

  .duduq-engine-feedback .duduq-mascot[data-size="feedback"] {
    animation: duduq-feedback-breathe 4.15s cubic-bezier(.45, 0, .55, 1) 620ms infinite;
  }

  .duduq-engine-complete .duduq-mascot[data-size="complete"] {
    animation: duduq-complete-breathe 4.45s cubic-bezier(.45, 0, .55, 1) 760ms infinite;
  }

  @keyframes duduq-premium-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    48% { transform: translateY(-2.8px) scale(1.019, .990); }
    56% { transform: translateY(-2.8px) scale(1.015, .992); }
  }

  @keyframes duduq-feedback-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-3.4px) scale(1.022, .989); }
  }

  @keyframes duduq-complete-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-4.4px) scale(1.025, .987); }
  }

  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     Hierarquia final: progresso mais leg\xEDvel, feedback alinhado ao tabuleiro
     e CTA de avan\xE7o semanticamente verde. Apenas apresenta\xE7\xE3o \xE9 alterada.
     ======================================================================== */

  .duduq-engine-feedback {
    width: min(1000px, calc(100% - 20px));
    margin-inline: auto;
  }

  .duduq-engine-button,
  .duduq-engine-stage .duduq-dd-primary {
    text-transform: uppercase;
    letter-spacing: .035em;
  }

  .duduq-engine-stage .duduq-dd-primary {
    width: min(210px, 100%);
  }

  /* Um \xFAnico chamado t\xE1til quando a a\xE7\xE3o fica dispon\xEDvel. A vibra\xE7\xE3o \xE9
     curta, discreta e baseada apenas em transform; n\xE3o se repete em repouso. */
  .duduq-engine-stage
    .duduq-dd-action-slot[data-feedback-state="idle"]
    .duduq-dd-primary[data-enabled="true"] {
    animation: duduq-confirm-nudge 560ms cubic-bezier(.22, .75, .22, 1) 1 !important;
  }

  .duduq-engine-stage
    .duduq-dd-action-slot[data-feedback-state="retry"]
    .duduq-dd-primary,
  .duduq-engine-stage
    .duduq-dd-action-slot[data-feedback-state="success"]
    .duduq-dd-primary {
    animation: duduq-dd-check-exit 180ms ease-in forwards !important;
  }

  @keyframes duduq-confirm-nudge {
    0% { transform: translateX(0) scale(.985); }
    34% { transform: translateX(-1.8px) scale(1.012); }
    46% { transform: translateX(1.6px) scale(1.014); }
    58% { transform: translateX(-1.1px) scale(1.01); }
    72% { transform: translateX(.7px) scale(1.006); }
    100% { transform: translateX(0) scale(1); }
  }

  .duduq-engine-feedback[data-state="success"]
    .duduq-engine-feedback-action {
    border-color: #45ad00;
    background: linear-gradient(180deg, #70e90e 0%, #58cc02 58%, #4cba00 100%);
    color: #fff;
    box-shadow:
      0 5px 0 #359500,
      0 12px 20px rgba(57, 156, 0, .20),
      inset 0 2px 0 rgba(255, 255, 255, .32);
  }

  .duduq-engine-feedback[data-state="success"]
    .duduq-engine-feedback-action:hover:not(:disabled) {
    background: linear-gradient(180deg, #7af118 0%, #60d608 58%, #52c500 100%);
    box-shadow:
      0 6px 0 #359500,
      0 15px 24px rgba(57, 156, 0, .24),
      inset 0 2px 0 rgba(255, 255, 255, .36);
  }

  .duduq-engine-feedback[data-state="success"]
    .duduq-engine-feedback-action:active:not(:disabled) {
    background: linear-gradient(180deg, #5fd508 0%, #50c000 100%);
    box-shadow:
      0 2px 0 #359500,
      0 7px 13px rgba(57, 156, 0, .18),
      inset 0 1px 0 rgba(255, 255, 255, .24);
  }

  @media (max-width: 720px) {
    .duduq-engine-feedback {
      width: 100%;
    }
  }

  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     Profundidade mais limpa: mant\xE9m a base t\xE1til curta e reduz a n\xE9voa das
     sombras ambientais. As imagens crescem sem mudar a mec\xE2nica dos cart\xF5es.
     ======================================================================== */

  .duduq-engine-header {
    box-shadow:
      0 3px 0 rgba(157, 188, 199, .62),
      0 8px 16px rgba(43, 89, 110, .06),
      inset 0 1px 0 rgba(255, 255, 255, .98);
  }

  .duduq-engine-stage .duduq-dd-instruction {
    box-shadow:
      0 3px 0 rgba(161, 188, 199, .64),
      0 7px 14px rgba(43, 89, 110, .055),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-target,
  .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
    box-shadow:
      0 3px 0 rgba(164, 193, 201, .7),
      0 7px 14px rgba(44, 89, 109, .05),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-target[data-active-target="true"] {
    box-shadow:
      0 3px 0 #86b7d9,
      0 0 0 3px rgba(47, 148, 237, .1),
      0 8px 16px rgba(31, 116, 194, .075),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage
    .duduq-dd-target:has(.duduq-dd-item[data-feedback="correct"]) {
    box-shadow:
      0 3px 0 #6ab953,
      0 7px 14px rgba(48, 145, 37, .055),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-pool {
    box-shadow:
      0 3px 0 rgba(166, 192, 201, .62),
      0 6px 12px rgba(44, 89, 109, .045),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card {
    box-shadow:
      0 3px 0 rgba(83, 172, 57, .72),
      0 7px 14px rgba(54, 169, 0, .065),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
    box-shadow:
      0 3px 0 rgba(210, 113, 73, .68),
      0 7px 14px rgba(166, 75, 22, .055),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-complete {
    box-shadow:
      0 4px 0 rgba(147, 190, 148, .48),
      0 12px 24px rgba(46, 94, 65, .075),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-dd-target-media {
    width: clamp(120px, 13vw, 158px);
    height: clamp(120px, 13vw, 158px);
    filter: drop-shadow(0 4px 8px rgba(31, 65, 99, .05));
  }

  .duduq-engine-stage
    .duduq-dd-target[data-has-media="true"]
    .duduq-dd-target-head {
    min-height: clamp(136px, 18.5vh, 166px);
  }

  @media (min-width: 900px) and (max-height: 720px) {

      width: 132px;
      height: 132px;
    }

    .duduq-engine-stage
      .duduq-dd-target[data-has-media="true"]
      .duduq-dd-target-head {
      min-height: 132px;
    }
  }

  @media (max-width: 720px) {
    .duduq-engine-stage .duduq-dd-target-media {
      width: clamp(104px, 28vw, 128px);
      height: clamp(104px, 28vw, 128px);
    }
  }

  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     Press\xE3o t\xE1til consistente sem interferir nas pe\xE7as arrast\xE1veis.
     Apenas transform, filter e box-shadow mudam durante o toque.
     ======================================================================== */

  .duduq-engine-button,
  .duduq-engine-stage .duduq-dd-primary,
  .duduq-engine-stage .duduq-dd-audio-shell > button {
    transform-origin: 50% 100%;
    touch-action: manipulation;
    transition:
      transform 90ms cubic-bezier(.2, .75, .25, 1),
      box-shadow 90ms ease,
      filter 110ms ease,
      background-color 140ms ease;
  }

  /* O CTA de avan\xE7o fica est\xE1vel no hover. A antiga onda infinita alterava
     o overflow visual e tamb\xE9m tinha prioridade sobre o estado pressionado. */
  .duduq-engine-feedback-action {
    animation: none !important;
  }

  .duduq-engine-feedback-action:hover:not(:disabled) {
    transform: none !important;
  }

  .duduq-engine-button:active:not(:disabled),
  .duduq-engine-stage
    .duduq-dd-action-slot[data-feedback-state="idle"]
    .duduq-dd-primary[data-enabled="true"]:active,
  .duduq-engine-stage
    .duduq-dd-audio-shell > button:active:not(:disabled) {
    filter: brightness(.94) saturate(.98);
    transition-duration: 45ms;
  }

  .duduq-engine-stage
    .duduq-dd-action-slot[data-feedback-state="idle"]
    .duduq-dd-primary[data-enabled="true"]:active {
    animation: none !important;
    transform: translateY(5px) scaleX(1.012) scaleY(.94) !important;
    filter: brightness(.9) saturate(.96);
    box-shadow:
      0 0 0 var(--premium-blue-deep),
      inset 0 4px 6px rgba(2, 47, 96, .23),
      inset 0 1px 0 rgba(255, 255, 255, .1) !important;
  }

  .duduq-engine-button-primary:not(.duduq-engine-feedback-action):active:not(:disabled) {
    transform: translateY(5px) scaleX(1.012) scaleY(.94) !important;
    filter: brightness(.9) saturate(.96);
    box-shadow:
      0 0 0 var(--premium-blue-deep),
      inset 0 4px 6px rgba(2, 47, 96, .23),
      inset 0 1px 0 rgba(255, 255, 255, .1) !important;
  }

  .duduq-engine-feedback[data-state="success"]
    .duduq-engine-feedback-action:active:not(:disabled) {
    animation: none !important;
    transform: translateY(5px) scaleX(1.012) scaleY(.94) !important;
    filter: brightness(.9) saturate(.96);
    box-shadow:
      0 0 0 #359500,
      inset 0 4px 6px rgba(34, 104, 0, .25),
      inset 0 1px 0 rgba(255, 255, 255, .1) !important;
  }

  .duduq-engine-button-secondary:active:not(:disabled),
  .duduq-engine-toolbar .duduq-engine-button:active:not(:disabled) {
    transform: translateY(4px) scaleX(1.008) scaleY(.95) !important;
    filter: brightness(.94);
    box-shadow:
      0 0 0 #b9c8d7,
      inset 0 3px 5px rgba(34, 63, 92, .14) !important;
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button:active:not(:disabled) {
    transform: translateY(5px) scaleX(1.025) scaleY(.91) !important;
    filter: brightness(.9) saturate(.96);
    box-shadow:
      0 0 0 var(--premium-blue-deep),
      inset 0 4px 6px rgba(2, 47, 96, .25),
      inset 0 1px 0 rgba(255, 255, 255, .1) !important;
  }

  .duduq-engine-button:active:not(:disabled)::after {
    opacity: .14;
    animation: none !important;
  }

  /* ========================================================================
     Host 1.0.22 \u2014 INTEGRATION READY
     O v\xEDdeo de QA mostrou que a mudan\xE7a percebida n\xE3o vinha do CTA se
     deslocando, mas da largura \xFAtil do viewport variando quando a barra de
     rolagem vertical aparecia. O gutter sim\xE9trico mant\xE9m o eixo central fixo;
     o fallback reserva a barra em navegadores sem suporte.
     ======================================================================== */

  html {
    overflow-y: auto;
    scrollbar-gutter: stable both-edges;
  }

  body {
    overflow-y: visible;
  }

  @supports not (scrollbar-gutter: stable) {
    html {
      overflow-y: scroll;
    }
  }

  /* O hover preserva a mesma extens\xE3o de sombra do repouso. Assim o bot\xE3o
     ganha brilho sem ampliar a regi\xE3o de overflow do documento. */
  .duduq-engine-feedback[data-state="success"]
    .duduq-engine-feedback-action:hover:not(:disabled) {
    transform: none !important;
    box-shadow:
      0 5px 0 #359500,
      0 12px 20px rgba(57, 156, 0, .20),
      inset 0 2px 0 rgba(255, 255, 255, .32) !important;
  }

  /* Mant\xE9m o esmagamento acima do hover na cascata final. */
  .duduq-engine-feedback[data-state="success"]
    .duduq-engine-feedback-action:active:not(:disabled) {
    transform: translateY(5px) scaleX(1.012) scaleY(.94) !important;
    box-shadow:
      0 0 0 #359500,
      inset 0 4px 6px rgba(34, 104, 0, .25),
      inset 0 1px 0 rgba(255, 255, 255, .1) !important;
  }

  /* Base visual compartilhada entre mec\xE2nicas: o feedback acompanha a
     largura \xFAtil do tabuleiro e preserva uma leitura confort\xE1vel. */
  .duduq-engine-feedback {
    width: min(860px, calc(100% - 20px));
    margin: 12px auto 0;
  }

  .duduq-engine-feedback-card,
  .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card,
  .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
    width: 100%;
    min-height: 94px;
    grid-template-columns: 76px minmax(0, 1fr) auto;
    column-gap: 18px;
    padding: 13px 22px 15px;
    border-radius: 21px;
  }

  .duduq-engine-feedback .duduq-mascot[data-size="feedback"] {
    width: 72px;
    height: 72px;
  }

  .duduq-engine-feedback-copy {
    align-self: center;
  }

  @media (max-width: 720px) {
    .duduq-engine-feedback {
      width: 100%;
      margin-top: 10px;
    }

    .duduq-engine-feedback-card,
    .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card,

    shuffleLeft: true,

    interactionMode: "smart",
    connectionMode: "1x1",
    snapDistance: 46,
    playAudioOnCardSelect: true,
    lockCorrectPairsOnRetry: true,

  function stableShuffle(items, random) {
    const result = [...items];
    for (let index = result.length - 1; index > 0; index -= 1) {
      const swapIndex = Math.floor(random() * (index + 1));
      [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
    }
    return result;

  function isSafeColorValue(value) {
    const normalized = value.trim();
    return /^#[0-9a-f]{3,8}$/i.test(normalized) || /^rgba?\([\d\s.,%]+\)$/i.test(normalized) || /^hsla?\([\d\s.,%a-z]+\)$/i.test(normalized) || /^[a-z]{3,20}$/i.test(normalized);

  function validateMatchingQuestion(question) {
    const issues = [];
    const leftIds = question.leftItems.map((item) => item.id);
    const rightIds = question.rightItems.map((item) => item.id);
    const leftSet = new Set(leftIds);
    const rightSet = new Set(rightIds);
    const interactionModes = new Set(["click", "touch", "smart"]);
    const connectionModes = new Set(["1x1", "1xN", "NxN"]);
    const interactionMode = question.behavior?.interactionMode ?? "smart";
    const connectionMode = question.behavior?.connectionMode ?? "1x1";
    if (!question.id.trim()) {
      issues.push({ path: "id", code: "ID_REQUIRED", message: "Informe o ID da questão.", severity: "error" });
    }
    if (!question.instruction.trim()) {
      issues.push({ path: "instruction", code: "INSTRUCTION_REQUIRED", message: "Informe a instrução.", severity: "error" });
    }
    if (question.leftItems.length < 1 || question.leftItems.length > 6) {
      issues.push({
        path: "leftItems",
        code: "LEFT_ITEMS_LIMIT",
        message: "A coluna esquerda deve conter entre 1 e 6 itens.",
        severity: "error"
      });

    if (question.rightItems.length < 1 || question.rightItems.length > 8) {
      issues.push({
        path: "rightItems",
        code: "RIGHT_ITEMS_LIMIT",
        message: "A coluna direita deve conter entre 1 e 8 itens.",
        severity: "error"
      });
    }
    if (new Set(leftIds).size !== leftIds.length) {

    }

  .duduq-engine-header {
    min-height: 76px;
    gap: 12px 18px;
    margin-bottom: clamp(18px, 2.4vh, 24px);
    padding: 10px 16px;
    border: 2px solid var(--dq-border);
    border-radius: 24px;
    background: rgba(255,255,255,.96);
    box-shadow:

  .duduq-engine-button-secondary,

    padding-inline: 14px;
    border: 2px solid var(--dq-border-strong);
    border-radius: 14px;
    background: var(--dq-surface);
    color: var(--dq-heading);
    box-shadow: 0 3px 0 var(--dq-depth);
  }

  .duduq-progress-trail {
    width: 100%;
    max-width: 580px;
    min-height: 52px;
    grid-template-columns: minmax(0,1fr) auto;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    border: 0;
    border-radius: 18px;
    background: transparent;
    box-shadow: none;
  }

  .duduq-progress-trail::before { display: none; }

  .duduq-progress-copy {
    grid-column: 2;
    display: block;
    min-width: max-content;
    padding: 0;
  }

  .duduq-progress-copy span { display: none; }

  .duduq-progress-copy strong {
    display: block;
    color: var(--dq-heading);
    font-family: Nunito, sans-serif;
    font-size: 13px;
    font-weight: 900;
    line-height: 1;
  }

  .duduq-progress-track,
  .duduq-progress-trail .duduq-progress-track {
    box-sizing: border-box;
    grid-column: 1;
    height: 16px;
    min-height: 16px;
    max-height: 16px;
    margin: 0 18px;
    border: 2px solid var(--dq-border-strong);
    border-radius: 999px;
    background: var(--dq-soft-surface);
    box-shadow:
      inset 0 2px 4px rgba(31,65,99,.13),
      0 2px 0 rgba(184,197,214,.8);
  }

  .duduq-progress-fill {
    border-radius: 999px;
    background: linear-gradient(180deg, #1471CF 0%, var(--dq-primary) 72%, #004892 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.26);
  }

  .duduq-progress-fill::after { animation-duration: 4.6s; opacity: .34; }

  .duduq-progress-trail[data-density="normal"] .duduq-progress-marker,
  .duduq-progress-trail[data-density="dense"] .duduq-progress-marker,
  .duduq-progress-marker {
    width: 22px;
    height: 22px;
    border: 2px solid var(--dq-border-strong);
    background: var(--dq-surface);
    color: var(--dq-muted);
    font-size: .7rem;
    box-shadow:
      0 3px 0 var(--dq-depth),
      0 7px 14px rgba(31,65,99,.08),
      inset 0 1px 0 #fff;
  }

  .duduq-progress-marker[data-status="current"] {
    border-color: var(--dq-primary);
    background: var(--dq-primary);
    color: #fff;
    box-shadow:
      0 4px 0 var(--dq-primary-depth),
      0 0 0 4px rgba(0,86,179,.11),
      0 9px 16px rgba(0,86,179,.14);
  }

  .duduq-progress-marker[data-status="complete"] {
    border-color: #D49A16;
    background: #FFD43B;
    color: #744E00;
    box-shadow: 0 4px 0 #C88B08, 0 8px 15px rgba(210,145,0,.14);
  }

  .duduq-mascot[data-size="idle"] { width: 64px; height: 64px; }
  .duduq-mascot[data-size="feedback"] { width: 84px; height: 84px; }
  .duduq-mascot[data-size="transition"] { width: 96px; height: 96px; }
  .duduq-mascot[data-size="complete"] { width: 154px; height: 154px; }

  .duduq-engine-header-mascot-slot {
    width: 72px;
    min-width: 72px;
    height: 64px;
    overflow: visible;
  }

  .duduq-engine-header-mascot-slot .duduq-mascot[data-size="idle"] {
    width: 64px;
    height: 64px;
  }

  .duduq-engine-stage { overflow: visible; }

  /* Enunciado canônico */
  .duduq-engine-stage .duduq-matching-instruction {
    width: min(760px, 100%);
    min-height: 60px;
    margin: clamp(14px,2.2vh,24px) auto clamp(24px,3.2vh,32px);
    grid-template-columns: 48px minmax(0,1fr) 48px;
    gap: 12px;
    padding: 8px 14px 10px;
    border: 2px solid var(--dq-border-strong);
    border-radius: 999px;
    background: rgba(255,255,255,.96);
    box-shadow:
      0 4px 0 var(--dq-depth),
      0 12px 24px rgba(31,65,99,.07),
      inset 0 1px 0 #fff;
  }

  .duduq-engine-stage .duduq-matching-instruction h2 {
    color: var(--dq-primary);
    font-family: Fredoka, Nunito, sans-serif;
    font-size: clamp(18px,2vw,28px);
    font-weight: 800;
    line-height: 1.16;

  .duduq-engine-stage .duduq-matching-instruction-spacer,
  .duduq-engine-stage .duduq-matching-audio-shell,
  .duduq-engine-stage .duduq-matching-audio {
    width: 48px;
    height: 48px;
  }

  .duduq-engine-stage .duduq-matching-audio {
    border: 2px solid var(--dq-primary-depth);
    background: linear-gradient(180deg,#1471CF 0%,var(--dq-primary) 72%,#004892 100%);
    color: #fff;
    box-shadow:
      0 5px 0 var(--dq-primary-depth),
      0 10px 18px rgba(0,86,179,.18),
      inset 0 2px 0 rgba(255,255,255,.36);

  .duduq-engine-stage .duduq-matching-audio[data-playing="true"] {
    border-color: #359500;
    background: linear-gradient(180deg,#70E90E 0%,#58CC02 62%,#49B900 100%);
    color: var(--dq-success-text);
    box-shadow:
      0 5px 0 #2F8A00,
      0 10px 18px rgba(57,156,0,.20),
      inset 0 2px 0 rgba(255,255,255,.36);
  }

  .duduq-matching-audio svg,
  .duduq-matching-item-audio svg { width: 22px; height: 22px; }

  /* Composição do Matching */
  .duduq-matching-root {
    color: var(--dq-text);
    font-family: Nunito, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .duduq-matching-surface {
    width: min(1000px,100%);
    gap: 0;
    padding: 0 clamp(4px,.8vw,12px);
  }

  .duduq-matching-board {
    width: min(980px,100%);
    grid-template-columns: minmax(0,1fr) clamp(72px,8vw,92px) minmax(0,1fr);
    align-items: stretch;
    gap: clamp(14px,1.8vw,22px);
    margin: 0 auto;
    padding: clamp(18px,2.25vw,26px);
    border: 2px solid var(--dq-border);
    border-radius: 24px;
    background:
      radial-gradient(circle at 15% 10%, rgba(239,248,255,.86), transparent 34%),
      radial-gradient(circle at 85% 88%, rgba(241,252,239,.68), transparent 32%),
      rgba(255,255,255,.94);
    box-shadow:
      0 4px 0 var(--dq-depth),
      0 14px 28px rgba(31,65,99,.075),
      inset 0 1px 0 #fff;
  }

  .duduq-matching-column {
    width: 100%;
    gap: clamp(14px,1.8vh,18px);
  }

  .duduq-matching-board[data-density="comfortable"] .duduq-matching-column {
    gap: clamp(16px,2.2vh,22px);
  }

  .duduq-matching-board[data-density="balanced"] .duduq-matching-column {
    gap: clamp(13px,1.7vh,17px);
  }

  .duduq-matching-board[data-density="compact"] .duduq-matching-column {
    gap: clamp(9px,1.25vh,12px);
  }

  .duduq-matching-column-title {
    min-height: 26px;
    color: var(--dq-muted);
    font: 900 13px/1 Nunito,sans-serif;
    letter-spacing: .055em;
  }

  .duduq-matching-card-shell {
    width: 100%;
    max-width: none;
  }

  .duduq-matching-card {
    width: 100%;
    min-height: 88px;
    grid-template-columns: 44px minmax(0,1fr) 44px;
    gap: 8px;
    padding: clamp(10px,1.2vw,14px);
    border: 2px solid var(--dq-border-strong);
    border-radius: 20px;
    background: linear-gradient(180deg,#FFFFFF 0%,#FAFCFE 100%);
    color: var(--dq-text);
    box-shadow:
      0 4px 0 var(--dq-depth),
      0 10px 18px rgba(31,65,99,.075),
      inset 0 1px 0 #fff;
    transition:
      transform 120ms ease,
      border-color 160ms ease,
      background-color 160ms ease,
      box-shadow 140ms ease,
      filter 140ms ease;
  }

  .duduq-matching-card:hover:not(:disabled) {
    border-color: #91ABC3;
    transform: translateY(-2px);
    filter: brightness(1.015);
    box-shadow:
      0 5px 0 var(--dq-depth),
      0 13px 22px rgba(31,65,99,.10),
      inset 0 1px 0 #fff;
  }

  .duduq-matching-card:active:not(:disabled) {
    transform: translateY(3px) scale(.992);
    box-shadow: 0 1px 0 var(--dq-depth), 0 4px 8px rgba(31,65,99,.06);
  }

  .duduq-matching-card[data-selected="true"] {
    border-color: var(--dq-selected-border);
    background: var(--dq-selected-bg);
    box-shadow:
      0 4px 0 var(--dq-primary-depth),
      0 0 0 4px rgba(0,86,179,.14),
      0 11px 20px rgba(0,86,179,.10);
  }

  .duduq-matching-card[data-paired="true"] {
    border-color: #8DAFCB;
    background: #FBFDFF;
  }

  .duduq-matching-card[data-feedback="correct"] {
    border-color: var(--dq-success-border);
    background: var(--dq-success-bg);
    color: var(--dq-success-text);
    box-shadow:
      0 4px 0 var(--dq-success-depth),
      0 10px 18px rgba(70,163,2,.10),
      inset 0 1px 0 #fff;
  }

  .duduq-matching-card[data-feedback="retry"] {
    border-color: var(--dq-retry-border);
    background: var(--dq-retry-bg);
    color: var(--dq-retry-text);
    box-shadow:
      0 4px 0 var(--dq-retry-depth),
      0 10px 18px rgba(183,28,28,.08),
      inset 0 1px 0 #fff;
  }

  .duduq-matching-card-content {
    font-family: Nunito, ui-rounded, system-ui, sans-serif;
    font-size: clamp(16px,1.8vw,21px);
    font-weight: 900;
    line-height: 1.12;
  }

  .duduq-matching-media {
    width: clamp(72px,7.8vw,96px);
    height: clamp(72px,7.8vw,96px);
    filter: drop-shadow(0 4px 7px rgba(31,65,99,.08));
  }

  .duduq-matching-color {
    width: clamp(68px,7.2vw,90px);
    height: clamp(68px,7.2vw,90px);
    border-radius: 18px;
  }

  .duduq-matching-port {
    width: 22px;
    height: 22px;
    border: 3px solid #9FB3C6;
    background: var(--dq-soft-surface);
  }

  .duduq-matching-card[data-selected="true"] .duduq-matching-port,
  .duduq-matching-card[data-paired="true"] .duduq-matching-port {
    border-color: var(--dq-primary);
  }

  .duduq-matching-card[data-feedback="correct"] .duduq-matching-port {
    border-color: var(--dq-success-border);
  }

  .duduq-matching-card[data-feedback="retry"] .duduq-matching-port {
    border-color: var(--dq-retry-border);
  }

  .duduq-matching-line {
    stroke: var(--dq-primary);
    stroke-width: 5;
    opacity: .86;
    filter: drop-shadow(0 2px 0 rgba(0,58,122,.18));
  }

  .duduq-matching-line[data-feedback="correct"] { stroke: var(--dq-success-border); }
  .duduq-matching-line[data-feedback="retry"] { stroke: var(--dq-retry-border); }

  .duduq-matching-center-guide::before {
    background: linear-gradient(180deg,transparent,rgba(175,192,211,.44),transparent);
  }

  .duduq-matching-item-audio {
    width: 36px;
    height: 36px;
    border: 2px solid var(--dq-primary-depth);
    background: linear-gradient(180deg,#1471CF,var(--dq-primary));
    box-shadow: 0 3px 0 var(--dq-primary-depth), 0 7px 12px rgba(0,86,179,.15);
  }

  .duduq-matching-item-audio[data-playing="true"] {
    border-color: #359500;
    background: linear-gradient(180deg,#70E90E 0%,#58CC02 62%,#49B900 100%);
    color: var(--dq-success-text);
    box-shadow: 0 3px 0 #2F8A00, 0 0 0 5px rgba(88,204,2,.14);
  }

  .duduq-matching-action-slot {
    min-height: 88px;
    place-items: start center;
    padding: clamp(14px,2vh,20px) 0 12px;
    overflow: visible;
  }

  .duduq-matching-primary {
    width: min(220px,100%);
    min-height: 56px;
    padding: 0 28px;
    border: 2px solid var(--dq-primary-depth);
    border-radius: 18px;
    background: linear-gradient(180deg,#1471CF 0%,var(--dq-primary) 72%,#004892 100%);
    color: #fff;
    box-shadow:
      0 6px 0 var(--dq-primary-depth),
      0 12px 22px rgba(0,86,179,.16),
      inset 0 2px 0 rgba(255,255,255,.28);
    font: 900 19px/1 Fredoka,Nunito,sans-serif;
  }

  .duduq-matching-primary:disabled {
    border-color: var(--dq-disabled-border);
    background: var(--dq-disabled);
    color: var(--dq-disabled-text);
    box-shadow: 0 4px 0 var(--dq-disabled-depth);
  }

  /* Feedback e transição iguais à base */
  .duduq-engine-feedback {
    width: min(860px,calc(100% - 20px));
    margin: 12px auto 0;
  }

  .duduq-engine-feedback-card,
  .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card,
  .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
    width: 100%;
    min-height: 104px;
    grid-template-columns: 84px minmax(0,1fr) auto;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    border: 2px solid var(--dq-border);
    border-radius: 24px;
    background: var(--dq-surface);
    box-shadow: 0 4px 0 var(--dq-depth), 0 12px 24px rgba(31,65,99,.07);
  }

  .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card {
    border-color: var(--dq-success-border);
    background: var(--dq-success-bg);
    color: var(--dq-success-text);
    box-shadow: 0 4px 0 var(--dq-success-depth), 0 10px 20px rgba(70,163,2,.12);
  }

  .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
    border-color: var(--dq-retry-border);
    background: var(--dq-retry-bg);
    color: var(--dq-retry-text);
    box-shadow: 0 4px 0 var(--dq-retry-depth), 0 10px 20px rgba(183,28,28,.10);

  .duduq-engine-feedback .duduq-mascot[data-size="feedback"] {

    height: 84px;
  }

  .duduq-engine-feedback-action {

    min-width: 190px;
    border-radius: 18px;
    font-family: Fredoka,Nunito,sans-serif;
    font-weight: 900;
  }

  .duduq-star-burst[data-variant="answer"] .duduq-star-particle { animation-duration: 820ms; }
  .duduq-star-burst[data-variant="lesson"] .duduq-star-particle { animation-duration: 1450ms; }

  @media (min-width:1120px) {
