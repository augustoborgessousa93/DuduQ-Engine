  overflow: hidden !important;

  height: 16px !important;

  background: linear-gradient(180deg, #E6EEF6 0%, #DCE6F0 100%) !important;

.duduq-progress-marker::after {

}
.duduq-progress-fill::after {
  content: "";

  inset: 0;
  border-radius: inherit;
  background: linear-gradient(115deg, transparent 18%, rgba(255,255,255,.10) 32%, rgba(255,255,255,.42) 46%, rgba(255,255,255,.16) 58%, transparent 72%);

  animation: duduqProgressShine 2.6s linear infinite;
  pointer-events: none;
}
.duduq-progress-fill {
  border-radius: inherit !important;
  background: linear-gradient(180deg, #43B3FF 0%, #1592FF 100%) !important;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 1px 2px rgba(10,108,214,.16) !important;
}
.duduq-progress-fill::before {
  content: "";
  position: absolute;
  left: 1px;
  right: 1px;
  top: 1px;
  height: 42%;
  border-radius: 999px;
  background: rgba(255,255,255,.28);
}

@keyframes duduqProgressShine {
  0% { background-position: 140% 0; }
  100% { background-position: -40% 0; }

@media (max-width: 640px) {

  const ASSETS = Object.freeze({

    repository: "augustoborgessousa93/Assets-DuduQ",
    mascots: Object.freeze({
      idle: "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Imagens%20Ilustrativa/DUDUQ_IDLE.png",

      complete: "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Imagens%20Ilustrativa/Duduq_Li%C3%A7%C3%A3o%20concluida.png"
    }),
    sounds: Object.freeze({
      "bubble-pop": "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Efeitos%20sonoros/bubble-pop.mp3",
      click: "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Efeitos%20sonoros/click.mp3",
      correct: "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Efeitos%20sonoros/correct.mp3",
      ding: "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Efeitos%20sonoros/ding.mp3",
      error: "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Efeitos%20sonoros/error.mp3",
      pop: "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Efeitos%20sonoros/pop.mp3",
      win: "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Efeitos%20sonoros/you%20win.mp3"
    }),
    backgrounds: Object.freeze({
      "1": "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Templates/1%C2%BA%20ano%20-whispering-woods.png",
      "2": "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Templates/2%C2%BA%20ano%20-chroma-canyons.png",
      "3": "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Templates/3%C2%BA%20ano%20-clockwork-valley.png",
      "4": "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Templates/4%C2%BA%20ano%20-papercraft-campus.png",
      "5": "https://raw.githubusercontent.com/augustoborgessousa93/Assets-DuduQ/main/Templates/5%C2%BA%20ano%20-sky-lab.png"
    })
  });

  function normalizeYear(value) {
    const match = String(value == null ? "" : value).match(/[1-5]/);
    return match ? match[0] : "";
  }

  function applyYear(value) {
    const year = normalizeYear(value);
    if (!year || !ASSETS.backgrounds[year] || !document.body) return false;
    document.documentElement.setAttribute("data-duduq-ano-ativo", year);
    document.body.style.backgroundImage = 'url("' + ASSETS.backgrounds[year] + '")';
    document.body.style.backgroundPosition = "center top";
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundRepeat = "no-repeat";
    return true;
  }

  window.DUDUQ_ASSETS = ASSETS;
  window.DuduQAssets = Object.freeze({
    version: "1.0.0",
    assets: ASSETS,
    setYear: applyYear,
    getYear: function () {
      return document.documentElement.getAttribute("data-duduq-ano-ativo") || null;
    }
  });

  const params = new URLSearchParams(window.location.search);
  const requestedYear =
    params.get("ano") || params.get("year") || params.get("serie") || params.get("série") ||
    document.documentElement.getAttribute("data-duduq-ano") || window.DUDUQ_ANO;
  applyYear(requestedYear);
})();

<script id="duduq-sound-system-v1">
/* DUDUQ SOUND SYSTEM V1 — camada sonora padronizada, sem alteração visual/mecânica. */
(function () {
  if (window.DuduQSound && window.DuduQSound.version === "1.0.0") return;

  const SOURCES = window.DUDUQ_ASSETS.sounds;
  const DEFAULT_VOLUME = {"click":0.22,"pop":0.30,"bubble-pop":0.46,"ding":0.40,"correct":0.56,"error":0.48,"win":0.64};
  const DEFAULT_GAP = {"click":55,"pop":70,"bubble-pop":110,"ding":100,"correct":1200,"error":520,"win":1800};
  const channels = new Map();
  const lastPlay = new Map();
  let gestureUnlocked = false;

  Object.entries(SOURCES).forEach(([name, src]) => {
    try {
      const audio = new Audio(src);
      audio.preload = "auto";
      audio.volume = DEFAULT_VOLUME[name] || 0.5;
      channels.set(name, audio);
    } catch (_) {}
  });

  function stop(name) {
    const audio = channels.get(name);
    if (!audio) return;
    try { audio.pause(); audio.currentTime = 0; } catch (_) {}
  }

  function stopAll() { channels.forEach((_, name) => stop(name)); }

  function unlockAllFromGesture() {
    if (gestureUnlocked) return;
    gestureUnlocked = true;
    channels.forEach((audio) => {
      const oldMuted = audio.muted;
      const oldVolume = audio.volume;
      try {
        audio.muted = true;
        audio.currentTime = 0;
        const result = audio.play();
        const finish = () => {
          try { audio.pause(); audio.currentTime = 0; } catch (_) {}
          audio.muted = oldMuted;
          audio.volume = oldVolume;
        };
        if (result && typeof result.then === "function") result.then(() => window.setTimeout(finish, 0)).catch(() => finish());
        else finish();
      } catch (_) {
        audio.muted = oldMuted;
        audio.volume = oldVolume;
      }
    });
    document.removeEventListener("pointerdown", unlockAllFromGesture, true);
    document.removeEventListener("keydown", unlockAllFromGesture, true);
  }

  document.addEventListener("pointerdown", unlockAllFromGesture, true);
  document.addEventListener("keydown", unlockAllFromGesture, true);

  function start(name, options = {}) {
    const audio = channels.get(name);
    if (!audio) return null;
    const now = (window.performance && performance.now) ? performance.now() : Date.now();
    const minGapMs = Number.isFinite(options.minGapMs) ? options.minGapMs : (DEFAULT_GAP[name] || 0);
    const previous = lastPlay.get(name) || -Infinity;
    if (now - previous < minGapMs) return null;
    lastPlay.set(name, now);

    try {
      audio.pause();
      audio.currentTime = 0;
      audio.muted = false;
      audio.volume = Math.max(0, Math.min(1, Number.isFinite(options.volume) ? options.volume : (DEFAULT_VOLUME[name] || 0.5)));
      if (Number.isFinite(options.playbackRate)) audio.playbackRate = options.playbackRate;
      else audio.playbackRate = 1;
      const promise = audio.play();
      if (promise && typeof promise.catch === "function") promise.catch(() => {});
    } catch (_) {}
    return audio;
  }

  function play(name, options = {}) {
    const aliases = {"you win":"win","you-win":"win","bubblePop":"bubble-pop"};
    const normalized = aliases[name] || name;
    const delayMs = Number(options.delayMs) || 0;
    if (delayMs > 0) { window.setTimeout(() => start(normalized, options), delayMs); return null; }
    return start(normalized, options);
  }

  function isRestartControl(button) {
    const text = `${button.id || ""} ${button.className || ""} ${button.getAttribute?.("aria-label") || ""} ${button.textContent || ""}`.toLowerCase();
    return /restart|recome|reinici|jogar novamente|play again/.test(text);
  }

  window.DuduQSound = Object.freeze({version:"1.0.0",play,stop,stopAll,sources:Object.freeze({...SOURCES})});

  document.addEventListener("click", function (event) {
    const target = event.target instanceof Element ? event.target : null;
    const button = target?.closest?.("button, [role='button']");
    if (!button) return;
    if (button.disabled || button.getAttribute("aria-disabled") === "true" || button.dataset.duduqSound === "none") return;
    if (isRestartControl(button)) stop("win");
    if (button.matches(".duduq-bp-bubble, .duduq-ts-target, .duduq-mq-card, .duduq-ws-object")) return;
    play("click", {volume:0.22,minGapMs:55});
  }, true);
})();
</script>

    border: 2px solid ${DRAG_DROP_NEUTRAL_TOKENS.colors.border};
    border-radius: 20px;
    background: rgba(255, 255, 255, .44);
  }

  .duduq-dd-pool[data-active-pool="true"] {
    border-color: ${DRAG_DROP_NEUTRAL_TOKENS.colors.primary};
    background: ${DRAG_DROP_NEUTRAL_TOKENS.colors.selectedBg};

  }

  .duduq-dd-pool-head {
    min-height: 32px;
    align-self: center;
    padding: 2px 10px;
    border-radius: 999px;
    background: transparent;
    color: ${DRAG_DROP_NEUTRAL_TOKENS.colors.mutedText};
    font-weight: 800;
    cursor: pointer;

  .duduq-dd-pool-head:disabled {

  }

  .duduq-dd-pool-items {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    min-height: 68px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 1.5vw, 18px);
    padding: 2px 4px 6px;
  }

  .duduq-dd-item {
    position: relative;
    min-width: clamp(84px, 16vw, 150px);
    min-height: 52px;
    max-width: 180px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 6px 10px;
    border: 2px solid ${DRAG_DROP_NEUTRAL_TOKENS.colors.controlBorder};
    border-radius: 16px;
    background: ${DRAG_DROP_NEUTRAL_TOKENS.colors.surface};
    color: ${DRAG_DROP_NEUTRAL_TOKENS.colors.text};
    box-shadow:
      0 4px 0 ${DRAG_DROP_NEUTRAL_TOKENS.colors.depth},
      0 8px 12px rgba(15, 23, 42, .08);
    font-size: clamp(15px, 1.8vw, 20px);
    font-weight: 800;
    line-height: 1.1;
    text-align: center;
    overflow-wrap: anywhere;
    word-break: break-word;
    white-space: normal;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  .duduq-dd-item[data-has-media="true"] {
    min-width: clamp(126px, 17vw, 184px);
    min-height: clamp(108px, 15vh, 142px);
    max-width: 198px;
    padding: 9px 13px;
    flex-direction: column;
    gap: clamp(6px, 1vh, 10px);
    border-radius: 18px;
  }

  .duduq-dd-item[data-compact="true"] {
    min-width: 68px;
    min-height: 48px;
    max-width: 128px;
    padding: 4px 6px;
    font-size: clamp(14px, 1.5vw, 18px);
  }

  .duduq-dd-item[data-compact="true"][data-has-media="true"] {
    min-width: 98px;
    min-height: 84px;
    max-width: 138px;
    padding: 6px 8px;
    border-radius: 16px;
  }

  .duduq-dd-item[data-selected="true"] {
    border-color: ${DRAG_DROP_NEUTRAL_TOKENS.colors.selectedBorder};
    background: ${DRAG_DROP_NEUTRAL_TOKENS.colors.selectedBg};
    box-shadow:
      0 4px 0 ${DRAG_DROP_NEUTRAL_TOKENS.colors.primaryDepth},
      0 0 0 4px rgba(0, 86, 179, .16);
  }

  .duduq-dd-item[data-dragging="true"] {
    opacity: .42;
    cursor: grabbing;
  }

  .duduq-dd-item[data-feedback="correct"] {
    border-color: ${DRAG_DROP_NEUTRAL_TOKENS.colors.successBorder};
    background: ${DRAG_DROP_NEUTRAL_TOKENS.colors.successBg};
    box-shadow:
      0 4px 0 ${DRAG_DROP_NEUTRAL_TOKENS.colors.successDepth},
      0 8px 12px rgba(27, 94, 32, .08);
  }

  .duduq-dd-item[data-feedback="retry"] {
    border-color: ${DRAG_DROP_NEUTRAL_TOKENS.colors.retryBorder};
    background: ${DRAG_DROP_NEUTRAL_TOKENS.colors.retryBg};
    box-shadow:
      0 4px 0 ${DRAG_DROP_NEUTRAL_TOKENS.colors.retryDepth},
      0 8px 12px rgba(183, 28, 28, .06);
  }

  .duduq-dd-item[aria-disabled="true"],
  .duduq-dd-item:disabled {
    cursor: default;
  }

  .duduq-dd-item:disabled:not([data-feedback="correct"]) {
    border-color: ${DRAG_DROP_NEUTRAL_TOKENS.colors.depth};
    background: ${DRAG_DROP_NEUTRAL_TOKENS.colors.disabled};
    color: ${DRAG_DROP_NEUTRAL_TOKENS.colors.disabledText};
    box-shadow: 0 3px 0 ${DRAG_DROP_NEUTRAL_TOKENS.colors.depth};
  }

  .duduq-dd-media {
    width: clamp(82px, 10vw, 112px);
    height: clamp(82px, 10vw, 112px);
    flex: 0 0 auto;
    display: block;
    object-fit: contain;
    object-position: center;
    border-radius: 0;
  }

  .duduq-dd-item[data-compact="true"] .duduq-dd-media {
    width: clamp(66px, 8vw, 88px);
    height: clamp(66px, 8vw, 88px);
  }

  .duduq-dd-target-media {
    width: clamp(80px, 9.5vw, 112px);
    height: clamp(80px, 9.5vw, 112px);
    flex: 0 0 auto;
    display: block;
    object-fit: contain;
    object-position: center;
    border-radius: 0;
  }

  .duduq-dd-target[data-has-media="true"] .duduq-dd-target-head {
    min-height: clamp(98px, 14vh, 132px);
    gap: clamp(6px, 1vw, 12px);
  }

  .duduq-dd-media-placeholder {
    display: grid;
    place-items: center;
    border: 2px dashed ${DRAG_DROP_NEUTRAL_TOKENS.colors.depth};
    background: ${DRAG_DROP_NEUTRAL_TOKENS.colors.softSurface};
    color: ${DRAG_DROP_NEUTRAL_TOKENS.colors.mutedText};
    font-size: 12px;
    font-weight: 800;
  }

  .duduq-dd-state-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 24px;
    min-height: 24px;
    display: grid;
    place-items: center;
    padding: 2px;
    border: 2px solid ${DRAG_DROP_NEUTRAL_TOKENS.colors.surface};
    border-radius: 999px;
    background: ${DRAG_DROP_NEUTRAL_TOKENS.colors.primary};
    color: #FFFFFF;
    box-shadow: 0 2px 0 ${DRAG_DROP_NEUTRAL_TOKENS.colors.primaryDepth};
  }

  .duduq-dd-state-badge[data-kind="correct"] {
    background: ${DRAG_DROP_NEUTRAL_TOKENS.colors.successBorder};
    color: ${DRAG_DROP_NEUTRAL_TOKENS.colors.successText};
    box-shadow: 0 2px 0 ${DRAG_DROP_NEUTRAL_TOKENS.colors.successDepth};
  }

  .duduq-dd-state-badge[data-kind="retry"] {
    background: ${DRAG_DROP_NEUTRAL_TOKENS.colors.retryText};
    color: #FFFFFF;
    box-shadow: 0 2px 0 ${DRAG_DROP_NEUTRAL_TOKENS.colors.retryStrong};
  }

  .duduq-dd-action-slot {
    width: min(980px, 100%);
    max-width: 100%;
    overflow-x: clip;
    min-height: clamp(82px, 11vh, 96px);
    flex: 0 0 auto;
    display: grid;
    place-items: end center;
    margin-top: auto;
    padding: clamp(10px, 1.7vh, 16px) 0 5px;
  }

  .duduq-dd-primary {
    min-height: 52px;
    width: min(220px, 100%);
    flex: 0 0 auto;
    padding: 0 20px;
    border-radius: 16px;
    font-size: 20px;
    font-weight: 700;
  }

  .duduq-dd-primary[data-enabled="true"] {
    background: ${DRAG_DROP_NEUTRAL_TOKENS.colors.primary};
    color: #FFFFFF;
    box-shadow: 0 4px 0 ${DRAG_DROP_NEUTRAL_TOKENS.colors.primaryDepth};
    cursor: pointer;
    animation: duduq-dd-check-ready 1.8s ease-in-out infinite;
  }

  .duduq-dd-action-slot[data-feedback-state="retry"] .duduq-dd-primary,
  .duduq-dd-action-slot[data-feedback-state="success"] .duduq-dd-primary {
    pointer-events: none;
    animation: duduq-dd-check-exit 180ms ease-in forwards;
  }

  .duduq-dd-primary[data-enabled="false"] {
    background: ${DRAG_DROP_NEUTRAL_TOKENS.colors.disabled};
    color: ${DRAG_DROP_NEUTRAL_TOKENS.colors.disabledText};
    box-shadow: 0 4px 0 ${DRAG_DROP_NEUTRAL_TOKENS.colors.depth};
    cursor: default;
    animation: none;
  }

  @keyframes duduq-dd-check-ready {
    0%, 100% {
      filter: brightness(1);
      box-shadow:
        0 4px 0 ${DRAG_DROP_NEUTRAL_TOKENS.colors.primaryDepth},
        0 8px 18px rgba(0, 86, 179, .10);
    }
    50% {
      filter: brightness(1.07);
      box-shadow:
        0 5px 0 ${DRAG_DROP_NEUTRAL_TOKENS.colors.primaryDepth},
        0 0 0 5px rgba(0, 86, 179, .10),
        0 12px 24px rgba(0, 86, 179, .22);
    }
  }

  @keyframes duduq-dd-check-exit {
    from {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    to {
      opacity: 0;
      transform: translateY(12px) scale(.96);
      visibility: hidden;
    }
  }

  @keyframes duduq-dd-feedback-enter {
    from {
      opacity: 0;
      transform: translateY(12px) scale(.97);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .duduq-dd-drag-ghost {
    position: absolute;
    z-index: 9999;
    pointer-events: none;
    opacity: .98;
    transform: translate3d(0, -5px, 0) scale(1.05) rotate(var(--duduq-dd-tilt, 0deg));
    transform-origin: 50% 58%;
    filter: drop-shadow(0 18px 18px rgba(15, 23, 42, .24));
    will-change: left, top, transform;
    transition: left 46ms linear, top 46ms linear, transform 80ms ease-out;
  }

  .duduq-dd-empty-note {
    color: ${DRAG_DROP_NEUTRAL_TOKENS.colors.mutedText};
    font-size: 14px;
    font-weight: 700;
    text-align: center;
  }

  .duduq-dd-visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .duduq-dd-audio-shell {
    position: relative;
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    justify-self: center;
    align-self: center;
    isolation: isolate;
  }

  .duduq-dd-audio-shell > button {
    position: relative;
    z-index: 3;
  }

  .duduq-dd-audio-waves {
    position: absolute;
    inset: -7px;
    z-index: 1;
    border-radius: 999px;
    pointer-events: none;
  }

  .duduq-dd-audio-wave {
    position: absolute;
    inset: 7px;
    border: 3px solid ${DRAG_DROP_NEUTRAL_TOKENS.colors.primary};
    border-radius: 999px;
    opacity: 0;
    animation: duduq-dd-audio-wave 1.2s ease-out forwards;
  }

  .duduq-dd-audio-wave:nth-child(2) {
    animation-delay: 150ms;
  }

  .duduq-dd-audio-wave:nth-child(3) {
    animation-delay: 300ms;
  }

  .duduq-dd-audio-shell[data-highlight="true"]::after {
    content: "";
    position: absolute;
    inset: -5px;
    z-index: 0;
    border: 3px solid rgba(0, 86, 179, .34);
    border-radius: 999px;
    pointer-events: none;
  }

  @keyframes duduq-dd-audio-wave {
    0% {
      transform: scale(.76);
      opacity: .72;
    }
    72% {
      opacity: .26;
    }
    100% {
      transform: scale(1.65);
      opacity: 0;
    }
  }

  @media (max-width: 520px) {
    .duduq-dd-surface {
      padding: 4px;
      gap: 6px;
    }
    .duduq-dd-instruction {
      width: calc(100% - 12px);
      min-width: 0;
      min-height: 54px;
      grid-template-columns: 42px minmax(0, 1fr) 48px;
      column-gap: 8px;
      padding: 6px 10px 9px;
      margin-bottom: 14px;
    }

    .duduq-dd-instruction::before {
      width: 42px;
      height: 42px;
    }
    .duduq-dd-target-grid {
      gap: 6px;
    }
    .duduq-dd-target {
      flex-basis: 29%;
      min-height: 112px;
      border-radius: 16px;
    }
    .duduq-dd-target-head {
      padding: 4px;
      font-size: 13px;
    }
    .duduq-dd-target-head > span {
    min-width: 0;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .duduq-dd-target-items {
      padding: 4px;
    }
    .duduq-dd-pool {
      min-height: 88px;
      padding: 7px 7px 13px;
    }
    .duduq-dd-item {
      min-width: 82px;
      min-height: 48px;
      padding: 4px 6px;
    }
    .duduq-dd-item[data-has-media="true"] {
      min-width: 110px;
      min-height: 96px;
      padding: 7px;
    }
    .duduq-dd-item[data-compact="true"] {
      min-width: 62px;
      min-height: 48px;
    }
    .duduq-dd-item[data-compact="true"][data-has-media="true"] {
      min-width: 90px;
      min-height: 76px;
      padding: 5px;
    }
    .duduq-dd-media {
      width: clamp(70px, 20vw, 90px);
      height: clamp(70px, 20vw, 90px);
    }
    .duduq-dd-item[data-compact="true"] .duduq-dd-media {
      width: clamp(58px, 16vw, 74px);
      height: clamp(58px, 16vw, 74px);
    }
    .duduq-dd-target-media {
      width: clamp(64px, 18vw, 86px);
      height: clamp(64px, 18vw, 86px);
    }
  }

  /*
   * REFLOW DE ACESSIBILIDADE
   *
   * Em zoom de 200%, uma viewport 768\xD7768 passa a oferecer cerca de 384\xD7384
   * CSS px. Nesse cen\xE1rio, a mec\xE2nica deixa de tentar caber em altura fixa:
   * cresce no fluxo da p\xE1gina, empilha destinos e permite apenas rolagem
   * vertical do host. O layout validado em 360\xD7640 n\xE3o \xE9 alterado, porque
   * esta regra exige simultaneamente largura e altura efetivas reduzidas.
   */
  @media (max-width: 520px) and (max-height: 520px) {
    .duduq-dd-root {
      height: auto;
      min-height: 100%;
      max-width: 100%;
      overflow-x: clip;
      overflow-y: visible;
      contain: inline-size;
    }

    .duduq-dd-surface {
      height: auto;
      min-height: 100%;
      max-width: 100%;
      overflow-x: clip;
      align-items: stretch;
      gap: 12px;
      padding: 6px;
    }

    .duduq-dd-instruction {
      width: 100%;
      max-width: 100%;
      margin-bottom: 8px;
    }

    .duduq-dd-board {
      width: 100%;
      max-width: 100%;
      flex: 0 0 auto;
      gap: 12px;
    }

    .duduq-dd-target-grid {
      flex-direction: column;
      flex-wrap: nowrap;
      align-items: stretch;
      width: 100%;
      max-width: 100%;
      gap: 10px;
    }

    .duduq-dd-target {
      width: 100%;
      max-width: 100%;
      flex: 0 0 auto;
      flex-basis: auto;
      min-height: 120px;
    }

    .duduq-dd-pool {
      width: 100%;
      max-width: 100%;
      min-height: 0;
      flex: 0 0 auto;
    }

    .duduq-dd-pool-items {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: stretch;
      width: 100%;
      max-width: 100%;
    }

    .duduq-dd-item,
    .duduq-dd-item[data-has-media="true"],
    .duduq-dd-item[data-compact="true"],
    .duduq-dd-item[data-compact="true"][data-has-media="true"] {
      width: 100%;
      min-width: 0;
      max-width: none;
    }

    .duduq-dd-action-slot {
      width: 100%;
      max-width: 100%;
      min-height: 72px;
      margin-top: 0;
      padding: 8px 0 12px;
    }

    .duduq-dd-primary {
      width: min(220px, 100%);
    }
  }

  @media (max-height: 650px) {
    .duduq-dd-surface {
      gap: 6px;
      padding-block: 2px;
    }
    .duduq-dd-instruction {
      min-height: 54px;
      padding-block: 5px 8px;
      margin-bottom: 14px;
    }
    .duduq-dd-board {
      gap: 10px;
    }
    .duduq-dd-target-grid {
      gap: 6px;
    }
    .duduq-dd-target {
      min-height: 112px;
    }
    .duduq-dd-target-head {
       min-height: 38px;
    }
    .duduq-dd-pool {
      min-height: 82px;
      padding: 5px 7px 12px;
    }
    .duduq-dd-action-slot {
      min-height: 76px;
      padding: 8px 0 4px;
    }

    .duduq-dd-primary {
      min-height: 50px;
    }
  }

  .duduq-dd-root[data-reduced-motion="true"] .duduq-dd-control,
  .duduq-dd-root[data-reduced-motion="true"] .duduq-dd-target,
  .duduq-dd-root[data-reduced-motion="true"] .duduq-dd-item,
  .duduq-dd-root[data-reduced-motion="true"] .duduq-dd-primary,
  .duduq-dd-root[data-reduced-motion="true"] .duduq-dd-drag-ghost,
  .duduq-dd-root[data-reduced-motion="true"] .duduq-dd-audio-wave {
    animation: none !important;
    transition: none !important;
    transform: none !important;
  }

  .duduq-dd-root[data-smart-drag="true"] .duduq-dd-target[data-magnetic-target="true"] {
    border-style: solid;
    border-color: #4C9FFF;
    background: rgba(239, 246, 255, .94);
    box-shadow: 0 0 0 4px rgba(0, 86, 179, .10), 0 8px 18px rgba(0, 86, 179, .10);
    transform: translateY(-1px) scale(1.012);
  }

  .duduq-dd-root[data-smart-drag="true"] .duduq-dd-target[data-magnetic-target="true"][data-active-target="true"] {
    border-color: #1676D2;
    background: #EDF6FF;
    box-shadow: 0 0 0 5px rgba(0, 86, 179, .13), 0 8px 0 ${DRAG_DROP_NEUTRAL_TOKENS.colors.primaryDepth}, 0 14px 26px rgba(0, 86, 179, .16);
    transform: translateY(-2px) scale(1.026);
  }

  .duduq-dd-root[data-smart-drag="true"] .duduq-dd-drag-ghost:not(.duduq-dd-return-ghost) {
    left: 0 !important;
    top: 0 !important;
    transform: translate3d(
      var(--duduq-dd-drag-x, 0px),
      calc(var(--duduq-dd-drag-y, 0px) - 5px),
      0
    ) scale(1.045) rotate(var(--duduq-dd-tilt, 0deg));
    transform-origin: 50% 58%;
    filter: none;
    will-change: transform;
    contain: layout paint style;
  }

  /* Quando um item ocupa um destino, o slot passa a reservar a altura real
     do card. Assim o card não invade a palavra/título do destino. */
  .duduq-dd-root[data-smart-drag="true"] .duduq-dd-target[data-occupied="true"] {
    min-height: clamp(198px, 27vh, 238px);
  }

  .duduq-dd-root[data-smart-drag="true"] .duduq-dd-target[data-occupied="true"] .duduq-dd-target-head {
    flex: 0 0 auto;
    min-height: 48px;
  }

  .duduq-dd-root[data-smart-drag="true"] .duduq-dd-target[data-occupied="true"] .duduq-dd-target-items {
    width: calc(100% - 34px);
    min-height: clamp(108px, 15vh, 128px);
    flex: 1 0 clamp(108px, 15vh, 128px);
    margin: 10px auto 14px;
    padding: 8px;
    border-color: transparent;
    background: transparent;
    overflow: visible;
  }

  @media (max-width: 520px) {
    .duduq-dd-root[data-smart-drag="true"] .duduq-dd-target[data-occupied="true"] {
      min-height: 168px;
    }
    .duduq-dd-root[data-smart-drag="true"] .duduq-dd-target[data-occupied="true"] .duduq-dd-target-items {
      min-height: 92px;
      flex-basis: 92px;
      margin-top: 8px;
      margin-bottom: 10px;
      padding: 5px;
    }
  }

  .duduq-dd-item[data-returning="true"] {
    opacity: 0 !important;
  }

  .duduq-dd-item[data-snap-effect="true"] {
    animation: duduq-dd-snap-item 360ms cubic-bezier(.2,.9,.25,1.2);
  }

  .duduq-dd-audio-token {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 34px;
    padding: 5px 10px;
    border-radius: 999px;
    background: #EAF4FF;
    color: ${DRAG_DROP_NEUTRAL_TOKENS.colors.primary};
    font-size: clamp(12px, 1.45vw, 15px);
    font-weight: 900;
    line-height: 1;
    white-space: nowrap;
  }

  .duduq-dd-word {
    white-space: nowrap;
    overflow-wrap: normal;
    word-break: normal;
  }

  .duduq-dd-phrase {
    white-space: normal;
    overflow-wrap: normal;
    word-break: normal;
    hyphens: none;
  }

  .duduq-dd-return-ghost {
    animation: duduq-dd-return-elastic 320ms cubic-bezier(.22,.75,.25,1) forwards;
    transition: none;
  }

  .duduq-dd-snap-burst {
    position: absolute;
    z-index: 10010;
    width: 8px;
    height: 8px;
    pointer-events: none;
  }

  .duduq-dd-snap-burst > i {
    --angle: calc(var(--duduq-dd-particle-index) * 45deg);
    position: absolute;
    left: -4px;
    top: -4px;
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: #FFD43B;

  /* Host 1.0.10 HTML QA FIX \u2014 hierarquia compacta e anima\xE7\xF5es disciplinadas */
  .duduq-engine-header-main {
    display: flex;
    min-width: 0;

    position: relative;
    flex: 0 0 auto;
    margin: 0;
    pointer-events: none;
    user-select: none;

  .duduq-mascot-body {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    transform-origin: 50% 84%;
    will-change: transform;
  }

  .duduq-mascot[data-state="idle"] .duduq-mascot-body {
    animation: duduq-mascot-breathe 3.8s ease-in-out infinite;
  }

  .duduq-mascot[data-state="success"] .duduq-mascot-body {
    animation:
      duduq-mascot-success-pop 560ms cubic-bezier(.16, .82, .24, 1) both,
      duduq-mascot-breathe 3.6s ease-in-out 620ms infinite;
  }

  .duduq-mascot[data-state="retry"] .duduq-mascot-body {
    animation:
      duduq-mascot-shake 480ms cubic-bezier(.36, .07, .19, .97) both,
      duduq-mascot-breathe 3.9s ease-in-out 560ms infinite;
  }

  .duduq-mascot[data-state="transition"] .duduq-mascot-body {
    animation:
      duduq-mascot-transition 720ms cubic-bezier(.16, .82, .24, 1) both,
      duduq-mascot-breathe 3.5s ease-in-out 760ms infinite;
  }

  .duduq-mascot[data-state="complete"] .duduq-mascot-body {
    animation:
      duduq-mascot-complete-pop 680ms cubic-bezier(.16, .82, .24, 1) both,
      duduq-mascot-breathe 3.5s ease-in-out 720ms infinite;
  }

  .duduq-mascot[data-reduced-motion="true"] .duduq-mascot-body {
    animation: none !important;
    transform: none !important;
  }

  @keyframes duduq-mascot-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    48% { transform: translateY(-2px) scale(1.018, 1.028); }
    56% { transform: translateY(-2px) scale(1.014, 1.022); }
  }

  @keyframes duduq-mascot-success-pop {
    0% { transform: translateY(8px) scale(.82) rotate(-3deg); opacity: .35; }
    58% { transform: translateY(-5px) scale(1.08) rotate(2deg); opacity: 1; }
    78% { transform: translateY(1px) scale(.98) rotate(-1deg); }
    100% { transform: translateY(0) scale(1) rotate(0); }
  }

  @keyframes duduq-mascot-shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    16% { transform: translateX(-5px) rotate(-2deg); }
    32% { transform: translateX(5px) rotate(2deg); }
    48% { transform: translateX(-4px) rotate(-1.5deg); }
    64% { transform: translateX(4px) rotate(1.5deg); }
    80% { transform: translateX(-2px) rotate(-.75deg); }
  }

  @keyframes duduq-mascot-transition {
    0% { transform: translateX(-8px) scale(.92) rotate(-3deg); opacity: .25; }
    56% { transform: translateX(5px) scale(1.04) rotate(2deg); opacity: 1; }
    78% { transform: translateX(-1px) scale(.99) rotate(-.5deg); }
    100% { transform: translateX(0) scale(1) rotate(0); }
  }

  @keyframes duduq-mascot-complete-pop {
    0% { transform: translateY(14px) scale(.78); opacity: 0; }
    55% { transform: translateY(-7px) scale(1.08); opacity: 1; }
    76% { transform: translateY(2px) scale(.98); }
    100% { transform: translateY(0) scale(1); }
  }

    width: 34%;
    transform: rotate(18deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.56), transparent);
    opacity: 0;
    pointer-events: none;
  }

  .duduq-engine-button-primary,
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"] {
    border-color: #0b5db4;
    background: linear-gradient(180deg, #1984e8 0%, #0868cb 72%, #075eb9 100%);
    color: #fff;
    box-shadow:
      0 6px 0 #064a92,
      0 12px 22px rgba(9, 103, 201, .20),
      inset 0 2px 0 rgba(255,255,255,.38);
    text-shadow: 0 1px 0 rgba(0,0,0,.18);
  }

  .duduq-engine-button-secondary {
    border-color: #c6d5e5;
    background: linear-gradient(180deg, #ffffff 0%, #edf4fa 100%);
    color: #24364e;
    box-shadow:
      0 4px 0 #c0cfde,
      0 8px 16px rgba(38, 63, 92, .10),
      inset 0 2px 0 rgba(255,255,255,.95);
  }

  .duduq-engine-button:hover:not(:disabled),
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]:hover {
    filter: brightness(1.05) saturate(1.03);
  }

  .duduq-engine-button-primary:hover::after,
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]:hover::after {
    opacity: .78;
    animation: duduq-button-shine 760ms ease-out both;
  }

  .duduq-engine-button:active:not(:disabled),
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]:active {
    transform: translateY(5px);
    transition-duration: 45ms;
  }

  .duduq-engine-button-primary:active:not(:disabled),
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]:active {
    box-shadow:
      0 1px 0 #064a92,
      0 4px 8px rgba(9, 103, 201, .15),
      inset 0 2px 0 rgba(255,255,255,.25);
  }

  .duduq-engine-button-secondary:active:not(:disabled) {
    box-shadow:
      0 1px 0 #c0cfde,
      0 3px 7px rgba(38, 63, 92, .08),
      inset 0 1px 0 rgba(255,255,255,.8);
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="false"] {
    border-color: #d2dbe5;
    background: linear-gradient(180deg, #edf2f7, #dde5ee);
    color: #7a8797;
    box-shadow:
      0 4px 0 #c6d0dc,
      inset 0 2px 0 rgba(255,255,255,.75);
  }

  @keyframes duduq-button-shine {
    from { transform: translateX(0) rotate(18deg); opacity: 0; }
    20% { opacity: .85; }
    to { transform: translateX(520%) rotate(18deg); opacity: 0; }
  }

  /* Drop zones neutras at\xE9 a valida\xE7\xE3o; verde fica reservado ao acerto confirmado. */
  .duduq-engine-stage .duduq-dd-target,
  .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
    border: 2px dashed #c5d2e1;
    background: rgba(255,255,255,.64);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
  }

  .duduq-engine-stage .duduq-dd-target:has(.duduq-dd-item[data-feedback="correct"]) {
    border: 2px solid #73d454;
    background: #f4fff1;
    box-shadow:
      0 4px 0 #53b837,
      0 10px 20px rgba(54, 169, 0, .11),
      inset 0 2px 0 rgba(255,255,255,.9);
  }

  .duduq-engine-stage .duduq-dd-action-slot {
    position: sticky;
    z-index: 20;
    bottom: 0;
    padding: 16px 0 18px;
    background: linear-gradient(
      to bottom,
      rgba(244,247,251,0),
      rgba(244,247,251,.92) 32%,
      rgba(244,247,251,1) 68%
    );
  }

  /* \xC1udio e Check usam a mesma fam\xEDlia azul; as ondas ficam exclusivas do \xE1udio. */
  .duduq-engine-stage .duduq-dd-audio-shell > button {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    border: 2px solid #0b5db4 !important;
    background: linear-gradient(
      180deg,
      #218bea 0%,
      #0b70d5 70%,
      #0864bf 100%
    ) !important;
    color: #ffffff !important;
    box-shadow:
      0 5px 0 #064a92,
      0 10px 18px rgba(9, 103, 201, .22),
      inset 0 2px 0 rgba(255,255,255,.42) !important;
    transform: translateY(0);
    transition:
      transform 70ms ease,
      filter 140ms ease,
      box-shadow 70ms ease;
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button::before {
    content: "";
    position: absolute;
    inset: 2px 7px auto;
    height: 40%;
    border-radius: 999px;
    background: linear-gradient(
      180deg,
      rgba(255,255,255,.52),
      rgba(255,255,255,0)
    );
    pointer-events: none;
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button:hover:not(:disabled) {
    filter: brightness(1.06) saturate(1.03);
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow:
      0 1px 0 #064a92,
      0 4px 8px rgba(9, 103, 201, .16),
      inset 0 2px 0 rgba(255,255,255,.28) !important;
  }

  .duduq-engine-stage .duduq-dd-audio-shell > button:disabled {
    opacity: .92;
    filter: saturate(.92);
  }

  .duduq-engine-stage .duduq-dd-audio-wave {
    border-color: #1682e5 !important;
  }

  .duduq-engine-stage
    .duduq-dd-audio-shell[data-highlight="true"]::after {
    border-color: rgba(22, 130, 229, .38) !important;
  }

  /* Brilho recorrente e discreto no Check quando ele est\xE1 dispon\xEDvel. */
  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]::after {
    opacity: 0;
    animation: duduq-check-glint 3.7s ease-in-out 1s infinite;
  }

  @keyframes duduq-check-glint {
    0%, 62% {
      transform: translateX(0) rotate(18deg);
      opacity: 0;
    }
    69% { opacity: .82; }
    84% {
      transform: translateX(520%) rotate(18deg);
      opacity: 0;
    }
    100% {
      transform: translateX(520%) rotate(18deg);
      opacity: 0;
    }
  }

  /* Continuar \xE9 uma a\xE7\xE3o positiva: verde, f\xEDsica e com convite em onda suave. */
  .duduq-engine-feedback-action {
    border-color: #46ad00;
    background: linear-gradient(
      180deg,
      #68dc18 0%,
      #58cc02 68%,
      #4db900 100%
    );
    color: #ffffff;
    box-shadow:
      0 6px 0 #369600,
      0 12px 22px rgba(54, 169, 0, .22),
      inset 0 2px 0 rgba(255,255,255,.42);
    text-shadow: 0 1px 0 rgba(22, 86, 0, .24);
    animation: duduq-continue-invite 2.8s ease-in-out 1.15s infinite;
  }

  .duduq-engine-feedback-action:hover:not(:disabled) {
    filter: brightness(1.045) saturate(1.04);
    animation-play-state: paused;
  }

  .duduq-engine-feedback-action:focus-visible,
  .duduq-engine-feedback-action:active:not(:disabled) {
    animation-play-state: paused;
  }

  .duduq-engine-feedback-action:active:not(:disabled) {
    transform: translateY(5px);
    box-shadow:
      0 1px 0 #369600,
      0 4px 8px rgba(54, 169, 0, .16),
      inset 0 2px 0 rgba(255,255,255,.28);
  }

  @keyframes duduq-continue-invite {
    0%, 58%, 100% {
      box-shadow:
        0 6px 0 #369600,
        0 12px 22px rgba(54, 169, 0, .22),
        0 0 0 0 rgba(88, 204, 2, 0),
        inset 0 2px 0 rgba(255,255,255,.42);
    }
    72% {
      box-shadow:
        0 6px 0 #369600,
        0 12px 22px rgba(54, 169, 0, .22),
        0 0 0 0 rgba(88, 204, 2, .30),
        inset 0 2px 0 rgba(255,255,255,.42);
    }
    88% {
      box-shadow:
        0 6px 0 #369600,
        0 12px 22px rgba(54, 169, 0, .22),
        0 0 0 11px rgba(88, 204, 2, 0),
        inset 0 2px 0 rgba(255,255,255,.42);
    }
  }

  .duduq-engine-complete::before {
    content: "";
    position: absolute;
    inset: 8% 18% 34%;
    border-radius: 50%;
    background: radial-gradient(
      circle,
      rgba(88, 204, 2, .18),
      rgba(88, 204, 2, 0) 68%
    );
    animation: duduq-complete-halo 3.8s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes duduq-complete-halo {
    0%, 100% { transform: scale(.94); opacity: .62; }
    50% { transform: scale(1.06); opacity: 1; }
  }

  /* Trilha DuduQ: progresso crescente, sem pontuar erros ou velocidade. */
  .duduq-progress-trail {
    position: relative;
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
    min-width: 0;
    padding: 10px 14px 14px;
    overflow: hidden;
    border: 1px solid #cbdced;
    border-radius: 18px;
    background:
      radial-gradient(circle at 10% 0%, rgba(255,255,255,.96), transparent 34%),
      linear-gradient(180deg, #ffffff 0%, #edf6ff 100%);
    box-shadow:
      0 4px 0 #bfd1e3,
      0 10px 22px rgba(31, 79, 126, .10),
      inset 0 1px 0 rgba(255,255,255,.98);
    isolation: isolate;
  }

  .duduq-progress-trail::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      linear-gradient(115deg, transparent 0 38%, rgba(255,255,255,.42) 46%, transparent 54% 100%);
    transform: translateX(-110%);
    animation: duduq-progress-panel-glint 5.6s ease-in-out infinite;
  }

  .duduq-progress-copy {
    display: flex;
    min-width: 0;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding-inline: 2px;
  }

  .duduq-progress-copy span {
    color: #607188;
    font-size: .68rem;
    font-weight: 900;
    letter-spacing: .075em;
    text-transform: uppercase;
  }

  .duduq-progress-copy strong {
    color: #123f70;
    font-size: .92rem;
    font-weight: 1000;
    line-height: 1.15;
    white-space: nowrap;
  }

  .duduq-progress-track {
    position: relative;
    height: 19px;
    min-width: 0;
    margin: 2px 18px 0;
    overflow: visible;
    border: 2px solid #a9c2da;
    border-radius: 999px;
    background:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.22) 0 16px,
        rgba(111,143,176,.08) 16px 18px
      ),
      linear-gradient(180deg, #e8f0f7, #d5e2ee);
    box-shadow:
      0 4px 0 #b5c9dc,
      inset 0 4px 6px rgba(55, 84, 118, .14),
      inset 0 -1px 0 rgba(255,255,255,.92);
  }

  .duduq-progress-track::after {
    content: "";
    position: absolute;
    inset: 3px 4px auto;
    height: 4px;
    border-radius: 999px;
    background: rgba(255,255,255,.58);
    pointer-events: none;
  }

  .duduq-progress-fill {
    position: absolute;
    inset: 2px;
    right: auto;
    width: calc(100% - 4px);
    overflow: hidden;
    transform: scaleX(var(--lesson-progress));
    transform-origin: left center;
    border-radius: inherit;
    background: linear-gradient(180deg, #55bdff 0%, #1686e8 52%, #0866c4 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.52),
      inset 0 -2px 0 rgba(2,72,145,.20),
      0 0 14px rgba(9, 103, 201, .24);
    transition: transform 520ms cubic-bezier(.2,.8,.2,1);
  }

  .duduq-progress-fill::before {
    content: "";
    position: absolute;
    inset: 1px 3px auto;
    height: 4px;
    border-radius: 999px;
    background: rgba(255,255,255,.48);
  }

  .duduq-progress-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-130%);
    background: linear-gradient(
      105deg,
      transparent 24%,
      rgba(255,255,255,.66) 48%,
      transparent 72%
    );
    animation: duduq-progress-shimmer 3.6s ease-in-out infinite;
  }

  .duduq-progress-marker {
    position: absolute;
    z-index: 3;
    left: var(--marker-position);
    top: 50%;
    display: grid;
    width: 34px;
    height: 34px;
    place-items: center;
    transform: translate(-50%, -50%);
    border: 2px solid #b2c5d8;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffffff, #eaf1f7);
    color: #91a4b9;
    box-shadow:
      0 4px 0 #aebfd0,
      0 8px 14px rgba(33, 67, 104, .13),
      inset 0 2px 0 rgba(255,255,255,.98);
    font-size: 1.05rem;
    font-weight: 1000;
    line-height: 1;
  }

  .duduq-progress-marker::after {
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(255,255,255,.72);
    border-radius: inherit;
    pointer-events: none;
  }

  .duduq-progress-marker[data-status="current"] {
    border-color: #0f79dc;
    background: linear-gradient(180deg, #65c7ff, #1687e8 58%, #0864bf);
    color: #ffffff;
    text-shadow: 0 1px 0 #07539c;
    box-shadow:
      0 5px 0 #075aaa,
      0 0 0 5px rgba(22,130,229,.13),
      0 10px 18px rgba(6,101,190,.20),
      inset 0 2px 0 rgba(255,255,255,.54);
    animation: duduq-progress-current 2.8s ease-in-out infinite;
  }

  .duduq-progress-marker[data-status="complete"] {
    border-color: #e3a600;
    background: linear-gradient(180deg, #fff19a, #ffd23f 55%, #efad00);
    color: #fffdf0;
    text-shadow: 0 1px 0 #9f6d00;
    box-shadow:
      0 5px 0 #c98a00,
      0 9px 17px rgba(210,145,0,.23),
      0 0 0 4px rgba(255,202,40,.13),
      inset 0 2px 0 rgba(255,255,255,.66);
    animation: duduq-progress-star-pop 460ms cubic-bezier(.16,.82,.24,1) both;
  }

  .duduq-progress-trail[data-complete="true"] .duduq-progress-fill {
    background: linear-gradient(180deg, #ffe77a, #ffc928 58%, #eaa300);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.62),
      inset 0 -2px 0 rgba(147,96,0,.18),
      0 0 17px rgba(234,163,0,.28);
  }

  .duduq-progress-trail[data-density="dense"] .duduq-progress-marker {
    width: 26px;
    height: 26px;
    font-size: .82rem;
  }

  .duduq-progress-trail[data-style="continuous"] .duduq-progress-track {
    margin-inline: 5px;
  }

  .duduq-progress-compact {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 38px;
    padding: 7px 11px;
    border: 1px solid #d0dce8;
    border-radius: 999px;
    background: #eef5fb;
    color: #183b63;
    box-shadow: 0 3px 0 #c2d1df;
    font-weight: 900;
  }

  .duduq-progress-compact > span {
    color: #f0b400;
    text-shadow: 0 1px 0 #9d7100;
  }

  @keyframes duduq-progress-panel-glint {
    0%, 72% { transform: translateX(-110%); opacity: 0; }
    80% { opacity: .72; }
    96%, 100% { transform: translateX(110%); opacity: 0; }
  }

  @keyframes duduq-progress-shimmer {
    0%, 55% { transform: translateX(-120%); opacity: 0; }
    66% { opacity: .8; }
    88%, 100% { transform: translateX(160%); opacity: 0; }
  }

  @keyframes duduq-progress-current {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.07); }
  }

  @keyframes duduq-progress-star-pop {
    0% { transform: translate(-50%, -50%) scale(.65) rotate(-12deg); }
    62% { transform: translate(-50%, -50%) scale(1.16) rotate(5deg); }
    100% { transform: translate(-50%, -50%) scale(1) rotate(0); }
  }

  /* Microtransi\xE7\xE3o honesta: curta, sem porcentagem fict\xEDcia e sem alterar a mec\xE2nica. */
  .duduq-step-transition {
    position: fixed;
    z-index: 9000;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(19, 35, 56, .52);
    backdrop-filter: blur(5px);
  }

  .duduq-step-transition-card {
    display: grid;
    width: min(520px, 100%);
    place-items: center;
    gap: 14px;
    padding: 24px clamp(18px, 5vw, 36px) 28px;
    border: 2px solid #bcd9f4;
    border-radius: 28px;
    background:
      radial-gradient(circle at 50% 18%, rgba(72,174,255,.15), transparent 42%),
      linear-gradient(180deg, #ffffff, #edf7ff);
    box-shadow:
      0 8px 0 #91b9db,
      0 28px 70px rgba(6, 43, 80, .28),
      inset 0 2px 0 rgba(255,255,255,.96);
    text-align: center;
    animation: duduq-transition-card-in 260ms cubic-bezier(.16,.82,.24,1) both;
  }

  .duduq-step-transition-copy {
    display: grid;
    gap: 3px;
  }

  .duduq-step-transition-copy span {
    color: #0967c9;
    font-size: .72rem;
    font-weight: 1000;
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  .duduq-step-transition-copy strong {
    color: #173451;
    font-size: clamp(1rem, 3vw, 1.2rem);
  }

  .duduq-step-transition-track {
    position: relative;
    width: min(360px, 100%);
    height: 20px;
    overflow: hidden;
    border: 2px solid #9bbbd7;
    border-radius: 999px;
    background: #dbe8f3;
    box-shadow:
      inset 0 3px 5px rgba(44,75,108,.16),
      inset 0 -1px 0 rgba(255,255,255,.9);
  }

  .duduq-step-transition-fill {
    position: absolute;
    inset: 2px;
    right: auto;
    width: calc(100% - 4px);
    transform: scaleX(0);
    transform-origin: left center;
    border-radius: inherit;
    background: linear-gradient(180deg, #42b3ff, #0b73d8 68%, #075eb9);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.4);
    animation: duduq-transition-fill var(--transition-duration) cubic-bezier(.2,.75,.25,1) forwards;
  }

  .duduq-step-transition-star {
    position: absolute;
    right: -2px;
    top: 50%;
    transform: translateY(-50%);
    color: #ffd54d;
    filter: drop-shadow(0 2px 1px rgba(110,76,0,.28));
    font-size: 1.05rem;
  }

  @keyframes duduq-transition-card-in {
    from { transform: translateY(12px) scale(.96); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  @keyframes duduq-transition-fill {
    from { transform: scaleX(.04); }
    to { transform: scaleX(1); }
  }

  .duduq-step-transition[data-reduced-motion="true"] {
    backdrop-filter: none;
  }

  .duduq-step-transition[data-reduced-motion="true"] .duduq-step-transition-card,
  .duduq-step-transition[data-reduced-motion="true"] .duduq-step-transition-fill {
    animation: none !important;
  }

  .duduq-step-transition[data-reduced-motion="true"] .duduq-step-transition-fill {
    transform: scaleX(1);
  }


  @media (max-width: 720px) {
    .duduq-engine-root { padding: 8px; }

    .duduq-engine-header {
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 12px;
      border-radius: 14px;
    }

    .duduq-engine-description { display: none; }

    .duduq-progress-trail {
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 8px 10px 10px;
    }

    .duduq-progress-copy {
      display: flex;
      min-width: 0;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .duduq-progress-track {
      margin-inline: 15px;
    }

    .duduq-engine-toolbar {
      width: 100%;
      justify-content: space-between;
    }

    .duduq-engine-toolbar .duduq-engine-button {
      flex: 1 1 auto;
    }

    .duduq-engine-feedback-card {
      grid-template-columns: 62px minmax(0, 1fr);
      padding: 14px;
    }

    .duduq-mascot[data-size="feedback"] {
      width: 58px;
      height: 58px;
    }

    .duduq-mascot[data-size="idle"] {
      width: 46px;
      height: 46px;
    }

    .duduq-mascot[data-size="transition"] {
      width: 82px;
      height: 82px;
    }

    .duduq-engine-complete {
      min-height: 300px;
      border-radius: 18px;
    }
  }

  @media (max-width: 420px) {
    .duduq-engine-toolbar {
      display: grid;
      grid-template-columns: auto 1fr 1fr;
    }

    .duduq-engine-counter { min-width: 58px; }
    .duduq-engine-button { padding-inline: 10px; }
  }



  /* ========================================================================
     Host 1.0.10 HTML QA FIX
     Menos est\xEDmulos concorrentes, alvos mais claros e movimento pontual.
     ======================================================================== */

  .duduq-engine-root {
    padding: clamp(8px, 1.1vw, 14px);
  }

  .duduq-engine-shell {
    width: min(1180px, 100%);
  }

  .duduq-engine-header {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 9px 12px;
    margin-bottom: 8px;
    padding: 9px 12px 10px;
    border-radius: 14px;
    box-shadow: 0 2px 0 #d4dee8;
  }

  .duduq-engine-header-main {
    gap: 9px;
  }

  .duduq-engine-heading h1 {
    font-size: clamp(1.05rem, 1.7vw, 1.3rem);
    line-height: 1.08;
  }

  .duduq-engine-toolbar {
    gap: 6px;
  }

  .duduq-engine-toolbar .duduq-engine-button {
    min-height: 36px;
    padding: 6px 10px;
    border-width: 1px;
    border-radius: 10px;
    box-shadow: 0 2px 0 #c4d1de;
    font-size: .84rem;
  }

  .duduq-mascot[data-size="idle"] {
    width: 40px;
    height: 40px;
  }

  .duduq-mascot[data-state="idle"] .duduq-mascot-body {
    animation: none;
    will-change: auto;
  }

  .duduq-mascot[data-state="success"] .duduq-mascot-body,
  .duduq-mascot[data-state="retry"] .duduq-mascot-body {
    animation: duduq-lean-feedback-in 260ms cubic-bezier(.2,.8,.2,1) both;
  }

  .duduq-mascot[data-state="complete"] .duduq-mascot-body {
    animation: duduq-lean-complete-in 420ms cubic-bezier(.16,.82,.24,1) both;
  }

  @keyframes duduq-lean-feedback-in {
    from { transform: translateY(4px) scale(.94); opacity: .45; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  @keyframes duduq-lean-complete-in {
    from { transform: translateY(8px) scale(.88); opacity: .4; }
    70% { transform: translateY(-2px) scale(1.03); opacity: 1; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* Progresso: leitura imediata, sem brilho ou pulso recorrente. */
  .duduq-progress-trail {
    gap: 7px;
    padding: 8px 12px 10px;
    border-color: #d3dee9;
    border-radius: 14px;
    background: #ffffff;
    box-shadow: 0 2px 0 #c6d3df;
  }

  .duduq-progress-trail::before,
  .duduq-progress-fill::after {
    display: none;
    animation: none;
  }

  .duduq-progress-copy {
    gap: 8px;
    padding-inline: 1px;
  }

  .duduq-progress-copy span {
    font-size: .62rem;
    letter-spacing: .06em;
  }

  .duduq-progress-copy strong {
    font-size: .84rem;
  }

  .duduq-progress-track {
    height: 12px;
    margin: 1px 14px 0;
    border-width: 1px;
    border-color: #b8c9da;
    background: #e3ebf3;
    box-shadow:
      inset 0 2px 3px rgba(55, 84, 118, .13),
      inset 0 -1px 0 rgba(255,255,255,.85);
  }

  .duduq-progress-track::after {
    inset: 2px 4px auto;
    height: 2px;
    opacity: .72;
  }

  .duduq-progress-fill {
    inset: 1px;
    right: auto;
    width: calc(100% - 2px);
    background: linear-gradient(180deg, #49b2f5 0%, #117bd7 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -1px 0 rgba(2,72,145,.18);
    transition: transform 420ms cubic-bezier(.2,.8,.2,1);
  }

  .duduq-progress-fill::before {
    inset: 1px 3px auto;
    height: 2px;
  }

  .duduq-progress-marker {
    width: 25px;
    height: 25px;
    border-width: 1px;
    background: #f7fafc;
    color: #8fa1b5;
    box-shadow:
      0 2px 0 #b8c6d4,
      0 4px 8px rgba(33,67,104,.10);
    font-size: .8rem;
    transition:
      transform 420ms cubic-bezier(.2,.8,.2,1),
      background-color 180ms ease,
      border-color 180ms ease,
      color 180ms ease;
  }

  .duduq-progress-marker::after {
    display: none;
  }

  .duduq-progress-marker[data-status="current"] {
    border-color: #0f79dc;
    background: #1687e8;
    color: #ffffff;
    text-shadow: none;
    box-shadow:
      0 3px 0 #075aaa,
      0 0 0 3px rgba(22,130,229,.12);
    animation: none;
  }

  .duduq-progress-marker[data-status="complete"] {
    border-color: #dfa000;
    background: #ffc928;
    color: #fffdf0;
    text-shadow: 0 1px 0 #9f6d00;
    box-shadow:
      0 3px 0 #c98a00,
      0 5px 9px rgba(210,145,0,.16);
    animation: duduq-progress-lean-pop 320ms cubic-bezier(.16,.82,.24,1) both;
  }

  @keyframes duduq-progress-lean-pop {
    0% { transform: translate(-50%, -50%) scale(.78); }
    70% { transform: translate(-50%, -50%) scale(1.08); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  .duduq-progress-trail[data-complete="true"] .duduq-progress-fill {
    background: linear-gradient(180deg, #ffe16a, #f4b900);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.62),
      inset 0 -1px 0 rgba(147,96,0,.17);
  }

  .duduq-progress-trail[data-density="dense"] .duduq-progress-marker {
    width: 22px;
    height: 22px;
    font-size: .7rem;
  }

  /* Instru\xE7\xE3o e \xE1rea de jogo: mais respiro, menos molduras pesadas. */
  .duduq-engine-stage .duduq-dd-instruction {
    width: min(760px, 100%);
    min-height: 56px;
    margin-bottom: 14px;
    border-width: 1px;
    border-color: #d5dfe9;
    background: #ffffff;
    box-shadow:
      0 2px 0 #c8d4df,
      0 6px 12px rgba(15,23,42,.045);
  }

  .duduq-engine-stage .duduq-dd-board {
    width: min(1000px, 100%);
    gap: clamp(12px, 1.6vh, 18px);
  }

  .duduq-engine-stage .duduq-dd-target-grid {
    gap: clamp(8px, 1vw, 12px);
  }

  .duduq-engine-stage .duduq-dd-target,
  .duduq-engine-stage .duduq-dd-target[data-valid-target="true"] {
    min-height: clamp(148px, 23vh, 200px);
    border: 2px dashed #cbd7e4;
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 2px 0 #d7e0e9;
  }

  .duduq-engine-stage .duduq-dd-target[data-active-target="true"] {
    border-style: solid;
    border-color: #2f8de3;
    background: #f2f8ff;
    box-shadow:
      0 0 0 3px rgba(47,141,227,.12),
      0 3px 0 #a8c9e8;
    transform: scale(1.015);
  }

  .duduq-engine-stage .duduq-dd-target-media {
    width: clamp(92px, 11vw, 126px);
    height: clamp(92px, 11vw, 126px);
  }

  .duduq-engine-stage .duduq-dd-target[data-has-media="true"] .duduq-dd-target-head {
    min-height: clamp(110px, 15vh, 144px);
  }

  .duduq-engine-stage .duduq-dd-target-head > span:last-child {
    min-width: 25px !important;
    padding: 2px 6px !important;
    background: #f1f5f9 !important;
    color: #617186 !important;
    font-size: 11px !important;
  }

  .duduq-engine-stage .duduq-dd-empty-note {
    color: #68788c;
    font-size: .83rem;
    font-weight: 750;
  }

  /* Itens: leitura forte, profundidade curta e sele\xE7\xE3o inequ\xEDvoca. */
  .duduq-engine-stage .duduq-dd-item {
    min-height: 56px;
    border-color: #91a3b8;
    border-radius: 15px;
    background: #ffffff;
    box-shadow:
      0 3px 0 #c2cdda,
      0 5px 10px rgba(15,23,42,.06);
    font-size: clamp(16px, 1.7vw, 20px);
    transform: translateY(0);
    transition:
      transform 100ms ease,
      box-shadow 100ms ease,
      border-color 150ms ease,
      background-color 150ms ease,
      opacity 150ms ease;
  }

  @media (hover: hover) and (pointer: fine) {
    .duduq-engine-stage .duduq-dd-item:hover:not(:disabled):not([aria-disabled="true"]) {
      transform: translateY(-1px);
      filter: none;
    }
  }

  .duduq-engine-stage .duduq-dd-item[data-selected="true"] {
    border-color: #1b76ce;
    background: #f0f7ff;
    box-shadow:
      0 3px 0 #91b7dc,
      0 0 0 3px rgba(27,118,206,.12);
  }

  .duduq-engine-stage .duduq-dd-item[data-dragging="true"] {
    opacity: .3;
  }

  .duduq-engine-stage .duduq-dd-drag-ghost {
    transform: scale(1.02);
    filter: drop-shadow(0 8px 10px rgba(15,23,42,.16));
  }

  .duduq-engine-stage .duduq-dd-drag-ghost .duduq-dd-item {
    box-shadow:
      0 3px 0 #aebdcd,
      0 8px 15px rgba(15,23,42,.13);
  }

  /* Bandeja discreta: serve ao conte\xFAdo, n\xE3o compete com os alvos. */
  .duduq-engine-stage .duduq-dd-pool {
    min-height: 96px;
    gap: 6px;
    padding: 7px 10px 12px;
    border: 1px solid #dce4ec;
    border-radius: 16px;
    background: rgba(255,255,255,.42);
    box-shadow: none;
  }

  .duduq-engine-stage .duduq-dd-pool-head {
    min-height: 27px;
    padding: 0 8px;
    color: #657589;
    font-size: .8rem;
  }

  .duduq-engine-stage .duduq-dd-pool-items {
    min-height: 60px;
    gap: clamp(10px, 1.25vw, 15px);
    padding: 1px 4px 4px;
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note) {
    min-height: 48px;
    gap: 0;
    padding: 4px 10px 6px;
    border-color: #e1e8ef;
    background: rgba(248,250,252,.66);
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note)
    .duduq-dd-pool-head {
    min-height: 20px;
    font-size: .76rem;
  }

  .duduq-engine-stage
    .duduq-dd-pool:has(.duduq-dd-pool-items > .duduq-dd-empty-note)
    .duduq-dd-pool-items {
    min-height: 18px;
  }

  /* A\xE7\xE3o principal: um \xFAnico convite visual quando fica dispon\xEDvel. */
  .duduq-engine-stage .duduq-dd-action-slot {
    padding: 12px 0 13px;
  }

  .duduq-engine-stage .duduq-dd-primary {
    min-height: 52px;
    box-shadow:
      0 4px 0 #064a92,
      0 8px 14px rgba(9,103,201,.14),
      inset 0 1px 0 rgba(255,255,255,.35);
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"] {
    animation: duduq-check-ready-lean 420ms cubic-bezier(.2,.8,.2,1) 1 both !important;
  }

  .duduq-engine-stage .duduq-dd-primary[data-enabled="true"]::after {
    display: none;
    animation: none !important;
  }

  @keyframes duduq-check-ready-lean {
    0% { transform: translateY(0) scale(.985); filter: brightness(.98); }
    62% { transform: translateY(-1px) scale(1.018); filter: brightness(1.045); }
    100% { transform: translateY(0) scale(1); filter: brightness(1); }
  }

  /* Feedback: uma mensagem, um mascote e uma a\xE7\xE3o. */
  .duduq-engine-feedback {
    margin-top: 9px;
  }

  .duduq-engine-feedback-card {
    grid-template-columns: 56px minmax(0, 1fr);
    gap: 9px 12px;
    min-height: 76px;
    padding: 11px 14px 13px;
    border-width: 1px;
    border-radius: 16px;
    transform: none;
  }

  .duduq-mascot[data-size="feedback"] {
    width: 54px;
    height: 54px;
  }

  .duduq-engine-feedback-copy strong {
    font-size: 1rem;
  }

  .duduq-engine-feedback-copy span {
    font-size: .92rem;
    line-height: 1.3;
  }

  .duduq-engine-feedback[data-state="success"] .duduq-engine-feedback-card {
    box-shadow:
      0 3px 0 #8bcf72,
      0 8px 16px rgba(54,169,0,.09);
  }

  .duduq-engine-feedback[data-state="retry"] .duduq-engine-feedback-card {
    box-shadow:
      0 3px 0 #e0a079,
      0 8px 16px rgba(166,75,22,.08);
  }

  .duduq-engine-feedback-action {
    width: min(260px, 100%);
    margin-top: 4px;
    box-shadow:
      0 4px 0 #369600,
      0 8px 15px rgba(54,169,0,.15),
      inset 0 1px 0 rgba(255,255,255,.4);
    animation: duduq-lean-action-in 260ms cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes duduq-lean-action-in {
    from { transform: translateY(5px); opacity: .35; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* Celebra\xE7\xE3o curta: tr\xEAs estrelas no acerto e oito na conclus\xE3o. */
  .duduq-star-particle {
    font-size: 15px;
    animation-duration: 820ms;
  }

  .duduq-star-burst[data-variant="lesson"] .duduq-star-particle {
    font-size: 18px;
    animation-duration: 1050ms;
  }

  .duduq-engine-complete::before {
    animation: none;
    opacity: .72;
  }

  @media (max-width: 720px) {
    .duduq-engine-header {
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 8px 9px 9px;
    }

    .duduq-engine-toolbar {
      width: auto;
      justify-content: flex-end;
    }

    .duduq-engine-toolbar .duduq-engine-button {
      flex: 0 1 auto;
      min-height: 34px;
      padding-inline: 8px;
      font-size: .78rem;
    }

    .duduq-progress-trail {
      gap: 6px;
      padding: 7px 9px 9px;
    }

    .duduq-progress-track {
      margin-inline: 12px;
    }

    .duduq-engine-stage .duduq-dd-target {
      min-height: 126px;
    }

    .duduq-engine-stage .duduq-dd-target-media {
      width: clamp(72px, 20vw, 94px);
      height: clamp(72px, 20vw, 94px);
    }
  }

  @media (max-width: 520px) {
    .duduq-engine-header {
      grid-template-columns: 1fr;
    }

    .duduq-engine-toolbar {
      width: 100%;
      justify-content: flex-end;
    }

    .duduq-engine-header-main {
      justify-content: center;
    }

    .duduq-engine-heading h1 {
      text-align: center;
    }

    .duduq-engine-stage .duduq-dd-item {
      min-height: 52px;
    }
  }


  /* ========================================================================
     Host 1.0.10 HTML QA FIX
     Presen\xE7a visual maior, fluxo vertical curto e nenhum efeito cont\xEDnuo.
     ======================================================================== */

  :root {

    --premium-blue-top: #4eb4ff;
    --premium-blue-depth: #0757a8;

    --premium-green-top: #82eb18;
    --premium-green-depth: #319400;
    --premium-gold: #ffc928;
    --premium-ink: #14233a;
    --premium-soft: #f5f9fd;
  }

  .duduq-engine-root {
    padding: clamp(8px, 1vw, 14px);
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,.96) 0 15%, transparent 42%),
      linear-gradient(180deg, #f6f9fd 0%, #edf4fb 100%);
  }

  .duduq-engine-shell {
    width: min(1200px, 100%);
  }

  .duduq-engine-toolbar .duduq-engine-button {
    min-height: 38px;
    padding: 7px 12px;
    border-color: #c5d3e1;
    border-radius: 12px;
    background: linear-gradient(180deg, #ffffff 0%, #edf4fa 100%);
    color: #253d5c;
    box-shadow:
      0 3px 0 #b9c8d7,
      0 6px 12px rgba(31,67,103,.08),

  .duduq-progress-copy span {
    color: #536b87;
    font-size: .64rem;
    letter-spacing: .08em;

  .duduq-progress-copy strong {

  }

  .duduq-progress-track {

  .duduq-progress-fill {

  /* Instru\xE7\xE3o com leitura confort\xE1vel e bot\xE3o de \xE1udio integrado. */

  .duduq-engine-stage .duduq-dd-board {

    background: linear-gradient(180deg, #f7fbff 0%, #edf7ff 100%);
    box-shadow:

  .duduq-engine-stage .duduq-dd-target[data-has-media="true"] .duduq-dd-target-head {
    min-height: clamp(132px, 18vh, 168px);
    padding-top: 8px;

  /* Itens mais t\xE1teis e leg\xEDveis, com profundidade curta. */

  /* ========================================================================
     Host 1.0.10 \u2014 corre\xE7\xF5es observadas na homologa\xE7\xE3o HTML (1365 \xD7 640)
     - mascotes com \xE1rea transparente ampliados dentro do slot;
     - CTA volta ao fluxo normal para n\xE3o sobrepor a bandeja;
     - alvo ativo mant\xE9m geometria est\xE1vel;
     - composi\xE7\xE3o compacta em telas largas de baixa altura;
     - conclus\xE3o mais concentrada e sem emblema duplicado.
     ======================================================================== */

  /* Os PNGs atuais possuem uma grande margem transparente. O zoom acontece
     apenas dentro do recorte do slot; n\xE3o altera o layout nem o hit target. */
  .duduq-mascot-body {
    overflow: hidden;
  }

  .duduq-mascot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: 50% 50%;
    transform-origin: 50% 50%;
  }

  .duduq-mascot[data-state="idle"] img,
  .duduq-mascot[data-state="transition"] img {
    transform: scale(4.1);
  }

  .duduq-mascot[data-state="success"] img,
  .duduq-mascot[data-state="retry"] img {
    transform: scale(4.0);
  }

  .duduq-mascot[data-state="complete"] img {
    transform: scale(3.8);
  }

  /* O bot\xE3o sticky invadia a bandeja em viewports de baixa altura. */
  .duduq-engine-stage .duduq-dd-action-slot {
    position: static;
    z-index: auto;
    background: transparent;
  }

  /* O destaque n\xE3o muda tamanho nem posi\xE7\xE3o do alvo durante o drag. */
  .duduq-engine-stage .duduq-dd-target[data-active-target="true"] {
    border: 2px solid #2f94ed;
    transform: none;
    background: linear-gradient(180deg, #f8fcff 0%, #eef7ff 100%);
    box-shadow:
      inset 0 0 0 2px rgba(47,148,237,.18),
      0 3px 0 #9bc2e4,

  }

  .duduq-engine-stage

    .duduq-dd-empty-note {
    opacity: 0;
  }

  /* A arte final do mascote j\xE1 assume o protagonismo da conclus\xE3o. */
  .duduq-engine-complete-emblem {
    display: none;
  }

  .duduq-engine-complete {
    min-height: clamp(330px, 57vh, 440px);
    padding-block: clamp(20px, 3vw, 32px);

  @media (min-width: 900px) and (max-height: 720px) {

     Host 1.0.11 \u2014 FINAL VISUAL POLISH
     - t\xEDtulo do cabe\xE7alho permanece im\xF3vel em todos os estados;
     - imagens dos alvos ganham presen\xE7a sem comprometer a \xE1rea de resposta;
     - indicadores de capacidade ficam mais leg\xEDveis para crian\xE7as e tablets;
     - feedback de sucesso vira uma faixa horizontal eficiente em desktop;
     - confirma\xE7\xE3o verde e conclus\xE3o recebem acabamento mais elegante.
     ======================================================================== */

  /* Reserva permanente do avatar: o t\xEDtulo n\xE3o salta quando o mascote muda
     do cabe\xE7alho para o feedback ou para a conclus\xE3o. */
  .duduq-engine-header-mascot-slot {
    width: 46px;

     \xE1rea de toque est\xE1veis. */
  .duduq-engine-stage .duduq-dd-target-media {
    width: clamp(120px, 13.6vw, 162px);

  .duduq-engine-stage .duduq-dd-capacity-badge {
    min-width: 31px !important;

    box-shadow: inset 0 1px 0 rgba(255,255,255,.95);
    font-size: 12.5px !important;
    line-height: 1.05;
    font-weight: 900 !important;
    font-variant-numeric: tabular-nums;
  }

  /* O acerto continua inequ\xEDvoco, por\xE9m com menos satura\xE7\xE3o repetida entre
     fundo, borda, sombra, item e selo. */
  .duduq-engine-stage

      radial-gradient(circle at 50% 18%, rgba(255,255,255,.9), transparent 58%),
