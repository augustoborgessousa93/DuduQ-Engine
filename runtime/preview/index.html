<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUDUQ — Penpot Product</title><style>html,body,#root{margin:0;width:100%;height:100%;overflow:hidden}#root{min-height:320px}</style></head><body><main id="root"></main>
<script src="/core/duduq-screen-runtime.js"></script><script src="/core/duduq-headless-product.js"></script>
<script>
const path=location.pathname, mechanic=new URLSearchParams(location.search).get('mechanic')||(path.includes('/target-shooter')?'target-shooter':'matching');
window.__DUDUQ_PRODUCT__={route:path,mechanic,runtimeType:'PENPOT_RENDERER + HEADLESS_ENGINE'};
window.addEventListener('load',()=>{const root=document.getElementById('root');window.__DUDUQ_PRODUCT__.instance=window.DuduQHeadlessProduct.mount({container:root,mechanic});setTimeout(()=>{const host=root.querySelector('[data-duduq-product-runtime]'),stage=host?.shadowRoot?.querySelector('[data-duduq-runtime-source="LIVE_VISUAL_PACKAGE"]');const visible=n=>{const s=getComputedStyle(n),b=n.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity>0&&b.width>10&&b.height>10};window.__DUDUQ_PRODUCT__.health={visibleRoots:stage&&visible(host)?1:0,staticOverlays:0,hiddenLegacyGames:document.querySelectorAll('iframe').length,goldenImages:[...document.images].filter(i=>/golden|visual-reference/i.test(i.src)).length,source:stage?.dataset.duduqRuntimeSource||null,ready:Boolean(stage&&visible(host))};document.documentElement.dataset.duduqProduct=window.__DUDUQ_PRODUCT__.health.ready?'ready':'pending'},500)});
</script></body></html>
